<!-- V5.7: added Persian (fa, RTL), Burmese (my), Indonesian (id), Ukrainian (uk) -->
<!-- V5.6: print/PDF stylesheet, skip link, focus indicators, high-contrast support -->

<style>
/* ==========================================================================
   M CORP AI / VITALGUARD — index.html  V5.8  (institutional edition)
   Single file. Zero external dependencies: no CDN, no web fonts, no trackers,
   no third-party requests, no browser storage written.
   Multilingual: 19 languages, EN default. RTL: AR, FA.
   Layout uses CSS logical properties so RTL requires no separate stylesheet.
   ========================================================================== */

:root{
  --ink:#0a0d0c;
  --ink-2:#111614;
  --ink-3:#161d1a;
  --bone:#ece7dc;
  --bone-dim:#cbc9c0;
  --bone-faint:#9a9e97;
  --signal:#5cf2a0;
  --signal-deep:#2e7d32;
  --amber:#ffbe5c;
  --rule:rgba(236,231,220,.12);
  --rule-hard:rgba(236,231,220,.28);

  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", "URW Palladio L", Georgia, serif;

  --pad: clamp(1.15rem, 4vw, 4.5rem);
  --maxw: 1240px;
}

/* --- language-specific type stacks (system fonts only, nothing downloaded) --- */
html[lang="ja"]{
  --serif: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", "MS PMincho", serif;
  --mono: "SF Mono", Menlo, Consolas, "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", monospace;
}
html[lang="ar"]{
  --serif: "Geeza Pro", "Noto Naskh Arabic", "Traditional Arabic", "Segoe UI", Tahoma, serif;
  --mono: "Noto Kufi Arabic", "Segoe UI", Tahoma, var(--mono);
}
html[lang="fa"]{
  --serif: "Iranian Sans", "IRANSans", "Vazirmatn", "Noto Naskh Arabic", "Geeza Pro", Tahoma, serif;
  --mono: "Vazirmatn", "Noto Kufi Arabic", "Segoe UI", Tahoma, var(--mono);
}
html[lang="my"]{
  --serif: "Myanmar Text", "Noto Sans Myanmar", "Padauk", "Myanmar MN", "Pyidaungsu", sans-serif;
  --mono: "Myanmar Text", "Noto Sans Myanmar", "Padauk", "Pyidaungsu", var(--mono);
}
html[lang="ar"] body{ font-size:18px; line-height:1.85; }
html[lang="fa"] body{ font-size:18px; line-height:1.9; }
html[lang="my"] body{ font-size:17px; line-height:2.05; }
html[lang="ja"] body{ line-height:1.85; }

*,*::before,*::after{ box-sizing:border-box; }
html{ scroll-behavior:smooth; -webkit-text-size-adjust:100%; }
@media (prefers-reduced-motion: reduce){
  html{ scroll-behavior:auto; }
  *,*::before,*::after{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
}

body{
  margin:0; background:var(--ink); color:var(--bone);
  font-family:var(--serif); font-size:17px; line-height:1.62;
  -webkit-font-smoothing:auto; -moz-osx-font-smoothing:auto;
  text-rendering:optimizeLegibility; overflow-x:hidden;
}

body::before{
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image:
    linear-gradient(var(--rule) 1px, transparent 1px),
    linear-gradient(90deg, var(--rule) 1px, transparent 1px);
  background-size:96px 96px; opacity:.28;
  mask-image:radial-gradient(circle at 50% 12%, #000 0%, transparent 78%);
  -webkit-mask-image:radial-gradient(circle at 50% 12%, #000 0%, transparent 78%);
}
body::after{
  content:""; position:fixed; inset:0; z-index:1; pointer-events:none; opacity:.04;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
}
main, header, footer{ position:relative; z-index:2; }
a{ color:inherit; }

/* ============ TYPE ============ */
.eyebrow{
  font-family:var(--mono); font-size:.68rem; letter-spacing:.2em; text-transform:uppercase;
  color:var(--signal); display:flex; align-items:center; gap:.7rem; margin:0 0 1.1rem;
}
.eyebrow::after{ content:""; flex:1; height:1px; background:var(--rule-hard); }
.eyebrow .num{ color:var(--bone-faint); }
html[lang="ar"] .eyebrow, html[lang="ja"] .eyebrow{ letter-spacing:.06em; text-transform:none; font-size:.76rem; }
html[lang="fa"] .eyebrow, html[lang="my"] .eyebrow{ letter-spacing:.05em; text-transform:none; font-size:.76rem; }

h1,h2,h3,h4{ font-family:var(--serif); font-weight:400; letter-spacing:-.015em; margin:0; }
h1{ font-size:clamp(2.25rem, 6vw, 4.5rem); line-height:1.06; }
h1, h2, h3, .card h3, .demo h3, .asks h3{ overflow-wrap:break-word; }
html[lang="de"] h1, html[lang="nl"] h1, html[lang="pl"] h1,
html[lang="sv"] h1{ hyphens:auto; -webkit-hyphens:auto; }
h2{ font-size:clamp(1.75rem, 3.8vw, 2.8rem); line-height:1.12; }
h3{ font-size:clamp(1.12rem, 1.9vw, 1.4rem); line-height:1.28; }
html[lang="ar"] h1, html[lang="ja"] h1{ letter-spacing:0; line-height:1.25; }
html[lang="ar"] h2, html[lang="ja"] h2{ letter-spacing:0; line-height:1.35; }
html[lang="fa"] h1, html[lang="my"] h1{ letter-spacing:0; line-height:1.32; }
html[lang="fa"] h2, html[lang="my"] h2{ letter-spacing:0; line-height:1.42; }
p{ margin:0 0 1.05em; color:var(--bone-dim); }
p.lead{ font-size:clamp(1.04rem,1.55vw,1.26rem); color:var(--bone); max-width:64ch; }
strong{ color:var(--bone); font-weight:600; }
.accent{ color:var(--signal); }
html[lang="en"] .accent, html[lang="es"] .accent, html[lang="fr"] .accent,
html[lang="pt"] .accent, html[lang="de"] .accent, html[lang="nl"] .accent,
html[lang="pl"] .accent, html[lang="it"] .accent, html[lang="sv"] .accent,
html[lang="id"] .accent, html[lang="uk"] .accent{ font-style:italic; }

/* ============ LAYOUT ============ */
.wrap{ max-width:var(--maxw); margin:0 auto; padding-inline:var(--pad); }
section{ padding:clamp(4rem,8vw,7.5rem) 0; border-top:1px solid var(--rule); }
section.hero{ border-top:0; }
.split{ display:grid; grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr); gap:clamp(2rem,5vw,4.5rem); align-items:start; }
@media (max-width:900px){ .split{ grid-template-columns:1fr; } }

/* ============ HEADER ============ */
header.topbar{
  position:sticky; top:0; z-index:60; background:rgba(10,13,12,.85);
  backdrop-filter:blur(11px); -webkit-backdrop-filter:blur(11px);
  border-bottom:1px solid var(--rule);
}
.topbar .wrap{ display:flex; align-items:center; gap:1.2rem; height:62px; }
.brand{ display:flex; align-items:center; gap:.6rem; text-decoration:none; margin-inline-end:auto; }
.brand svg{ width:19px; height:19px; flex:none; }
.brand b{ font-family:var(--mono); font-size:.8rem; letter-spacing:.14em; font-weight:600; }
.brand span{ font-family:var(--mono); font-size:.66rem; letter-spacing:.14em; color:var(--bone-faint); }
nav.links{ display:flex; gap:1.35rem; }
nav.links a{
  font-family:var(--mono); font-size:.7rem; letter-spacing:.1em; text-transform:uppercase;
  color:var(--bone-dim); text-decoration:none; padding:.3rem 0;
  border-bottom:1px solid transparent; transition:color .2s, border-color .2s; white-space:nowrap;
}
nav.links a:hover{ color:var(--signal); border-bottom-color:var(--signal); }
nav.links a, .langbox select, .btn, .checks li{ font-weight:500; }
html[lang="ar"] nav.links a, html[lang="ja"] nav.links a{ text-transform:none; letter-spacing:.02em; font-size:.78rem; }
html[lang="fa"] nav.links a, html[lang="my"] nav.links a{ text-transform:none; letter-spacing:.02em; font-size:.78rem; }
@media (max-width:1200px){ nav.links{ display:none; } }

/* ---- language switcher ---- */
.langbox{ display:flex; align-items:center; gap:.5rem; flex:none; }
.langbox svg{ width:15px; height:15px; color:var(--bone-faint); flex:none; }
.langbox select{
  font-family:var(--mono); font-size:.72rem; letter-spacing:.08em;
  background:var(--ink-2); color:var(--bone); border:1px solid var(--rule-hard);
  padding:.45rem 1.9rem .45rem .7rem; cursor:pointer; appearance:none; -webkit-appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%23a9a89f' stroke-width='1.6'/></svg>");
  background-repeat:no-repeat; background-position:right .65rem center; background-size:9px;
  transition:border-color .2s, color .2s;
}
html[dir="rtl"] .langbox select{ padding:.45rem .7rem .45rem 1.9rem; background-position:left .65rem center; }
.langbox select:hover, .langbox select:focus{ border-color:var(--signal); color:var(--signal); outline:none; }
.langbox select option{ background:var(--ink-2); color:var(--bone); }

/* ---- readability toggle: larger text on demand, no preference is stored ---- */
.readability-toggle{
  display:inline-flex; align-items:center; justify-content:center; flex:none;
  width:40px; height:40px; padding:0; color:var(--bone-dim);
  background:var(--ink-2); border:1px solid var(--rule-hard); cursor:pointer;
  transition:border-color .2s, color .2s, background .2s;
}
.readability-toggle svg{ width:18px; height:18px; }
.readability-toggle:hover, .readability-toggle:focus-visible{
  border-color:var(--signal); color:var(--signal); outline:none;
}
.readability-toggle[aria-pressed="true"]{
  border-color:var(--signal); color:var(--signal); background:rgba(92,242,160,.08);
}
html.readability-mode{ font-size:110%; }
html.readability-mode body{ font-size:18.5px; }
html.readability-mode .topbar .wrap{ height:68px; }

/* Slightly stronger weight for secondary and microcopy text. */
.hero-note, .zero-strip span, .note, .card .tag, .card .why,
.spec th, .org th, .status-grid b, .pill, .scene b, .demo .size,
.demo .go, footer p, footer a, .brand span, .eyebrow .num, #filterStatus{
  font-weight:500;
}

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex; align-items:center; gap:.6rem;
  font-family:var(--mono); font-size:.73rem; letter-spacing:.12em; text-transform:uppercase;
  text-decoration:none; padding:.82rem 1.35rem; border:1px solid var(--rule-hard);
  color:var(--bone); background:transparent; cursor:pointer;
  transition:background .22s, color .22s, border-color .22s, transform .22s;
}
.btn:hover{ border-color:var(--signal); color:var(--signal); transform:translateY(-2px); }
.btn.solid{ background:var(--signal); color:#06110c; border-color:var(--signal); font-weight:600; }
.btn.solid:hover{ background:#7dffb9; color:#06110c; }
html[lang="ar"] .btn, html[lang="ja"] .btn{ text-transform:none; letter-spacing:.02em; font-size:.8rem; }
.arw{ transition:transform .22s; }
html[dir="rtl"] .arw{ transform:scaleX(-1); }
.btn:hover .arw{ transform:translateX(4px); }
html[dir="rtl"] .btn:hover .arw{ transform:scaleX(-1) translateX(4px); }

/* ============ HERO ============ */
.hero{ padding-top:clamp(3rem,7vw,5.5rem); padding-bottom:clamp(2.5rem,5vw,4rem); }
.hero-flag{
  display:inline-flex; align-items:center; gap:.65rem; flex-wrap:wrap;
  font-family:var(--mono); font-size:.67rem; letter-spacing:.16em; text-transform:uppercase;
  color:var(--signal); border:1px solid rgba(92,242,160,.35); padding:.42rem .85rem; margin-bottom:1.8rem;
}
html[lang="ar"] .hero-flag, html[lang="ja"] .hero-flag{ text-transform:none; letter-spacing:.02em; font-size:.75rem; }
.dot{ width:6px; height:6px; border-radius:50%; background:var(--signal); flex:none; animation:pulse 2.6s ease-in-out infinite; }
@keyframes pulse{ 0%,100%{opacity:1; box-shadow:0 0 0 0 rgba(92,242,160,.5);} 50%{opacity:.55; box-shadow:0 0 0 7px rgba(92,242,160,0);} }
.hero h1{ max-width:19ch; margin-bottom:1.6rem; }
.hero-sub{ max-width:66ch; }
.hero-cta{ display:flex; flex-wrap:wrap; gap:.75rem; margin-top:2.2rem; }
.hero-note{ font-family:var(--mono); font-size:.7rem; letter-spacing:.05em; color:var(--bone-faint); margin-top:1.5rem; line-height:1.7; }

.zero-strip{ margin-top:clamp(2.6rem,5vw,4rem); border:1px solid var(--rule); border-inline-start:2px solid var(--signal); display:grid; grid-template-columns:repeat(4,1fr); }
.zero-strip div{ padding:1.4rem 1.2rem; border-inline-start:1px solid var(--rule); }
.zero-strip div:first-child{ border-inline-start:0; }
.zero-strip b{ display:block; font-family:var(--mono); font-size:1.7rem; color:var(--bone); font-weight:500; }
.zero-strip span{ font-family:var(--mono); font-size:.64rem; letter-spacing:.12em; text-transform:uppercase; color:var(--bone-faint); }
html[lang="ar"] .zero-strip span, html[lang="ja"] .zero-strip span{ text-transform:none; letter-spacing:.01em; font-size:.72rem; }
@media (max-width:820px){
  .zero-strip{ grid-template-columns:repeat(2,1fr); }
  .zero-strip div:nth-child(3){ border-inline-start:0; }
  .zero-strip div:nth-child(n+3){ border-top:1px solid var(--rule); }
}

/* ============ LISTS / BLOCKS ============ */
.checks{ list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(2,1fr); }
.checks li{
  font-family:var(--mono); font-size:.79rem; line-height:1.55; color:var(--bone-dim);
  padding:.85rem 1rem; padding-inline-start:2.1rem; position:relative; border-bottom:1px solid var(--rule);
}
.checks li::before{ content:"✓"; position:absolute; inset-inline-start:.85rem; top:.85rem; color:var(--signal); font-size:.8rem; }
.checks li:hover{ color:var(--bone); background:rgba(92,242,160,.045); }
html[lang="ar"] .checks li, html[lang="ja"] .checks li{ font-size:.9rem; }
html[lang="fa"] .checks li, html[lang="my"] .checks li{ font-size:.9rem; }
@media (max-width:700px){ .checks{ grid-template-columns:1fr; } }

.note{
  font-family:var(--mono); font-size:.73rem; line-height:1.75; color:var(--bone-faint);
  border:1px dashed var(--rule-hard); padding:1.15rem 1.25rem; margin-top:2rem;
}
.note b{ color:var(--amber); font-weight:400; }
html[lang="ar"] .note, html[lang="ja"] .note{ font-size:.85rem; }
html[lang="fa"] .note, html[lang="my"] .note{ font-size:.85rem; }

.pull{
  font-family:var(--serif); font-size:clamp(1.35rem,3.2vw,2.2rem); line-height:1.32; color:var(--bone);
  border-inline-start:2px solid var(--signal); padding-inline-start:clamp(1.2rem,3vw,2.4rem); max-width:30ch;
}

/* ============ USE-CASE CARDS ============ */
.filterbar{ display:flex; flex-wrap:wrap; gap:.5rem; margin:2.1rem 0 2.5rem; }
.chip{
  font-family:var(--mono); font-size:.68rem; letter-spacing:.11em; text-transform:uppercase;
  padding:.55rem .95rem; border:1px solid var(--rule-hard); background:transparent;
  color:var(--bone-dim); cursor:pointer; transition:all .2s;
}
.chip:hover{ color:var(--bone); border-color:var(--bone-faint); }
.chip[aria-pressed="true"]{ background:var(--signal); border-color:var(--signal); color:#06110c; font-weight:600; }
html[lang="ar"] .chip, html[lang="ja"] .chip{ text-transform:none; letter-spacing:.01em; font-size:.78rem; }

.cards{ display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:1px; background:var(--rule); border:1px solid var(--rule); }
.card{ background:var(--ink); padding:1.9rem 1.7rem 2rem; display:flex; flex-direction:column; gap:.8rem; transition:background .25s; }
.card:hover{ background:var(--ink-3); }
.card.hidden{ display:none; }
.card .ic{ width:32px; height:32px; color:var(--signal); }
html[dir="rtl"] .card .ic{ transform:scaleX(-1); }
.card h3{ color:var(--bone); }
.card .tag{
  font-family:var(--mono); font-size:.6rem; letter-spacing:.14em; text-transform:uppercase;
  color:var(--bone-faint); border:1px solid var(--rule-hard); padding:.22rem .5rem; align-self:flex-start;
}
html[lang="ar"] .card .tag, html[lang="ja"] .card .tag{ text-transform:none; letter-spacing:.01em; font-size:.7rem; }
.card ul{ list-style:none; margin:.15rem 0 0; padding:0; }
.card ul li{ font-size:.94rem; color:var(--bone-dim); padding:.34rem 0; padding-inline-start:1.05rem; position:relative; line-height:1.55; }
.card ul li::before{ content:"—"; position:absolute; inset-inline-start:0; color:var(--signal-deep); }
.card .why{
  margin-top:auto; padding-top:1rem; border-top:1px solid var(--rule);
  font-family:var(--mono); font-size:.7rem; letter-spacing:.03em; color:var(--amber); line-height:1.6;
}
html[lang="ar"] .card .why, html[lang="ja"] .card .why{ font-size:.82rem; }

/* ============ TABLES ============ */
.spec{ width:100%; border-collapse:collapse; font-family:var(--mono); font-size:.79rem; }
.spec th, .spec td{ text-align:start; padding:.95rem .8rem; border-bottom:1px solid var(--rule); vertical-align:top; }
.spec th{ color:var(--bone-faint); font-weight:400; letter-spacing:.1em; text-transform:uppercase; font-size:.66rem; width:40%; }
.spec td{ color:var(--bone); }
.spec .ok{ color:var(--signal); }
html[lang="ar"] .spec, html[lang="ja"] .spec{ font-size:.88rem; }
html[lang="ar"] .spec th, html[lang="ja"] .spec th{ text-transform:none; letter-spacing:.01em; font-size:.8rem; }

.org{ width:100%; border-collapse:collapse; margin-top:1.3rem; }
.org th{ font-family:var(--mono); font-size:.64rem; letter-spacing:.14em; text-transform:uppercase; color:var(--bone-faint); text-align:start; padding:.7rem .8rem; border-bottom:1px solid var(--rule-hard); font-weight:400; }
.org td{ padding:1rem .8rem; border-bottom:1px solid var(--rule); font-size:.96rem; color:var(--bone-dim); }
.org td:first-child{ color:var(--bone); font-family:var(--mono); font-size:.8rem; }
html[lang="ar"] .org th, html[lang="ja"] .org th{ text-transform:none; letter-spacing:.01em; font-size:.78rem; }

/* ============ STATUS GRID ============ */
.status-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:1px; background:var(--rule); border:1px solid var(--rule); }
.status-grid > div{ background:var(--ink); padding:1.5rem 1.35rem; display:flex; flex-direction:column; gap:.55rem; }
.status-grid b{ font-family:var(--mono); font-size:.64rem; letter-spacing:.14em; text-transform:uppercase; color:var(--signal); }
html[lang="ar"] .status-grid b, html[lang="ja"] .status-grid b{ text-transform:none; letter-spacing:.01em; font-size:.76rem; }
.status-grid p{ margin:0; font-size:.95rem; color:var(--bone-dim); }
.pill{
  align-self:flex-start; font-family:var(--mono); font-size:.6rem; letter-spacing:.12em; text-transform:uppercase;
  padding:.24rem .6rem; border:1px solid var(--rule-hard); color:var(--bone-faint); margin-top:auto;
}
.pill.live{ color:var(--amber); border-color:rgba(255,190,92,.45); }
.pill.done{ color:var(--signal); border-color:rgba(92,242,160,.4); }
html[lang="ar"] .pill, html[lang="ja"] .pill{ text-transform:none; letter-spacing:.01em; font-size:.72rem; }
html[lang="fa"] .pill, html[lang="my"] .pill{ text-transform:none; letter-spacing:.01em; font-size:.72rem; }

/* ============ SCENES / ASK ============ */
.scenes{ display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:clamp(1.4rem,3vw,2.6rem); margin-top:3rem; }
.scene{ border-top:2px solid var(--signal-deep); padding-top:1.2rem; }
.scene b{ display:block; font-family:var(--mono); font-size:.68rem; letter-spacing:.13em; text-transform:uppercase; color:var(--signal); margin-bottom:.65rem; }
html[lang="ar"] .scene b, html[lang="ja"] .scene b{ text-transform:none; letter-spacing:.01em; font-size:.8rem; }
.scene p{ font-size:.96rem; margin:0; }

.asks{ display:grid; grid-template-columns:repeat(auto-fit,minmax(270px,1fr)); gap:1px; background:var(--rule); border:1px solid var(--rule); margin-top:2.2rem; }
.asks > div{ background:var(--ink); padding:1.7rem 1.5rem; }
.asks .n{ font-family:var(--mono); font-size:.7rem; color:var(--signal); letter-spacing:.14em; }
.asks h3{ margin:.6rem 0 .55rem; color:var(--bone); }
.asks p{ margin:0; font-size:.95rem; }

/* ============ DEMOS ============ */
.demos{ display:grid; grid-template-columns:repeat(auto-fit,minmax(290px,1fr)); gap:1.3rem; }
.demo{ border:1px solid var(--rule); padding:1.8rem 1.6rem; text-decoration:none; display:block; transition:border-color .25s, transform .25s, background .25s; }
.demo:hover{ border-color:var(--signal); transform:translateY(-3px); background:var(--ink-2); }
.demo .size{ font-family:var(--mono); font-size:.66rem; letter-spacing:.13em; color:var(--amber); text-transform:uppercase; }
.demo h3{ margin:.6rem 0 .5rem; }
.demo p{ margin:0 0 1rem; font-size:.93rem; }
.demo .go{ font-family:var(--mono); font-size:.7rem; letter-spacing:.12em; text-transform:uppercase; color:var(--signal); }
html[lang="ar"] .demo .size, html[lang="ja"] .demo .size, html[lang="ar"] .demo .go, html[lang="ja"] .demo .go{ text-transform:none; letter-spacing:.01em; font-size:.78rem; }

/* ============ CONTACT / FOOTER ============ */
.cta{ background:var(--ink-2); }
.mailbox{
  display:inline-flex; align-items:center; gap:.8rem; margin-top:1.5rem;
  border:1px solid var(--rule-hard); padding:.95rem 1.3rem;
  font-family:var(--mono); font-size:.9rem; color:var(--bone); text-decoration:none;
  transition:border-color .22s, color .22s; direction:ltr;
}
.mailbox:hover{ border-color:var(--signal); color:var(--signal); }
footer{ border-top:1px solid var(--rule); padding:2.6rem 0 3.4rem; }
.footgrid{ display:flex; flex-wrap:wrap; gap:1.2rem 2.4rem; align-items:baseline; }
footer p, footer a{ font-family:var(--mono); font-size:.7rem; letter-spacing:.05em; color:var(--bone-faint); margin:0; text-decoration:none; }
footer a:hover{ color:var(--signal); }
.license-badge{
  display:inline-flex; align-items:center; gap:.55rem; border:1px solid rgba(92,242,160,.4); color:var(--signal);
  font-family:var(--mono); font-size:.66rem; letter-spacing:.12em; text-transform:uppercase; padding:.4rem .8rem;
}
html[lang="ar"] footer p, html[lang="ja"] footer p, html[lang="ar"] footer a, html[lang="ja"] footer a{ font-size:.8rem; letter-spacing:.01em; }

/* ============ REVEAL ============ */
.rv{ opacity:0; transform:translateY(18px); transition:opacity .7s cubic-bezier(.2,.7,.3,1), transform .7s cubic-bezier(.2,.7,.3,1); }
.rv.in{ opacity:1; transform:none; }
@media (prefers-reduced-motion: reduce){ .rv{ opacity:1; transform:none; } }
::selection{ background:var(--signal); color:#06110c; }

/* ═════════ 접근성: 키보드 포커스 표시 (V5.7) ═════════ */
a:focus-visible, button:focus-visible, select:focus-visible, [tabindex]:focus-visible{
  outline:2px solid var(--signal); outline-offset:3px;
}
main:focus{ outline:none; }

/* 본문 바로가기 — 키보드·스크린리더 사용자를 위한 첫 번째 초점 */
.skip-link{
  position:absolute; inset-inline-start:.6rem; top:-3rem; z-index:100;
  font-family:var(--mono); font-size:.72rem; letter-spacing:.08em;
  background:var(--signal); color:#06110c; font-weight:600;
  padding:.7rem 1.1rem; text-decoration:none;
  transition:top .18s ease;
}
.skip-link:focus{ top:.6rem; }

/* 고대비 선호 설정 대응 */
@media (prefers-contrast: more){
  :root{
    --bone-dim:#e9e6dd; --bone-faint:#cbc9c1;
    --rule:rgba(236,231,220,.30); --rule-hard:rgba(236,231,220,.58);
  }
  .btn, .chip, .pill, .card .tag{ border-width:1.5px; }
  .note{ border-style:solid; }
}

/* ═════════ 모바일 메뉴 (햄버거) ═════════ */
.navtoggle{
  display:none; flex:none; width:40px; height:40px; padding:0;
  align-items:center; justify-content:center; flex-direction:column; gap:5px;
  background:transparent; border:1px solid var(--rule-hard); cursor:pointer;
  transition:border-color .2s;
}
.navtoggle:hover, .navtoggle:focus-visible{ border-color:var(--signal); outline:none; }
.navtoggle span{
  display:block; width:17px; height:1.5px; background:var(--bone);
  transition:transform .25s ease, opacity .2s ease;
}
.topbar.nav-open .navtoggle span:nth-child(1){ transform:translateY(6.5px) rotate(45deg); }
.topbar.nav-open .navtoggle span:nth-child(2){ opacity:0; }
.topbar.nav-open .navtoggle span:nth-child(3){ transform:translateY(-6.5px) rotate(-45deg); }

/* ═════════ 태블릿·모바일 최적화 ═════════ */
@media (max-width:1440px){
  nav.links{ gap:1rem; }
  nav.links a{ font-size:.66rem; letter-spacing:.07em; }
}
@media (max-width:1200px){
  .navtoggle{ display:flex; }
  .topbar .wrap{ gap:.7rem; }
  nav.links{
    display:none; position:absolute; top:100%; inset-inline:0;
    flex-direction:column; gap:0; background:var(--ink-2);
    border-top:1px solid var(--rule); border-bottom:1px solid var(--rule-hard);
    padding:.2rem var(--pad) .9rem; max-height:calc(100dvh - 62px); overflow-y:auto;
  }
  .topbar.nav-open nav.links{ display:flex; }
  nav.links a{
    padding:.95rem .2rem; border-bottom:1px solid var(--rule); border-radius:0;
    font-size:.82rem; letter-spacing:.06em;
  }
  nav.links a:last-child{ border-bottom:0; }
  nav.links a:hover{ border-bottom-color:var(--rule); color:var(--signal); }
  .chip{ min-height:42px; display:inline-flex; align-items:center; }
  .btn{ min-height:44px; }
}
@media (max-width:620px){
  /* V5.5: force all minimum-width grids into one flexible column on narrow phones. */
  .cards, .demos, .status-grid, .asks, .scenes{
    grid-template-columns:minmax(0,1fr);
  }
  .cards > *, .demos > *, .status-grid > *, .asks > *, .scenes > *{
    min-width:0;
  }
  .topbar .wrap{ height:58px; gap:.5rem; }
  .readability-toggle{ width:36px; height:36px; }
  .langbox svg{ display:none; }
  .langbox select{
    max-width:min(42vw,148px); padding-inline:.55rem 1.6rem;
    text-overflow:ellipsis; background-size:8px;
  }
  html.readability-mode .topbar .wrap{ height:64px; }
  .brand span{ display:none; }
  .hero-cta{ gap:.6rem; }
  .hero-cta .btn{ width:100%; justify-content:center; }
  .card{ padding:1.55rem 1.3rem 1.65rem; }
  .demo{ padding:1.45rem 1.25rem; }
  .status-grid > div{ padding:1.3rem 1.15rem; }
  .asks > div{ padding:1.45rem 1.25rem; }
  .note{ padding:1rem 1.05rem; }
  .zero-strip b{ font-size:1.45rem; }
  /* 사양표·조직표를 좁은 화면에서 2단 쌓기로 전환 */
  .spec tr{ display:block; border-bottom:1px solid var(--rule); padding:.6rem 0; }
  .spec th, .spec td{ display:block; width:auto; border-bottom:0; padding:.15rem .1rem; }
  .spec th{ color:var(--bone-faint); margin-bottom:.15rem; }
  .org th{ font-size:.6rem; padding:.6rem .4rem; }
  .org td{ padding:.85rem .4rem; font-size:.92rem; }
  .org td:first-child{ font-size:.75rem; }
  .mailbox{ width:100%; justify-content:center; font-size:.82rem; }
  .footgrid{ gap:.9rem 1.4rem; }
}
@media (max-width:420px){
  .brand b{ display:none; }
}
@media (max-width:400px){
  .zero-strip{ grid-template-columns:1fr; }
  .zero-strip div:nth-child(n+2){ border-top:1px solid var(--rule); border-inline-start:0; }
}
/* 터치 기기에서는 부양 효과 제거 (모바일에서 눌림이 어색해지는 문제 방지) */
@media (hover:none){
  .btn:hover, .demo:hover, .card:hover{ transform:none; }
  .card:hover{ background:var(--ink); }
}
/* ═════════ 구형·저사양 단말 성능 보정 (V5.7) ═════════
   전체 화면 노이즈 필터와 배경 블러는 10년 전 단말의 GPU에서 스크롤을
   눈에 띄게 떨어뜨린다. 좁은 화면에서는 두 효과를 끄고 단색으로 대체한다.
   시각적 손실은 거의 없고, 목표 하드웨어에서의 체감 성능이 개선된다. */
@media (max-width:620px){
  body::after{ display:none; }
  body::before{ opacity:.16; background-size:64px 64px; }
  header.topbar{
    backdrop-filter:none; -webkit-backdrop-filter:none;
    background:var(--ink);
  }
}

/* 긴 주소·이메일이 좁은 화면에서 넘치지 않도록 */
.mailbox, .demo .go, footer a{ overflow-wrap:anywhere; }

/* ═════════ 인쇄 및 PDF 변환 (V5.7) ═════════
   심사자가 페이지를 인쇄하거나 PDF로 저장해 검토 자료에 첨부하는 경우를
   위한 규칙이다. 특히 .rv 요소는 스크롤 전에는 opacity:0 이므로, 이
   규칙이 없으면 인쇄 결과가 대부분 백지로 나온다. */
@media print{
  :root{
    --ink:#ffffff; --ink-2:#ffffff; --ink-3:#ffffff;
    --bone:#111111; --bone-dim:#333333; --bone-faint:#555555;
    --signal:#1b5e20; --signal-deep:#1b5e20; --amber:#7a4b00;
    --rule:rgba(0,0,0,.20); --rule-hard:rgba(0,0,0,.38);
  }
  body{ background:#fff; color:#111; font-size:10.5pt; line-height:1.5; }
  body::before, body::after{ display:none !important; }
  header.topbar, .navtoggle, .readability-toggle, .langbox,
  nav.links, .filterbar, #filterStatus{ display:none !important; }
  /* 스크롤 연출 요소를 모두 펼친 상태로 출력 */
  .rv{ opacity:1 !important; transform:none !important; }
  /* 필터로 숨긴 적용 영역도 인쇄물에는 전부 포함 */
  .card.hidden{ display:flex !important; }
  main, section{ padding:10pt 0; }
  section{ border-top:1px solid rgba(0,0,0,.25); }
  .split, .cards, .demos, .status-grid, .asks, .scenes, .checks{
    display:block;
  }
  .card, .demo, .status-grid > div, .asks > div, .scene, .note, .pull{
    break-inside:avoid; page-break-inside:avoid;
    border:1px solid rgba(0,0,0,.22); margin-bottom:7pt; padding:7pt 9pt;
  }
  h1{ font-size:20pt; } h2{ font-size:14pt; } h3{ font-size:11.5pt; }
  h1, h2, h3{ break-after:avoid; page-break-after:avoid; }
  .hero-cta a.btn{
    display:inline-block; border:none; padding:0 .6rem 0 0;
    text-transform:none; letter-spacing:0; color:#111;
  }
  /* 종이에서는 클릭할 수 없으므로 주소를 본문에 함께 인쇄 */
  a[href^="https"]::after{
    content:" \a0<" attr(href) ">"; font-family:var(--mono);
    font-size:8.5pt; color:#555; word-break:break-all;
  }
  .brand svg{ display:none; }
  .license-badge{ border-color:rgba(0,0,0,.4); }
}
/* ==========================================================================
   VERIFICATION PANEL  (V5.7)
   A  live self-audit of this page
   B  limitations and threat model
   C  offline copy of this page
   Vanilla CSS only. No external asset of any kind.
   ========================================================================== */
.verify-toggle{
  display:inline-flex; align-items:center; gap:.45rem; flex:none;
  height:40px; padding:0 .8rem; color:var(--bone-dim);
  background:var(--ink-2); border:1px solid var(--rule-hard); cursor:pointer;
  font-family:var(--mono); font-size:.68rem; letter-spacing:.12em; text-transform:uppercase;
  transition:border-color .2s, color .2s, background .2s; white-space:nowrap;
}
.verify-toggle svg{ width:17px; height:17px; flex:none; }
.verify-toggle:hover, .verify-toggle:focus-visible{ border-color:var(--signal); color:var(--signal); outline:none; }
.verify-toggle[aria-expanded="true"]{ border-color:var(--signal); color:var(--signal); background:rgba(92,242,160,.08); }
html[lang="ar"] .verify-toggle, html[lang="ja"] .verify-toggle, html[lang="fa"] .verify-toggle,
html[lang="my"] .verify-toggle, html[lang="ko"] .verify-toggle, html[lang="zh-TW"] .verify-toggle,
html[lang="hi"] .verify-toggle, html[lang="bn"] .verify-toggle{ text-transform:none; letter-spacing:.02em; font-size:.76rem; }
@media (max-width:620px){ .verify-toggle span{ display:none; } .verify-toggle{ width:40px; padding:0; justify-content:center; } }

.verify{ border-top:1px solid var(--rule); background:var(--ink-2); padding:clamp(2.2rem,5vw,3.6rem) 0; }
.verify[hidden]{ display:none; }
.verify-head{ display:flex; align-items:flex-start; gap:1rem; margin-bottom:.9rem; }
.verify-head h2{ font-size:clamp(1.4rem,2.6vw,2rem); flex:1; }
.verify-head h2:focus{ outline:none; }
.verify-head h2:focus-visible{ outline:2px solid var(--signal); outline-offset:6px; }
.verify-close{
  flex:none; width:34px; height:34px; padding:0; cursor:pointer; line-height:1;
  background:transparent; border:1px solid var(--rule-hard); color:var(--bone-dim);
  font-family:var(--mono); font-size:.9rem; transition:border-color .2s, color .2s;
}
.verify-close:hover, .verify-close:focus-visible{ border-color:var(--signal); color:var(--signal); outline:none; }
.verify .lead{ margin-bottom:2rem; }

.vgrid{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:clamp(1rem,2vw,1.6rem); align-items:start; }
@media (max-width:1000px){ .vgrid{ grid-template-columns:1fr; } }
.vcard{ border:1px solid var(--rule-hard); background:var(--ink); padding:clamp(1.2rem,2vw,1.7rem); }
.vcard h3{ display:flex; align-items:baseline; gap:.6rem; margin-bottom:.8rem; }
.vcard h3 .n{
  font-family:var(--mono); font-size:.7rem; letter-spacing:.14em; color:var(--signal);
  border:1px solid rgba(92,242,160,.4); padding:.12rem .42rem; flex:none;
}
.vcard p{ font-size:.94rem; }
.vcard .btn{ margin-block:.4rem 1rem; }
.vnote{
  font-family:var(--mono); font-size:.68rem; line-height:1.75; letter-spacing:.02em;
  color:var(--bone-faint); border-top:1px solid var(--rule); padding-top:.85rem; margin:1rem 0 0;
}
.vnote.warn{ color:var(--amber); border-top-color:rgba(255,190,92,.3); }

/* --- A: self-audit output --- */
.audit-out{ margin:0; }
.audit-out table{ width:100%; border-collapse:collapse; font-family:var(--mono); font-size:.7rem; }
.audit-out th, .audit-out td{
  text-align:start; padding:.6rem .1rem; border-bottom:1px solid var(--rule); vertical-align:top;
}
.audit-out th{ font-weight:500; color:var(--bone-dim); letter-spacing:.02em; padding-inline-end:.8rem; }
.audit-out td{ color:var(--bone); white-space:nowrap; text-align:end; }

"s1.body":"<p class='lead'>Frontier-scale compute is affordable to a small number of institutions and states. In refugee settlements, off-grid farms, disaster zones, underground worksites, air-gapped facilities and regions subject to network shutdown, the binding constraints are different: electricity, bandwidth, unit cost, and the legal exposure that comes with collecting personal data.</p><p>This project takes the opposite direction from the prevailing trend. Rather than adding parameters, it removes infrastructure. Rather than collecting data in order to improve, it collects none. What remains is small enough to be read line by line, inexpensive enough to be distributed without charge, and durable enough to continue operating once connectivity, cloud credit and project funding have ended.</p><p>The same properties are relevant well beyond humanitarian settings. Systems intended for extreme environments — including planetary exploration — are subject to comparable requirements for survivability and self-sufficiency.</p>",

"<article class='card rv' data-tags='disaster'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M4 18h16'/><path d='M7 18V9l5-5 5 5v9'/><path d='M12 13v5'/></svg><span class='tag'>Infrastructure-independent</span><h3>Disaster response and off-grid emergency operations</h3><ul><li>Device-to-device mesh communication without internet or cellular service</li><li>Offline triage support and vital-sign monitoring</li><li>Search-and-rescue support during power and network outages</li></ul><p class='why'>The first hours of a disaster are precisely when the network is unavailable.</p></article>"+
"<article class='card rv' data-tags='defence'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><rect x='3' y='4' width='18' height='14' rx='1.5'/><path d='M8 21h8M12 18v3M7 9h4M7 13h7'/></svg><span class='tag'>Air-gapped</span><h3>Air-gapped and safety-critical facilities</h3><ul><li>Critical infrastructure where outbound traffic is prohibited by policy</li><li>Semiconductor fabrication and advanced manufacturing environments</li><li>Privacy-preserving medical and healthcare devices</li></ul><p class='why'>Egress Kill Switch: outbound communication can be disabled instantly, making exfiltration structurally impossible rather than merely prohibited.</p></article>"+
"<article class='card rv' data-tags='esg'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M4 12a8 8 0 0 1 8-8h5'/><path d='M20 12a8 8 0 0 1-8 8H7'/><path d='M14 1.5L17.5 4 14 6.5M10 17.5L6.5 20 10 22.5'/></svg><span class='tag'>Circular economy</span><h3>E-waste upcycling and environmental monitoring</h3><ul><li>Retired smartphones repurposed as humanitarian and monitoring nodes</li><li>Low-cost environmental and occupational safety monitoring</li><li>Acoustic and vibrational detection of locust swarms in off-grid regions</li></ul><p class='why'>Extending device lifespan is a measurable ESG outcome rather than a claim.</p></article>"+
"<article class='card rv' data-tags='defence esg'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M3 20h18'/><path d='M6 20V10l6-6 6 6v10'/><circle cx='12' cy='13' r='2'/></svg><span class='tag'>Remote operations</span><h3>Remote industrial sites and edge operations</h3><ul><li>Underground mines and tunnel operations</li><li>Construction and other hazardous worksites</li><li>Local asset tracking and worker-safety monitoring without network infrastructure</li></ul><p class='why'>Where connectivity ends, the device must still be able to reason on its own.</p></article>"+
"<article class='card rv' data-tags='agri'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M12 21c0-6 3-9 8-9-1 6-4 9-8 9z'/><path d='M12 21c0-6-3-9-8-9 1 6 4 9 8 9z'/><path d='M12 21v-7'/></svg><span class='tag'>Low coverage</span><h3>Agriculture and livestock across large, low-coverage areas</h3><ul><li>Soil-moisture and livestock-condition monitoring in the United States, Canada and Australia</li><li>Early indication of disease risk within herds</li><li>Local alerting to deter theft of high-value livestock</li></ul><p class='why'>Continuous low-power monitoring may improve productivity where communications infrastructure is limited.</p></article>"+
"<article class='card rv' data-tags='consumer esg'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><rect x='7' y='6' width='10' height='12' rx='2'/><path d='M9 6V3h6v3M9 18v3h6v-3'/><path d='M10 12h4'/></svg><span class='tag'>$1-class silicon</span><h3>Ultra-low-cost and solar-powered hardware</h3><ul><li>Solar-powered digital watches carrying simple life-safety functions</li><li>Always-on operation on ultra-low-cost semiconductor chips</li><li>Negligible effect on unit manufacturing cost</li></ul><p class='why'>Efficiency here is not a limitation accepted reluctantly; it is the design premise.</p></article>"+
"<article class='card rv' data-tags='rights disaster defence'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><circle cx='12' cy='12' r='2.2'/><path d='M8 8a5.5 5.5 0 0 0 0 8M16 8a5.5 5.5 0 0 1 0 8M5 5a10 10 0 0 0 0 14M19 5a10 10 0 0 1 0 14'/></svg><span class='tag'>BLE &amp; ultrasonic</span><h3>Local communication without any network</h3><ul><li>Bluetooth mesh between nearby devices</li><li>Ultrasonic and acoustic transport where radio is unavailable or inadvisable</li><li>Pure-JavaScript machine learning and BLE scanning on ten-year-old Android devices</li></ul><p class='why'>Design target for field endurance is 60–70 days on minimal power, with six months as the longer-term objective.</p></article>",

"s4.eyebrow":"Architecture",
"s4.h":"Security properties that follow from structure, not from policy.",
"s4.body":"<p>The objective is a single-file, zero-dependency architecture in which every module is written from first principles for completeness and self-reliance. Nothing is imported at runtime, because anything imported at runtime is something an adversary, an outage or a discontinued service can remove.</p><p><strong>Egress Kill Switch:</strong> outbound network communication can be disabled instantly, isolating the device so that exfiltration is structurally impossible rather than administratively forbidden. This distinction matters to organisations that must demonstrate, not merely assert, that data cannot leave.</p>",
"s4.spec":"<tr><th>Runtime</th><td>Pure JavaScript, in-browser, single file</td></tr><tr><th>External libraries</th><td><span class='ok'>None</span> — zero dependency, no CDN</td></tr><tr><th>Server requirement</th><td><span class='ok'>None</span> — serverless, zero egress</td></tr><tr><th>Personal data collected</th><td><span class='ok'>None</span> — no telemetry, no metadata</td></tr><tr><th>Core method</th><td>FSM + behaviour trees + lightweight RL (rule-based, inspectable)</td></tr><tr><th>Local transport</th><td>BLE mesh; ultrasonic and acoustic</td></tr><tr><th>Minimum hardware</th><td>Ten-year-old Android device; $1-class chips; basic solar supply</td></tr><tr><th>Field endurance</th><td>60–70 days design target; six months as longer-term objective</td></tr><tr><th>Compliance posture</th><td>GDPR Privacy-by-Design; ESG and UN SDG alignment</td></tr><tr><th>Licence</th><td><span class='ok'>Apache License 2.0</span></td></tr><tr><th>Removal</th><td>Deletable by the user at any time, leaving no residual data</td></tr>",

"s5.eyebrow":"Design ethics",
"s5.pull":"Technical performance alone does not determine whether a system can be adopted.",
"s5.body":"<p class='lead'>In humanitarian and civil-society deployments, adoption is generally decided by legal responsibility and risk rather than by capability. However capable a system may be, a residual probability of a substantial data-protection dispute is often sufficient to prevent an NGO or international organisation from taking it on.</p><p>Each design decision here follows from that constraint: reduce hallucination in sensitive domains, remain transparent enough to be independently audited, operate in low-resource settings, collect nothing, transfer no legal liability to the adopting organisation, and remain simple enough for non-programmers to read, adapt and delete.</p><p>Alignment with international norms — GDPR, the UNCRC and the CRPD — is treated as a design input from the outset rather than a compliance layer added afterwards.</p>",
"s5.scenes":"<div class='scene'><b>Reduce hallucination</b><p>Incorrect output in child protection, healthcare or disaster response carries immediate consequences.</p></div><div class='scene'><b>Remain inspectable</b><p>Open code and open architecture, because an opaque system cannot be defended when it fails.</p></div><div class='scene'><b>Transfer no liability</b><p>No collection, no server and no cross-border transfer means no liability passed to the adopting organisation.</p></div><div class='scene'><b>Remain deletable</b><p>Users can remove the system and its data at any time. Ease of deletion is freedom from obligation.</p></div>",

"s6.eyebrow":"Review and audit status",
"s6.h":"Each item is stated together with its current stage.",
"s6.lead":"Each item below is labelled with its stage so that it can be read precisely, and each can be verified independently through the sources indicated.",
"s6.grid":"<div><b>First-stage review</b><p>Government of Luxembourg · UCL · IDS (United Kingdom)</p><span class='pill done'>Completed</span></div><div><b>Security audit</b><p>U.S. OTF Security Lab — USAGM / Open Technology Fund (2026)</p><span class='pill done'>Completed</span></div><div><b>Research paper</b><p><a href='https://mcorpai.org/VitalGuard_Offline_AI.pdf' target='_blank' rel='noopener' style='color:var(--signal);text-decoration:none;'>Offline AI (VitalGuard) — PDF ↗</a></p><span class='pill done'>Published</span></div><div><b>Academic dissemination</b><p>Submission to ACM FAccT in preparation; open to future research collaboration with the University of Oxford</p><span class='pill'>Planned</span></div><div><b>Standards posture</b><p>GDPR Privacy-by-Design; ESG frameworks; UN Sustainable Development Goals</p><span class='pill'>By design</span></div><div><b>Licence</b><p>Apache License 2.0 — available without charge for public-good use</p><span class='pill done'>Confirmed</span></div>",
"s6.note":"<b>STATUS AND LIMITATIONS —</b> The published demonstrations are minimum viable products rather than finished products, and field validation at scale has not yet been carried out. Statements about compliance describe architectural intent and verifiable properties — principally that no personal data is collected and no outbound connection is required — rather than a certification issued by a third party. This section is written so that reviewers can verify each claim independently rather than accept it on trust.",

"s7.eyebrow":"Demonstrations",
"s7.h":"Opening the file in a browser constitutes the entire installation.",
"s7.lead":"Minimum viable products including basic on-device machine learning. Capacity: one image. No account, no sign-up, and no data leaves the device.",
"s7.demos":"<a class='demo' href='https://mcorpai.com/' target='_blank' rel='noopener'><span class='size'>600 KB · Demonstration 01</span><h3>Bluetooth mesh networking</h3><p>Device-to-device mesh with lightweight on-device machine learning and BLE scanning, running entirely in the browser.</p><span class='go'>mcorpai.com ↗</span></a><a class='demo' href='https://mcorpai.net/' target='_blank' rel='noopener'><span class='size'>460 KB · Demonstration 02</span><h3>Bluetooth and ultrasonic</h3><p>Acoustic and ultrasonic local transport for environments in which radio is unavailable or inadvisable.</p><span class='go'>mcorpai.net ↗</span></a><a class='demo' href='https://mcorpai.org/' target='_blank' rel='noopener'><span class='size'>Project workspace</span><h3>Papers, contact and status</h3><p>Current documentation and the correspondence address for the programme.</p><span class='go'>mcorpai.org ↗</span></a>",
"s7.note":"No data collection. No analytics. No third-party requests — including on this page, which loads no external font, script or stylesheet.",

"s8.eyebrow":"The institute",
"s8.h":"An institution-to-institution proposal rather than an individual appointment.",
"s8.body":"<p>The M Corp AI Research Institute is planned for the Republic of Korea, working with partners internationally. Selected projects are intended for release without charge under the Apache License 2.0 for public-good use. A proportion of the institute's revenue is intended to support independent art films and children affected by rare diseases, with a high ESG rating as an explicit objective.</p><p>The founder is not seeking individual employment. What is proposed is a technology licensing and joint research agreement between your organisation and the institute, allowing the founder to remain responsible for architecture, research direction and long-term mission.</p>",
"s8.org":"<thead><tr><th>Role</th><th>Responsibility</th></tr></thead><tbody><tr><td>Founder &amp; AI Systems Architect</td><td>Morgan J. — architecture, research direction, long-term vision</td></tr><tr><td>Software engineering team</td><td>Three developers based in Eastern Europe — development, implementation and coding</td></tr></tbody>",
"s8.note":"<b>CURRENT OBJECTIVE —</b> To establish an independent low-level AI research institute in the Republic of Korea with a small engineering team, and to identify institutional partners able to support its establishment and sustainable long-term operation.",

"s9.eyebrow":"Partnership",
"s9.h":"Three forms of collaboration are currently being sought.",
"s9.items":"<div><span class='n'>01</span><h3>Research partnership</h3><p>Remote collaboration with academic groups and research institutes on offline AI, edge computing and privacy-preserving system design, including joint publication.</p></div><div><span class='n'>02</span><h3>Licensing and joint R&amp;D</h3><p>Institution-to-institution agreements enabling an organisation to apply the architecture within its own programmes, with technical support from the institute.</p></div><div><span class='n'>03</span><h3>Funding</h3><p>Support for the establishment and sustainable operation of an independent offline AI research laboratory in the Republic of Korea.</p></div>",

"s1.body":"<p class='lead'>최전선 규모의 연산 자원을 감당할 수 있는 곳은 소수의 기관과 국가에 한정됩니다. 난민 정착지, 전력망 밖의 농지, 재난 지역, 지하 작업장, 외부와 차단된 시설, 통신이 차단된 지역에서는 제약의 성격 자체가 다릅니다. 전력, 대역폭, 단가, 그리고 개인데이터 수집에 뒤따르는 법적 노출이 그것입니다.</p><p>이 프로젝트는 주류와 반대 방향을 택합니다. 파라미터를 늘리는 대신 인프라를 걷어내고, 개선을 위해 데이터를 모으는 대신 아무것도 모으지 않습니다. 그 결과 남는 것은 한 줄씩 읽어 검증할 수 있을 만큼 작고, 무상으로 배포할 수 있을 만큼 저렴하며, 통신과 클라우드 예산과 사업 기간이 끝난 뒤에도 계속 동작할 만큼 견고한 시스템입니다.</p><p>같은 성질은 인도적 지원의 범위를 넘어서도 의미를 가집니다. 행성 탐사를 포함한 극한 환경용 시스템 역시 생존성과 자립성이라는 점에서 유사한 요건을 적용받기 때문입니다.</p>",

"s2.eyebrow":"설계 제약",
"s2.h":"아래 항목은 모두 설정 옵션이 아니라 아키텍처 차원의 결정입니다.",
"s2.list":"<li>서버 인프라를 필요로 하지 않음</li><li>외부 라이브러리 없음, 자기완결적 단일 파일</li><li>GPU 구매·임대 비용 없음</li><li>추가 배포 1건당 한계비용이 사실상 0</li><li>외부 송신이 없는 구조</li><li>제3자 네트워크에서 불러오는 자원 없음</li><li>GDPR 준수를 전제로 한 설계(Privacy-by-Design)</li><li>극저전력 동작</li><li>퇴역 단말에서 동작하여 기기 수명을 연장</li><li>1달러급 칩과 기본적인 태양광 전원으로 구동</li><li>ESG 체계 및 UN 지속가능발전목표와 정합</li><li>예산을 하드웨어가 아닌 연구 인력에 집중</li>",
"s2.note":"<b>방법 —</b> 대형 딥러닝 모델 대신 유한상태기계(FSM)와 행동 트리, 경량 강화학습을 결합한 하이브리드 구성을 사용합니다. 규칙 기반 상태 제어는 낮은 연산 비용으로 안정적인 실시간 동작을 제공하며, 안전이 걸린 상황에서 그에 못지않게 중요한 점으로, 사후에 추적하고 설명할 수 있는 판단을 남깁니다.",

"s3.eyebrow":"적용 영역",
"s3.h":"클라우드 의존형 AI를 배치할 수 없는 여덟 가지 운용 환경.",
"s3.lead":"아래 영역은 하나의 구현을 공유합니다. 귀 기관의 사업에 가장 가까운 환경으로 걸러 보실 수 있습니다. 각 항목은 완료된 배치 실적이 아니라 적용 영역으로 기재했으며, 현장 검증에 관한 내용은 검토 현황 절에 별도로 밝혔습니다.",

"<article class='card rv' data-tags='disaster'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M4 18h16'/><path d='M7 18V9l5-5 5 5v9'/><path d='M12 13v5'/></svg><span class='tag'>인프라 비의존</span><h3>재난 대응 및 전력망 밖 긴급 활동</h3><ul><li>인터넷과 이동통신 없이 단말 간 메시 통신</li><li>오프라인 중증도 분류 지원 및 활력징후 모니터링</li><li>정전·통신 두절 시 수색구조 지원</li></ul><p class='why'>재난 발생 직후의 몇 시간은 바로 통신망을 쓸 수 없는 시간대입니다.</p></article>"+
"<article class='card rv' data-tags='defence'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><rect x='3' y='4' width='18' height='14' rx='1.5'/><path d='M8 21h8M12 18v3M7 9h4M7 13h7'/></svg><span class='tag'>망 분리 환경</span><h3>망 분리 시설 및 안전상 중요한 시설</h3><ul><li>내부 방침상 외부 송신이 금지된 국가기간시설</li><li>반도체 제조 및 첨단 생산 환경</li><li>프라이버시를 보전하는 의료·헬스케어 기기</li></ul><p class='why'>Egress Kill Switch: 외부 통신을 즉시 차단하여, 유출을 규정상의 금지가 아니라 구조상 불가능한 상태로 만듭니다.</p></article>"+
"<article class='card rv' data-tags='esg'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M4 12a8 8 0 0 1 8-8h5'/><path d='M20 12a8 8 0 0 1-8 8H7'/><path d='M14 1.5L17.5 4 14 6.5M10 17.5L6.5 20 10 22.5'/></svg><span class='tag'>순환경제</span><h3>전자폐기물 업사이클링과 환경 모니터링</h3><ul><li>퇴역 스마트폰을 인도적 지원·관측 노드로 재활용</li><li>저비용 환경 및 산업안전 모니터링</li><li>전력망 밖 지역에서 메뚜기떼의 음향·진동 탐지</li></ul><p class='why'>기기 수명 연장은 주장에 그치지 않고 측정 가능한 ESG 성과입니다.</p></article>"+
"<article class='card rv' data-tags='defence esg'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M3 20h18'/><path d='M6 20V10l6-6 6 6v10'/><circle cx='12' cy='13' r='2'/></svg><span class='tag'>원격 운용</span><h3>원격지 산업 현장과 엣지 운용</h3><ul><li>지하 광산 및 터널 작업</li><li>건설 현장 등 위험 작업 환경</li><li>통신 기반 없이 자산 추적과 작업자 안전 모니터링</li></ul><p class='why'>통신이 끊기는 지점부터는 단말 스스로 판단을 이어가야 합니다.</p></article>"+
"<article class='card rv' data-tags='agri'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M12 21c0-6 3-9 8-9-1 6-4 9-8 9z'/><path d='M12 21c0-6-3-9-8-9 1 6 4 9 8 9z'/><path d='M12 21v-7'/></svg><span class='tag'>통신 취약 지대</span><h3>광대한 통신 취약 지역의 농업과 축산</h3><ul><li>미국·캐나다·호주의 토양 수분 및 가축 상태 모니터링</li><li>축군 내 질병 위험의 조기 포착</li><li>고가 가축의 도난을 억제하는 현장 경보</li></ul><p class='why'>통신 기반이 제한된 지역에서 저전력 상시 모니터링은 생산성 개선으로 이어질 수 있습니다.</p></article>"+
"<article class='card rv' data-tags='consumer esg'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><rect x='7' y='6' width='10' height='12' rx='2'/><path d='M9 6V3h6v3M9 18v3h6v-3'/><path d='M10 12h4'/></svg><span class='tag'>1달러급 반도체</span><h3>초저가 및 태양광 구동 하드웨어</h3><ul><li>간단한 인명 보호 기능을 갖춘 태양광 디지털 시계</li><li>초저가 칩 위에서의 상시 동작</li><li>단위 제조 원가에 미치는 영향이 미미함</li></ul><p class='why'>여기서 효율은 마지못해 받아들인 제약이 아니라 설계의 전제 그 자체입니다.</p></article>"+
"<article class='card rv' data-tags='rights disaster defence'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><circle cx='12' cy='12' r='2.2'/><path d='M8 8a5.5 5.5 0 0 0 0 8M16 8a5.5 5.5 0 0 1 0 8M5 5a10 10 0 0 0 0 14M19 5a10 10 0 0 1 0 14'/></svg><span class='tag'>BLE·초음파</span><h3>통신망 없이 이루어지는 근거리 통신</h3><ul><li>인접 단말 간 블루투스 메시</li><li>전파를 쓸 수 없거나 쓰기 어려운 환경에서의 초음파·음향 전송</li><li>10년 된 안드로이드 기기에서 동작하는 순수 자바스크립트 머신러닝과 BLE 스캔</li></ul><p class='why'>현장 지속 시간의 설계 목표는 저전력 조건에서 60~70일이며, 장기 목표는 6개월입니다.</p></article>",

"s4.eyebrow":"아키텍처",
"s4.h":"운영 규정이 아니라 구조에서 도출되는 보안 성질.",
"s4.body":"<p>목표는 모든 모듈을 처음부터 직접 작성하여 완결성과 자립성을 확보한 단일 파일·무의존성 아키텍처입니다. 실행 시점에 아무것도 불러오지 않는 이유는, 실행 시점에 불러오는 것은 모두 공격자나 장애, 서비스 종료에 의해 사라질 수 있기 때문입니다.</p><p><strong>Egress Kill Switch:</strong> 외부 통신을 즉시 차단해 단말을 격리함으로써, 데이터 유출을 행정적 금지가 아니라 구조적 불가능의 영역으로 옮깁니다. 데이터가 밖으로 나가지 않는다는 사실을 주장이 아니라 증명해야 하는 조직에게 이 구분은 중요합니다.</p>",
"s4.spec":"<tr><th>실행 환경</th><td>순수 자바스크립트, 브라우저 내, 단일 파일</td></tr><tr><th>외부 라이브러리</th><td><span class='ok'>없음</span> — 무의존성, CDN 미사용</td></tr><tr><th>서버 요구사항</th><td><span class='ok'>없음</span> — 서버리스, 외부 송신 없음</td></tr><tr><th>수집 개인데이터</th><td><span class='ok'>없음</span> — 텔레메트리·메타데이터 모두 없음</td></tr><tr><th>핵심 방식</th><td>FSM + 행동 트리 + 경량 강화학습(규칙 기반, 검증 가능)</td></tr><tr><th>근거리 전송</th><td>BLE 메시, 초음파 및 음향</td></tr><tr><th>최소 하드웨어</th><td>10년 된 안드로이드 기기, 1달러급 칩, 기본 태양광 전원</td></tr><tr><th>현장 지속 시간</th><td>설계 목표 60~70일, 장기 목표 6개월</td></tr><tr><th>규범 대응</th><td>GDPR Privacy-by-Design, ESG 및 UN SDGs 정합</td></tr><tr><th>라이선스</th><td><span class='ok'>Apache License 2.0</span></td></tr><tr><th>삭제</th><td>사용자가 언제든 삭제 가능하며 잔존 데이터가 없음</td></tr>",

"s5.eyebrow":"설계 윤리",
"s5.pull":"기술적 성능만으로 도입 여부가 결정되지는 않습니다.",
"s5.body":"<p class='lead'>인도적 지원과 시민사회 현장에서 도입을 좌우하는 것은 대개 성능이 아니라 법적 책임과 위험입니다. 아무리 성능이 뛰어나도 상당한 규모의 데이터 보호 분쟁이 발생할 가능성이 남아 있다면, NGO나 국제기구가 도입을 포기하는 경우가 적지 않습니다.</p><p>이 설계의 각 판단은 그 제약에서 나왔습니다. 민감한 영역에서 환각을 줄일 것, 독립적인 감사를 견딜 만큼 투명할 것, 저자원 환경에서 동작할 것, 아무것도 수집하지 않을 것, 도입 기관에 법적 책임을 넘기지 않을 것, 그리고 개발자가 아닌 실무자가 읽고 고치고 지울 수 있을 만큼 단순할 것입니다.</p><p>GDPR, 아동권리협약(UNCRC), 장애인권리협약(CRPD) 등 국제 규범과의 정합은 사후에 덧붙이는 준수 절차가 아니라 처음부터의 설계 입력으로 다룹니다.</p>",
"s5.scenes":"<div class='scene'><b>환각을 줄인다</b><p>아동 보호, 의료, 재난 대응에서의 잘못된 출력은 즉각적인 결과를 낳습니다.</p></div><div class='scene'><b>검증 가능하게 둔다</b><p>코드와 구조를 공개합니다. 설명할 수 없는 시스템은 실패했을 때 방어할 수 없기 때문입니다.</p></div><div class='scene'><b>책임을 넘기지 않는다</b><p>수집도, 서버도, 국경 간 이전도 없으므로 도입 기관에 넘어가는 책임이 없습니다.</p></div><div class='scene'><b>지울 수 있게 둔다</b><p>사용자는 언제든 시스템과 데이터를 삭제할 수 있습니다. 삭제의 용이성은 의무로부터의 자유입니다.</p></div>",

"s6.eyebrow":"검토 및 감사 현황",
"s6.h":"각 항목을 현재 단계와 함께 기재했습니다.",
"s6.lead":"각 항목에는 단계를 함께 표기하여 정확히 읽히도록 했으며, 모두 기재된 출처를 통해 독립적으로 확인하실 수 있습니다.",
"s6.grid":"<div><b>1차 검토</b><p>룩셈부르크 정부 · UCL · IDS (영국)</p><span class='pill done'>완료</span></div><div><b>보안 감사</b><p>미국 OTF Security Lab — USAGM / Open Technology Fund (2026)</p><span class='pill done'>완료</span></div><div><b>연구 논문</b><p><a href='https://mcorpai.org/VitalGuard_Offline_AI.pdf' target='_blank' rel='noopener' style='color:var(--signal);text-decoration:none;'>Offline AI (VitalGuard) — PDF ↗</a></p><span class='pill done'>공개</span></div><div><b>학술 발표</b><p>ACM FAccT 투고를 준비 중이며, 옥스퍼드 대학과의 향후 공동 연구에도 열려 있습니다</p><span class='pill'>예정</span></div><div><b>규범 대응</b><p>GDPR Privacy-by-Design, ESG 체계, UN 지속가능발전목표</p><span class='pill'>설계 반영</span></div><div><b>라이선스</b><p>Apache License 2.0 — 공익 목적에 한해 무상 이용 가능</p><span class='pill done'>확정</span></div>",
"s6.note":"<b>현황과 한계 —</b> 공개된 데모는 완성품이 아니라 최소 구현이며, 대규모 현장 검증은 아직 수행하지 않았습니다. 규범 대응에 관한 기술은 제3자가 발급한 인증이 아니라 설계 의도와 검증 가능한 성질, 즉 개인데이터를 수집하지 않으며 외부 연결을 필요로 하지 않는다는 사실을 가리킵니다. 이 절은 검토하시는 분들이 각 서술을 신뢰에 기대어 받아들이는 대신 독립적으로 확인하실 수 있도록 작성했습니다.",

"s4.eyebrow":"アーキテクチャ",
"s4.h":"運用規則ではなく、構造から導かれる安全性。",
"s4.body":"<p>目標は、すべてのモジュールを原理から書き起こし、完結性と自立性を確保した単一ファイル・外部依存ゼロのアーキテクチャです。実行時に何も読み込まないのは、実行時に読み込むものはすべて、攻撃者・障害・サービス終了によって奪われ得るからです。</p><p><strong>Egress Kill Switch：</strong>外部通信を即座に遮断し、端末を隔離することで、データの持ち出しを行政上の禁止ではなく構造上不可能な状態にします。この区別は、データが外部に出ないことを主張ではなく立証しなければならない組織にとって重要です。</p>",
"s4.spec":"<tr><th>実行環境</th><td>純JavaScript、ブラウザ内、単一ファイル</td></tr><tr><th>外部ライブラリ</th><td><span class='ok'>なし</span> — 依存ゼロ、CDN不使用</td></tr><tr><th>サーバー要件</th><td><span class='ok'>なし</span> — サーバーレス、外部送信なし</td></tr><tr><th>収集する個人データ</th><td><span class='ok'>なし</span> — テレメトリ・メタデータともになし</td></tr><tr><th>中核手法</th><td>有限状態機械＋ビヘイビアツリー＋軽量強化学習（ルールベース、検証可能）</td></tr><tr><th>近距離伝送</th><td>BLEメッシュ、超音波・音響</td></tr><tr><th>最低動作環境</th><td>10年前のAndroid端末、1ドル級チップ、簡易太陽光電源</td></tr><tr><th>現場稼働</th><td>設計目標60〜70日、長期目標6か月</td></tr><tr><th>法令対応方針</th><td>GDPR（Privacy-by-Design）、ESGおよび国連SDGsとの整合</td></tr><tr><th>ライセンス</th><td><span class='ok'>Apache License 2.0</span></td></tr><tr><th>削除</th><td>利用者がいつでも削除可能、データの残留なし</td></tr>",

"s5.eyebrow":"設計倫理",
"s5.pull":"技術的性能のみでは、そのシステムを採用できるかは決まりません。",
"s5.body":"<p class='lead'>人道支援や市民社会の現場では、採用の可否は性能よりも法的責任とリスクによって決まるのが通例です。どれほど高性能であっても、重大なデータ保護上の紛争が生じ得る確率が残るだけで、NGOや国際機関は導入を見送らざるを得ないことが少なくありません。</p><p>本設計の各判断はこの制約から導かれています。すなわち、機微な領域での誤出力を抑えること、独立した監査に耐える透明性を保つこと、低資源環境で動作すること、何も収集しないこと、導入組織に法的責任を移転しないこと、そして技術者でない担当者が読み・改変し・削除できる程度に単純であることです。</p><p>GDPR、児童の権利条約、障害者権利条約といった国際規範との整合は、後から加える適合作業ではなく、当初からの設計条件として扱っています。</p>",
"s5.scenes":"<div class='scene'><b>誤出力を抑える</b><p>児童保護、医療、災害対応における誤った出力は、直ちに結果をもたらします。</p></div><div class='scene'><b>検証可能であること</b><p>失敗した際に説明できない仕組みは擁護できないため、コードと構造を公開します。</p></div><div class='scene'><b>責任を移転しない</b><p>収集せず、サーバーを持たず、越境移転もないため、導入組織に責任が生じません。</p></div><div class='scene'><b>削除できること</b><p>利用者はいつでもシステムとデータを削除できます。削除の容易さは義務からの自由です。</p></div>",

"s6.eyebrow":"審査・監査の状況",
"s6.h":"各項目を現在の段階とともに記載しています。",
"s6.lead":"各項目には現在の段階を明記しており、いずれも記載の出典によって独立に確認いただけます。",
"s6.grid":"<div><b>一次審査</b><p>ルクセンブルク政府 ・ UCL ・ IDS（英国）</p><span class='pill done'>完了</span></div><div><b>セキュリティ監査</b><p>米国 OTF Security Lab — USAGM／Open Technology Fund（2026年）</p><span class='pill done'>完了</span></div><div><b>研究論文</b><p><a href='https://mcorpai.org/VitalGuard_Offline_AI.pdf' target='_blank' rel='noopener' style='color:var(--signal);text-decoration:none;'>Offline AI（VitalGuard）— PDF ↗</a></p><span class='pill done'>公開済</span></div><div><b>学術発表</b><p>ACM FAccTへの投稿を準備中。オックスフォード大学との将来的な共同研究にも開かれています</p><span class='pill'>予定</span></div><div><b>基準への対応</b><p>GDPR（Privacy-by-Design）、ESG枠組み、国連持続可能な開発目標</p><span class='pill'>設計上</span></div><div><b>ライセンス</b><p>Apache License 2.0 — 公益目的での無償利用が可能</p><span class='pill done'>確定</span></div>",
"s6.note":"<b>現状と限界 —</b> 公開中のデモは完成品ではなく最小限の実装であり、大規模な実地検証は未実施です。法令対応に関する記述は、第三者による認証ではなく、設計上の意図と検証可能な性質、すなわち個人データを収集せず外部接続を必要としないという事実を示すものです。本節は、審査にあたる方が各記述を信頼に基づいて受け入れるのではなく、独立して検証できるようにするために設けています。",

"s7.eyebrow":"デモ",

"s7.demos":"<a class='demo' href='https://mcorpai.com/' target='_blank' rel='noopener'><span class='size'>600 KB ・ デモ 01</span><h3>Bluetoothメッシュネットワーク</h3><p>端末間メッシュに軽量な機械学習とBLEスキャンを組み合わせ、すべてブラウザ内で動作します。</p><span class='go'>mcorpai.com ↗</span></a><a class='demo' href='https://mcorpai.net/' target='_blank' rel='noopener'><span class='size'>460 KB ・ デモ 02</span><h3>Bluetoothおよび超音波</h3><p>電波が利用できない、または適切でない環境のための音響・超音波による近距離伝送。</p><span class='go'>mcorpai.net ↗</span></a><a class='demo' href='https://mcorpai.org/' target='_blank' rel='noopener'><span class='size'>プロジェクト窓口</span><h3>論文・連絡先・進捗</h3><p>本プログラムの最新資料と連絡先を掲載しています。</p><span class='go'>mcorpai.org ↗</span></a>",
"s7.note":"データ収集なし。アクセス解析なし。第三者への通信なし。本ページ自体も外部のフォント、スクリプト、スタイルシートを一切読み込みません。",

"s8.eyebrow":"研究所",
"s8.h":"個人の採用ではなく、機関間の提携としての提案です。",
"s8.body":"<p>M Corp AI研究所は大韓民国に設立を予定しており、国際的なパートナーと協働します。選定したプロジェクトは、公益目的での利用に向けてApache License 2.0のもとで無償公開する方針です。また、研究所収益の一部は独立系芸術映画および希少疾患の子どもたちの支援に充てることを予定しており、高いESG評価の達成を明確な目標としています。</p><p>設立者は個人としての雇用を求めておりません。ご提案しているのは、貴組織と研究所との間の技術ライセンス供与および共同研究契約であり、これにより設立者はアーキテクチャ、研究方針、長期的使命に専念することができます。</p>",
"s8.org":"<thead><tr><th>役割</th><th>担当</th></tr></thead><tbody><tr><td>設立者 兼 AIシステムアーキテクト</td><td>Morgan J. — アーキテクチャ、研究方針、長期構想</td></tr><tr><td>ソフトウェア開発チーム</td><td>東欧在住の開発者3名 — 開発、実装、コーディング</td></tr></tbody>",

"s9.items":"<div><span class='n'>01</span><h3>共同研究</h3><p>オフラインAI、エッジコンピューティング、プライバシー保護設計に関する大学・研究機関との遠隔協働、および共著論文の作成。</p></div><div><span class='n'>02</span><h3>ライセンス供与・共同開発</h3><p>貴組織の事業内で本アーキテクチャを活用いただくための機関間契約。研究所による技術支援を伴います。</p></div><div><span class='n'>03</span><h3>資金支援</h3><p>大韓民国における独立したオフラインAI研究拠点の設立と持続的運営に対するご支援。</p></div>",

"hero.sub":"يقوم الذكاء الاصطناعي المعاصر على افتراض وجود مراكز بيانات، وإمداد كهربائي مستقر، واتصال متواصل، ومؤسسةٍ قادرةٍ على تحمّل التبعات القانونية المتصلة بحماية البيانات. ولا يتحقق واحد من هذه الافتراضات على الأقل لدى شريحة واسعة من سكان العالم. وقد وُضع تصميم VitalGuard انطلاقاً من هذا الواقع: نظام من ملف واحد، بلا تبعيات، يعمل داخل المتصفح على هاتف يعود إلى عشر سنوات، ولا يتطلب خادماً، ولا يجمع أي بيانات شخصية.",
"hero.cta":"<a class='btn solid' href='#applications'>مجالات التطبيق <span class='arw'>→</span></a><a class='btn' href='https://mcorpai.org/VitalGuard_Offline_AI.pdf' target='_blank' rel='noopener'>الورقة البحثية (PDF)</a><a class='btn' href='#status'>حالة المراجعة والتدقيق</a><a class='btn' href='https://github.com/jekymin8232/vitalguardai-com' target='_blank' rel='noopener'>GitHub للأبحاث ذات الصلة</a>",
"hero.note":"يُدار المشروع عن بُعد من جمهورية كوريا · Morgan J.، مهندس أنظمة ذكاء اصطناعي دون اتصال · تُستقبل جميع المراسلات عبر البريد الإلكتروني",
"hero.zero":"<div><b>0</b><span>خوادم مطلوبة</span></div><div><b>0</b><span>تبعيات خارجية</span></div><div><b>0</b><span>بيانات شخصية مجمّعة</span></div><div><b>0</b><span>طلبات إلى أطراف ثالثة</span></div>",

"s1.eyebrow":"الإطار العام",
"s1.pull":"القيد في الميدان نادراً ما يكون جودة النموذج.",
"s1.body":"<p class='lead'>لا تتوافر القدرة الحاسوبية المتقدمة إلا لعدد محدود من المؤسسات والدول. أما في مخيمات اللاجئين، والمزارع الواقعة خارج الشبكة، ومناطق الكوارث، ومواقع العمل تحت الأرض، والمنشآت المعزولة، والمناطق الخاضعة لقطع الاتصال، فإن القيود مختلفة في طبيعتها: الإمداد الكهربائي، وسعة النطاق، وكلفة الوحدة، والمسؤولية القانونية المترتبة على جمع البيانات الشخصية.</p><p>ويسلك هذا المشروع اتجاهاً معاكساً للاتجاه السائد؛ فبدلاً من زيادة عدد المعاملات، يزيل البنية التحتية، وبدلاً من جمع البيانات بغرض التحسين، لا يجمع شيئاً. ويبقى بعد ذلك نظام صغير الحجم بما يتيح مراجعته سطراً سطراً، ومنخفض الكلفة بما يسمح بتوزيعه دون مقابل، ومتين بما يكفي للاستمرار في العمل بعد انقطاع الاتصال ونفاد الرصيد السحابي وانتهاء التمويل.</p><p>وتتجاوز أهمية هذه الخصائص السياق الإنساني؛ إذ تخضع الأنظمة المخصصة للبيئات القاسية، ومنها الاستكشاف الفضائي، لمتطلبات مماثلة من حيث القدرة على البقاء والاكتفاء الذاتي.</p>",

"s2.eyebrow":"قيود التصميم",
"s2.h":"كل خاصية مما يلي قرارٌ معماري، لا خياراً في الإعدادات.",
"s2.list":"<li>لا يتطلب أي بنية خوادم</li><li>بلا مكتبات خارجية؛ ملف واحد مكتفٍ ذاتياً</li><li>بلا كلفة شراء أو استئجار لوحدات المعالجة الرسومية</li><li>كلفة حدّية تكاد تنعدم لكل عملية نشر إضافية</li><li>بنية لا ترسل أي بيانات إلى الخارج</li><li>لا يُحمَّل أي محتوى من شبكات طرف ثالث</li><li>مصمَّم للامتثال للائحة العامة لحماية البيانات (GDPR) وفق مبدأ الخصوصية بالتصميم</li><li>استهلاك منخفض جداً للطاقة</li><li>يعمل على أجهزة مُستغنى عنها، فيُطيل عمرها التشغيلي</li><li>يعمل على شرائح لا تتجاوز كلفتها دولاراً واحداً وبإمداد شمسي بسيط</li><li>متوافق مع أطر الحوكمة البيئية والاجتماعية ومع أهداف التنمية المستدامة للأمم المتحدة</li><li>تركيز الموارد على الباحثين بدلاً من العتاد</li>",
"s2.note":"<b>المنهج —</b> يستخدم النظام، بدلاً من نموذج تعلّم عميق واسع، مزيجاً من آلات الحالة المنتهية وأشجار السلوك والتعلّم المعزَّز الخفيف. ويوفّر التحكم القائم على القواعد سلوكاً آنياً مستقراً بكلفة حسابية منخفضة؛ والأهم من ذلك في السياقات المتصلة بالسلامة أنه ينتج قرارات قابلة للتتبع والتفسير بعد وقوعها.",

"s3.eyebrow":"مجالات التطبيق",
"s3.h":"ثماني بيئات تشغيلية يتعذّر فيها نشر ذكاء اصطناعي معتمد على الحوسبة السحابية.",
"s3.lead":"تشترك المجالات الواردة أدناه في التنفيذ ذاته، ويمكن تصفيتها بحسب البيئة الأقرب إلى برنامج مؤسستكم. وهي مذكورة بوصفها مجالات تطبيق لا عمليات نشر مكتملة، أما التحقق الميداني فيرد بيانه في قسم حالة المراجعة.",

"<article class='card rv' data-tags='disaster'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M4 18h16'/><path d='M7 18V9l5-5 5 5v9'/><path d='M12 13v5'/></svg><span class='tag'>مستقل عن البنية التحتية</span><h3>الاستجابة للكوارث والعمليات الطارئة خارج الشبكة</h3><ul><li>اتصال شبكي متشابك بين الأجهزة دون إنترنت أو خدمة خلوية</li><li>دعم الفرز الطبي ومتابعة العلامات الحيوية دون اتصال</li><li>مساندة عمليات البحث والإنقاذ أثناء انقطاع الكهرباء والشبكة</li></ul><p class='why'>الساعات الأولى من الكارثة هي بعينها الوقت الذي تكون فيه الشبكة معطّلة.</p></article>"+
"<article class='card rv' data-tags='defence'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><rect x='3' y='4' width='18' height='14' rx='1.5'/><path d='M8 21h8M12 18v3M7 9h4M7 13h7'/></svg><span class='tag'>معزول عن الشبكة</span><h3>المنشآت المعزولة والحسّاسة من حيث السلامة</h3><ul><li>البنى الحيوية التي تحظر سياساتها أي حركة بيانات صادرة</li><li>مصانع أشباه الموصلات وبيئات التصنيع المتقدم</li><li>الأجهزة الطبية والصحية التي تحفظ الخصوصية</li></ul><p class='why'>مفتاح قطع الإرسال (Egress Kill Switch): يمكن تعطيل الاتصال الصادر فوراً، فيغدو تسريب البيانات مستحيلاً من حيث البنية، لا ممنوعاً بقرار إداري فحسب.</p></article>"+
"<article class='card rv' data-tags='esg'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M4 12a8 8 0 0 1 8-8h5'/><path d='M20 12a8 8 0 0 1-8 8H7'/><path d='M14 1.5L17.5 4 14 6.5M10 17.5L6.5 20 10 22.5'/></svg><span class='tag'>الاقتصاد الدائري</span><h3>إعادة توظيف النفايات الإلكترونية والرصد البيئي</h3><ul><li>تحويل الهواتف المستغنى عنها إلى عُقد إنسانية ورصدية</li><li>رصد بيئي ورصد للسلامة المهنية بكلفة منخفضة</li><li>الكشف الصوتي والاهتزازي عن أسراب الجراد في المناطق الواقعة خارج الشبكة</li></ul><p class='why'>إطالة العمر التشغيلي للأجهزة نتيجة بيئية قابلة للقياس، لا مجرد دعوى.</p></article>"+
"<article class='card rv' data-tags='defence esg'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M3 20h18'/><path d='M6 20V10l6-6 6 6v10'/><circle cx='12' cy='13' r='2'/></svg><span class='tag'>مواقع نائية</span><h3>المواقع الصناعية النائية والعمليات الطرفية</h3><ul><li>المناجم تحت الأرض وأعمال الأنفاق</li><li>مواقع البناء وسائر بيئات العمل الخطرة</li><li>التتبع المحلي للأصول ومتابعة سلامة العاملين دون بنية اتصالات</li></ul><p class='why'>حيث ينتهي الاتصال، يتعيّن أن يظل الجهاز قادراً على الاستدلال بنفسه.</p></article>"+
"<article class='card rv' data-tags='agri'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M12 21c0-6 3-9 8-9-1 6-4 9-8 9z'/><path d='M12 21c0-6-3-9-8-9 1 6 4 9 8 9z'/><path d='M12 21v-7'/></svg><span class='tag'>تغطية محدودة</span><h3>الزراعة والثروة الحيوانية في مساحات واسعة ضعيفة التغطية</h3><ul><li>رصد رطوبة التربة وحالة الماشية في الولايات المتحدة وكندا وأستراليا</li><li>الكشف المبكر عن مخاطر الأمراض داخل القطيع</li><li>تنبيهات محلية تحدّ من سرقة الماشية عالية القيمة</li></ul><p class='why'>يُسهم الرصد المتواصل منخفض الاستهلاك في تحسين الإنتاجية حيث تكون بنية الاتصالات محدودة.</p></article>"+
"<article class='card rv' data-tags='consumer esg'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><rect x='7' y='6' width='10' height='12' rx='2'/><path d='M9 6V3h6v3M9 18v3h6v-3'/><path d='M10 12h4'/></svg><span class='tag'>شرائح بكلفة دولار واحد</span><h3>الأجهزة منخفضة الكلفة والعاملة بالطاقة الشمسية</h3><ul><li>ساعات رقمية تعمل بالطاقة الشمسية وتحمل وظائف بسيطة لحماية الحياة</li><li>تشغيل دائم على شرائح شديدة الانخفاض في الكلفة</li><li>أثر لا يكاد يُذكر في كلفة تصنيع الوحدة</li></ul><p class='why'>الكفاءة هنا ليست قيداً قُبل على مضض، بل هي منطلق التصميم ذاته.</p></article>"+
"<article class='card rv' data-tags='rights disaster defence'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><circle cx='12' cy='12' r='2.2'/><path d='M8 8a5.5 5.5 0 0 0 0 8M16 8a5.5 5.5 0 0 1 0 8M5 5a10 10 0 0 0 0 14M19 5a10 10 0 0 1 0 14'/></svg><span class='tag'>بلوتوث وموجات فوق صوتية</span><h3>اتصال محلي دون أي شبكة</h3><ul><li>شبكة بلوتوث متشابكة بين الأجهزة المتقاربة</li><li>نقل صوتي وفوق صوتي حيث يتعذّر استخدام الراديو أو لا يُستحسن</li><li>تعلّم آلي ومسح بلوتوث بلغة JavaScript خالصة على أجهزة أندرويد يعود عمرها إلى عشر سنوات</li></ul><p class='why'>يبلغ هدف التصميم للتشغيل الميداني من 60 إلى 70 يوماً بطاقة محدودة، مع ستة أشهر هدفاً على المدى الأبعد.</p></article>",

"s4.eyebrow":"البنية",
"s4.h":"خصائص أمنية مستمدة من البنية، لا من السياسات الإدارية.",
"s4.body":"<p>الغاية بنية من ملف واحد بلا تبعيات، تُكتب فيها كل وحدة انطلاقاً من المبادئ الأولى بحيث تكون مكتملة ومكتفية ذاتياً. ولا يُحمَّل شيء أثناء التشغيل، لأن كل ما يُحمَّل أثناء التشغيل يمكن أن يزيله خصمٌ أو عطلٌ أو خدمةٌ توقّف تشغيلها.</p><p><strong>مفتاح قطع الإرسال (Egress Kill Switch):</strong> يمكن تعطيل الاتصال الصادر فوراً وعزل الجهاز، فيصبح تسريب البيانات مستحيلاً من حيث البنية لا محظوراً إدارياً. وهذا التمييز ذو أهمية للمؤسسات المطالَبة بإثبات أن البيانات لا تغادر، لا بمجرد التأكيد على ذلك.</p>",
"s4.spec":"<tr><th>بيئة التشغيل</th><td>JavaScript خالصة داخل المتصفح، ملف واحد</td></tr><tr><th>المكتبات الخارجية</th><td><span class='ok'>لا شيء</span> — بلا تبعيات ودون شبكات توزيع محتوى</td></tr><tr><th>متطلبات الخادم</th><td><span class='ok'>لا شيء</span> — بلا خوادم وبلا إرسال خارجي</td></tr><tr><th>البيانات الشخصية المجمّعة</th><td><span class='ok'>لا شيء</span> — لا بيانات تتبّع ولا بيانات وصفية</td></tr><tr><th>المنهج الأساسي</th><td>آلات الحالة وأشجار السلوك وتعلّم معزَّز خفيف، قائمة على قواعد قابلة للفحص</td></tr><tr><th>النقل المحلي</th><td>شبكة بلوتوث متشابكة؛ موجات صوتية وفوق صوتية</td></tr><tr><th>الحد الأدنى من العتاد</th><td>جهاز أندرويد يعود إلى عشر سنوات؛ شرائح بكلفة دولار واحد؛ إمداد شمسي بسيط</td></tr><tr><th>التحمّل الميداني</th><td>هدف تصميمي من 60 إلى 70 يوماً؛ وستة أشهر على المدى الأبعد</td></tr><tr><th>الموقف من الامتثال</th><td>الخصوصية بالتصميم وفق اللائحة العامة لحماية البيانات؛ وتوافق مع أطر الحوكمة البيئية والاجتماعية وأهداف التنمية المستدامة</td></tr><tr><th>الرخصة</th><td><span class='ok'>Apache License 2.0</span></td></tr><tr><th>الإزالة</th><td>يمكن للمستخدم حذفه في أي وقت دون بقاء أي بيانات</td></tr>",

"s5.eyebrow":"أخلاقيات التصميم",
"s5.pull":"الأداء التقني وحده لا يحدّد إمكان اعتماد النظام.",
"s5.body":"<p class='lead'>في السياقات الإنسانية وسياقات المجتمع المدني، يُحسم قرار الاعتماد عادةً بالمسؤولية القانونية والمخاطر، لا بالقدرة التقنية. ومهما بلغت كفاءة النظام، فإن بقاء احتمالٍ ولو ضئيل لنزاعٍ جوهري في شأن حماية البيانات كثيراً ما يكفي لصرف منظمة غير حكومية أو منظمة دولية عن تبنّيه.</p><p>وينبع كل قرار تصميمي في هذا العمل من ذلك القيد: تقليل الهلوسة في المجالات الحسّاسة، والإبقاء على شفافية تتيح تدقيقاً مستقلاً، والعمل في بيئات محدودة الموارد، والامتناع عن أي جمع للبيانات، وعدم نقل أي مسؤولية قانونية إلى المؤسسة المتبنّية، والبقاء بسيطاً بما يمكّن غير المبرمجين من قراءته وتكييفه وحذفه.</p><p>ويُعامَل الاتساق مع المعايير الدولية — اللائحة العامة لحماية البيانات، واتفاقية حقوق الطفل، واتفاقية حقوق الأشخاص ذوي الإعاقة — بوصفه مدخلاً تصميمياً منذ البداية، لا طبقة امتثال تُضاف لاحقاً.</p>",
"s5.scenes":"<div class='scene'><b>تقليل الهلوسة</b><p>تترتب على المخرجات الخاطئة في حماية الطفل أو الرعاية الصحية أو الاستجابة للكوارث نتائج فورية.</p></div><div class='scene'><b>قابلية الفحص</b><p>شفرة مفتوحة وبنية مفتوحة، لأن النظام المعتم يتعذّر الدفاع عنه حين يخفق.</p></div><div class='scene'><b>عدم نقل المسؤولية</b><p>لا جمع، ولا خادم، ولا نقل عابر للحدود؛ ومن ثَمّ لا مسؤولية تُنقل إلى المؤسسة المتبنّية.</p></div><div class='scene'><b>قابلية الحذف</b><p>يمكن للمستخدمين إزالة النظام وبياناته في أي وقت، وسهولة الحذف تحرّرٌ من الالتزام.</p></div>",

"s6.eyebrow":"حالة المراجعة والتدقيق",
"s6.h":"يُذكر كل بند مقروناً بمرحلته الراهنة.",
"s6.lead":"يحمل كل بند وصف مرحلته حتى يُقرأ على وجه الدقة، ويمكن التحقق من كل منها باستقلال عبر المصادر المشار إليها.",
"s6.grid":"<div><b>مراجعة المرحلة الأولى</b><p>حكومة لوكسمبورغ · جامعة لندن (UCL) · معهد دراسات التنمية (IDS)، المملكة المتحدة</p><span class='pill done'>مكتملة</span></div><div><b>تدقيق أمني</b><p>مختبر OTF الأمني، الولايات المتحدة — USAGM / Open Technology Fund (2026)</p><span class='pill done'>مكتمل</span></div><div><b>ورقة بحثية</b><p><a href='https://mcorpai.org/VitalGuard_Offline_AI.pdf' target='_blank' rel='noopener' style='color:var(--signal);text-decoration:none;'>Offline AI (VitalGuard) — PDF ↗</a></p><span class='pill done'>منشورة</span></div><div><b>النشر الأكاديمي</b><p>يجري إعداد مشاركة في مؤتمر ACM FAccT، مع الانفتاح على تعاون بحثي مستقبلي مع جامعة أكسفورد</p><span class='pill'>مخطط له</span></div><div><b>الموقف من المعايير</b><p>الخصوصية بالتصميم وفق اللائحة العامة لحماية البيانات؛ وأطر الحوكمة البيئية والاجتماعية؛ وأهداف التنمية المستدامة للأمم المتحدة</p><span class='pill'>بحكم التصميم</span></div><div><b>الرخصة</b><p>Apache License 2.0 — متاحة دون مقابل للاستخدام ذي النفع العام</p><span class='pill done'>مؤكدة</span></div>",
"s6.note":"<b>الحالة والحدود —</b> النماذج المنشورة نماذج أولية قابلة للتشغيل لا منتجات نهائية، ولم يُجرَ بعد تحقق ميداني واسع النطاق. والعبارات المتعلقة بالامتثال تصف نية معمارية وخصائص قابلة للتحقق، وأهمها الامتناع عن جمع أي بيانات شخصية وانتفاء الحاجة إلى أي اتصال صادر، لا شهادةً صادرة عن جهة ثالثة. وقد صيغ هذا القسم كي يتمكن المراجعون من التحقق من كل عبارة باستقلال، بدلاً من قبولها على سبيل الثقة.",

"s7.eyebrow":"النماذج التجريبية",
"s7.h":"فتح الملف في المتصفح هو عملية التثبيت بأكملها.",
"s7.lead":"نماذج أولية قابلة للتشغيل تتضمن تعلّماً آلياً أساسياً داخل الجهاز. السعة: صورة واحدة. لا حساب ولا تسجيل، ولا تغادر أي بيانات الجهاز.",
"s7.demos":"<a class='demo' href='https://mcorpai.com/' target='_blank' rel='noopener'><span class='size'>600 كيلوبايت · النموذج 01</span><h3>شبكة بلوتوث متشابكة</h3><p>شبكة بين الأجهزة مع تعلّم آلي خفيف ومسح بلوتوث، تعمل بالكامل داخل المتصفح.</p><span class='go'>mcorpai.com ↗</span></a><a class='demo' href='https://mcorpai.net/' target='_blank' rel='noopener'><span class='size'>460 كيلوبايت · النموذج 02</span><h3>بلوتوث وموجات فوق صوتية</h3><p>نقل محلي صوتي وفوق صوتي للبيئات التي يتعذّر فيها استخدام الراديو أو لا يُستحسن.</p><span class='go'>mcorpai.net ↗</span></a><a class='demo' href='https://mcorpai.org/' target='_blank' rel='noopener'><span class='size'>مساحة المشروع</span><h3>الأوراق ووسائل التواصل والحالة</h3><p>الوثائق الحالية وعنوان المراسلة الخاص بالبرنامج.</p><span class='go'>mcorpai.org ↗</span></a>",
"s7.note":"لا جمع للبيانات، ولا قياس للزيارات، ولا طلبات إلى أطراف ثالثة؛ بما يشمل هذه الصفحة التي لا تُحمّل أي خط أو نص برمجي أو ملف تنسيق خارجي.",

"s8.eyebrow":"المعهد",
"s8.h":"مقترح بين مؤسستين، لا طلب تعيين فردي.",
"s8.body":"<p>يُعتزم تأسيس معهد M Corp AI البحثي في جمهورية كوريا، بالعمل مع شركاء دوليين. ويُنوى إتاحة مشاريع مختارة دون مقابل بموجب رخصة Apache 2.0 للاستخدام ذي النفع العام. كما يُعتزم تخصيص جزء من إيرادات المعهد لدعم الأفلام الفنية المستقلة والأطفال المصابين بأمراض نادرة، مع اتخاذ تصنيف بيئي واجتماعي مرتفع هدفاً معلناً.</p><p>ولا يسعى المؤسس إلى وظيفة فردية؛ وإنما المقترح اتفاق ترخيص تقني وبحث مشترك بين مؤسستكم والمعهد، بما يتيح للمؤسس التفرغ للبنية المعمارية وتوجيه البحث والرسالة بعيدة المدى.</p>",
"s8.org":"<thead><tr><th>الدور</th><th>المسؤولية</th></tr></thead><tbody><tr><td>المؤسس ومهندس أنظمة الذكاء الاصطناعي</td><td>Morgan J. — البنية المعمارية، وتوجيه البحث، والرؤية بعيدة المدى</td></tr><tr><td>فريق هندسة البرمجيات</td><td>ثلاثة مطورين في أوروبا الشرقية — التطوير والتنفيذ والبرمجة</td></tr></tbody>",
"s8.note":"<b>الهدف الراهن —</b> تأسيس معهد بحثي مستقل للذكاء الاصطناعي منخفض المستوى في جمهورية كوريا بفريق هندسي صغير، وتحديد شركاء مؤسسيين قادرين على دعم تأسيسه وتشغيله المستدام على المدى الطويل.",

"s9.eyebrow":"الشراكة",
"s9.h":"يجري السعي حالياً إلى ثلاثة أشكال من التعاون.",
"s9.items":"<div><span class='n'>01</span><h3>شراكة بحثية</h3><p>تعاون عن بُعد مع المجموعات الأكاديمية ومعاهد البحث في مجالات الذكاء الاصطناعي دون اتصال، والحوسبة الطرفية، وتصميم الأنظمة الحافظة للخصوصية، بما يشمل النشر المشترك.</p></div><div><span class='n'>02</span><h3>الترخيص والبحث المشترك</h3><p>اتفاقات بين المؤسسات تتيح لمؤسستكم توظيف هذه البنية ضمن برامجها، مع دعم تقني من المعهد.</p></div><div><span class='n'>03</span><h3>التمويل</h3><p>دعم تأسيس مختبر بحثي مستقل للذكاء الاصطناعي دون اتصال في جمهورية كوريا وتشغيله على نحو مستدام.</p></div>",

"s10.eyebrow":"التواصل",
"s10.h":"المراسلات وتقارير التدقيق والاستفسارات.",
"s10.lead":"يُدار المشروع عن بُعد حصراً حفاظاً على الحياد والتركيز. والبريد الإلكتروني هو القناة المناسبة لجميع الاستفسارات ومقترحات التعاون ومراسلات التدقيق. وتُرسَل الردود من جمهورية كوريا بتوقيتها المحلي.",
"s10.links":"<a class='btn' href='https://mcorpai.org/' target='_blank' rel='noopener'>mcorpai.org ↗</a><a class='btn' href='https://mcorpai.org/VitalGuard_Offline_AI.pdf' target='_blank' rel='noopener'>الورقة البحثية ↗</a>",
"s10.note":"المقر: جمهورية كوريا · إدارة عن بُعد · Morgan J.، مهندس أنظمة ذكاء اصطناعي دون اتصال",

"hero.sub":"La IA contemporánea presupone centros de datos, electricidad estable, conectividad continua y una organización capaz de asumir la responsabilidad derivada de la protección de datos. Para una parte considerable de la población mundial, alguno de esos supuestos no se cumple. VitalGuard se ha diseñado a partir de esa condición: un sistema de archivo único y sin dependencias que funciona en el navegador de un teléfono de hace diez años, no requiere servidor y no recopila datos personales.",

"s1.eyebrow":"Contexto",
"s1.pull":"En el terreno, la restricción rara vez es la calidad del modelo.",
"s1.body":"<p class='lead'>La capacidad de cómputo de frontera está al alcance de un número reducido de instituciones y Estados. En asentamientos de personas refugiadas, explotaciones agrarias fuera de la red, zonas de desastre, obras subterráneas, instalaciones aisladas y regiones sujetas a cortes de red, las restricciones son otras: electricidad, ancho de banda, coste unitario y la exposición jurídica que conlleva recopilar datos personales.</p><p>Este proyecto sigue la dirección opuesta a la tendencia dominante. En lugar de añadir parámetros, elimina infraestructura. En lugar de recopilar datos para mejorar, no recopila ninguno. Lo que queda es lo bastante pequeño como para leerse línea por línea, lo bastante económico como para distribuirse sin coste y lo bastante robusto como para seguir funcionando cuando la conectividad, el crédito en la nube y la financiación se han agotado.</p><p>Estas mismas propiedades resultan pertinentes mucho más allá del ámbito humanitario. Los sistemas destinados a entornos extremos, incluida la exploración planetaria, están sujetos a requisitos comparables de supervivencia y autosuficiencia.</p>",

"s2.eyebrow":"Restricciones de diseño",
"s2.h":"Cada propiedad que figura a continuación es una decisión arquitectónica, no una opción de configuración.",
"s2.list":"<li>No requiere infraestructura de servidores</li><li>Sin bibliotecas externas; archivo único autónomo</li><li>Sin coste de adquisición ni alquiler de GPU</li><li>Coste marginal casi nulo por cada despliegue adicional</li><li>Arquitectura sin salida de datos</li><li>No se carga contenido desde redes de terceros</li><li>Diseñado para el cumplimiento del RGPD (privacidad desde el diseño)</li><li>Consumo energético muy reducido</li><li>Funciona en dispositivos retirados, prolongando su vida útil</li><li>Opera con chips de coste ínfimo y alimentación solar básica</li><li>Alineado con los marcos ESG y los Objetivos de Desarrollo Sostenible</li><li>Presupuesto concentrado en investigación y no en equipamiento</li>",
"s2.note":"<b>MÉTODO —</b> En lugar de un modelo extenso de aprendizaje profundo, el sistema emplea una combinación de máquinas de estados finitos, árboles de comportamiento y aprendizaje por refuerzo ligero. El control de estados basado en reglas ofrece un comportamiento estable en tiempo real con bajo coste computacional y, lo que resulta igualmente importante en contextos críticos para la seguridad, produce decisiones que pueden trazarse y explicarse a posteriori.",
