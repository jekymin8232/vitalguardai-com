/* ══════════════════════════════════════════════════════════════════════════
   ENGINE — language detection, rendering, filtering, reveal
   ══════════════════════════════════════════════════════════════════════════ */
(function () {
  'use strict';

  var SUPPORTED = ['en','ko','ja','zh-TW','id','hi','bn','my','fa','ar','uk',
                   'de','nl','sv','pl','pt','es','it','fr'];
  var RTL = ['ar','fa'];
  var DEFAULT = 'en';
  var current = DEFAULT;

  /* ---- 1. Detection -----------------------------------------------------
     Order of precedence:
       (1) ?lang= or #lang= in the URL, so that a link can be shared in a
           specific language with a review panel;
       (2) the browser's own language list (navigator.languages);
       (3) English, which is the default for every locale not listed below.
     Detection reads the browser's language setting only. No IP address,
     no geolocation, no time zone. Nothing is stored: no cookie, no
     localStorage, no fingerprinting.                                      */

  /* Regional tags that resolve to a specific supported variant. Only
     Traditional-script Chinese locales are mapped; a generic or
     Simplified Chinese locale falls through to English, as does every
     unlisted language. */
  var REGION_MAP = {
    'zh-tw':'zh-TW', 'zh-hant':'zh-TW', 'zh-hant-tw':'zh-TW',
    'zh-hk':'zh-TW', 'zh-hant-hk':'zh-TW', 'zh-mo':'zh-TW',
    'pt-br':'pt', 'pt-pt':'pt', 'pt-ao':'pt', 'pt-mz':'pt',
    'de-at':'de', 'de-ch':'de', 'de-li':'de', 'nl-be':'nl',
    'bn-bd':'bn', 'bn-in':'bn', 'it-ch':'it', 'sv-fi':'sv',
    /* V5.7 */
    'fa-ir':'fa', 'fa-af':'fa', 'prs':'fa', 'prs-af':'fa', 'fa-ir-u-ca-persian':'fa',
    'my-mm':'my', 'mya':'my', 'bur':'my',
    'id-id':'id', 'in':'id', 'in-id':'id', 'ind':'id',
    'uk-ua':'uk', 'ukr':'uk'
  };

  function normalise(tag) {
    if (!tag) { return null; }
    var t = String(tag).toLowerCase().replace(/_/g, '-');
    if (REGION_MAP[t]) { return REGION_MAP[t]; }
    for (var i = 0; i < SUPPORTED.length; i++) {
      if (SUPPORTED[i].toLowerCase() === t) { return SUPPORTED[i]; }
    }
    var base = t.split('-')[0];
    if (base === 'zh') { return null; }   /* 지역 미지정 중국어는 기본 언어로 */
    return SUPPORTED.indexOf(base) !== -1 ? base : null;
  }

  function fromUrl() {
    /* V5.7: 'lang=' 앞에 구분자를 요구하여 'sublang=' 'hreflang=' 등
       유사 파라미터를 잘못 읽는 일을 막는다. */
    var m = (window.location.search + window.location.hash).match(/[?&#]lang=([a-zA-Z-]+)/);
    return m ? normalise(m[1]) : null;
  }

  function fromBrowser() {
    var list = [];
    if (navigator.languages && navigator.languages.length) {
      list = navigator.languages;
    } else if (navigator.language) {
      list = [navigator.language];
    } else if (navigator.userLanguage) {
      list = [navigator.userLanguage];
    }
    for (var i = 0; i < list.length; i++) {
      var code = normalise(list[i]);
      if (code) { return code; }
    }
    return null;
  }

  function detect() {
    return fromUrl() || fromBrowser() || DEFAULT;
  }

  /* ---- 2. Rendering ----------------------------------------------------- */
  function render(lang) {
    if (SUPPORTED.indexOf(lang) === -1) { lang = DEFAULT; }
    var dict = I18N[lang] || I18N[DEFAULT];
    var base = I18N[DEFAULT];
    current = lang;

    var html = document.documentElement;
    html.setAttribute('lang', lang);
    html.setAttribute('dir', RTL.indexOf(lang) !== -1 ? 'rtl' : 'ltr');

    if (dict['meta.title']) { document.title = dict['meta.title']; }
    var md = document.querySelector('meta[name="description"]');
    if (md && dict['meta.desc']) { md.setAttribute('content', dict['meta.desc']); }

    /* V5.5: keep social metadata synchronized with the active language. */
    var ogTitle = document.querySelector('meta[property="og:title"]');
    var ogDesc = document.querySelector('meta[property="og:description"]');
    var ogLocale = document.querySelector('meta[property="og:locale"]');
    if (ogTitle && dict['meta.title']) { ogTitle.setAttribute('content', dict['meta.title']); }
    if (ogDesc && dict['meta.desc']) { ogDesc.setAttribute('content', dict['meta.desc']); }
    if (ogLocale) {
      var localeMap = {
        'en':'en_US', 'ko':'ko_KR', 'ja':'ja_JP', 'zh-TW':'zh_TW',
        'hi':'hi_IN', 'bn':'bn_BD', 'ar':'ar_SA', 'de':'de_DE',
        'nl':'nl_NL', 'sv':'sv_SE', 'pl':'pl_PL', 'pt':'pt_PT',
        'es':'es_ES', 'it':'it_IT', 'fr':'fr_FR',
        'fa':'fa_IR', 'my':'my_MM', 'id':'id_ID', 'uk':'uk_UA'
      };
      ogLocale.setAttribute('content', localeMap[lang] || 'en_US');
    }

    var nodes = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++) {
      var key = nodes[i].getAttribute('data-i18n');
      var val = (dict[key] !== undefined) ? dict[key] : base[key];
      if (val !== undefined) { nodes[i].innerHTML = val; }
    }

    var ariaNodes = document.querySelectorAll('[data-i18n-aria]');
    for (var j = 0; j < ariaNodes.length; j++) {
      var ariaKey = ariaNodes[j].getAttribute('data-i18n-aria');
      var ariaVal = (dict[ariaKey] !== undefined) ? dict[ariaKey] : base[ariaKey];
      if (ariaVal !== undefined) {
        ariaNodes[j].setAttribute('aria-label', ariaVal);
        ariaNodes[j].setAttribute('title', ariaVal);
      }
    }

    var sel = document.getElementById('langSelect');
    if (sel && sel.value !== lang) { sel.value = lang; }

    setNav(false);
    var auditBox = document.getElementById('auditOut');
    if (auditBox) { auditBox.innerHTML = ''; }
    var saveBox = document.getElementById('saveOut');
    if (saveBox) { saveBox.textContent = ''; }
    applyFilter('all');
    resetChips();
    observeReveals();
    highlightNav();
  }

  /* ---- 3. Use-case filter (event delegation, survives re-render) -------- */
  function resetChips() {
    var chips = document.querySelectorAll('#filterbar .chip');
    for (var i = 0; i < chips.length; i++) {
      chips[i].setAttribute('aria-pressed', chips[i].getAttribute('data-filter') === 'all' ? 'true' : 'false');

    for (var i = 0; i < cards.length; i++) {

      else { cards[i].classList.add('hidden'); }

      var tpl = dict['s3.status'] || I18N[DEFAULT]['s3.status'];

  var bar = document.getElementById('filterbar');
  if (bar) {
    bar.addEventListener('click', function (ev) {
      var chip = ev.target.closest ? ev.target.closest('.chip') : null;

    io = new IntersectionObserver(function (entries) {
      for (var i = 0; i < entries.length; i++) {
        if (entries[i].isIntersecting) {
          entries[i].target.classList.add('in');
          io.unobserve(entries[i].target);
        }
      }
    }, { threshold: 0.1, rootMargin: '0px 0px -6% 0px' });
  }

  function observeReveals() {
    var items = document.querySelectorAll('.rv');
    for (var i = 0; i < items.length; i++) {
      if (items[i].classList.contains('in')) { continue; }
      if (io) {
        var r = items[i].getBoundingClientRect();
        if (r.top < window.innerHeight && r.bottom > 0) { items[i].classList.add('in'); }
        else { io.observe(items[i]); }
      } else {
        items[i].classList.add('in');
      }
    }
  }

  /* ---- 5. Section highlight in the navigation --------------------------- */
  function highlightNav() {
    var links = document.querySelectorAll('nav.links a');
    var y = window.scrollY + 150, currentLink = null;
    for (var i = 0; i < links.length; i++) {
      links[i].style.color = '';
      links[i].style.borderBottomColor = 'transparent';
      links[i].removeAttribute('aria-current');
      var id = links[i].getAttribute('href');
      var target = id && id.charAt(0) === '#' ? document.querySelector(id) : null;
      if (target && target.offsetTop <= y) { currentLink = links[i]; }

      currentLink.style.color = 'var(--signal)';
      currentLink.style.borderBottomColor = 'var(--signal)';

    }

      ticking = true;
    }

  /* ---- 5b. Mobile menu (hamburger) --------------------------------------
     The panel reuses the same navigation markup as the desktop bar, so the
     translated labels never have to be duplicated. */
  var topbar   = document.querySelector('header.topbar');
  var navBtn   = document.getElementById('navToggle');
  var navPanel = document.getElementById('navLinks');

  function setNav(open) {
    if (!topbar || !navBtn) { return; }
    if (open) { topbar.classList.add('nav-open'); }
    else { topbar.classList.remove('nav-open'); }
    navBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
  }

  if (navBtn && topbar) {
    navBtn.addEventListener('click', function () {
      setNav(!topbar.classList.contains('nav-open'));
    });
  }
  if (navPanel) {
    navPanel.addEventListener('click', function (ev) {
      if (ev.target && ev.target.tagName === 'A') { setNav(false); }
    });
  }
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' || ev.keyCode === 27) { setNav(false); }
  });
  window.addEventListener('resize', function () {
    if (window.innerWidth > 1200) { setNav(false); }
  }, { passive: true });

  /* ---- 5c. Readability mode (session-only; no storage) ------------------- */
  var readabilityBtn = document.getElementById('readabilityToggle');
  if (readabilityBtn) {
    readabilityBtn.addEventListener('click', function () {
      var enabled = !document.documentElement.classList.contains('readability-mode');
      document.documentElement.classList.toggle('readability-mode', enabled);
      readabilityBtn.setAttribute('aria-pressed', enabled ? 'true' : 'false');
    });

  /* ---- 5d. Verification panel (V5.7) ------------------------------------
     Three checks a reviewer would otherwise have to take on trust:
       A  a live self-audit of this page,
       B  the limitations and threat model stated explicitly,
       C  an offline copy of this page.
     Everything below runs locally. Nothing is sent, nothing is stored.      */
  var vToggle = document.getElementById('verifyToggle');
  var vPanel  = document.getElementById('verifyPanel');
  var vClose  = document.getElementById('verifyClose');
  var vTitle  = document.getElementById('verifyTitle');

  function setVerify(open) {
    if (!vPanel || !vToggle) { return; }
    if (open) { vPanel.removeAttribute('hidden'); } else { vPanel.setAttribute('hidden', ''); }
    vToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open && vTitle && vTitle.focus) { vTitle.focus(); }
    if (!open && vToggle.focus) { vToggle.focus(); }
  }

  if (vToggle) {
    vToggle.addEventListener('click', function () {
      setVerify(vPanel ? vPanel.hasAttribute('hidden') : false);
      setNav(false);
    });
  }
  if (vClose) { vClose.addEventListener('click', function () { setVerify(false); }); }
  document.addEventListener('keydown', function (ev) {
    if ((ev.key === 'Escape' || ev.keyCode === 27) && vPanel && !vPanel.hasAttribute('hidden')) {
      setVerify(false);
    }
  });

  /* --- A. Self-audit ------------------------------------------------------
     Two independent passes:
       (1) a static scan of the document for anything that points at another
           origin (script, stylesheet, font, image, frame, media, object);
       (2) the browser's own resource timing record for this page.
     Both are read-only. The result is whatever this browser reports.        */
  function absOrigin(u) {
    if (!u) { return null; }
    if (/^(data:|blob:|about:|javascript:|mailto:|tel:|#)/i.test(u)) { return null; }
    try {
      var a = document.createElement('a');
      a.href = u;
      if (!a.protocol || a.protocol === ':' ) { return null; }
      var o = a.protocol + '//' + a.host;
      return (o === (location.protocol + '//' + location.host)) ? null : o;
    } catch (e) { return null; }
  }

  function scanDocument() {
    var found = [], n = 0;
    var nodes = document.querySelectorAll(
      'script[src],link[href],img[src],image[href],iframe[src],frame[src],' +
      'source[src],source[srcset],video[src],audio[src],track[src],object[data],embed[src],use[href]'
    );
    for (var i = 0; i < nodes.length; i++) {
      var el = nodes[i];
      if (el.tagName === 'LINK') {
        var relAttr = (el.getAttribute('rel') || '').toLowerCase();
        if (relAttr.indexOf('stylesheet') === -1 && relAttr.indexOf('preload') === -1 &&
            relAttr.indexOf('prefetch') === -1 && relAttr.indexOf('preconnect') === -1 &&
            relAttr.indexOf('icon') === -1) { continue; }
      }
      var url = el.getAttribute('src') || el.getAttribute('href') ||
                el.getAttribute('data') || el.getAttribute('srcset') || '';
      var org = absOrigin(String(url).split(/[\s,]+/)[0]);
      if (org) { n++; if (found.indexOf(org) === -1) { found.push(org); } }
    }
    return { count: n, origins: found };
  }

  function scanTiming() {
    var entries = [];
    try {
      if (window.performance && performance.getEntriesByType) {

      }
    } catch (e) { entries = []; }
    var origins = [], bytes = 0, supported = !!(window.performance && performance.getEntriesByType);
    for (var i = 0; i < entries.length; i++) {
      var org = absOrigin(entries[i].name);
      if (org && origins.indexOf(org) === -1) { origins.push(org); }
      if (typeof entries[i].transferSize === 'number') { bytes += entries[i].transferSize; }
    }
    var pageBytes = null;
    try {
      var navs = performance.getEntriesByType('navigation');
      if (navs && navs.length && typeof navs[0].transferSize === 'number' && navs[0].transferSize > 0) {
        pageBytes = navs[0].transferSize;
      } else if (navs && navs.length && navs[0].decodedBodySize) {
        pageBytes = navs[0].decodedBodySize;
      }
    } catch (e) { pageBytes = null; }
    return { supported: supported, count: entries.length, origins: origins,
             bytes: bytes, pageBytes: pageBytes };
  }

    try { cookieLen = document.cookie ? document.cookie.length : 0; } catch (e) { cookieLen = 0; }

    try { if (window.localStorage && localStorage.length > 0) { written++; note.push('localStorage'); } } catch (e) {}
    try { if (window.sessionStorage && sessionStorage.length > 0) { written++; note.push('sessionStorage'); } } catch (e) {}
    return { count: written, cookieLen: cookieLen, note: note };
  }

  function fmtBytes(n) {
    if (n === null || n === undefined) { return '\u2014'; }
    if (n < 1024) { return n + ' B'; }
    return Math.round(n / 1024) + ' KB';
  }

  function row(label, value, good) {
    return '<tr><th>' + label + '</th><td class="' + (good ? 'v-ok' : 'v-warn') + '">' + value + '</td></tr>';
  }

  function runAudit() {
    var out = document.getElementById('auditOut');
    if (!out) { return; }
    var dict = I18N[current] || I18N[DEFAULT];
    var base = I18N[DEFAULT];
    function t(k) { return (dict[k] !== undefined) ? dict[k] : base[k]; }

    var doc = scanDocument();
    var tim = scanTiming();
    var sto = scanStorage();

    var allOrigins = doc.origins.slice();
    for (var i = 0; i < tim.origins.length; i++) {
      if (allOrigins.indexOf(tim.origins[i]) === -1) { allOrigins.push(tim.origins[i]); }
    }
    var clean = (doc.count === 0 && allOrigins.length === 0 && sto.count === 0);

    var html = '<table><tbody>';
    html += row(t('v.a.l1'), doc.count, doc.count === 0);
    html += row(t('v.a.l2'), tim.supported ? tim.count : '\u2014', tim.count === 0);
    html += row(t('v.a.l3'), allOrigins.length, allOrigins.length === 0);
    html += row(t('v.a.l4'), sto.count, sto.count === 0);
    html += row(t('v.a.l5'), fmtBytes(tim.pageBytes), true);
    html += '</tbody></table>';
    html += '<div class="audit-verdict' + (clean ? '' : ' bad') + '">' +
            (clean ? t('v.a.ok') : t('v.a.warn')) + '</div>';
    if (allOrigins.length) {
      html += '<div class="audit-origins">' + allOrigins.join('<br>') + '</div>';
    }

  if (auditBtn) { auditBtn.addEventListener('click', runAudit); }

  /* --- C. Offline copy ---------------------------------------------------
     The page has no external dependency, so the document in memory is a
     complete, self-contained file. It is serialised locally and handed to
     the browser's own download mechanism. No request is made.              */
  var saveBtn = document.getElementById('saveCopy');
  if (saveBtn) {
    saveBtn.addEventListener('click', function () {
      var out = document.getElementById('saveOut');
      var dict = I18N[current] || I18N[DEFAULT];
      var base = I18N[DEFAULT];
      function t(k) { return (dict[k] !== undefined) ? dict[k] : base[k]; }
      try {
        var markup = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
        var blob = new Blob([markup], { type: 'text/html;charset=utf-8' });
        var url  = URL.createObjectURL(blob);
        var a    = document.createElement('a');
        a.href = url;
        a.download = 'mcorpai-vitalguard-' + current + '.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
        if (out) { out.textContent = t('v.c.ok'); out.className = 'vnote'; }
      } catch (e) {
        if (out) { out.textContent = t('v.c.err'); out.className = 'vnote warn'; }
      }
    });
  }

  /* ---- 6. Manual language selection ------------------------------------- */
  var select = document.getElementById('langSelect');
  if (select) {
    select.addEventListener('change', function () {
      render(select.value);
      window.scrollTo({ top: 0, behavior: 'auto' });
    });
  }

  /* ---- 7. Boot ---------------------------------------------------------- */
  render(detect());
})();
</script>

</body>
</html>
