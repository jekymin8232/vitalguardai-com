"<article class='card rv' data-tags='agri'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M12 21c0-6 3-9 8-9-1 6-4 9-8 9z'/><path d='M12 21c0-6-3-9-8-9 1 6 4 9 8 9z'/><path d='M12 21v-7'/></svg><span class='tag'>Geringe Abdeckung</span><h3>Land- und Viehwirtschaft in weiträumigen, schwach abgedeckten Gebieten</h3><ul><li>Überwachung von Bodenfeuchte und Tierzustand in den Vereinigten Staaten, Kanada und Australien</li><li>Frühe Hinweise auf Krankheitsrisiken im Bestand</li><li>Lokale Warnungen zur Abschreckung von Diebstahl wertvoller Nutztiere</li></ul><p class='why'>Wo die Kommunikationsinfrastruktur begrenzt ist, kann eine kontinuierliche, energiearme Überwachung die Produktivität verbessern.</p></article>"+
"<article class='card rv' data-tags='consumer esg'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><rect x='7' y='6' width='10' height='12' rx='2'/><path d='M9 6V3h6v3M9 18v3h6v-3'/><path d='M10 12h4'/></svg><span class='tag'>Chips der Ein-Dollar-Klasse</span><h3>Sehr kostengünstige und solarbetriebene Hardware</h3><ul><li>Solarbetriebene Digitaluhren mit einfachen lebensschützenden Funktionen</li><li>Dauerbetrieb auf Chips äußerst geringer Kosten</li><li>Vernachlässigbarer Einfluss auf die Stückkosten der Fertigung</li></ul><p class='why'>Effizienz ist hier keine widerwillig hingenommene Einschränkung, sondern die Prämisse des Entwurfs.</p></article>"+
"<article class='card rv' data-tags='rights disaster defence'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><circle cx='12' cy='12' r='2.2'/><path d='M8 8a5.5 5.5 0 0 0 0 8M16 8a5.5 5.5 0 0 1 0 8M5 5a10 10 0 0 0 0 14M19 5a10 10 0 0 1 0 14'/></svg><span class='tag'>BLE und Ultraschall</span><h3>Lokale Kommunikation gänzlich ohne Netz</h3><ul><li>Bluetooth-Vermaschung zwischen benachbarten Geräten</li><li>Akustische und Ultraschallübertragung, wo Funk nicht verfügbar oder nicht ratsam ist</li><li>Maschinelles Lernen und BLE-Abtastung in reinem JavaScript auf zehn Jahre alten Android-Geräten</li></ul><p class='why'>Als Entwurfsziel für die Feldstandzeit gelten 60 bis 70 Tage bei minimalem Verbrauch, längerfristig sechs Monate.</p></article>",

"s4.eyebrow":"Architektur",
"s4.h":"Sicherheitseigenschaften, die aus der Struktur folgen und nicht aus Vorgaben.",
"s4.body":"<p>Angestrebt wird eine Ein-Datei-Architektur ohne Abhängigkeiten, in der jedes Modul von Grund auf im Hinblick auf Vollständigkeit und Eigenständigkeit geschrieben ist. Zur Laufzeit wird nichts nachgeladen, denn alles zur Laufzeit Nachgeladene kann durch einen Angreifer, einen Ausfall oder einen eingestellten Dienst entzogen werden.</p><p><strong>Egress Kill Switch:</strong> Ausgehende Netzkommunikation lässt sich unmittelbar deaktivieren und das Gerät dadurch isolieren, sodass ein Datenabfluss strukturell unmöglich und nicht lediglich verwaltungsseitig untersagt ist. Für Organisationen, die nicht nur behaupten, sondern nachweisen müssen, dass keine Daten abfließen, ist diese Unterscheidung wesentlich.</p>",
"s4.spec":"<tr><th>Laufzeitumgebung</th><td>Reines JavaScript, im Browser, Einzeldatei</td></tr><tr><th>Externe Bibliotheken</th><td><span class='ok'>Keine</span> — ohne Abhängigkeiten, ohne CDN</td></tr><tr><th>Servererfordernis</th><td><span class='ok'>Keines</span> — serverlos, ohne ausgehenden Verkehr</td></tr><tr><th>Erhobene personenbezogene Daten</th><td><span class='ok'>Keine</span> — weder Telemetrie noch Metadaten</td></tr><tr><th>Kernverfahren</th><td>Endliche Automaten, Verhaltensbäume und leichtgewichtiges bestärkendes Lernen (regelbasiert, prüfbar)</td></tr><tr><th>Lokale Übertragung</th><td>BLE-Vermaschung; Ultraschall und Akustik</td></tr><tr><th>Mindesthardware</th><td>Zehn Jahre altes Android-Gerät; Chips der Ein-Dollar-Klasse; einfache Solarversorgung</td></tr><tr><th>Feldstandzeit</th><td>Entwurfsziel 60 bis 70 Tage; längerfristig sechs Monate</td></tr><tr><th>Regulatorische Ausrichtung</th><td>Datenschutz durch Technikgestaltung nach DSGVO; ESG- und SDG-Bezug</td></tr><tr><th>Lizenz</th><td><span class='ok'>Apache License 2.0</span></td></tr><tr><th>Entfernung</th><td>Jederzeit durch die Nutzenden löschbar, ohne verbleibende Daten</td></tr>",

"s5.eyebrow":"Entwurfsethik",
"s5.pull":"Technische Leistungsfähigkeit allein entscheidet nicht darüber, ob ein System eingesetzt werden kann.",
"s5.body":"<p class='lead'>In humanitären und zivilgesellschaftlichen Zusammenhängen entscheidet über den Einsatz in der Regel die rechtliche Verantwortung und das Risiko, nicht die technische Leistungsfähigkeit. So leistungsfähig ein System auch sein mag: Bereits eine verbleibende Wahrscheinlichkeit erheblicher datenschutzrechtlicher Auseinandersetzungen genügt häufig, damit eine Nichtregierungsorganisation oder eine internationale Organisation von einer Übernahme absieht.</p><p>Jede Entwurfsentscheidung folgt aus dieser Bedingung: Halluzinationen in sensiblen Bereichen verringern, hinreichend transparent für eine unabhängige Prüfung bleiben, in ressourcenarmen Umgebungen arbeiten, nichts erheben, keine rechtliche Verantwortung auf die einsetzende Organisation übertragen und einfach genug bleiben, damit auch Personen ohne Programmierkenntnisse das System lesen, anpassen und löschen können.</p><p>Die Übereinstimmung mit internationalen Normen — DSGVO, UN-Kinderrechtskonvention und UN-Behindertenrechtskonvention — wird von Beginn an als Entwurfsvorgabe behandelt und nicht als nachträglich ergänzte Konformitätsschicht.</p>",
"s5.scenes":"<div class='scene'><b>Halluzinationen verringern</b><p>Fehlerhafte Ausgaben im Kinderschutz, im Gesundheitswesen oder in der Katastrophenhilfe haben unmittelbare Folgen.</p></div><div class='scene'><b>Prüfbar bleiben</b><p>Offener Quelltext und offene Architektur, denn ein undurchsichtiges System lässt sich im Fehlerfall nicht verteidigen.</p></div><div class='scene'><b>Keine Verantwortung übertragen</b><p>Ohne Erhebung, ohne Server und ohne grenzüberschreitende Übermittlung geht keine Verantwortung auf die einsetzende Organisation über.</p></div><div class='scene'><b>Löschbar bleiben</b><p>Nutzende können System und Daten jederzeit entfernen. Die Leichtigkeit der Löschung ist Freiheit von Verpflichtung.</p></div>",

"s6.eyebrow":"Prüf- und Auditstand",
"s6.h":"Jeder Punkt wird mit seinem gegenwärtigen Stand ausgewiesen.",
"s6.lead":"Jeder Punkt ist mit seinem Stand versehen, damit er genau gelesen werden kann; alle Angaben lassen sich anhand der genannten Quellen unabhängig überprüfen.",
"s6.grid":"<div><b>Prüfung der ersten Stufe</b><p>Regierung Luxemburgs · UCL · IDS (Vereinigtes Königreich)</p><span class='pill done'>Abgeschlossen</span></div><div><b>Sicherheitsaudit</b><p>OTF Security Lab (USA) — USAGM / Open Technology Fund (2026)</p><span class='pill done'>Abgeschlossen</span></div><div><b>Forschungsbeitrag</b><p><a href='https://mcorpai.org/VitalGuard_Offline_AI.pdf' target='_blank' rel='noopener' style='color:var(--signal);text-decoration:none;'>Offline AI (VitalGuard) — PDF ↗</a></p><span class='pill done'>Veröffentlicht</span></div><div><b>Wissenschaftliche Verbreitung</b><p>Einreichung bei ACM FAccT in Vorbereitung; offen für künftige Forschungszusammenarbeit mit der University of Oxford</p><span class='pill'>Geplant</span></div><div><b>Normative Ausrichtung</b><p>Datenschutz durch Technikgestaltung nach DSGVO; ESG-Rahmenwerke; Nachhaltigkeitsziele der Vereinten Nationen</p><span class='pill'>Entwurfsbedingt</span></div><div><b>Lizenz</b><p>Apache License 2.0 — unentgeltlich für gemeinwohlorientierte Nutzung</p><span class='pill done'>Bestätigt</span></div>",
"s6.note":"<b>STAND UND GRENZEN —</b> Die veröffentlichten Demonstrationen sind funktionsfähige Minimalumsetzungen und keine fertigen Produkte; eine Feldvalidierung im großen Maßstab steht noch aus. Aussagen zur Konformität beschreiben eine Entwurfsabsicht und überprüfbare Eigenschaften — vor allem, dass keine personenbezogenen Daten erhoben werden und keine ausgehende Verbindung erforderlich ist — und keine von Dritten ausgestellte Zertifizierung. Dieser Abschnitt ist so verfasst, dass Prüfende jede Aussage unabhängig nachvollziehen können, statt sie auf Vertrauen hin anzunehmen.",

"s7.eyebrow":"Demonstrationen",
"s7.h":"Das Öffnen der Datei im Browser ist die gesamte Installation.",
"s7.lead":"Funktionsfähige Minimalumsetzungen mit einfachem maschinellem Lernen auf dem Gerät. Umfang: ein Bild. Ohne Konto, ohne Registrierung, und keine Daten verlassen das Gerät.",
"s7.demos":"<a class='demo' href='https://mcorpai.com/' target='_blank' rel='noopener'><span class='size'>600 KB · Demonstration 01</span><h3>Bluetooth-Vermaschung</h3><p>Vermaschung zwischen Geräten mit leichtgewichtigem maschinellem Lernen und BLE-Abtastung, vollständig im Browser ausgeführt.</p><span class='go'>mcorpai.com ↗</span></a><a class='demo' href='https://mcorpai.net/' target='_blank' rel='noopener'><span class='size'>460 KB · Demonstration 02</span><h3>Bluetooth und Ultraschall</h3><p>Akustische und Ultraschallübertragung für Umgebungen, in denen Funk nicht verfügbar oder nicht ratsam ist.</p><span class='go'>mcorpai.net ↗</span></a><a class='demo' href='https://mcorpai.org/' target='_blank' rel='noopener'><span class='size'>Projektübersicht</span><h3>Beiträge, Kontakt und Stand</h3><p>Aktuelle Unterlagen und Korrespondenzadresse des Vorhabens.</p><span class='go'>mcorpai.org ↗</span></a>",
"s7.note":"Keine Datenerhebung. Keine Reichweitenmessung. Keine Anfragen an Dritte — auch nicht auf dieser Seite, die weder externe Schriftarten noch Skripte oder Stilvorlagen lädt.",

"s8.eyebrow":"Das Institut",
"s8.h":"Ein Vorschlag von Institution zu Institution, keine persönliche Bewerbung.",
"s8.body":"<p>Das M Corp AI Forschungsinstitut soll in der Republik Korea errichtet werden und mit internationalen Partnern zusammenarbeiten. Ausgewählte Vorhaben werden für gemeinwohlorientierte Nutzung unentgeltlich unter der Apache License 2.0 bereitgestellt. Ein Teil der Erträge des Instituts ist zur Förderung unabhängiger Autorenfilme sowie von Kindern mit seltenen Erkrankungen vorgesehen, wobei eine hohe ESG-Bewertung ausdrücklich angestrebt wird.</p><p>Der Gründer sucht kein individuelles Beschäftigungsverhältnis. Vorgeschlagen wird eine Vereinbarung über Technologielizenzierung und gemeinsame Forschung zwischen Ihrer Organisation und dem Institut, die es dem Gründer erlaubt, weiterhin Architektur, Forschungsrichtung und langfristigen Auftrag zu verantworten.</p>",
"s8.org":"<thead><tr><th>Funktion</th><th>Verantwortung</th></tr></thead><tbody><tr><td>Gründer und Systemarchitekt für KI</td><td>Morgan J. — Architektur, Forschungsrichtung, langfristige Ausrichtung</td></tr><tr><td>Softwareentwicklungsteam</td><td>Drei Entwickler in Osteuropa — Entwicklung, Umsetzung und Programmierung</td></tr></tbody>",
"s8.note":"<b>GEGENWÄRTIGES ZIEL —</b> In der Republik Korea ein unabhängiges Forschungsinstitut für hardwarenahe KI mit einem kleinen Entwicklungsteam zu errichten und institutionelle Partner zu gewinnen, die dessen Aufbau und dauerhaften Betrieb tragen können.",

"s9.eyebrow":"Partnerschaft",
"s9.h":"Gegenwärtig werden drei Formen der Zusammenarbeit gesucht.",
"s9.items":"<div><span class='n'>01</span><h3>Forschungspartnerschaft</h3><p>Ortsunabhängige Zusammenarbeit mit Hochschulgruppen und Forschungsinstituten zu Offline-KI, Edge Computing und datenschutzwahrendem Systementwurf, einschließlich gemeinsamer Veröffentlichungen.</p></div><div><span class='n'>02</span><h3>Lizenzierung und gemeinsame Entwicklung</h3><p>Vereinbarungen zwischen Institutionen, die es Ihrer Organisation ermöglichen, diese Architektur in eigenen Programmen einzusetzen, mit fachlicher Unterstützung des Instituts.</p></div><div><span class='n'>03</span><h3>Förderung</h3><p>Unterstützung für Aufbau und dauerhaften Betrieb eines unabhängigen Forschungslabors für Offline-KI in der Republik Korea.</p></div>",

"s10.eyebrow":"Kontakt",
"s10.h":"Korrespondenz, Auditberichte und Anfragen.",
"s10.lead":"Das Vorhaben wird ausschließlich ortsunabhängig betreut, um Neutralität und Konzentration zu wahren. Für sämtliche Anfragen, Kooperationsvorschläge und auditbezogene Korrespondenz ist die E-Mail der geeignete Weg. Antworten ergehen aus der Republik Korea (KST).",
"s10.links":"<a class='btn' href='https://mcorpai.org/' target='_blank' rel='noopener'>mcorpai.org ↗</a><a class='btn' href='https://mcorpai.org/VitalGuard_Offline_AI.pdf' target='_blank' rel='noopener'>Forschungsbeitrag ↗</a>",
"s10.note":"Sitz in der Republik Korea · Ortsunabhängig betreut · Morgan J., Architekt für Offline-KI und Systementwurf",

"hero.flag":"Offline AI · Zonder afhankelijkheden · Apache License 2.0",
"hero.title":"Offline AI voor omgevingen die cloudinfrastructuur <span class='accent'>niet bereikt</span>.",
"hero.sub":"Hedendaagse AI veronderstelt datacentra, een stabiele stroomvoorziening, ononderbroken connectiviteit en een organisatie die de aansprakelijkheid rond gegevensbescherming kan dragen. Voor een aanzienlijk deel van de wereldbevolking is ten minste één van die voorwaarden niet vervuld. VitalGuard is vanuit die situatie ontworpen: een systeem in één bestand, zonder afhankelijkheden, dat draait in de browser van een tien jaar oude smartphone, geen server vereist en geen persoonsgegevens verzamelt.",

"hero.note":"Op afstand beheerd vanuit de Republiek Korea · Morgan J., architect offline AI en systeemontwerper · Alle correspondentie per e-mail",
"hero.zero":"<div><b>0</b><span>Servers nodig</span></div><div><b>0</b><span>Externe afhankelijkheden</span></div><div><b>0</b><span>Persoonsgegevens</span></div><div><b>0</b><span>Verzoeken aan derden</span></div>",

"s1.eyebrow":"Context",
"s1.pull":"In het veld is de beperkende factor zelden de kwaliteit van het model.",
"s1.body":"<p class='lead'>Rekencapaciteit op het hoogste niveau is voor een beperkt aantal instellingen en staten betaalbaar. In vluchtelingennederzettingen, landbouwbedrijven buiten het net, rampgebieden, ondergrondse werkplekken, fysiek gescheiden installaties en regio's met netwerkafsluitingen zijn de beperkingen van andere aard: stroomvoorziening, bandbreedte, kostprijs per eenheid en de juridische blootstelling die gepaard gaat met het verzamelen van persoonsgegevens.</p><p>Dit project kiest de tegenovergestelde richting van de heersende tendens. In plaats van parameters toe te voegen, wordt infrastructuur weggenomen; in plaats van gegevens te verzamelen om te verbeteren, wordt er niets verzameld. Wat overblijft is klein genoeg om regel voor regel te worden gelezen, goedkoop genoeg om kosteloos te worden verspreid en robuust genoeg om te blijven werken nadat connectiviteit, cloudbudget en financiering zijn opgedroogd.</p><p>Dezelfde eigenschappen zijn ook ver buiten de humanitaire context van belang. Systemen voor extreme omgevingen, waaronder planetaire verkenning, zijn onderworpen aan vergelijkbare eisen op het gebied van overlevingsvermogen en zelfredzaamheid.</p>",

"s2.eyebrow":"Ontwerpbeperkingen",
"s2.h":"Elke eigenschap hieronder is een architectuurbeslissing en geen instelling.",
"s2.list":"<li>Geen serverinfrastructuur vereist</li><li>Geen externe bibliotheken; zelfstandig enkel bestand</li><li>Geen kosten voor aanschaf of huur van GPU's</li><li>Vrijwel nul marginale kosten per extra uitrol</li><li>Architectuur zonder uitgaand dataverkeer</li><li>Geen inhoud die van netwerken van derden wordt geladen</li><li>Ontworpen voor naleving van de AVG (privacy by design)</li><li>Zeer laag energieverbruik</li><li>Draait op afgedankte toestellen en verlengt hun levensduur</li><li>Werkt op chips van één dollar en eenvoudige zonne-energie</li><li>Afgestemd op ESG-kaders en de duurzameontwikkelingsdoelen van de VN</li><li>Middelen gaan naar onderzoek in plaats van hardware</li>",
"s2.note":"<b>METHODE —</b> In plaats van een omvangrijk deep-learningmodel combineert het systeem eindigetoestandsautomaten, gedragsbomen en lichtgewicht versterkend leren. Regelgebaseerde toestandsbesturing levert stabiel realtimegedrag tegen lage rekenkosten en — in veiligheidskritische situaties even belangrijk — beslissingen die achteraf herleidbaar en verklaarbaar blijven.",

"<article class='card rv' data-tags='defence esg'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M3 20h18'/><path d='M6 20V10l6-6 6 6v10'/><circle cx='12' cy='13' r='2'/></svg><span class='tag'>Afgelegen locaties</span><h3>Afgelegen industriële locaties en edge-operaties</h3><ul><li>Ondergrondse mijnen en tunnelwerkzaamheden</li><li>Bouwplaatsen en andere gevaarlijke werkomgevingen</li><li>Lokale registratie van bedrijfsmiddelen en bewaking van werknemersveiligheid zonder netwerkinfrastructuur</li></ul><p class='why'>Waar de connectiviteit ophoudt, moet het toestel zelfstandig blijven redeneren.</p></article>"+
"<article class='card rv' data-tags='agri'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M12 21c0-6 3-9 8-9-1 6-4 9-8 9z'/><path d='M12 21c0-6-3-9-8-9 1 6 4 9 8 9z'/><path d='M12 21v-7'/></svg><span class='tag'>Beperkte dekking</span><h3>Landbouw en veehouderij in uitgestrekte gebieden met beperkte dekking</h3><ul><li>Monitoring van bodemvocht en de conditie van vee in de Verenigde Staten, Canada en Australië</li><li>Vroegtijdige aanwijzingen voor ziekterisico binnen de veestapel</li><li>Lokale waarschuwingen om diefstal van waardevol vee te ontmoedigen</li></ul><p class='why'>Waar de communicatie-infrastructuur beperkt is, kan continue monitoring met laag verbruik de productiviteit verbeteren.</p></article>"+

"s4.eyebrow":"Architectuur",
"s4.h":"Beveiligingseigenschappen die voortvloeien uit de structuur en niet uit beleid.",
"s4.body":"<p>Het doel is een architectuur in één bestand en zonder afhankelijkheden, waarin elke module vanaf de grondbeginselen is geschreven met het oog op volledigheid en zelfredzaamheid. Tijdens uitvoering wordt niets ingeladen, omdat alles wat tijdens uitvoering wordt ingeladen kan worden weggenomen door een tegenstander, een storing of een beëindigde dienst.</p><p><strong>Egress Kill Switch:</strong> uitgaande netwerkcommunicatie kan onmiddellijk worden uitgeschakeld, waardoor het toestel wordt geïsoleerd en gegevensuitstroom structureel onmogelijk wordt in plaats van bestuurlijk verboden. Voor organisaties die moeten aantonen, en niet slechts stellen, dat gegevens het toestel niet verlaten, is dit onderscheid wezenlijk.</p>",
"s4.spec":"<tr><th>Uitvoeringsomgeving</th><td>Zuivere JavaScript, in de browser, één bestand</td></tr><tr><th>Externe bibliotheken</th><td><span class='ok'>Geen</span> — zonder afhankelijkheden, zonder CDN</td></tr><tr><th>Serververeiste</th><td><span class='ok'>Geen</span> — serverloos, zonder uitgaand verkeer</td></tr><tr><th>Verzamelde persoonsgegevens</th><td><span class='ok'>Geen</span> — geen telemetrie, geen metadata</td></tr><tr><th>Kernmethode</th><td>Eindigetoestandsautomaten, gedragsbomen en lichtgewicht versterkend leren (regelgebaseerd, controleerbaar)</td></tr><tr><th>Lokale overdracht</th><td>BLE-mesh; ultrasoon en akoestisch</td></tr><tr><th>Minimale hardware</th><td>Tien jaar oud Android-toestel; chips van één dollar; eenvoudige zonne-energie</td></tr><tr><th>Inzetduur in het veld</th><td>Ontwerpdoel 60 tot 70 dagen; zes maanden op langere termijn</td></tr><tr><th>Naleving</th><td>Privacy by design volgens de AVG; afstemming op ESG en de SDG's</td></tr><tr><th>Licentie</th><td><span class='ok'>Apache License 2.0</span></td></tr><tr><th>Verwijdering</th><td>Op elk moment door de gebruiker te verwijderen, zonder achtergebleven gegevens</td></tr>",

"s5.eyebrow":"Ontwerpethiek",
"s5.pull":"Technische prestaties alleen bepalen niet of een systeem kan worden ingevoerd.",
"s5.body":"<p class='lead'>In humanitaire en maatschappelijke contexten wordt invoering doorgaans bepaald door juridische aansprakelijkheid en risico, en niet door technische capaciteit. Hoe goed een systeem ook presteert, een resterende kans op een omvangrijk geschil over gegevensbescherming is vaak al voldoende om een ngo of internationale organisatie ervan te weerhouden het in gebruik te nemen.</p><p>Elke ontwerpkeuze volgt uit die beperking: hallucinaties in gevoelige domeinen beperken, voldoende transparant blijven voor een onafhankelijke audit, werken in omgevingen met weinig middelen, niets verzamelen, geen juridische aansprakelijkheid overdragen aan de invoerende organisatie, en eenvoudig genoeg blijven zodat ook wie niet programmeert het kan lezen, aanpassen en verwijderen.</p><p>Afstemming op internationale normen — de AVG, het Kinderrechtenverdrag en het Verdrag inzake de rechten van personen met een handicap — wordt vanaf het begin als ontwerpvoorwaarde behandeld en niet als een laag die achteraf wordt toegevoegd.</p>",
"s5.scenes":"<div class='scene'><b>Hallucinaties beperken</b><p>Een onjuiste uitkomst in kinderbescherming, zorg of rampenbestrijding heeft onmiddellijke gevolgen.</p></div><div class='scene'><b>Controleerbaar blijven</b><p>Open code en open architectuur, want een ondoorzichtig systeem valt bij falen niet te verdedigen.</p></div><div class='scene'><b>Geen aansprakelijkheid overdragen</b><p>Zonder verzameling, zonder server en zonder doorgifte over de grens gaat er geen aansprakelijkheid over op de invoerende organisatie.</p></div><div class='scene'><b>Verwijderbaar blijven</b><p>Gebruikers kunnen het systeem en de gegevens op elk moment verwijderen. Het gemak van verwijderen is vrijheid van verplichting.</p></div>",

"s6.eyebrow":"Beoordelings- en auditstatus",
"s6.h":"Elk onderdeel wordt met de huidige fase weergegeven.",
"s6.lead":"Bij elk onderdeel staat de fase vermeld zodat het nauwkeurig kan worden gelezen, en alle onderdelen zijn via de genoemde bronnen onafhankelijk te controleren.",
"s6.grid":"<div><b>Eerstelijnsbeoordeling</b><p>Luxemburgse regering · UCL · IDS (Verenigd Koninkrijk)</p><span class='pill done'>Afgerond</span></div><div><b>Beveiligingsaudit</b><p>OTF Security Lab (VS) — USAGM / Open Technology Fund (2026)</p><span class='pill done'>Afgerond</span></div><div><b>Onderzoekspaper</b><p><a href='https://mcorpai.org/VitalGuard_Offline_AI.pdf' target='_blank' rel='noopener' style='color:var(--signal);text-decoration:none;'>Offline AI (VitalGuard) — PDF ↗</a></p><span class='pill done'>Gepubliceerd</span></div><div><b>Wetenschappelijke verspreiding</b><p>Indiening bij ACM FAccT in voorbereiding; open voor toekomstige onderzoekssamenwerking met de University of Oxford</p><span class='pill'>Gepland</span></div><div><b>Normatieve positie</b><p>Privacy by design volgens de AVG; ESG-kaders; duurzameontwikkelingsdoelen van de VN</p><span class='pill'>Vanuit het ontwerp</span></div><div><b>Licentie</b><p>Apache License 2.0 — kosteloos beschikbaar voor gebruik in het algemeen belang</p><span class='pill done'>Bevestigd</span></div>",
"s6.note":"<b>STATUS EN BEPERKINGEN —</b> De gepubliceerde demonstraties zijn werkende minimale uitvoeringen en geen afgeronde producten; grootschalige validatie in het veld heeft nog niet plaatsgevonden. Uitspraken over naleving beschrijven een ontwerpintentie en controleerbare eigenschappen — vooral dat er geen persoonsgegevens worden verzameld en dat geen uitgaande verbinding nodig is — en geen certificering door een derde partij. Dit onderdeel is zo geschreven dat beoordelaars elke uitspraak zelfstandig kunnen nagaan in plaats van haar op vertrouwen aan te nemen.",

"s7.eyebrow":"Demonstraties",
"s7.h":"Het bestand openen in een browser is de volledige installatie.",
"s7.lead":"Werkende minimale uitvoeringen met eenvoudig machinaal leren op het toestel zelf. Omvang: één afbeelding. Zonder account of registratie, en er verlaten geen gegevens het toestel.",
"s7.demos":"<a class='demo' href='https://mcorpai.com/' target='_blank' rel='noopener'><span class='size'>600 KB · Demonstratie 01</span><h3>Bluetooth-meshnetwerk</h3><p>Mesh tussen toestellen met lichtgewicht machinaal leren en BLE-scanning, volledig uitgevoerd in de browser.</p><span class='go'>mcorpai.com ↗</span></a><a class='demo' href='https://mcorpai.net/' target='_blank' rel='noopener'><span class='size'>460 KB · Demonstratie 02</span><h3>Bluetooth en ultrasoon</h3><p>Akoestische en ultrasone lokale overdracht voor omgevingen waarin radio niet beschikbaar of niet raadzaam is.</p><span class='go'>mcorpai.net ↗</span></a><a class='demo' href='https://mcorpai.org/' target='_blank' rel='noopener'><span class='size'>Projectomgeving</span><h3>Documenten, contact en stand van zaken</h3><p>Actuele documentatie en correspondentieadres van het programma.</p><span class='go'>mcorpai.org ↗</span></a>",
"s7.note":"Geen gegevensverzameling. Geen bezoekersstatistieken. Geen verzoeken aan derden — ook niet op deze pagina, die geen extern lettertype, script of stijlblad laadt.",

"s8.eyebrow":"Het instituut",
"s8.h":"Een voorstel van instelling tot instelling, en geen individuele sollicitatie.",
"s8.body":"<p>Het M Corp AI Onderzoeksinstituut wordt voorzien in de Republiek Korea, in samenwerking met internationale partners. Geselecteerde projecten worden kosteloos beschikbaar gesteld onder de Apache License 2.0 voor gebruik in het algemeen belang. Een deel van de inkomsten van het instituut is bestemd voor de ondersteuning van onafhankelijke auteursfilms en van kinderen met zeldzame aandoeningen, waarbij een hoge ESG-beoordeling een uitdrukkelijk doel is.</p><p>De oprichter zoekt geen individuele aanstelling. Voorgesteld wordt een overeenkomst voor technologielicentiëring en gezamenlijk onderzoek tussen uw organisatie en het instituut, waardoor de oprichter verantwoordelijk kan blijven voor architectuur, onderzoeksrichting en langetermijnopdracht.</p>",
"s8.org":"<thead><tr><th>Functie</th><th>Verantwoordelijkheid</th></tr></thead><tbody><tr><td>Oprichter en AI-systeemarchitect</td><td>Morgan J. — architectuur, onderzoeksrichting, langetermijnvisie</td></tr><tr><td>Softwareontwikkelteam</td><td>Drie ontwikkelaars in Oost-Europa — ontwikkeling, implementatie en programmering</td></tr></tbody>",
"s8.note":"<b>HUIDIGE DOELSTELLING —</b> In de Republiek Korea een onafhankelijk onderzoeksinstituut voor laagniveau-AI oprichten met een klein ontwikkelteam, en institutionele partners vinden die de oprichting en duurzame werking ervan op lange termijn kunnen ondersteunen.",

"s9.eyebrow":"Samenwerking",
"s9.h":"Op dit moment worden drie vormen van samenwerking gezocht.",
"s9.items":"<div><span class='n'>01</span><h3>Onderzoekssamenwerking</h3><p>Samenwerking op afstand met academische groepen en onderzoeksinstellingen op het gebied van offline AI, edge computing en privacywaarborgend systeemontwerp, met inbegrip van gezamenlijke publicaties.</p></div><div><span class='n'>02</span><h3>Licentiëring en gezamenlijke ontwikkeling</h3><p>Overeenkomsten tussen instellingen waarmee uw organisatie deze architectuur binnen eigen programma's kan toepassen, met technische ondersteuning van het instituut.</p></div><div><span class='n'>03</span><h3>Financiering</h3><p>Steun voor de oprichting en duurzame werking van een onafhankelijk onderzoekslaboratorium voor offline AI in de Republiek Korea.</p></div>",

"s10.eyebrow":"Contact",
"s10.h":"Correspondentie, auditrapporten en vragen.",
"s10.lead":"Het project wordt uitsluitend op afstand beheerd, om neutraliteit en focus te bewaren. E-mail is het aangewezen kanaal voor alle vragen, samenwerkingsvoorstellen en auditgerelateerde correspondentie. Antwoorden worden verzonden vanuit de Republiek Korea (KST).",
"s10.links":"<a class='btn' href='https://mcorpai.org/' target='_blank' rel='noopener'>mcorpai.org ↗</a><a class='btn' href='https://mcorpai.org/VitalGuard_Offline_AI.pdf' target='_blank' rel='noopener'>Onderzoekspaper ↗</a>",
"s10.note":"Gevestigd in de Republiek Korea · Op afstand beheerd · Morgan J., architect offline AI en systeemontwerper",

"foot":"<span class='license-badge'>Apache License 2.0</span><p>© 2026 M Corp AI · VitalGuard</p><p>ESG · Duurzameontwikkelingsdoelen van de Verenigde Naties</p><a href='mailto:contact@mcorpai.org'>contact@mcorpai.org</a><p>Deze pagina laadt geen externe bronnen en slaat niets op uw toestel op. De taal wordt bij het laden eenmalig vastgesteld en niet geregistreerd.</p>"

"v.c.p":"Strona nie ma żadnych zależności zewnętrznych, dokument jest więc już kompletnym, pojedynczym plikiem. Można go teraz zapisać i otworzyć później bez jakiegokolwiek połączenia, w aktualnie wyświetlanym języku.",

"hero.flag":"AI offline · Bez zależności · Licencja Apache 2.0",
"hero.title":"Sztuczna inteligencja offline dla środowisk, do których infrastruktura chmurowa <span class='accent'>nie dociera</span>.",
"hero.sub":"Współczesna sztuczna inteligencja zakłada istnienie centrów danych, stabilnego zasilania, nieprzerwanej łączności oraz organizacji zdolnej przyjąć odpowiedzialność związaną z ochroną danych. Dla znacznej części ludności świata co najmniej jedno z tych założeń nie jest spełnione. VitalGuard zaprojektowano właśnie na tę sytuację: system w jednym pliku, bez zależności, działający w przeglądarce dziesięcioletniego telefonu, niewymagający serwera i niegromadzący danych osobowych.",
"hero.cta":"<a class='btn solid' href='#applications'>Obszary zastosowań <span class='arw'>→</span></a><a class='btn' href='https://mcorpai.org/VitalGuard_Offline_AI.pdf' target='_blank' rel='noopener'>Artykuł naukowy (PDF)</a><a class='btn' href='#status'>Stan przeglądów i audytu</a><a class='btn' href='https://github.com/jekymin8232/vitalguardai-com' target='_blank' rel='noopener'>Powiązane badania na GitHubie</a>",
"hero.note":"Prowadzony zdalnie z Republiki Korei · Morgan J., architekt AI offline i projektant systemów · Wszelka korespondencja drogą elektroniczną",
"hero.zero":"<div><b>0</b><span>Wymaganych serwerów</span></div><div><b>0</b><span>Zależności zewnętrznych</span></div><div><b>0</b><span>Danych osobowych</span></div><div><b>0</b><span>Zapytań do podmiotów trzecich</span></div>",

"s1.eyebrow":"Kontekst",
"s1.pull":"W terenie ograniczeniem rzadko bywa jakość modelu.",
"s1.body":"<p class='lead'>Moc obliczeniowa najwyższej klasy pozostaje w zasięgu nielicznych instytucji i państw. W osiedlach uchodźczych, gospodarstwach poza siecią energetyczną, obszarach dotkniętych katastrofami, wyrobiskach podziemnych, obiektach odseparowanych od sieci oraz w regionach objętych blokadą łączności ograniczenia mają zupełnie inny charakter: zasilanie, przepustowość, koszt jednostkowy oraz ryzyko prawne wiążące się z gromadzeniem danych osobowych.</p><p>Niniejszy projekt obiera kierunek przeciwny do dominującego. Zamiast zwiększać liczbę parametrów, usuwa infrastrukturę; zamiast gromadzić dane w celu doskonalenia, nie gromadzi ich wcale. To, co pozostaje, jest na tyle niewielkie, by dało się je przeczytać wiersz po wierszu, na tyle tanie, by rozpowszechniać je nieodpłatnie, i na tyle trwałe, by działać również wtedy, gdy skończą się łączność, budżet chmurowy i finansowanie.</p><p>Te same właściwości mają znaczenie daleko poza obszarem pomocy humanitarnej. Systemy przeznaczone do środowisk ekstremalnych, w tym do badań planetarnych, podlegają porównywalnym wymaganiom w zakresie przetrwania i samowystarczalności.</p>",

"s2.eyebrow":"Ograniczenia projektowe",
"s2.h":"Każda z poniższych właściwości jest decyzją architektoniczną, a nie opcją konfiguracyjną.",
"s2.list":"<li>Nie wymaga żadnej infrastruktury serwerowej</li><li>Bez bibliotek zewnętrznych; samodzielny pojedynczy plik</li><li>Bez kosztów zakupu ani najmu procesorów graficznych</li><li>Koszt krańcowy każdego kolejnego wdrożenia bliski zeru</li><li>Architektura bez ruchu wychodzącego</li><li>Żadnych treści pobieranych z sieci podmiotów trzecich</li><li>Zaprojektowany pod kątem zgodności z RODO (ochrona danych w fazie projektowania)</li><li>Bardzo niskie zużycie energii</li><li>Działa na urządzeniach wycofanych z użytku, wydłużając ich żywotność</li><li>Pracuje na układach klasy jednodolarowej i przy prostym zasilaniu słonecznym</li><li>Zgodny z ramami ESG oraz Celami Zrównoważonego Rozwoju ONZ</li><li>Środki kierowane na badania, a nie na sprzęt</li>",
"s2.note":"<b>METODA —</b> Zamiast rozbudowanego modelu uczenia głębokiego system łączy automaty skończone, drzewa zachowań oraz lekkie uczenie ze wzmocnieniem. Sterowanie stanami oparte na regułach zapewnia stabilne działanie w czasie rzeczywistym przy niskim koszcie obliczeniowym, a — co w zastosowaniach związanych z bezpieczeństwem równie istotne — pozostawia decyzje możliwe do prześledzenia i wyjaśnienia po fakcie.",

"s3.eyebrow":"Zastosowania",
"s3.h":"Osiem środowisk pracy, w których wdrożenie AI zależnej od chmury nie jest możliwe.",
"s3.lead":"Poniższe obszary opierają się na tej samej implementacji i można je filtrować według środowiska najbliższego Państwa programowi. Każdy z nich przedstawiono jako obszar zastosowania, a nie zakończone wdrożenie; walidację terenową omówiono w części dotyczącej stanu przeglądów.",

"<article class='card rv' data-tags='disaster'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M4 18h16'/><path d='M7 18V9l5-5 5 5v9'/><path d='M12 13v5'/></svg><span class='tag'>Niezależny od infrastruktury</span><h3>Reagowanie kryzysowe i działania ratownicze poza siecią</h3><ul><li>Łączność kratowa między urządzeniami bez internetu i bez sieci komórkowej</li><li>Wsparcie segregacji medycznej i monitorowanie parametrów życiowych bez połączenia</li><li>Wsparcie poszukiwań i ratownictwa podczas przerw w zasilaniu i łączności</li></ul><p class='why'>Pierwsze godziny katastrofy to właśnie ten czas, w którym sieć jest niedostępna.</p></article>"+
"<article class='card rv' data-tags='defence'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><rect x='3' y='4' width='18' height='14' rx='1.5'/><path d='M8 21h8M12 18v3M7 9h4M7 13h7'/></svg><span class='tag'>Odseparowany od sieci</span><h3>Obiekty odseparowane od sieci i o krytycznym znaczeniu dla bezpieczeństwa</h3><ul><li>Infrastruktura krytyczna, w której ruch wychodzący jest zakazany przepisami wewnętrznymi</li><li>Wytwarzanie półprzewodników i zaawansowane środowiska produkcyjne</li><li>Urządzenia medyczne i zdrowotne chroniące prywatność</li></ul><p class='why'>Egress Kill Switch: łączność wychodzącą można wyłączyć natychmiast, dzięki czemu wyprowadzenie danych staje się niemożliwe strukturalnie, a nie jedynie zakazane.</p></article>"+
"<article class='card rv' data-tags='esg'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M4 12a8 8 0 0 1 8-8h5'/><path d='M20 12a8 8 0 0 1-8 8H7'/><path d='M14 1.5L17.5 4 14 6.5M10 17.5L6.5 20 10 22.5'/></svg><span class='tag'>Gospodarka o obiegu zamkniętym</span><h3>Ponowne wykorzystanie elektroodpadów i monitoring środowiska</h3><ul><li>Wycofane telefony przekształcone w węzły humanitarne i pomiarowe</li><li>Tani monitoring środowiskowy oraz bezpieczeństwa pracy</li><li>Akustyczne i drganiowe wykrywanie rojów szarańczy na obszarach poza siecią</li></ul><p class='why'>Wydłużenie żywotności urządzeń to mierzalny efekt ESG, a nie deklaracja.</p></article>"+
"<article class='card rv' data-tags='defence esg'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M3 20h18'/><path d='M6 20V10l6-6 6 6v10'/><circle cx='12' cy='13' r='2'/></svg><span class='tag'>Obiekty oddalone</span><h3>Oddalone obiekty przemysłowe i praca na brzegu sieci</h3><ul><li>Kopalnie podziemne i prace tunelowe</li><li>Place budowy i inne środowiska pracy o podwyższonym ryzyku</li><li>Lokalne śledzenie zasobów i monitorowanie bezpieczeństwa pracowników bez infrastruktury sieciowej</li></ul><p class='why'>Tam, gdzie kończy się łączność, urządzenie musi wnioskować samodzielnie.</p></article>"+
"<article class='card rv' data-tags='agri'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M12 21c0-6 3-9 8-9-1 6-4 9-8 9z'/><path d='M12 21c0-6-3-9-8-9 1 6 4 9 8 9z'/><path d='M12 21v-7'/></svg><span class='tag'>Ograniczony zasięg</span><h3>Rolnictwo i hodowla na rozległych obszarach o słabym zasięgu</h3><ul><li>Monitorowanie wilgotności gleby i kondycji zwierząt w Stanach Zjednoczonych, Kanadzie i Australii</li><li>Wczesne rozpoznanie ryzyka chorób w stadzie</li><li>Lokalne alarmy zniechęcające do kradzieży cennych zwierząt gospodarskich</li></ul><p class='why'>Tam, gdzie infrastruktura łączności jest ograniczona, stały monitoring o niskim poborze energii może poprawić wydajność.</p></article>"+
"<article class='card rv' data-tags='consumer esg'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><rect x='7' y='6' width='10' height='12' rx='2'/><path d='M9 6V3h6v3M9 18v3h6v-3'/><path d='M10 12h4'/></svg><span class='tag'>Układy klasy jednodolarowej</span><h3>Sprzęt bardzo tani i zasilany energią słoneczną</h3><ul><li>Zegarki cyfrowe zasilane słonecznie z prostymi funkcjami ratującymi życie</li><li>Praca ciągła na układach o skrajnie niskim koszcie</li><li>Znikomy wpływ na jednostkowy koszt wytworzenia</li></ul><p class='why'>Efektywność nie jest tu ograniczeniem przyjętym z konieczności, lecz samym założeniem projektu.</p></article>"+
"<article class='card rv' data-tags='rights disaster defence'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><circle cx='12' cy='12' r='2.2'/><path d='M8 8a5.5 5.5 0 0 0 0 8M16 8a5.5 5.5 0 0 1 0 8M5 5a10 10 0 0 0 0 14M19 5a10 10 0 0 1 0 14'/></svg><span class='tag'>BLE i ultradźwięki</span><h3>Łączność lokalna bez jakiejkolwiek sieci</h3><ul><li>Sieć kratowa Bluetooth między urządzeniami znajdującymi się blisko siebie</li><li>Przesył akustyczny i ultradźwiękowy tam, gdzie radio jest niedostępne lub niewskazane</li><li>Uczenie maszynowe i skanowanie BLE w czystym języku JavaScript na dziesięcioletnich urządzeniach z systemem Android</li></ul><p class='why'>Zakładany czas pracy w terenie wynosi od 60 do 70 dni przy minimalnym poborze energii, a celem długofalowym jest sześć miesięcy.</p></article>",

"s4.eyebrow":"Architektura",
"s4.h":"Właściwości bezpieczeństwa wynikające ze struktury, a nie z regulaminów.",
"s4.body":"<p>Celem jest architektura w jednym pliku i bez zależności, w której każdy moduł napisano od podstaw z myślą o kompletności i samodzielności. W czasie działania nic nie jest pobierane, ponieważ wszystko, co pobierane jest w czasie działania, może zostać odebrane przez przeciwnika, awarię lub zamknięcie usługi.</p><p><strong>Egress Kill Switch:</strong> łączność wychodzącą można wyłączyć natychmiast, odseparowując urządzenie w taki sposób, że wyprowadzenie danych staje się niemożliwe strukturalnie, a nie zakazane administracyjnie. Rozróżnienie to ma znaczenie dla organizacji, które muszą wykazać, a nie jedynie oświadczyć, że dane nie opuszczają urządzenia.</p>",
"s4.spec":"<tr><th>Środowisko wykonawcze</th><td>Czysty JavaScript, w przeglądarce, pojedynczy plik</td></tr><tr><th>Biblioteki zewnętrzne</th><td><span class='ok'>Brak</span> — bez zależności, bez CDN</td></tr><tr><th>Wymóg serwera</th><td><span class='ok'>Brak</span> — bez serwera, bez ruchu wychodzącego</td></tr><tr><th>Gromadzone dane osobowe</th><td><span class='ok'>Brak</span> — bez telemetrii i bez metadanych</td></tr><tr><th>Metoda podstawowa</th><td>Automaty skończone, drzewa zachowań i lekkie uczenie ze wzmocnieniem (oparte na regułach, możliwe do skontrolowania)</td></tr><tr><th>Przesył lokalny</th><td>Sieć kratowa BLE; ultradźwięki i akustyka</td></tr><tr><th>Minimalny sprzęt</th><td>Dziesięcioletnie urządzenie z systemem Android; układy klasy jednodolarowej; proste zasilanie słoneczne</td></tr><tr><th>Czas pracy w terenie</th><td>Cel projektowy od 60 do 70 dni; sześć miesięcy w dłuższej perspektywie</td></tr><tr><th>Zgodność regulacyjna</th><td>Ochrona danych w fazie projektowania zgodnie z RODO; zgodność z ESG i Celami Zrównoważonego Rozwoju</td></tr><tr><th>Licencja</th><td><span class='ok'>Apache License 2.0</span></td></tr><tr><th>Usunięcie</th><td>Możliwe do usunięcia przez użytkownika w każdej chwili, bez pozostałości danych</td></tr>",

"s5.eyebrow":"Etyka projektowa",
"s5.pull":"Sama sprawność techniczna nie przesądza o tym, czy system może zostać wdrożony.",
"s5.body":"<p class='lead'>W działaniach humanitarnych i obywatelskich o wdrożeniu decyduje z reguły odpowiedzialność prawna i ryzyko, a nie możliwości techniczne. Nawet przy bardzo wysokiej sprawności systemu resztkowe prawdopodobieństwo poważnego sporu dotyczącego ochrony danych często wystarcza, aby organizacja pozarządowa lub międzynarodowa zrezygnowała z jego przyjęcia.</p><p>Każda decyzja projektowa wynika z tego ograniczenia: ograniczać halucynacje w obszarach wrażliwych, zachować przejrzystość wystarczającą do niezależnego audytu, działać w środowiskach o skromnych zasobach, niczego nie gromadzić, nie przenosić odpowiedzialności prawnej na organizację wdrażającą oraz pozostać na tyle prostym, by osoby nieprogramujące mogły system przeczytać, dostosować i usunąć.</p><p>Zgodność z normami międzynarodowymi — RODO, Konwencją o prawach dziecka oraz Konwencją o prawach osób niepełnosprawnych — traktowana jest jako założenie projektowe od samego początku, a nie jako warstwa zgodności dodana później.</p>",
"s5.scenes":"<div class='scene'><b>Ograniczać halucynacje</b><p>Błędny wynik w ochronie dzieci, opiece zdrowotnej czy reagowaniu kryzysowym pociąga za sobą natychmiastowe skutki.</p></div><div class='scene'><b>Pozostać sprawdzalnym</b><p>Otwarty kod i otwarta architektura, ponieważ systemu nieprzejrzystego nie da się obronić, gdy zawiedzie.</p></div><div class='scene'><b>Nie przenosić odpowiedzialności</b><p>Bez gromadzenia, bez serwera i bez przekazywania danych za granicę żadna odpowiedzialność nie przechodzi na organizację wdrażającą.</p></div><div class='scene'><b>Pozostać usuwalnym</b><p>Użytkownicy mogą usunąć system i jego dane w każdej chwili. Łatwość usunięcia jest wolnością od zobowiązania.</p></div>",

"s6.eyebrow":"Stan przeglądów i audytu",
"s6.h":"Każdą pozycję przedstawiono wraz z jej obecnym etapem.",
"s6.lead":"Przy każdej pozycji podano etap, aby można ją było odczytać precyzyjnie, a wszystkie można zweryfikować niezależnie na podstawie wskazanych źródeł.",
"s6.grid":"<div><b>Przegląd pierwszego etapu</b><p>Rząd Luksemburga · UCL · IDS (Zjednoczone Królestwo)</p><span class='pill done'>Zakończony</span></div><div><b>Audyt bezpieczeństwa</b><p>OTF Security Lab (USA) — USAGM / Open Technology Fund (2026)</p><span class='pill done'>Zakończony</span></div><div><b>Artykuł naukowy</b><p><a href='https://mcorpai.org/VitalGuard_Offline_AI.pdf' target='_blank' rel='noopener' style='color:var(--signal);text-decoration:none;'>Offline AI (VitalGuard) — PDF ↗</a></p><span class='pill done'>Opublikowany</span></div><div><b>Upowszechnianie naukowe</b><p>Przygotowywane zgłoszenie na konferencję ACM FAccT; otwartość na przyszłą współpracę badawczą z Uniwersytetem Oksfordzkim</p><span class='pill'>Planowane</span></div><div><b>Odniesienie do norm</b><p>Ochrona danych w fazie projektowania zgodnie z RODO; ramy ESG; Cele Zrównoważonego Rozwoju ONZ</p><span class='pill'>Wynika z projektu</span></div><div><b>Licencja</b><p>Licencja Apache 2.0 — nieodpłatnie do zastosowań w interesie publicznym</p><span class='pill done'>Potwierdzona</span></div>",
"s6.note":"<b>STAN I OGRANICZENIA —</b> Opublikowane wersje demonstracyjne są działającymi implementacjami minimalnymi, a nie produktami gotowymi; walidacja terenowa na dużą skalę nie została dotąd przeprowadzona. Stwierdzenia dotyczące zgodności opisują zamiar projektowy oraz właściwości możliwe do zweryfikowania — przede wszystkim to, że nie są gromadzone żadne dane osobowe i że nie jest wymagane żadne połączenie wychodzące — a nie certyfikat wydany przez podmiot zewnętrzny. Niniejszą część zredagowano tak, aby osoby oceniające mogły zweryfikować każde stwierdzenie niezależnie, zamiast przyjmować je na zasadzie zaufania.",

"s7.eyebrow":"Wersje demonstracyjne",
"s7.h":"Otwarcie pliku w przeglądarce stanowi całą instalację.",
"s7.lead":"Działające implementacje minimalne obejmujące podstawowe uczenie maszynowe na samym urządzeniu. Pojemność: jeden obraz. Bez konta i bez rejestracji, a żadne dane nie opuszczają urządzenia.",
"s7.demos":"<a class='demo' href='https://mcorpai.com/' target='_blank' rel='noopener'><span class='size'>600 KB · Demonstracja 01</span><h3>Sieć kratowa Bluetooth</h3><p>Sieć kratowa między urządzeniami z lekkim uczeniem maszynowym i skanowaniem BLE, wykonywana w całości w przeglądarce.</p><span class='go'>mcorpai.com ↗</span></a><a class='demo' href='https://mcorpai.net/' target='_blank' rel='noopener'><span class='size'>460 KB · Demonstracja 02</span><h3>Bluetooth i ultradźwięki</h3><p>Lokalny przesył akustyczny i ultradźwiękowy dla środowisk, w których radio jest niedostępne lub niewskazane.</p><span class='go'>mcorpai.net ↗</span></a><a class='demo' href='https://mcorpai.org/' target='_blank' rel='noopener'><span class='size'>Przestrzeń projektu</span><h3>Dokumenty, kontakt i stan prac</h3><p>Aktualna dokumentacja oraz adres korespondencyjny programu.</p><span class='go'>mcorpai.org ↗</span></a>",
"s7.note":"Brak gromadzenia danych. Brak analityki ruchu. Brak zapytań do podmiotów trzecich — również na tej stronie, która nie pobiera żadnych zewnętrznych krojów pisma, skryptów ani arkuszy stylów.",

"s8.eyebrow":"Instytut",
"s8.h":"Propozycja skierowana od instytucji do instytucji, a nie indywidualna aplikacja o zatrudnienie.",
"s8.body":"<p>Instytut Badawczy M Corp AI ma powstać w Republice Korei i współpracować z partnerami międzynarodowymi. Wybrane projekty będą udostępniane nieodpłatnie na Licencji Apache 2.0 z przeznaczeniem do zastosowań w interesie publicznym. Część przychodów instytutu przewidziano na wsparcie niezależnego kina autorskiego oraz dzieci dotkniętych chorobami rzadkimi, przy czym wysoka ocena ESG stanowi wyraźnie określony cel.</p><p>Założyciel nie poszukuje indywidualnego zatrudnienia. Przedmiotem propozycji jest umowa o licencjonowanie technologii i wspólne badania pomiędzy Państwa organizacją a instytutem, dzięki której założyciel może pozostać odpowiedzialny za architekturę, kierunek badań oraz misję długofalową.</p>",

"s1.body":"<p class='lead'>সর্বোচ্চ পর্যায়ের গণনাশক্তি সামর্থ্যের মধ্যে রয়েছে অল্পসংখ্যক প্রতিষ্ঠান ও রাষ্ট্রের। শরণার্থী বসতি, বিদ্যুৎ সঞ্চালন জালের বাইরের কৃষিজমি, দুর্যোগকবলিত অঞ্চল, ভূগর্ভস্থ কর্মস্থল, নেটওয়ার্ক থেকে বিচ্ছিন্ন স্থাপনা এবং ইন্টারনেট বন্ধ থাকা অঞ্চলে সীমাবদ্ধতার প্রকৃতি ভিন্ন: বিদ্যুৎ, ব্যান্ডউইথ, একক ব্যয় এবং ব্যক্তিগত তথ্য সংগ্রহের সঙ্গে জড়িত আইনি ঝুঁকি।</p><p>এই প্রকল্প প্রচলিত ধারার বিপরীত পথ নেয়। প্যারামিটার বাড়ানোর বদলে অবকাঠামো সরিয়ে দেয়; উন্নতির জন্য তথ্য সংগ্রহ করার বদলে কিছুই সংগ্রহ করে না। যা অবশিষ্ট থাকে তা এতটাই ছোট যে লাইন ধরে ধরে পড়া যায়, এতটাই সাশ্রয়ী যে বিনামূল্যে বিতরণ করা যায়, এবং এতটাই দৃঢ় যে সংযোগ, ক্লাউড বরাদ্দ ও তহবিল শেষ হয়ে যাওয়ার পরেও চলতে থাকে।</p><p>একই বৈশিষ্ট্যগুলি মানবিক সহায়তার সীমা ছাড়িয়েও প্রাসঙ্গিক। গ্রহ অনুসন্ধানসহ চরম পরিবেশের জন্য নির্মিত ব্যবস্থাগুলিকেও টিকে থাকার সামর্থ্য ও স্বনির্ভরতার তুলনীয় শর্ত মানতে হয়।</p>",

"s2.eyebrow":"পরিকল্পনার সীমাবদ্ধতা",
"s2.h":"নিচের প্রতিটি বৈশিষ্ট্য স্থাপত্যগত সিদ্ধান্ত, কোনো সেটিংস বিকল্প নয়।",
"s2.list":"<li>কোনো সার্ভার অবকাঠামোর প্রয়োজন নেই</li><li>বাইরের কোনো লাইব্রেরি নেই; স্বয়ংসম্পূর্ণ একক ফাইল</li><li>জিপিইউ কেনা বা ভাড়ার ব্যয় নেই</li><li>প্রতিটি অতিরিক্ত স্থাপনের প্রান্তিক ব্যয় প্রায় শূন্য</li><li>বাইরের দিকে তথ্য না পাঠানো স্থাপত্য</li><li>তৃতীয় পক্ষের নেটওয়ার্ক থেকে কোনো উপাদান আনা হয় না</li><li>GDPR অনুসরণের লক্ষ্যে পরিকল্পিত (Privacy-by-Design)</li><li>অত্যন্ত কম বিদ্যুৎ খরচ</li><li>অবসরপ্রাপ্ত যন্ত্রে চলে এবং তার আয়ু বাড়ায়</li><li>এক ডলার শ্রেণির চিপ ও সাধারণ সৌর সরবরাহে সক্রিয়</li><li>ESG কাঠামো ও জাতিসংঘের টেকসই উন্নয়ন লক্ষ্যমাত্রার সঙ্গে সঙ্গতিপূর্ণ</li><li>বরাদ্দ যন্ত্রপাতির বদলে গবেষকদের উপর কেন্দ্রীভূত</li>",
"s2.note":"<b>পদ্ধতি —</b> বৃহৎ গভীর শিখন প্রতিমান ব্যবহারের বদলে এই ব্যবস্থা সসীম অবস্থা যন্ত্র, আচরণ বৃক্ষ এবং হালকা শক্তিবৃদ্ধিমূলক শিখনের সমন্বয় ব্যবহার করে। নিয়মভিত্তিক অবস্থা নিয়ন্ত্রণ কম গণনা ব্যয়ে স্থিতিশীল তাৎক্ষণিক আচরণ দেয়, এবং নিরাপত্তা-সংশ্লিষ্ট প্রেক্ষাপটে সমান গুরুত্বপূর্ণ যে বিষয়টি, তা হলো এর সিদ্ধান্তগুলি পরে অনুসরণ ও ব্যাখ্যা করা সম্ভব থাকে।",

"s3.eyebrow":"প্রয়োগক্ষেত্র",
"s3.h":"আটটি পরিচালনাগত পরিবেশ, যেখানে ক্লাউডনির্ভর কৃত্রিম বুদ্ধিমত্তা স্থাপন করা সম্ভব নয়।",
"s3.lead":"নিচের ক্ষেত্রগুলি একই বাস্তবায়নের উপর দাঁড়িয়ে আছে এবং আপনাদের কর্মসূচির সঙ্গে সর্বাধিক সাদৃশ্যপূর্ণ পরিবেশ অনুযায়ী ছেঁকে দেখা যায়। প্রতিটিকে প্রয়োগক্ষেত্র হিসেবে উল্লেখ করা হয়েছে, সম্পন্ন স্থাপনা হিসেবে নয়; মাঠপর্যায়ের যাচাই সম্পর্কে পর্যালোচনার অবস্থা অংশে বলা হয়েছে।",

"<article class='card rv' data-tags='disaster'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M4 18h16'/><path d='M7 18V9l5-5 5 5v9'/><path d='M12 13v5'/></svg><span class='tag'>অবকাঠামোনিরপেক্ষ</span><h3>দুর্যোগ সাড়া ও সঞ্চালন জালের বাইরে জরুরি কার্যক্রম</h3><ul><li>ইন্টারনেট বা মোবাইল নেটওয়ার্ক ছাড়া যন্ত্র থেকে যন্ত্রে জালবদ্ধ যোগাযোগ</li><li>অফলাইনে ত্রিয়াজ সহায়তা ও প্রাণসংকেত পর্যবেক্ষণ</li><li>বিদ্যুৎ ও নেটওয়ার্ক বিচ্ছিন্ন থাকা অবস্থায় অনুসন্ধান ও উদ্ধারে সহায়তা</li></ul><p class='why'>দুর্যোগের প্রথম কয়েক ঘণ্টা ঠিক সেই সময়, যখন নেটওয়ার্ক পাওয়া যায় না।</p></article>"+
"<article class='card rv' data-tags='defence'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><rect x='3' y='4' width='18' height='14' rx='1.5'/><path d='M8 21h8M12 18v3M7 9h4M7 13h7'/></svg><span class='tag'>নেটওয়ার্ক থেকে বিচ্ছিন্ন</span><h3>বিচ্ছিন্ন ও নিরাপত্তার দিক থেকে সংকটাপন্ন স্থাপনা</h3><ul><li>অভ্যন্তরীণ নীতিতে বহির্গামী সঞ্চালন নিষিদ্ধ থাকা গুরুত্বপূর্ণ অবকাঠামো</li><li>অর্ধপরিবাহী উৎপাদন ও অগ্রসর উৎপাদন পরিবেশ</li><li>গোপনীয়তা রক্ষাকারী চিকিৎসা ও স্বাস্থ্যযন্ত্র</li></ul><p class='why'>Egress Kill Switch: বহির্গামী যোগাযোগ তাৎক্ষণিকভাবে বন্ধ করা যায়, ফলে তথ্য পাচার নিয়মে নিষিদ্ধ নয় বরং কাঠামোগতভাবেই অসম্ভব হয়ে যায়।</p></article>"+
"<article class='card rv' data-tags='esg'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M4 12a8 8 0 0 1 8-8h5'/><path d='M20 12a8 8 0 0 1-8 8H7'/><path d='M14 1.5L17.5 4 14 6.5M10 17.5L6.5 20 10 22.5'/></svg><span class='tag'>চক্রাকার অর্থনীতি</span><h3>ই-বর্জ্যের পুনর্ব্যবহার ও পরিবেশ পর্যবেক্ষণ</h3><ul><li>অবসরপ্রাপ্ত স্মার্টফোনকে মানবিক ও পর্যবেক্ষণ নোড হিসেবে ব্যবহার</li><li>স্বল্পব্যয়ে পরিবেশ ও কর্মক্ষেত্রের নিরাপত্তা পর্যবেক্ষণ</li><li>সঞ্চালন জালের বাইরের অঞ্চলে পঙ্গপালের ঝাঁক শব্দ ও কম্পনের মাধ্যমে শনাক্তকরণ</li></ul><p class='why'>যন্ত্রের আয়ু বাড়ানো কেবল দাবি নয়, এটি পরিমাপযোগ্য ESG ফলাফল।</p></article>"+
"<article class='card rv' data-tags='defence esg'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M3 20h18'/><path d='M6 20V10l6-6 6 6v10'/><circle cx='12' cy='13' r='2'/></svg><span class='tag'>দূরবর্তী কর্মকাণ্ড</span><h3>দূরবর্তী শিল্পস্থল ও প্রান্তিক পরিচালনা</h3><ul><li>ভূগর্ভস্থ খনি ও সুড়ঙ্গের কাজ</li><li>নির্মাণস্থল ও অন্যান্য ঝুঁকিপূর্ণ কর্মপরিবেশ</li><li>নেটওয়ার্ক অবকাঠামো ছাড়াই স্থানীয়ভাবে সম্পদ অনুসরণ ও কর্মীর নিরাপত্তা পর্যবেক্ষণ</li></ul><p class='why'>যেখানে সংযোগ শেষ হয়, সেখানেও যন্ত্রকে নিজেই বিচার-বিবেচনা চালিয়ে যেতে হয়।</p></article>"+
"<article class='card rv' data-tags='agri'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M12 21c0-6 3-9 8-9-1 6-4 9-8 9z'/><path d='M12 21c0-6-3-9-8-9 1 6 4 9 8 9z'/><path d='M12 21v-7'/></svg><span class='tag'>সীমিত নেটওয়ার্ক</span><h3>বিস্তীর্ণ ও দুর্বল নেটওয়ার্কের অঞ্চলে কৃষি ও পশুপালন</h3><ul><li>যুক্তরাষ্ট্র, কানাডা ও অস্ট্রেলিয়ায় মাটির আর্দ্রতা ও পশুর অবস্থা পর্যবেক্ষণ</li><li>পালের ভেতরে রোগ-ঝুঁকির আগাম আভাস</li><li>মূল্যবান পশু চুরি নিরুৎসাহিত করতে স্থানীয় সতর্কবার্তা</li></ul><p class='why'>যেখানে যোগাযোগ অবকাঠামো সীমিত, সেখানে কম বিদ্যুতে নিরবচ্ছিন্ন পর্যবেক্ষণ উৎপাদনশীলতা বাড়াতে পারে।</p></article>"+
"<article class='card rv' data-tags='consumer esg'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><rect x='7' y='6' width='10' height='12' rx='2'/><path d='M9 6V3h6v3M9 18v3h6v-3'/><path d='M10 12h4'/></svg><span class='tag'>এক ডলার শ্রেণির চিপ</span><h3>অতি স্বল্পমূল্যের ও সৌরচালিত যন্ত্র</h3><ul><li>সরল জীবনরক্ষামূলক কাজসহ সৌরচালিত ডিজিটাল ঘড়ি</li><li>অতি স্বল্পমূল্যের চিপে নিরবচ্ছিন্ন পরিচালনা</li><li>একক উৎপাদন ব্যয়ে প্রভাব নগণ্য</li></ul><p class='why'>এখানে দক্ষতা বাধ্য হয়ে মেনে নেওয়া সীমা নয়, বরং পরিকল্পনার মূল ভিত্তি।</p></article>"+
"<article class='card rv' data-tags='rights disaster defence'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><circle cx='12' cy='12' r='2.2'/><path d='M8 8a5.5 5.5 0 0 0 0 8M16 8a5.5 5.5 0 0 1 0 8M5 5a10 10 0 0 0 0 14M19 5a10 10 0 0 1 0 14'/></svg><span class='tag'>BLE ও অতিধ্বনি</span><h3>কোনো নেটওয়ার্ক ছাড়াই স্থানীয় যোগাযোগ</h3><ul><li>নিকটবর্তী যন্ত্রের মধ্যে ব্লুটুথ জাল</li><li>যেখানে বেতার পাওয়া যায় না বা উপযুক্ত নয়, সেখানে অতিধ্বনি ও ধ্বনিভিত্তিক সঞ্চালন</li><li>দশ বছরের পুরোনো Android যন্ত্রে বিশুদ্ধ JavaScript-এ যন্ত্রশিখন ও BLE স্ক্যান</li></ul><p class='why'>মাঠপর্যায়ে চলার পরিকল্পিত লক্ষ্য ন্যূনতম বিদ্যুতে ৬০ থেকে ৭০ দিন, দীর্ঘমেয়াদি লক্ষ্য ছয় মাস।</p></article>",

"s4.h":"নিরাপত্তার বৈশিষ্ট্য বিধিবিধান থেকে নয়, কাঠামো থেকেই উদ্ভূত।",
"s4.body":"<p>লক্ষ্য হলো একক ফাইলের, নির্ভরতাহীন স্থাপত্য, যেখানে প্রতিটি অংশ পূর্ণতা ও স্বনির্ভরতার কথা মাথায় রেখে মূল নীতি থেকে লেখা। চলার সময় বাইরের কিছুই আনা হয় না, কারণ চলার সময় আনা প্রতিটি উপাদানই কোনো প্রতিপক্ষ, কোনো বিপর্যয় বা বন্ধ হয়ে যাওয়া সেবার কারণে হারিয়ে যেতে পারে।</p><p><strong>Egress Kill Switch:</strong> বহির্গামী যোগাযোগ তাৎক্ষণিকভাবে নিষ্ক্রিয় করে যন্ত্রটিকে বিচ্ছিন্ন করা যায়, ফলে তথ্য পাচার প্রশাসনিকভাবে নিষিদ্ধ না থেকে কাঠামোগতভাবেই অসম্ভব হয়ে দাঁড়ায়। যেসব প্রতিষ্ঠানকে কেবল বলা নয়, প্রমাণ করতে হয় যে তথ্য বাইরে যায় না, তাদের জন্য এই পার্থক্য গুরুত্বপূর্ণ।</p>",
"s4.spec":"<tr><th>চলার পরিবেশ</th><td>বিশুদ্ধ JavaScript, ব্রাউজারের ভেতরে, একক ফাইল</td></tr><tr><th>বাইরের লাইব্রেরি</th><td><span class='ok'>নেই</span> — নির্ভরতাহীন, CDN ব্যবহার নেই</td></tr><tr><th>সার্ভারের প্রয়োজন</th><td><span class='ok'>নেই</span> — সার্ভারবিহীন, বহির্গামী সঞ্চালন নেই</td></tr><tr><th>সংগৃহীত ব্যক্তিগত তথ্য</th><td><span class='ok'>নেই</span> — টেলিমেট্রি ও মেটাডেটা কোনোটিই নয়</td></tr><tr><th>মূল পদ্ধতি</th><td>সসীম অবস্থা যন্ত্র + আচরণ বৃক্ষ + হালকা শক্তিবৃদ্ধিমূলক শিখন (নিয়মভিত্তিক, যাচাইযোগ্য)</td></tr><tr><th>স্থানীয় সঞ্চালন</th><td>BLE জাল; অতিধ্বনি ও ধ্বনি</td></tr><tr><th>ন্যূনতম যন্ত্র</th><td>দশ বছরের পুরোনো Android যন্ত্র; এক ডলার শ্রেণির চিপ; সাধারণ সৌর সরবরাহ</td></tr><tr><th>মাঠপর্যায়ে স্থায়িত্ব</th><td>পরিকল্পিত লক্ষ্য ৬০ থেকে ৭০ দিন; দীর্ঘমেয়াদে ছয় মাস</td></tr><tr><th>বিধিগত অবস্থান</th><td>GDPR অনুসারে Privacy-by-Design; ESG ও জাতিসংঘের SDG-র সঙ্গে সঙ্গতি</td></tr><tr><th>লাইসেন্স</th><td><span class='ok'>Apache License 2.0</span></td></tr><tr><th>অপসারণ</th><td>ব্যবহারকারী যেকোনো সময় মুছে ফেলতে পারেন, কোনো তথ্য অবশিষ্ট থাকে না</td></tr>",

"s5.eyebrow":"পরিকল্পনার নৈতিকতা",
"s5.pull":"কেবল কৌশলগত সামর্থ্য দিয়ে কোনো ব্যবস্থা গ্রহণযোগ্য হবে কি না তা নির্ধারিত হয় না।",
"s5.body":"<p class='lead'>মানবিক ও নাগরিক সমাজের প্রেক্ষাপটে গ্রহণের সিদ্ধান্ত সাধারণত কৌশলগত সামর্থ্যের চেয়ে আইনি দায় ও ঝুঁকির উপর নির্ভর করে। ব্যবস্থা যত সক্ষমই হোক, তথ্যসুরক্ষা নিয়ে বড় ধরনের বিরোধের অবশিষ্ট সম্ভাবনাই প্রায়শই যথেষ্ট হয়ে যায়, যার ফলে কোনো বেসরকারি বা আন্তর্জাতিক সংস্থা তা গ্রহণ থেকে বিরত থাকে।</p><p>এখানকার প্রতিটি সিদ্ধান্ত সেই সীমাবদ্ধতা থেকেই এসেছে: সংবেদনশীল ক্ষেত্রে অলীক ফলাফল কমানো, স্বাধীন নিরীক্ষার উপযোগী স্বচ্ছতা রক্ষা করা, স্বল্প সম্পদের পরিবেশে কাজ করা, কিছুই সংগ্রহ না করা, গ্রহণকারী প্রতিষ্ঠানের উপর কোনো আইনি দায় না চাপানো এবং এতটা সরল থাকা যাতে প্রোগ্রামিং না জানা কর্মীও তা পড়তে, বদলাতে ও মুছতে পারেন।</p><p>GDPR, শিশু অধিকার সনদ এবং প্রতিবন্ধী ব্যক্তির অধিকার সনদের মতো আন্তর্জাতিক মানদণ্ডের সঙ্গে সঙ্গতিকে শুরু থেকেই পরিকল্পনার শর্ত হিসেবে দেখা হয়েছে, পরে যুক্ত করা কোনো স্তর হিসেবে নয়।</p>",
"s5.scenes":"<div class='scene'><b>অলীক ফলাফল কমানো</b><p>শিশু সুরক্ষা, স্বাস্থ্যসেবা বা দুর্যোগ সাড়ায় ভুল ফলাফলের পরিণতি তাৎক্ষণিক।</p></div><div class='scene'><b>যাচাইযোগ্য থাকা</b><p>মুক্ত কোড ও মুক্ত স্থাপত্য, কারণ অস্বচ্ছ ব্যবস্থা ব্যর্থ হলে তার পক্ষে দাঁড়ানো যায় না।</p></div><div class='scene'><b>দায় হস্তান্তর না করা</b><p>সংগ্রহ নেই, সার্ভার নেই, সীমান্ত পার হয়ে স্থানান্তর নেই; ফলে গ্রহণকারী প্রতিষ্ঠানের উপর কোনো দায় বর্তায় না।</p></div><div class='scene'><b>মুছে ফেলার সুযোগ রাখা</b><p>ব্যবহারকারী যেকোনো সময় ব্যবস্থা ও তার তথ্য সরিয়ে ফেলতে পারেন। মুছে ফেলার সহজতাই দায়মুক্তি।</p></div>",

"s6.eyebrow":"পর্যালোচনা ও নিরীক্ষার অবস্থা",
"s6.h":"প্রতিটি বিষয় তার বর্তমান পর্যায়সহ উল্লেখ করা হয়েছে।",
"s6.lead":"প্রতিটি বিষয়ের সঙ্গে পর্যায় উল্লেখ করা হয়েছে যাতে তা নিখুঁতভাবে পড়া যায়, এবং উল্লিখিত সূত্র থেকে প্রত্যেকটি স্বাধীনভাবে যাচাই করা সম্ভব।",
"s6.grid":"<div><b>প্রথম পর্যায়ের পর্যালোচনা</b><p>লুক্সেমবার্গ সরকার · UCL · IDS (যুক্তরাজ্য)</p><span class='pill done'>সম্পন্ন</span></div><div><b>নিরাপত্তা নিরীক্ষা</b><p>যুক্তরাষ্ট্রের OTF Security Lab — USAGM / Open Technology Fund (২০২৬)</p><span class='pill done'>সম্পন্ন</span></div><div><b>গবেষণাপত্র</b><p><a href='https://mcorpai.org/VitalGuard_Offline_AI.pdf' target='_blank' rel='noopener' style='color:var(--signal);text-decoration:none;'>Offline AI (VitalGuard) — PDF ↗</a></p><span class='pill done'>প্রকাশিত</span></div><div><b>একাডেমিক উপস্থাপন</b><p>ACM FAccT-এ জমা দেওয়ার প্রস্তুতি চলছে; অক্সফোর্ড বিশ্ববিদ্যালয়ের সঙ্গে ভবিষ্যৎ গবেষণা সহযোগিতার জন্য উন্মুক্ত</p><span class='pill'>পরিকল্পিত</span></div><div><b>মানদণ্ডগত অবস্থান</b><p>GDPR অনুসারে Privacy-by-Design; ESG কাঠামো; জাতিসংঘের টেকসই উন্নয়ন লক্ষ্যমাত্রা</p><span class='pill'>পরিকল্পনাগত</span></div><div><b>লাইসেন্স</b><p>Apache License 2.0 — জনস্বার্থে ব্যবহারের জন্য বিনামূল্যে</p><span class='pill done'>নিশ্চিত</span></div>",
"s6.note":"<b>বর্তমান অবস্থা ও সীমা —</b> প্রকাশিত নমুনাগুলি সম্পূর্ণ পণ্য নয়, বরং কার্যকর ন্যূনতম বাস্তবায়ন, এবং বড় পরিসরে মাঠপর্যায়ের যাচাই এখনো করা হয়নি। বিধি অনুসরণ সম্পর্কিত বক্তব্যগুলি তৃতীয় পক্ষের দেওয়া কোনো সনদ নয়, বরং পরিকল্পনাগত অভিপ্রায় ও যাচাইযোগ্য বৈশিষ্ট্য নির্দেশ করে — মূলত এই যে কোনো ব্যক্তিগত তথ্য সংগ্রহ করা হয় না এবং বাইরের দিকে কোনো সংযোগের প্রয়োজন হয় না। এই অংশটি এমনভাবে লেখা হয়েছে যাতে পর্যালোচকেরা প্রতিটি বক্তব্য আস্থার ভিত্তিতে মেনে নেওয়ার বদলে স্বাধীনভাবে যাচাই করতে পারেন।",

"s7.eyebrow":"নমুনা",
"s7.h":"ব্রাউজারে ফাইলটি খোলাই সম্পূর্ণ স্থাপন প্রক্রিয়া।",
"s7.lead":"যন্ত্রের ভেতরেই চলা প্রাথমিক যন্ত্রশিখনসহ কার্যকর ন্যূনতম বাস্তবায়ন। ধারণক্ষমতা: একটি ছবি। কোনো অ্যাকাউন্ট বা নিবন্ধন লাগে না, এবং কোনো তথ্য যন্ত্রের বাইরে যায় না।",
"s7.demos":"<a class='demo' href='https://mcorpai.com/' target='_blank' rel='noopener'><span class='size'>600 KB · নমুনা 01</span><h3>ব্লুটুথ জাল নেটওয়ার্ক</h3><p>যন্ত্রের মধ্যে জালবদ্ধ সংযোগের সঙ্গে হালকা যন্ত্রশিখন ও BLE স্ক্যান, পুরো প্রক্রিয়া ব্রাউজারের ভেতরেই।</p><span class='go'>mcorpai.com ↗</span></a><a class='demo' href='https://mcorpai.net/' target='_blank' rel='noopener'><span class='size'>460 KB · নমুনা 02</span><h3>ব্লুটুথ ও অতিধ্বনি</h3><p>যেখানে বেতার পাওয়া যায় না বা উপযুক্ত নয়, সেই পরিবেশের জন্য ধ্বনি ও অতিধ্বনিভিত্তিক স্থানীয় সঞ্চালন।</p><span class='go'>mcorpai.net ↗</span></a><a class='demo' href='https://mcorpai.org/' target='_blank' rel='noopener'><span class='size'>প্রকল্প কেন্দ্র</span><h3>গবেষণাপত্র, যোগাযোগ ও অগ্রগতি</h3><p>এই কর্মসূচির সাম্প্রতিক নথিপত্র ও যোগাযোগের ঠিকানা।</p><span class='go'>mcorpai.org ↗</span></a>",
"s7.note":"কোনো তথ্য সংগ্রহ নেই। কোনো ভিজিট বিশ্লেষণ নেই। তৃতীয় পক্ষের কোনো অনুরোধ নেই — এই পৃষ্ঠাটিও বাইরের কোনো ফন্ট, স্ক্রিপ্ট বা স্টাইলশিট আনে না।",

"s8.eyebrow":"ইনস্টিটিউট",
"s8.h":"এটি প্রতিষ্ঠান থেকে প্রতিষ্ঠানে দেওয়া প্রস্তাব, ব্যক্তিগত চাকরির আবেদন নয়।",
"s8.body":"<p>M Corp AI গবেষণা ইনস্টিটিউট কোরিয়া প্রজাতন্ত্রে প্রতিষ্ঠার পরিকল্পনা রয়েছে এবং তা আন্তর্জাতিক সহযোগীদের সঙ্গে কাজ করবে। নির্বাচিত প্রকল্পগুলি জনস্বার্থে ব্যবহারের জন্য Apache License 2.0-এর অধীনে বিনামূল্যে প্রকাশ করা হবে। ইনস্টিটিউটের আয়ের একটি অংশ স্বাধীন শিল্পসম্মত চলচ্চিত্র এবং বিরল রোগে আক্রান্ত শিশুদের সহায়তায় ব্যয়ের পরিকল্পনা রয়েছে, যেখানে উচ্চ ESG মূল্যায়ন একটি ঘোষিত লক্ষ্য।</p><p>প্রতিষ্ঠাতা ব্যক্তিগত চাকরি খুঁজছেন না। যা প্রস্তাব করা হচ্ছে তা আপনাদের প্রতিষ্ঠান ও ইনস্টিটিউটের মধ্যে প্রযুক্তি লাইসেন্স ও যৌথ গবেষণা চুক্তি, যার ফলে প্রতিষ্ঠাতা স্থাপত্য, গবেষণার দিক ও দীর্ঘমেয়াদি লক্ষ্যে মনোনিবেশ করতে পারেন।</p>",
"s8.org":"<thead><tr><th>ভূমিকা</th><th>দায়িত্ব</th></tr></thead><tbody><tr><td>প্রতিষ্ঠাতা ও এআই সিস্টেম স্থপতি</td><td>Morgan J. — স্থাপত্য, গবেষণার দিক, দীর্ঘমেয়াদি পরিকল্পনা</td></tr><tr><td>সফটওয়্যার উন্নয়ন দল</td><td>পূর্ব ইউরোপে অবস্থানরত তিনজন ডেভেলপার — উন্নয়ন, বাস্তবায়ন ও কোডিং</td></tr></tbody>",
"s8.note":"<b>বর্তমান লক্ষ্য —</b> ছোট একটি কৌশলগত দল নিয়ে কোরিয়া প্রজাতন্ত্রে নিম্নস্তরের কৃত্রিম বুদ্ধিমত্তার একটি স্বাধীন গবেষণা ইনস্টিটিউট প্রতিষ্ঠা করা এবং তার প্রতিষ্ঠা ও দীর্ঘমেয়াদি টেকসই পরিচালনায় সহায়তা করতে সক্ষম প্রাতিষ্ঠানিক সহযোগী খুঁজে বের করা।",

"s9.eyebrow":"সহযোগিতা",
"s9.h":"এই মুহূর্তে তিন ধরনের সহযোগিতা খোঁজা হচ্ছে।",
"s9.items":"<div><span class='n'>01</span><h3>গবেষণা সহযোগিতা</h3><p>অফলাইন কৃত্রিম বুদ্ধিমত্তা, প্রান্তিক গণনা এবং গোপনীয়তা রক্ষাকারী ব্যবস্থার পরিকল্পনা নিয়ে বিশ্ববিদ্যালয়ের গবেষণাদল ও গবেষণা প্রতিষ্ঠানের সঙ্গে দূরবর্তী সহযোগিতা, যার মধ্যে যৌথ প্রকাশনাও রয়েছে।</p></div><div><span class='n'>02</span><h3>লাইসেন্স ও যৌথ উন্নয়ন</h3><p>প্রতিষ্ঠান পর্যায়ের চুক্তি, যার মাধ্যমে আপনাদের প্রতিষ্ঠান নিজেদের কর্মসূচিতে এই স্থাপত্য ব্যবহার করতে পারবে, সঙ্গে ইনস্টিটিউটের কৌশলগত সহায়তা।</p></div><div><span class='n'>03</span><h3>আর্থিক সহায়তা</h3><p>কোরিয়া প্রজাতন্ত্রে একটি স্বাধীন অফলাইন এআই গবেষণাগার প্রতিষ্ঠা ও তার টেকসই পরিচালনায় সহায়তা।</p></div>",

"s10.eyebrow":"যোগাযোগ",
"s10.h":"পত্রালাপ, নিরীক্ষা প্রতিবেদন ও জিজ্ঞাসা।",
"s10.lead":"নিরপেক্ষতা ও মনোযোগ রক্ষার জন্য এই প্রকল্প সম্পূর্ণ দূরবর্তীভাবে পরিচালিত হয়। সমস্ত জিজ্ঞাসা, সহযোগিতার প্রস্তাব ও নিরীক্ষা সম্পর্কিত পত্রালাপের জন্য ইমেইলই উপযুক্ত মাধ্যম। উত্তর কোরিয়া প্রজাতন্ত্রের মান সময় (KST) অনুসারে পাঠানো হয়।",

"s10.note":"কোরিয়া প্রজাতন্ত্রে অবস্থিত · দূরবর্তীভাবে পরিচালিত · Morgan J., অফলাইন এআই স্থপতি ও সিস্টেম পরিকল্পক",

"foot":"<span class='license-badge'>Apache License 2.0</span><p>© 2026 M Corp AI · VitalGuard</p><p>ESG · জাতিসংঘের টেকসই উন্নয়ন লক্ষ্যমাত্রা</p><a href='mailto:contact@mcorpai.org'>contact@mcorpai.org</a><p>এই পৃষ্ঠা বাইরের কোনো উপাদান আনে না এবং আপনার যন্ত্রে কিছুই সংরক্ষণ করে না। ভাষা কেবল পৃষ্ঠা লোড হওয়ার সময় একবার শনাক্ত করা হয় এবং তা নথিবদ্ধ করা হয় না।</p>"

"hero.title":"IA offline per i contesti che l'infrastruttura in cloud <span class='accent'>non raggiunge</span>.",
"hero.sub":"L'IA contemporanea presuppone centri dati, alimentazione elettrica stabile, connettività continua e un'organizzazione in grado di assumersi la responsabilità in materia di protezione dei dati. Per una parte considerevole della popolazione mondiale almeno una di queste condizioni non è soddisfatta. VitalGuard è stato progettato a partire da questa premessa: un sistema in un unico file, senza dipendenze, che funziona nel browser di uno smartphone di dieci anni, non richiede alcun server e non raccoglie dati personali.",

"s1.eyebrow":"Contesto",
"s1.pull":"Sul campo il vincolo è raramente la qualità del modello.",
"s1.body":"<p class='lead'>La capacità di calcolo di frontiera è alla portata di un numero ristretto di istituzioni e di Stati. Negli insediamenti per rifugiati, nelle aziende agricole fuori rete, nelle zone colpite da calamità, nei cantieri sotterranei, negli impianti isolati dalla rete e nelle regioni soggette a interruzioni della connettività i vincoli sono di altra natura: alimentazione elettrica, banda disponibile, costo unitario e l'esposizione giuridica connessa alla raccolta di dati personali.</p><p>Questo progetto segue la direzione opposta a quella prevalente. Anziché aggiungere parametri, sottrae infrastruttura; anziché raccogliere dati per migliorare, non ne raccoglie alcuno. Ciò che resta è abbastanza ridotto da poter essere letto riga per riga, abbastanza economico da poter essere distribuito gratuitamente e abbastanza solido da continuare a funzionare quando connettività, budget in cloud e finanziamenti sono esauriti.</p><p>Le medesime proprietà rilevano ben oltre l'ambito umanitario. I sistemi destinati ad ambienti estremi, compresa l'esplorazione planetaria, sono soggetti a requisiti comparabili di sopravvivenza e autosufficienza.</p>",

"s2.eyebrow":"Vincoli progettuali",
"s2.h":"Ciascuna delle proprietà seguenti costituisce una decisione architetturale e non un'opzione di configurazione.",
"s2.list":"<li>Non richiede alcuna infrastruttura di server</li><li>Nessuna libreria esterna; file unico autonomo</li><li>Nessun costo di acquisto o noleggio di processori grafici</li><li>Costo marginale quasi nullo per ogni ulteriore installazione</li><li>Architettura priva di traffico in uscita</li><li>Nessun contenuto caricato da reti di terzi</li><li>Progettato per la conformità al GDPR (protezione dei dati sin dalla progettazione)</li><li>Consumo energetico molto contenuto</li><li>Funziona su dispositivi dismessi, prolungandone la vita utile</li><li>Opera su chip di costo unitario minimo e con semplice alimentazione solare</li><li>Allineato ai quadri ESG e agli Obiettivi di sviluppo sostenibile delle Nazioni Unite</li><li>Risorse concentrate sulla ricerca anziché sull'hardware</li>",
"s2.note":"<b>METODO —</b> Anziché un ampio modello di apprendimento profondo, il sistema combina automi a stati finiti, alberi di comportamento e apprendimento per rinforzo leggero. Il controllo di stato basato su regole assicura un comportamento stabile in tempo reale con costi computazionali contenuti e — aspetto altrettanto rilevante nei contesti critici per la sicurezza — produce decisioni tracciabili e spiegabili a posteriori.",

"<article class='card rv' data-tags='defence esg'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M3 20h18'/><path d='M6 20V10l6-6 6 6v10'/><circle cx='12' cy='13' r='2'/></svg><span class='tag'>Siti remoti</span><h3>Siti industriali remoti e operazioni ai margini della rete</h3><ul><li>Miniere sotterranee e lavori in galleria</li><li>Cantieri e altri ambienti di lavoro pericolosi</li><li>Tracciamento locale dei beni e monitoraggio della sicurezza dei lavoratori senza infrastruttura di rete</li></ul><p class='why'>Dove la connettività termina, il dispositivo deve continuare a ragionare da sé.</p></article>"+
"<article class='card rv' data-tags='agri'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M12 21c0-6 3-9 8-9-1 6-4 9-8 9z'/><path d='M12 21c0-6-3-9-8-9 1 6 4 9 8 9z'/><path d='M12 21v-7'/></svg><span class='tag'>Copertura limitata</span><h3>Agricoltura e zootecnia su aree vaste e poco coperte</h3><ul><li>Monitoraggio dell'umidità del suolo e delle condizioni del bestiame negli Stati Uniti, in Canada e in Australia</li><li>Indicazione precoce del rischio sanitario all'interno delle mandrie</li><li>Segnalazioni locali per scoraggiare il furto di bestiame di valore</li></ul><p class='why'>Dove l'infrastruttura di comunicazione è limitata, un monitoraggio continuo a basso consumo può migliorare la produttività.</p></article>"+
"<article class='card rv' data-tags='consumer esg'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><rect x='7' y='6' width='10' height='12' rx='2'/><path d='M9 6V3h6v3M9 18v3h6v-3'/><path d='M10 12h4'/></svg><span class='tag'>Chip di costo minimo</span><h3>Hardware a costo molto contenuto e alimentato a energia solare</h3><ul><li>Orologi digitali a energia solare con semplici funzioni salvavita</li><li>Funzionamento continuo su chip di costo minimo</li><li>Incidenza trascurabile sul costo unitario di produzione</li></ul><p class='why'>Qui l'efficienza non è un vincolo accettato per necessità: è la premessa stessa del progetto.</p></article>"+
"<article class='card rv' data-tags='rights disaster defence'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><circle cx='12' cy='12' r='2.2'/><path d='M8 8a5.5 5.5 0 0 0 0 8M16 8a5.5 5.5 0 0 1 0 8M5 5a10 10 0 0 0 0 14M19 5a10 10 0 0 1 0 14'/></svg><span class='tag'>BLE e ultrasuoni</span><h3>Comunicazione locale senza alcuna rete</h3><ul><li>Maglia Bluetooth tra dispositivi vicini</li><li>Trasmissione acustica e a ultrasuoni dove la radio non è disponibile o non è opportuna</li><li>Apprendimento automatico e scansione BLE in JavaScript puro su dispositivi Android di dieci anni</li></ul><p class='why'>L'obiettivo progettuale di autonomia sul campo è di 60-70 giorni con consumo minimo, con sei mesi come traguardo di più lungo periodo.</p></article>",

"s4.eyebrow":"Architettura",
"s4.h":"Proprietà di sicurezza che derivano dalla struttura e non da disposizioni interne.",
"s4.body":"<p>L'obiettivo è un'architettura in un unico file e senza dipendenze, nella quale ogni modulo è scritto a partire dai principi primi per garantire completezza e autonomia. Nulla viene caricato in fase di esecuzione, poiché tutto ciò che viene caricato in fase di esecuzione può essere sottratto da un avversario, da un guasto o dalla cessazione di un servizio.</p><p><strong>Egress Kill Switch:</strong> la comunicazione di rete in uscita può essere disattivata immediatamente, isolando il dispositivo così che l'esfiltrazione risulti strutturalmente impossibile anziché amministrativamente vietata. Per le organizzazioni che devono dimostrare, e non soltanto affermare, che i dati non escono, tale distinzione è essenziale.</p>",
"s4.spec":"<tr><th>Ambiente di esecuzione</th><td>JavaScript puro, nel browser, file unico</td></tr><tr><th>Librerie esterne</th><td><span class='ok'>Nessuna</span> — senza dipendenze e senza CDN</td></tr><tr><th>Requisito di server</th><td><span class='ok'>Nessuno</span> — senza server e senza traffico in uscita</td></tr><tr><th>Dati personali raccolti</th><td><span class='ok'>Nessuno</span> — né telemetria né metadati</td></tr><tr><th>Metodo principale</th><td>Automi a stati, alberi di comportamento e apprendimento per rinforzo leggero (basati su regole, ispezionabili)</td></tr><tr><th>Trasmissione locale</th><td>Maglia BLE; ultrasuoni e acustica</td></tr><tr><th>Hardware minimo</th><td>Dispositivo Android di dieci anni; chip di costo minimo; semplice alimentazione solare</td></tr><tr><th>Autonomia sul campo</th><td>Obiettivo progettuale 60-70 giorni; sei mesi nel più lungo periodo</td></tr><tr><th>Posizionamento normativo</th><td>Protezione dei dati sin dalla progettazione ai sensi del GDPR; allineamento a ESG e Obiettivi di sviluppo sostenibile</td></tr><tr><th>Licenza</th><td><span class='ok'>Apache License 2.0</span></td></tr><tr><th>Rimozione</th><td>Eliminabile dall'utente in qualsiasi momento, senza dati residui</td></tr>",

"s5.eyebrow":"Etica progettuale",
"s5.pull":"Le prestazioni tecniche, da sole, non determinano se un sistema possa essere adottato.",
"s5.body":"<p class='lead'>Nei contesti umanitari e della società civile l'adozione è di norma decisa dalla responsabilità giuridica e dal rischio, e non dalla capacità tecnica. Per quanto un sistema sia performante, una probabilità residua di controversia rilevante in materia di protezione dei dati è spesso sufficiente a indurre un'organizzazione non governativa o internazionale a rinunciarvi.</p><p>Ogni scelta progettuale deriva da tale vincolo: ridurre le allucinazioni negli ambiti sensibili, mantenere una trasparenza sufficiente per un audit indipendente, funzionare in contesti a risorse limitate, non raccogliere nulla, non trasferire responsabilità giuridica all'organizzazione che adotta il sistema e rimanere abbastanza semplice perché anche personale non programmatore possa leggerlo, adattarlo ed eliminarlo.</p><p>L'allineamento alle norme internazionali — GDPR, Convenzione sui diritti dell'infanzia e Convenzione sui diritti delle persone con disabilità — è trattato come requisito progettuale dall'origine e non come uno strato di conformità aggiunto in seguito.</p>",
"s5.scenes":"<div class='scene'><b>Ridurre le allucinazioni</b><p>Un esito errato nella tutela dei minori, nell'assistenza sanitaria o nella risposta alle calamità produce conseguenze immediate.</p></div><div class='scene'><b>Rimanere ispezionabile</b><p>Codice e architettura aperti, poiché un sistema opaco non è difendibile quando fallisce.</p></div><div class='scene'><b>Non trasferire responsabilità</b><p>Senza raccolta, senza server e senza trasferimenti trasfrontalieri nessuna responsabilità passa all'organizzazione che adotta il sistema.</p></div><div class='scene'><b>Rimanere eliminabile</b><p>Gli utenti possono rimuovere il sistema e i suoi dati in qualsiasi momento. La facilità di eliminazione è libertà dall'obbligo.</p></div>",

"s6.eyebrow":"Stato di revisione e audit",
"s6.h":"Ogni voce è indicata con la fase in cui si trova.",
"s6.lead":"Ogni voce è accompagnata dalla propria fase affinché possa essere letta con precisione, e tutte sono verificabili in modo indipendente attraverso le fonti indicate.",
"s6.grid":"<div><b>Revisione di prima fase</b><p>Governo del Lussemburgo · UCL · IDS (Regno Unito)</p><span class='pill done'>Conclusa</span></div><div><b>Audit di sicurezza</b><p>OTF Security Lab (Stati Uniti) — USAGM / Open Technology Fund (2026)</p><span class='pill done'>Concluso</span></div><div><b>Contributo di ricerca</b><p><a href='https://mcorpai.org/VitalGuard_Offline_AI.pdf' target='_blank' rel='noopener' style='color:var(--signal);text-decoration:none;'>Offline AI (VitalGuard) — PDF ↗</a></p><span class='pill done'>Pubblicato</span></div><div><b>Diffusione scientifica</b><p>Proposta ad ACM FAccT in preparazione; disponibilità a una futura collaborazione di ricerca con l'Università di Oxford</p><span class='pill'>Previsto</span></div><div><b>Posizionamento normativo</b><p>Protezione dei dati sin dalla progettazione ai sensi del GDPR; quadri ESG; Obiettivi di sviluppo sostenibile delle Nazioni Unite</p><span class='pill'>Per progetto</span></div><div><b>Licenza</b><p>Apache License 2.0 — disponibile gratuitamente per usi di interesse pubblico</p><span class='pill done'>Confermata</span></div>",
"s6.note":"<b>STATO E LIMITI —</b> Le dimostrazioni pubblicate sono implementazioni minime funzionanti e non prodotti finiti; una validazione sul campo su larga scala non è ancora stata condotta. Le affermazioni relative alla conformità descrivono un'intenzione architetturale e proprietà verificabili — in particolare l'assenza di raccolta di dati personali e l'assenza di qualsiasi connessione in uscita necessaria — e non una certificazione rilasciata da terzi. La presente sezione è redatta affinché chi effettua la valutazione possa verificare ogni affermazione in modo indipendente, anziché accettarla sulla fiducia.",

"s7.eyebrow":"Dimostrazioni",
"s7.h":"Aprire il file in un browser costituisce l'intera installazione.",
"s7.lead":"Implementazioni minime funzionanti con apprendimento automatico elementare eseguito sul dispositivo. Capacità: una immagine. Senza account né registrazione, e nessun dato lascia il dispositivo.",
"s7.demos":"<a class='demo' href='https://mcorpai.com/' target='_blank' rel='noopener'><span class='size'>600 KB · Dimostrazione 01</span><h3>Rete a maglia Bluetooth</h3><p>Maglia tra dispositivi con apprendimento automatico leggero e scansione BLE, eseguita interamente nel browser.</p><span class='go'>mcorpai.com ↗</span></a><a class='demo' href='https://mcorpai.net/' target='_blank' rel='noopener'><span class='size'>460 KB · Dimostrazione 02</span><h3>Bluetooth e ultrasuoni</h3><p>Trasmissione locale acustica e a ultrasuoni per ambienti in cui la radio non è disponibile o non è opportuna.</p><span class='go'>mcorpai.net ↗</span></a><a class='demo' href='https://mcorpai.org/' target='_blank' rel='noopener'><span class='size'>Spazio del progetto</span><h3>Documenti, contatti e stato dei lavori</h3><p>Documentazione aggiornata e indirizzo di corrispondenza del programma.</p><span class='go'>mcorpai.org ↗</span></a>",
"s7.note":"Nessuna raccolta di dati. Nessuna rilevazione statistica. Nessuna richiesta a terzi — nemmeno in questa pagina, che non carica alcun carattere tipografico, script o foglio di stile esterno.",

"s8.eyebrow":"L'istituto",
"s8.h":"Una proposta da istituzione a istituzione, e non una candidatura individuale.",
"s8.body":"<p>L'Istituto di ricerca M Corp AI è previsto nella Repubblica di Corea, in collaborazione con partner internazionali. Progetti selezionati saranno resi disponibili gratuitamente con Licenza Apache 2.0 per usi di interesse pubblico. Una parte dei proventi dell'istituto è destinata al sostegno del cinema d'autore indipendente e di bambini affetti da malattie rare, con una valutazione ESG elevata come obiettivo dichiarato.</p><p>Il fondatore non cerca un impiego individuale. Ciò che si propone è un accordo di licenza tecnologica e ricerca congiunta tra la vostra organizzazione e l'istituto, che consenta al fondatore di continuare a rispondere dell'architettura, dell'indirizzo scientifico e della missione di lungo periodo.</p>",
"s8.org":"<thead><tr><th>Ruolo</th><th>Responsabilità</th></tr></thead><tbody><tr><td>Fondatore e architetto di sistemi di IA</td><td>Morgan J. — architettura, indirizzo scientifico, visione di lungo periodo</td></tr><tr><td>Gruppo di ingegneria del software</td><td>Tre sviluppatori con sede nell'Europa orientale — sviluppo, realizzazione e programmazione</td></tr></tbody>",
"s8.note":"<b>OBIETTIVO ATTUALE —</b> Istituire nella Repubblica di Corea un istituto di ricerca indipendente dedicato all'IA di basso livello con un piccolo gruppo di ingegneria, e individuare partner istituzionali in grado di sostenerne la costituzione e il funzionamento duraturo.",

"s9.eyebrow":"Partenariato",
"s9.h":"Sono attualmente ricercate tre forme di collaborazione.",
"s9.items":"<div><span class='n'>01</span><h3>Partenariato di ricerca</h3><p>Collaborazione a distanza con gruppi accademici e istituti di ricerca su IA offline, edge computing e progettazione di sistemi che tutelano la riservatezza, comprese pubblicazioni congiunte.</p></div><div><span class='n'>02</span><h3>Licenza e ricerca congiunta</h3><p>Accordi tra istituzioni che consentano alla vostra organizzazione di applicare questa architettura nei propri programmi, con il supporto tecnico dell'istituto.</p></div><div><span class='n'>03</span><h3>Finanziamento</h3><p>Sostegno alla costituzione e al funzionamento duraturo di un laboratorio di ricerca indipendente sull'IA offline nella Repubblica di Corea.</p></div>",

"s10.eyebrow":"Contatti",
"s10.h":"Corrispondenza, relazioni di audit e richieste di informazioni.",
"s10.lead":"Il progetto è gestito esclusivamente da remoto, al fine di preservare neutralità e concentrazione. La posta elettronica è il canale appropriato per qualsiasi richiesta, proposta di collaborazione o corrispondenza relativa ad audit. Le risposte sono inviate dalla Repubblica di Corea (KST).",
"s10.links":"<a class='btn' href='https://mcorpai.org/' target='_blank' rel='noopener'>mcorpai.org ↗</a><a class='btn' href='https://mcorpai.org/VitalGuard_Offline_AI.pdf' target='_blank' rel='noopener'>Contributo di ricerca ↗</a>",
"s10.note":"Con sede nella Repubblica di Corea · Gestito da remoto · Morgan J., architetto di IA offline e progettista di sistemi",
