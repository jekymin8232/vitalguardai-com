"hero.flag":"Offline-AI · Utan beroenden · Apache License 2.0",
"hero.title":"Offline-AI för sammanhang som molninfrastrukturen <span class='accent'>inte når</span>.",
"hero.sub":"Dagens AI förutsätter datacenter, stabil elförsörjning, oavbruten uppkoppling och en organisation som kan bära ansvaret för dataskydd. För en betydande del av världens befolkning är minst ett av dessa villkor inte uppfyllt. VitalGuard är utformat utifrån just den situationen: ett system i en enda fil, utan beroenden, som körs i webbläsaren på en tio år gammal mobiltelefon, inte kräver någon server och inte samlar in några personuppgifter.",
"hero.cta":"<a class='btn solid' href='#applications'>Tillämpningsområden <span class='arw'>→</span></a><a class='btn' href='https://mcorpai.org/VitalGuard_Offline_AI.pdf' target='_blank' rel='noopener'>Forskningsartikel (PDF)</a><a class='btn' href='#status'>Gransknings- och revisionsstatus</a><a class='btn' href='https://github.com/jekymin8232/vitalguardai-com' target='_blank' rel='noopener'>Relaterad forskning på GitHub</a>",
"hero.note":"Drivs på distans från Republiken Korea · Morgan J., arkitekt för offline-AI och systemdesigner · All korrespondens via e-post",
"hero.zero":"<div><b>0</b><span>Servrar som krävs</span></div><div><b>0</b><span>Externa beroenden</span></div><div><b>0</b><span>Personuppgifter</span></div><div><b>0</b><span>Förfrågningar till tredje part</span></div>",

"s1.eyebrow":"Sammanhang",
"s1.pull":"Ute i fält är begränsningen sällan modellens kvalitet.",
"s1.body":"<p class='lead'>Beräkningskapacitet i forskningsfronten är tillgänglig för ett begränsat antal institutioner och stater. I flyktingbosättningar, jordbruk utanför elnätet, katastrofområden, arbetsplatser under jord, nätverksisolerade anläggningar och regioner med avstängd uppkoppling är begränsningarna av ett annat slag: elförsörjning, bandbredd, kostnad per enhet och den rättsliga exponering som följer av att samla in personuppgifter.</p><p>Projektet går i motsatt riktning mot den rådande utvecklingen. I stället för att lägga till parametrar tas infrastruktur bort; i stället för att samla in data för att förbättra samlas ingenting in. Vad som återstår är litet nog att läsas rad för rad, billigt nog att spridas utan kostnad och robust nog att fortsätta fungera efter att uppkoppling, molnbudget och finansiering har tagit slut.</p><p>Samma egenskaper är relevanta långt utanför det humanitära området. System avsedda för extrema miljöer, inbegripet planetär utforskning, omfattas av jämförbara krav på överlevnadsförmåga och självförsörjning.</p>",

"s2.eyebrow":"Designbegränsningar",
"s2.h":"Var och en av egenskaperna nedan är ett arkitekturbeslut och inte en inställning.",
"s2.list":"<li>Kräver ingen serverinfrastruktur</li><li>Inga externa bibliotek; självständig enskild fil</li><li>Inga kostnader för inköp eller hyra av grafikprocessorer</li><li>Närmast obefintlig marginalkostnad för varje ytterligare installation</li><li>Arkitektur utan utgående trafik</li><li>Inget innehåll hämtas från tredje parts nätverk</li><li>Utformat för efterlevnad av GDPR (inbyggt dataskydd)</li><li>Mycket låg energiförbrukning</li><li>Fungerar på utfasade enheter och förlänger deras livslängd</li><li>Fungerar på kretsar i endollarsklassen och med enkel solförsörjning</li><li>I linje med ESG-ramverk och FN:s globala mål för hållbar utveckling</li><li>Medlen inriktas på forskning i stället för på hårdvara</li>",
"s2.note":"<b>METOD —</b> I stället för en omfattande djupinlärningsmodell kombinerar systemet ändliga tillståndsmaskiner, beteendeträd och lättviktig förstärkningsinlärning. Regelbaserad tillståndsstyrning ger ett stabilt realtidsbeteende till låg beräkningskostnad och — vilket är lika viktigt i säkerhetskritiska sammanhang — beslut som i efterhand går att spåra och förklara.",

"s3.eyebrow":"Tillämpningar",
"s3.h":"Åtta driftmiljöer där molnberoende AI inte går att införa.",
"s3.lead":"Områdena nedan bygger på samma implementering och kan filtreras utifrån den miljö som ligger närmast er verksamhet. Vart och ett anges som tillämpningsområde och inte som genomfört införande; validering i fält beskrivs i avsnittet om granskningsstatus.",

"s3.status":"Visar {n} av {t} tillämpningsområden",
"s3.cards":
"<article class='card rv' data-tags='disaster'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M4 18h16'/><path d='M7 18V9l5-5 5 5v9'/><path d='M12 13v5'/></svg><span class='tag'>Oberoende av infrastruktur</span><h3>Katastrofinsatser och nödoperationer utanför elnätet</h3><ul><li>Meshkommunikation mellan enheter utan internet och utan mobilnät</li><li>Stöd för triage och övervakning av vitalparametrar offline</li><li>Stöd vid eftersök och räddning under el- och nätavbrott</li></ul><p class='why'>De första timmarna av en katastrof är just de timmar då nätet inte är tillgängligt.</p></article>"+

"<article class='card rv' data-tags='esg'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M4 12a8 8 0 0 1 8-8h5'/><path d='M20 12a8 8 0 0 1-8 8H7'/><path d='M14 1.5L17.5 4 14 6.5M10 17.5L6.5 20 10 22.5'/></svg><span class='tag'>Cirkulär ekonomi</span><h3>Uppgradering av elavfall och miljöövervakning</h3><ul><li>Utfasade mobiltelefoner som humanitära noder och mätnoder</li><li>Billig övervakning av miljö och arbetsmiljö</li><li>Akustisk och vibrationsbaserad upptäckt av gräshoppssvärmar i regioner utanför elnätet</li></ul><p class='why'>Att förlänga enheternas livslängd är ett mätbart ESG-resultat och inte ett påstående.</p></article>"+
"<article class='card rv' data-tags='defence esg'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M3 20h18'/><path d='M6 20V10l6-6 6 6v10'/><circle cx='12' cy='13' r='2'/></svg><span class='tag'>Avlägsna platser</span><h3>Avlägsna industriplatser och drift i nätets ytterkant</h3><ul><li>Underjordsgruvor och tunnelarbeten</li><li>Byggarbetsplatser och andra riskfyllda arbetsmiljöer</li><li>Lokal spårning av utrustning och övervakning av arbetstagares säkerhet utan nätinfrastruktur</li></ul><p class='why'>Där uppkopplingen upphör måste enheten fortsätta att resonera på egen hand.</p></article>"+
"<article class='card rv' data-tags='agri'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M12 21c0-6 3-9 8-9-1 6-4 9-8 9z'/><path d='M12 21c0-6-3-9-8-9 1 6 4 9 8 9z'/><path d='M12 21v-7'/></svg><span class='tag'>Begränsad täckning</span><h3>Jordbruk och djurhållning över vidsträckta områden med svag täckning</h3><ul><li>Övervakning av markfukt och djurens tillstånd i Förenta staterna, Kanada och Australien</li><li>Tidiga indikationer på sjukdomsrisk i besättningen</li><li>Lokala varningar som motverkar stöld av värdefulla djur</li></ul><p class='why'>Där kommunikationsinfrastrukturen är begränsad kan kontinuerlig övervakning med låg förbrukning förbättra produktiviteten.</p></article>"+
"<article class='card rv' data-tags='consumer esg'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><rect x='7' y='6' width='10' height='12' rx='2'/><path d='M9 6V3h6v3M9 18v3h6v-3'/><path d='M10 12h4'/></svg><span class='tag'>Kretsar i endollarsklassen</span><h3>Mycket billig och soldriven hårdvara</h3><ul><li>Soldrivna digitala armbandsur med enkla livräddande funktioner</li><li>Kontinuerlig drift på kretsar med ytterst låg kostnad</li><li>Försumbar inverkan på tillverkningskostnaden per enhet</li></ul><p class='why'>Effektivitet är här ingen motvilligt accepterad begränsning, utan själva utgångspunkten för utformningen.</p></article>"+
"<article class='card rv' data-tags='rights disaster defence'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><circle cx='12' cy='12' r='2.2'/><path d='M8 8a5.5 5.5 0 0 0 0 8M16 8a5.5 5.5 0 0 1 0 8M5 5a10 10 0 0 0 0 14M19 5a10 10 0 0 1 0 14'/></svg><span class='tag'>BLE och ultraljud</span><h3>Lokal kommunikation utan något nät alls</h3><ul><li>Bluetooth-mesh mellan närliggande enheter</li><li>Akustisk och ultraljudsbaserad överföring där radio inte är tillgänglig eller lämplig</li><li>Maskininlärning och BLE-avsökning i ren JavaScript på tio år gamla Android-enheter</li></ul><p class='why'>Designmålet för drifttid i fält är 60 till 70 dagar vid minimal förbrukning, med sex månader som mål på längre sikt.</p></article>",

"s4.eyebrow":"Arkitektur",
"s4.h":"Säkerhetsegenskaper som följer av strukturen och inte av interna regler.",
"s4.body":"<p>Målet är en arkitektur i en enda fil och utan beroenden, där varje modul är skriven från grunden med fullständighet och självständighet för ögonen. Ingenting hämtas vid körning, eftersom allt som hämtas vid körning kan tas bort av en motpart, av ett avbrott eller av en nedlagd tjänst.</p><p><strong>Egress Kill Switch:</strong> utgående nätkommunikation kan stängas av omedelbart och enheten därmed isoleras, så att dataläckage blir strukturellt omöjligt i stället för administrativt förbjudet. För organisationer som måste visa, och inte endast hävda, att uppgifter inte lämnar enheten är denna skillnad avgörande.</p>",
"s4.spec":"<tr><th>Körmiljö</th><td>Ren JavaScript, i webbläsaren, en enda fil</td></tr><tr><th>Externa bibliotek</th><td><span class='ok'>Inga</span> — utan beroenden och utan CDN</td></tr><tr><th>Serverkrav</th><td><span class='ok'>Inga</span> — utan server och utan utgående trafik</td></tr><tr><th>Insamlade personuppgifter</th><td><span class='ok'>Inga</span> — varken telemetri eller metadata</td></tr><tr><th>Huvudmetod</th><td>Tillståndsmaskiner, beteendeträd och lättviktig förstärkningsinlärning (regelbaserade och granskningsbara)</td></tr><tr><th>Lokal överföring</th><td>BLE-mesh; ultraljud och akustik</td></tr><tr><th>Minsta hårdvara</th><td>Tio år gammal Android-enhet; kretsar i endollarsklassen; enkel solförsörjning</td></tr><tr><th>Drifttid i fält</th><td>Designmål 60 till 70 dagar; sex månader på längre sikt</td></tr><tr><th>Regelefterlevnad</th><td>Inbyggt dataskydd enligt GDPR; anpassning till ESG och de globala målen</td></tr><tr><th>Licens</th><td><span class='ok'>Apache License 2.0</span></td></tr><tr><th>Borttagning</th><td>Kan tas bort av användaren när som helst, utan kvarlämnade uppgifter</td></tr>",

"s5.eyebrow":"Designetik",
"s5.pull":"Teknisk prestanda avgör inte i sig om ett system kan införas.",
"s5.body":"<p class='lead'>I humanitära sammanhang och inom civilsamhället avgörs införandet i regel av rättsligt ansvar och risk, inte av teknisk förmåga. Hur väl ett system än presterar räcker ofta en kvarstående sannolikhet för en betydande dataskyddstvist för att en icke-statlig eller internationell organisation ska avstå från att införa det.</p><p>Varje designbeslut följer av den begränsningen: minska hallucinationer inom känsliga områden, förbli tillräckligt transparent för en oberoende granskning, fungera i resurssvaga miljöer, inte samla in någonting, inte överföra rättsligt ansvar till den införande organisationen och förbli så enkelt att även den som inte programmerar kan läsa, anpassa och ta bort det.</p><p>Anpassningen till internationella normer — GDPR, barnkonventionen och konventionen om rättigheter för personer med funktionsnedsättning — behandlas som ett designvillkor från början och inte som ett efterhandslager för regelefterlevnad.</p>",
"s5.scenes":"<div class='scene'><b>Minska hallucinationer</b><p>Felaktiga utdata inom barnskydd, hälso- och sjukvård eller katastrofinsatser får omedelbara följder.</p></div><div class='scene'><b>Förbli granskningsbart</b><p>Öppen kod och öppen arkitektur, eftersom ett ogenomskinligt system inte kan försvaras när det brister.</p></div><div class='scene'><b>Inte överföra ansvar</b><p>Utan insamling, utan server och utan överföring över gränser övergår inget ansvar till den införande organisationen.</p></div><div class='scene'><b>Förbli borttagbart</b><p>Användare kan ta bort systemet och dess uppgifter när som helst. Enkelheten i borttagningen är frihet från förpliktelse.</p></div>",

"s6.eyebrow":"Gransknings- och revisionsstatus",
"s6.h":"Varje punkt anges tillsammans med sitt nuvarande skede.",
"s6.lead":"Varje punkt anges med sitt skede så att den kan läsas korrekt, och samtliga kan kontrolleras oberoende via de angivna källorna.",
"s6.grid":"<div><b>Granskning i första steget</b><p>Luxemburgs regering · UCL · IDS (Storbritannien)</p><span class='pill done'>Avslutad</span></div><div><b>Säkerhetsgranskning</b><p>OTF Security Lab (USA) — USAGM / Open Technology Fund (2026)</p><span class='pill done'>Avslutad</span></div><div><b>Forskningsartikel</b><p><a href='https://mcorpai.org/VitalGuard_Offline_AI.pdf' target='_blank' rel='noopener' style='color:var(--signal);text-decoration:none;'>Offline AI (VitalGuard) — PDF ↗</a></p><span class='pill done'>Publicerad</span></div><div><b>Vetenskaplig spridning</b><p>Bidrag till ACM FAccT under förberedelse; öppet för framtida forskningssamarbete med University of Oxford</p><span class='pill'>Planerat</span></div><div><b>Normativ position</b><p>Inbyggt dataskydd enligt GDPR; ESG-ramverk; FN:s globala mål för hållbar utveckling</p><span class='pill'>Genom designen</span></div><div><b>Licens</b><p>Apache License 2.0 — kostnadsfritt tillgänglig för allmännyttig användning</p><span class='pill done'>Bekräftad</span></div>",
"s6.note":"<b>STATUS OCH BEGRÄNSNINGAR —</b> De publicerade demonstrationerna är fungerande minimala implementeringar och inte färdiga produkter; validering i fält i stor skala har ännu inte genomförts. Uttalanden om regelefterlevnad beskriver en avsikt i utformningen och kontrollerbara egenskaper — främst att inga personuppgifter samlas in och att ingen utgående anslutning krävs — och inte en certifiering utfärdad av tredje part. Detta avsnitt är skrivet så att den som granskar kan kontrollera varje uttalande självständigt i stället för att godta det på förtroende.",

"s7.eyebrow":"Demonstrationer",
"s7.h":"Att öppna filen i en webbläsare utgör hela installationen.",
"s7.lead":"Fungerande minimala implementeringar med enkel maskininlärning på enheten. Kapacitet: en bild. Utan konto och utan registrering, och inga uppgifter lämnar enheten.",
"s7.demos":"<a class='demo' href='https://mcorpai.com/' target='_blank' rel='noopener'><span class='size'>600 KB · Demonstration 01</span><h3>Bluetooth-meshnätverk</h3><p>Mesh mellan enheter med lättviktig maskininlärning och BLE-avsökning, helt utförd i webbläsaren.</p><span class='go'>mcorpai.com ↗</span></a><a class='demo' href='https://mcorpai.net/' target='_blank' rel='noopener'><span class='size'>460 KB · Demonstration 02</span><h3>Bluetooth och ultraljud</h3><p>Akustisk och ultraljudsbaserad lokal överföring för miljöer där radio inte är tillgänglig eller lämplig.</p><span class='go'>mcorpai.net ↗</span></a><a class='demo' href='https://mcorpai.org/' target='_blank' rel='noopener'><span class='size'>Projektets sida</span><h3>Dokument, kontakt och läget</h3><p>Aktuell dokumentation och korrespondensadress för programmet.</p><span class='go'>mcorpai.org ↗</span></a>",
"s7.note":"Ingen insamling av uppgifter. Ingen besöksmätning. Inga förfrågningar till tredje part — inte heller på denna sida, som inte hämtar något externt typsnitt, skript eller stilmall.",

"s8.eyebrow":"Institutet",
"s8.h":"Ett förslag från institution till institution, och inte en enskild jobbansökan.",
"s8.body":"<p>M Corp AI:s forskningsinstitut planeras i Republiken Korea och ska arbeta med internationella partner. Utvalda projekt kommer att tillhandahållas kostnadsfritt under Apache License 2.0 för allmännyttig användning. En del av institutets intäkter är avsedd att stödja oberoende konstnärlig film och barn med sällsynta sjukdomar, där en hög ESG-bedömning är ett uttalat mål.</p><p>Grundaren söker ingen enskild anställning. Vad som föreslås är ett avtal om teknologilicensiering och gemensam forskning mellan er organisation och institutet, vilket gör det möjligt för grundaren att fortsatt ansvara för arkitektur, forskningsinriktning och det långsiktiga uppdraget.</p>",
"s8.org":"<thead><tr><th>Roll</th><th>Ansvar</th></tr></thead><tbody><tr><td>Grundare och systemarkitekt för AI</td><td>Morgan J. — arkitektur, forskningsinriktning, långsiktig inriktning</td></tr><tr><td>Grupp för mjukvaruutveckling</td><td>Tre utvecklare i Östeuropa — utveckling, genomförande och programmering</td></tr></tbody>",
"s8.note":"<b>NUVARANDE MÅL —</b> Att i Republiken Korea inrätta ett oberoende forskningsinstitut för AI på låg nivå med en liten utvecklingsgrupp, och att finna institutionella partner som kan stödja dess inrättande och långsiktigt hållbara drift.",

"s9.eyebrow":"Samarbete",
"s9.h":"Tre former av samarbete söks för närvarande.",
"s9.items":"<div><span class='n'>01</span><h3>Forskningssamarbete</h3><p>Samarbete på distans med akademiska grupper och forskningsinstitut om offline-AI, edge computing och systemdesign som värnar den personliga integriteten, inbegripet gemensamma publikationer.</p></div><div><span class='n'>02</span><h3>Licensiering och gemensam utveckling</h3><p>Avtal mellan institutioner som gör det möjligt för er organisation att tillämpa arkitekturen i egna program, med tekniskt stöd från institutet.</p></div><div><span class='n'>03</span><h3>Finansiering</h3><p>Stöd till inrättandet och den långsiktigt hållbara driften av ett oberoende forskningslaboratorium för offline-AI i Republiken Korea.</p></div>",

"s10.eyebrow":"Kontakt",
"s10.h":"Korrespondens, granskningsrapporter och förfrågningar.",
"s10.lead":"Projektet drivs uteslutande på distans för att bevara neutralitet och fokus. E-post är den lämpliga kanalen för alla förfrågningar, samarbetsförslag och korrespondens som rör granskningar. Svar sänds från Republiken Korea (KST).",
"s10.links":"<a class='btn' href='https://mcorpai.org/' target='_blank' rel='noopener'>mcorpai.org ↗</a><a class='btn' href='https://mcorpai.org/VitalGuard_Offline_AI.pdf' target='_blank' rel='noopener'>Forskningsartikel ↗</a>",
"s10.note":"Med säte i Republiken Korea · Drivs på distans · Morgan J., arkitekt för offline-AI och systemdesigner",

"foot":"<span class='license-badge'>Apache License 2.0</span><p>© 2026 M Corp AI · VitalGuard</p><p>ESG · FN:s globala mål för hållbar utveckling</p><a href='mailto:contact@mcorpai.org'>contact@mcorpai.org</a><p>Denna sida hämtar inga externa resurser och sparar ingenting på din enhet. Språket fastställs en gång vid inläsningen och registreras inte.</p>"

"hero.sub":"AI masa kini mengandaikan pusat data, listrik yang andal, konektivitas berkelanjutan, dan organisasi yang sanggup memikul tanggung jawab hukum atas perlindungan data. Bagi sebagian besar penduduk dunia, satu atau lebih andaian itu tidak berlaku. VitalGuard adalah sistem berkas tunggal tanpa ketergantungan yang dirancang untuk keadaan tersebut: berjalan di peramban pada telepon berusia sepuluh tahun, tidak memerlukan server, dan tidak mengumpulkan data pribadi.",

"hero.zero":"<div><b>0</b><span>Server yang dibutuhkan</span></div><div><b>0</b><span>Ketergantungan eksternal</span></div><div><b>0</b><span>Data pribadi</span></div><div><b>0</b><span>Permintaan pihak ketiga</span></div>",
"s1.eyebrow":"Konteks",
"s1.pull":"Kendala di lapangan jarang sekali berupa mutu model.",
"s1.body":"<p class='lead'>Komputasi berskala terdepan hanya terjangkau oleh sejumlah kecil lembaga dan negara. Di permukiman pengungsi, ladang di luar jaringan listrik, wilayah bencana, area kerja bawah tanah, fasilitas terisolasi jaringan, serta kawasan yang mengalami pemutusan internet, kendala yang mengikat justru berbeda: listrik, lebar pita, biaya satuan, dan paparan hukum yang menyertai pengumpulan data pribadi.</p><p>Proyek ini mengambil arah yang berlawanan dengan kecenderungan yang berlaku. Alih-alih menambah parameter, ia menghapus infrastruktur. Alih-alih mengumpulkan data demi peningkatan, ia tidak mengumpulkan apa pun. Yang tersisa cukup kecil untuk dibaca baris demi baris, cukup murah untuk disebarkan tanpa biaya, dan cukup tahan untuk terus bekerja setelah konektivitas, kredit awan, dan pendanaan proyek berakhir.</p><p>Sifat yang sama juga relevan jauh melampaui konteks kemanusiaan. Sistem yang ditujukan bagi lingkungan ekstrem — termasuk penjelajahan antariksa — tunduk pada persyaratan daya tahan dan kemandirian yang sebanding.</p>",
"s2.eyebrow":"Kendala perancangan",
"s2.h":"Setiap sifat di bawah ini merupakan keputusan arsitektural, bukan pilihan konfigurasi.",
"s2.list":"<li>Tidak memerlukan infrastruktur server</li><li>Tanpa pustaka eksternal; berkas tunggal yang mandiri</li><li>Tanpa biaya pembelian atau sewa GPU</li><li>Biaya marjinal mendekati nol untuk setiap penerapan tambahan</li><li>Arsitektur tanpa lalu lintas keluar</li><li>Tidak ada muatan dari jaringan pihak ketiga (nol CDN)</li><li>Dirancang untuk kepatuhan GDPR (Privacy-by-Design)</li><li>Konsumsi daya sangat rendah</li><li>Berjalan pada perangkat purna pakai sehingga memperpanjang usia perangkat keras</li><li>Bekerja pada cip kelas 1 dolar dan pasokan surya sederhana</li><li>Selaras dengan kerangka ESG dan Tujuan Pembangunan Berkelanjutan PBB</li><li>Anggaran terpusat pada peneliti, bukan pada perangkat keras</li>",
"s2.note":"<b>METODE —</b> Alih-alih model pembelajaran mendalam berukuran besar, sistem ini memakai gabungan mesin keadaan terbatas, pohon perilaku, dan pembelajaran penguatan ringan. Kendali keadaan berbasis aturan memberi perilaku waktu nyata yang stabil dengan beban komputasi rendah dan — yang sama pentingnya dalam konteks keselamatan — menghasilkan keputusan yang dapat ditelusuri serta dijelaskan setelah kejadian.",
"s3.eyebrow":"Penerapan",
"s3.h":"Delapan lingkungan operasi tempat AI berbasis awan tidak dapat diterapkan.",
"s3.lead":"Kategori di bawah ini berbagi satu implementasi yang sama. Saringlah menurut konteks yang paling dekat dengan program Anda. Masing-masing dinyatakan sebagai bidang penerapan, bukan sebagai penerapan yang telah rampung; validasi lapangan dibahas pada bagian tinjauan.",
"s3.filters":"<button class='chip' data-filter='all' aria-pressed='true'>Semua</button><button class='chip' data-filter='rights' aria-pressed='false'>Hak asasi manusia</button><button class='chip' data-filter='disaster' aria-pressed='false'>Tanggap bencana</button><button class='chip' data-filter='defence' aria-pressed='false'>Infrastruktur kritis</button><button class='chip' data-filter='esg' aria-pressed='false'>ESG &amp; limbah elektronik</button><button class='chip' data-filter='agri' aria-pressed='false'>Pertanian</button><button class='chip' data-filter='consumer' aria-pressed='false'>Perangkat keras berbiaya rendah</button>",
"s3.status":"Menampilkan {n} dari {t} bidang penerapan",
"s3.cards":"<article class='card rv' data-tags='disaster'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M4 18h16'/><path d='M7 18V9l5-5 5 5v9'/><path d='M12 13v5'/></svg><span class='tag'>Tidak bergantung pada infrastruktur</span><h3>Tanggap bencana dan operasi darurat di luar jaringan</h3><ul><li>Komunikasi mesh antarperangkat tanpa internet maupun layanan seluler</li><li>Dukungan triase luring dan pemantauan tanda vital</li><li>Dukungan pencarian dan penyelamatan saat listrik dan jaringan padam</li></ul><p class='why'>Jam-jam pertama sebuah bencana justru saat jaringan tidak tersedia.</p></article><article class='card rv' data-tags='defence'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><rect x='3' y='4' width='18' height='14' rx='1.5'/><path d='M8 21h8M12 18v3M7 9h4M7 13h7'/></svg><span class='tag'>Terisolasi jaringan</span><h3>Fasilitas terisolasi jaringan dan kritis bagi keselamatan</h3><ul><li>Infrastruktur kritis yang melarang lalu lintas keluar berdasarkan kebijakan</li><li>Lingkungan fabrikasi semikonduktor dan manufaktur maju</li><li>Perangkat medis dan kesehatan yang menjaga privasi</li></ul><p class='why'>Egress Kill Switch: komunikasi keluar dapat dimatikan seketika sehingga penyedotan data menjadi mustahil secara struktural, bukan sekadar dilarang.</p></article><article class='card rv' data-tags='esg'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M4 12a8 8 0 0 1 8-8h5'/><path d='M20 12a8 8 0 0 1-8 8H7'/><path d='M14 1.5L17.5 4 14 6.5M10 17.5L6.5 20 10 22.5'/></svg><span class='tag'>Ekonomi sirkular</span><h3>Pemanfaatan ulang limbah elektronik dan pemantauan lingkungan</h3><ul><li>Telepon pintar purna pakai dialihfungsikan menjadi simpul kemanusiaan dan pemantauan</li><li>Pemantauan lingkungan dan keselamatan kerja berbiaya rendah</li><li>Deteksi akustik dan getaran atas kawanan belalang di wilayah tanpa jaringan</li></ul><p class='why'>Memperpanjang usia perangkat adalah hasil ESG yang terukur, bukan sekadar klaim.</p></article><article class='card rv' data-tags='defence esg'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M3 20h18'/><path d='M6 20V10l6-6 6 6v10'/><circle cx='12' cy='13' r='2'/></svg><span class='tag'>Operasi terpencil</span><h3>Lokasi industri terpencil dan operasi di tepi jaringan</h3><ul><li>Tambang bawah tanah dan pekerjaan terowongan</li><li>Konstruksi dan area kerja berbahaya lainnya</li><li>Pelacakan aset setempat dan pemantauan keselamatan pekerja tanpa infrastruktur jaringan</li></ul><p class='why'>Di tempat konektivitas berakhir, perangkat harus tetap mampu bernalar sendiri.</p></article><article class='card rv' data-tags='agri'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M12 21c0-6 3-9 8-9-1 6-4 9-8 9z'/><path d='M12 21c0-6-3-9-8-9 1 6 4 9 8 9z'/><path d='M12 21v-7'/></svg><span class='tag'>Cakupan rendah</span><h3>Pertanian dan peternakan di wilayah luas dengan cakupan jaringan rendah</h3><ul><li>Pemantauan kelembapan tanah dan kondisi ternak di Amerika Serikat, Kanada dan Australia</li><li>Indikasi awal risiko penyakit dalam kawanan ternak</li><li>Peringatan setempat untuk mencegah pencurian ternak bernilai tinggi</li></ul><p class='why'>Pemantauan berdaya rendah secara terus-menerus dapat meningkatkan produktivitas di tempat infrastruktur komunikasi terbatas.</p></article><article class='card rv' data-tags='consumer esg'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><rect x='7' y='6' width='10' height='12' rx='2'/><path d='M9 6V3h6v3M9 18v3h6v-3'/><path d='M10 12h4'/></svg><span class='tag'>Silikon kelas 1 dolar</span><h3>Perangkat keras berbiaya sangat rendah dan bertenaga surya</h3><ul><li>Jam digital bertenaga surya yang membawa fungsi keselamatan sederhana</li><li>Operasi tanpa henti pada cip semikonduktor berbiaya sangat rendah</li><li>Pengaruh yang dapat diabaikan terhadap biaya produksi per unit</li></ul><p class='why'>Efisiensi di sini bukan keterbatasan yang diterima dengan enggan; ia adalah premis perancangan.</p></article><article class='card rv' data-tags='rights disaster defence'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><circle cx='12' cy='12' r='2.2'/><path d='M8 8a5.5 5.5 0 0 0 0 8M16 8a5.5 5.5 0 0 1 0 8M5 5a10 10 0 0 0 0 14M19 5a10 10 0 0 1 0 14'/></svg><span class='tag'>BLE &amp; ultrasonik</span><h3>Komunikasi setempat tanpa jaringan apa pun</h3><ul><li>Mesh Bluetooth antarperangkat yang berdekatan</li><li>Pengangkutan ultrasonik dan akustik di tempat radio tidak tersedia atau tidak disarankan</li><li>Pembelajaran mesin murni JavaScript dan pemindaian BLE pada perangkat Android berusia sepuluh tahun</li></ul><p class='why'>Sasaran rancangan untuk daya tahan lapangan adalah 60–70 hari dengan daya minimal, dengan enam bulan sebagai tujuan jangka panjang.</p></article>",
"s4.eyebrow":"Arsitektur",
"s4.h":"Sifat keamanan yang lahir dari struktur, bukan dari kebijakan.",
"s4.body":"<p>Sasarannya adalah arsitektur berkas tunggal tanpa ketergantungan, yang setiap modulnya ditulis dari prinsip dasar demi kelengkapan dan kemandirian. Tidak ada yang diimpor saat berjalan, sebab apa pun yang diimpor saat berjalan adalah sesuatu yang dapat dihilangkan oleh pihak lawan, oleh gangguan layanan, atau oleh layanan yang dihentikan.</p><p><strong>Egress Kill Switch:</strong> komunikasi jaringan keluar dapat dimatikan seketika sehingga perangkat terisolasi dan penyedotan data menjadi mustahil secara struktural, bukan sekadar dilarang secara administratif. Perbedaan ini penting bagi organisasi yang harus membuktikan, bukan sekadar menyatakan, bahwa data tidak dapat keluar.</p>",
"s4.spec":"<tr><th>Lingkungan jalan</th><td>JavaScript murni, di dalam peramban, berkas tunggal</td></tr><tr><th>Pustaka eksternal</th><td><span class='ok'>Tidak ada</span> — tanpa ketergantungan, tanpa CDN</td></tr><tr><th>Kebutuhan server</th><td><span class='ok'>Tidak ada</span> — tanpa server, tanpa lalu lintas keluar</td></tr><tr><th>Data pribadi yang dikumpulkan</th><td><span class='ok'>Tidak ada</span> — tanpa telemetri, tanpa metadata</td></tr><tr><th>Metode inti</th><td>FSM + pohon perilaku + RL ringan (berbasis aturan, dapat diperiksa)</td></tr><tr><th>Pengangkutan setempat</th><td>Mesh BLE; ultrasonik dan akustik</td></tr><tr><th>Perangkat keras minimum</th><td>Perangkat Android berusia sepuluh tahun; cip kelas 1 dolar; pasokan surya sederhana</td></tr><tr><th>Daya tahan lapangan</th><td>Sasaran rancangan 60–70 hari; enam bulan sebagai tujuan jangka panjang</td></tr><tr><th>Sikap kepatuhan</th><td>GDPR Privacy-by-Design; keselarasan ESG dan SDG PBB</td></tr><tr><th>Lisensi</th><td><span class='ok'>Apache License 2.0</span></td></tr><tr><th>Penghapusan</th><td>Dapat dihapus pengguna kapan saja tanpa meninggalkan sisa data</td></tr>",
"s5.eyebrow":"Etika perancangan",
"s5.pull":"Kinerja teknis semata tidak menentukan apakah sebuah sistem dapat diadopsi.",
"s5.body":"<p class='lead'>Dalam penerapan kemanusiaan dan masyarakat sipil, keputusan adopsi umumnya ditentukan oleh tanggung jawab hukum dan risiko, bukan oleh kemampuan. Sehebat apa pun sebuah sistem, sisa kemungkinan terjadinya sengketa perlindungan data yang besar sering sudah cukup untuk menghalangi sebuah LSM atau organisasi internasional menerimanya.</p><p>Setiap keputusan perancangan di sini lahir dari kendala tersebut: mengurangi halusinasi pada ranah sensitif, tetap cukup transparan untuk diaudit secara independen, bekerja di lingkungan bersumber daya rendah, tidak mengumpulkan apa pun, tidak mengalihkan tanggung jawab hukum kepada organisasi pengadopsi, dan tetap cukup sederhana untuk dibaca, disesuaikan serta dihapus oleh mereka yang bukan pemrogram.</p><p>Keselarasan dengan norma internasional — GDPR, UNCRC dan CRPD — diperlakukan sebagai masukan perancangan sejak awal, bukan lapisan kepatuhan yang ditambahkan belakangan.</p>",
"s5.scenes":"<div class='scene'><b>Mengurangi halusinasi</b><p>Keluaran yang salah dalam perlindungan anak, layanan kesehatan atau tanggap bencana berakibat langsung.</p></div><div class='scene'><b>Tetap dapat diperiksa</b><p>Kode terbuka dan arsitektur terbuka, sebab sistem yang tertutup tidak dapat dipertanggungjawabkan ketika gagal.</p></div><div class='scene'><b>Tidak mengalihkan tanggung jawab</b><p>Tanpa pengumpulan, tanpa server dan tanpa perpindahan lintas batas berarti tidak ada tanggung jawab yang beralih kepada organisasi pengadopsi.</p></div><div class='scene'><b>Tetap dapat dihapus</b><p>Pengguna dapat menghapus sistem beserta datanya kapan saja. Kemudahan penghapusan adalah kebebasan dari kewajiban.</p></div>",
"s6.eyebrow":"Status tinjauan dan audit",
"s6.h":"Setiap butir dinyatakan bersama tahapannya saat ini.",
"s6.lead":"Setiap butir di bawah ini diberi label tahapan agar dapat dibaca secara tepat, dan masing-masing dapat diperiksa secara independen melalui sumber yang disebutkan.",
"s6.grid":"<div><b>Tinjauan tahap pertama</b><p>Pemerintah Luksemburg · UCL · IDS (Britania Raya)</p><span class='pill done'>Selesai</span></div><div><b>Audit keamanan</b><p>U.S. OTF Security Lab — USAGM / Open Technology Fund (2026)</p><span class='pill done'>Selesai</span></div><div><b>Makalah penelitian</b><p><a href='https://mcorpai.org/VitalGuard_Offline_AI.pdf' target='_blank' rel='noopener' style='color:var(--signal);text-decoration:none;'>Offline AI (VitalGuard) — PDF ↗</a></p><span class='pill done'>Terbit</span></div><div><b>Diseminasi akademik</b><p>Pengiriman ke ACM FAccT sedang disiapkan; terbuka bagi kerja sama penelitian dengan University of Oxford di masa depan</p><span class='pill'>Direncanakan</span></div><div><b>Sikap terhadap standar</b><p>GDPR Privacy-by-Design; kerangka ESG; Tujuan Pembangunan Berkelanjutan PBB</p><span class='pill'>Melekat pada rancangan</span></div><div><b>Lisensi</b><p>Apache License 2.0 — tersedia tanpa biaya untuk penggunaan bagi kepentingan publik</p><span class='pill done'>Dipastikan</span></div>",
"s6.note":"<b>STATUS DAN KETERBATASAN —</b> Demonstrasi yang diterbitkan merupakan produk minimum yang dapat dijalankan, bukan produk jadi, dan validasi lapangan berskala besar belum dilakukan. Pernyataan mengenai kepatuhan menggambarkan maksud arsitektural dan sifat yang dapat diperiksa — terutama bahwa tidak ada data pribadi yang dikumpulkan dan tidak diperlukan sambungan keluar — bukan sertifikasi yang diterbitkan pihak ketiga. Bagian ini ditulis agar penelaah dapat memeriksa setiap pernyataan secara mandiri, bukan menerimanya atas dasar kepercayaan.",
"s7.eyebrow":"Demonstrasi",
"s7.h":"Membuka berkas di peramban sudah merupakan keseluruhan proses pemasangan.",
"s7.lead":"Produk minimum yang dapat dijalankan, termasuk pembelajaran mesin dasar pada perangkat. Kapasitas: satu citra. Tanpa akun, tanpa pendaftaran, dan tidak ada data yang meninggalkan perangkat.",
"s7.demos":"<a class='demo' href='https://mcorpai.com/' target='_blank' rel='noopener'><span class='size'>600 KB · Demonstrasi 01</span><h3>Jaringan mesh Bluetooth</h3><p>Mesh antarperangkat dengan pembelajaran mesin ringan pada perangkat dan pemindaian BLE, seluruhnya berjalan di peramban.</p><span class='go'>mcorpai.com ↗</span></a><a class='demo' href='https://mcorpai.net/' target='_blank' rel='noopener'><span class='size'>460 KB · Demonstrasi 02</span><h3>Bluetooth dan ultrasonik</h3><p>Pengangkutan setempat secara akustik dan ultrasonik untuk lingkungan yang tidak memungkinkan atau tidak menyarankan penggunaan radio.</p><span class='go'>mcorpai.net ↗</span></a><a class='demo' href='https://mcorpai.org/' target='_blank' rel='noopener'><span class='size'>Ruang kerja proyek</span><h3>Makalah, kontak dan status</h3><p>Dokumentasi terkini dan alamat korespondensi program ini.</p><span class='go'>mcorpai.org ↗</span></a>",
"s7.note":"Tanpa pengumpulan data. Tanpa analitik. Tanpa permintaan pihak ketiga — termasuk pada halaman ini, yang tidak memuat fon, skrip maupun lembar gaya eksternal.",
"s8.eyebrow":"Institut",
"s8.h":"Sebuah usulan antarlembaga, bukan permohonan pekerjaan perseorangan.",
"s8.body":"<p>M Corp AI Research Institute direncanakan berkedudukan di Republik Korea dan bekerja bersama mitra di berbagai negara. Proyek terpilih ditujukan untuk dirilis tanpa biaya di bawah Apache License 2.0 bagi kepentingan publik. Sebagian pendapatan institut ditujukan untuk mendukung film seni independen dan anak-anak yang terdampak penyakit langka, dengan peringkat ESG yang tinggi sebagai sasaran yang dinyatakan secara eksplisit.</p><p>Pendirinya tidak sedang mencari pekerjaan perseorangan. Yang diusulkan adalah perjanjian lisensi teknologi dan penelitian bersama antara organisasi Anda dan institut, sehingga pendiri tetap bertanggung jawab atas arsitektur, arah penelitian dan misi jangka panjang.</p>",
"s8.org":"<thead><tr><th>Peran</th><th>Tanggung jawab</th></tr></thead><tbody><tr><td>Pendiri &amp; Arsitek Sistem AI</td><td>Morgan J. — arsitektur, arah penelitian, visi jangka panjang</td></tr><tr><td>Tim rekayasa perangkat lunak</td><td>Tiga pengembang yang berbasis di Eropa Timur — pengembangan, implementasi dan penulisan kode</td></tr></tbody>",
"s8.note":"<b>SASARAN SAAT INI —</b> Mendirikan lembaga penelitian AI tingkat rendah yang independen di Republik Korea bersama tim rekayasa kecil, serta menemukan mitra kelembagaan yang mampu mendukung pendirian dan keberlanjutan operasinya dalam jangka panjang.",
"s9.eyebrow":"Kemitraan",
"s9.h":"Tiga bentuk kerja sama sedang dicari saat ini.",
"s9.items":"<div><span class='n'>01</span><h3>Kemitraan penelitian</h3><p>Kerja sama jarak jauh dengan kelompok akademik dan lembaga penelitian mengenai AI luring, komputasi tepi dan perancangan sistem yang menjaga privasi, termasuk publikasi bersama.</p></div><div><span class='n'>02</span><h3>Lisensi dan penelitian bersama</h3><p>Perjanjian antarlembaga yang memungkinkan sebuah organisasi menerapkan arsitektur ini dalam programnya sendiri, dengan dukungan teknis dari institut.</p></div><div><span class='n'>03</span><h3>Pendanaan</h3><p>Dukungan bagi pendirian dan keberlanjutan operasi laboratorium penelitian AI luring yang independen di Republik Korea.</p></div>",
"s10.eyebrow":"Kontak",
"s10.h":"Korespondensi, laporan audit dan pertanyaan.",
"s10.lead":"Proyek ini dikelola sepenuhnya dari jarak jauh demi menjaga netralitas dan fokus. Surel adalah saluran yang tepat untuk semua pertanyaan, usulan kerja sama dan korespondensi audit. Balasan ditulis dari Republik Korea (KST).",
"s10.links":"<a class='btn' href='https://mcorpai.org/' target='_blank' rel='noopener'>mcorpai.org ↗</a><a class='btn' href='https://mcorpai.org/VitalGuard_Offline_AI.pdf' target='_blank' rel='noopener'>Makalah penelitian ↗</a>",
"s10.note":"Berkedudukan di Republik Korea · Dikelola dari jarak jauh · Morgan J., Arsitek AI Luring &amp; Perancang Sistem",

"s1.body":"<p class='lead'>ထိပ်တန်း တွက်ချက်မှုစွမ်းအားကို အဖွဲ့အစည်းနှင့် နိုင်ငံ အနည်းငယ်သာ တတ်နိုင်ပါသည်။ ဒုက္ခသည် စခန်းများ၊ လျှပ်စစ်လိုင်း မရောက်သော လယ်ယာများ၊ သဘာဝဘေး ဒေသများ၊ မြေအောက် လုပ်ငန်းခွင်များ၊ ကွန်ရက်နှင့် လုံးဝ ခွဲထားသော အဆောက်အအုံများနှင့် အင်တာနက် ဖြတ်တောက်ခံရသော ဒေသများတွင် အဓိက အဟန့်အတားများမှာ မတူညီပါ။ ၎င်းတို့မှာ လျှပ်စစ်၊ လိုင်းအကျယ်၊ တစ်ခုချင်းစီ၏ ကုန်ကျစရိတ်နှင့် ကိုယ်ရေးကိုယ်တာ ဒေတာ စုဆောင်းခြင်းနှင့်အတူ လိုက်ပါလာသော ဥပဒေဆိုင်ရာ အန္တရာယ်တို့ ဖြစ်ပါသည်။</p><p>ဤစီမံကိန်းသည် လက်ရှိ ဦးတည်ချက်နှင့် ဆန့်ကျင်ဘက် လမ်းကြောင်းကို ရွေးထားပါသည်။ ပါရာမီတာ ထပ်ဖြည့်မည့်အစား အခြေခံအဆောက်အအုံကို ဖယ်ရှားပါသည်။ တိုးတက်စေရန် ဒေတာ စုဆောင်းမည့်အစား လုံးဝ မစုဆောင်းပါ။ ကျန်ရစ်သည်မှာ စာကြောင်းလိုက် ဖတ်နိုင်လောက်အောင် သေးငယ်ပြီး၊ အခမဲ့ ဖြန့်ဝေနိုင်လောက်အောင် ကုန်ကျစရိတ် နည်းကာ၊ ချိတ်ဆက်မှု၊ ကလောက် ခရက်ဒစ်နှင့် စီမံကိန်း ရန်ပုံငွေ ကုန်ဆုံးသွားပြီးနောက်တွင်ပင် ဆက်လက် အလုပ်လုပ်နိုင်လောက်အောင် ခံနိုင်ရည်ရှိပါသည်။</p><p>ဤဂုဏ်သတ္တိများသည် လူသားချင်း စာနာမှုဆိုင်ရာ နယ်ပယ်ကို ကျော်လွန်၍လည်း အရေးပါပါသည်။ အလွန်အမင်း ပတ်ဝန်းကျင်များအတွက် ရည်ရွယ်သော စနစ်များ — ဂြိုဟ်များသို့ စူးစမ်းရှာဖွေရေး အပါအဝင် — သည် ရှင်သန်နိုင်စွမ်းနှင့် ကိုယ်ပိုင် ရပ်တည်နိုင်စွမ်းအတွက် အလားတူ လိုအပ်ချက်များနှင့် ရင်ဆိုင်နေရပါသည်။</p>",
"s2.eyebrow":"ဒီဇိုင်း ကန့်သတ်ချက်များ",
"s2.h":"အောက်ပါ ဂုဏ်သတ္တိတိုင်းသည် ချိန်ညှိမှု ရွေးချယ်စရာ မဟုတ်ဘဲ တည်ဆောက်ပုံဆိုင်ရာ ဆုံးဖြတ်ချက် ဖြစ်ပါသည်။",
"s2.list":"<li>ဆာဗာ အခြေခံအဆောက်အအုံ လုံးဝ မလိုအပ်</li><li>ပြင်ပ လိုက်ဘရီ မရှိ၊ ကိုယ်တိုင် ပြည့်စုံသော ဖိုင်တစ်ဖိုင်တည်း</li><li>GPU ဝယ်ယူခ သို့မဟုတ် ငှားရမ်းခ မရှိ</li><li>ထပ်တိုး ဖြန့်ကျက်မှုတစ်ခုစီအတွက် ကုန်ကျစရိတ် သုညနီးပါး</li><li>အပြင်သို့ ထွက်သွားသည့် ဒေတာ လုံးဝမရှိသော တည်ဆောက်ပုံ</li><li>တတိယအဖွဲ့ ကွန်ရက်များမှ အကြောင်းအရာ တင်သွင်းမှု မရှိ (CDN သုည)</li><li>GDPR လိုက်နာမှုအတွက် ရေးဆွဲထား (Privacy-by-Design)</li><li>လျှပ်စစ်သုံးစွဲမှု အလွန်နည်း</li><li>အသုံးမပြုတော့သော စက်ပစ္စည်းများပေါ်တွင် အလုပ်လုပ်ပြီး ဟာ့ဒ်ဝဲ သက်တမ်းကို တိုးစေ</li><li>တစ်ဒေါ်လာတန်း ချစ်ပ်များနှင့် ရိုးရှင်းသော နေရောင်ခြည် လျှပ်စစ်ဖြင့် အလုပ်လုပ်</li><li>ESG မူဘောင်များနှင့် ကုလသမဂ္ဂ ရေရှည်တည်တံ့ရေး ပန်းတိုင်များနှင့် ကိုက်ညီ</li><li>ဘတ်ဂျက်ကို ဟာ့ဒ်ဝဲအစား သုတေသီများအပေါ် အာရုံစိုက်</li>",
"s2.note":"<b>နည်းလမ်း —</b> ကြီးမားသော နက်ရှိုင်းလေ့လာမှု မော်ဒယ်အစား၊ ဤစနစ်သည် အခြေအနေစက်များ၊ အပြုအမူ သစ်ပင်များနှင့် ပေါ့ပါးသော အားဖြည့်လေ့လာမှုတို့ကို ပေါင်းစပ် အသုံးပြုပါသည်။ စည်းမျဉ်းအခြေခံ အခြေအနေ ထိန်းချုပ်မှုသည် တွက်ချက်မှု ကုန်ကျစရိတ် နည်းစွာဖြင့် တည်ငြိမ်သော အချိန်နှင့်တပြေးညီ အပြုအမူကို ပေးစွမ်းပြီး — ဘေးကင်းရေးနှင့် ဆက်စပ်သော နေရာများတွင် အလားတူ အရေးကြီးသည်မှာ — ဖြစ်ပွားပြီးနောက် ပြန်လည် ခြေရာခံ၍ ရှင်းလင်းနိုင်သော ဆုံးဖြတ်ချက်များကို ထုတ်ပေးပါသည်။",
"s3.eyebrow":"အသုံးချမှုများ",
"s3.h":"ကလောက်အပေါ် မှီခိုသော AI ကို ချထားနိုင်ခြင်း မရှိသည့် လုပ်ငန်းခွင် ရှစ်မျိုး။",
"s3.lead":"အောက်ပါ အမျိုးအစားများသည် တူညီသော ပရိုဂရမ် တစ်ခုတည်းကို မျှဝေအသုံးပြုပါသည်။ သင့်အစီအစဉ်နှင့် အနီးစပ်ဆုံး နေရာအလိုက် စစ်ထုတ်ကြည့်ပါ။ တစ်ခုချင်းစီကို ပြီးစီးသော ချထားမှုအဖြစ် မဟုတ်ဘဲ အသုံးချနိုင်သည့် နယ်ပယ်အဖြစ် ဖော်ပြထားပါသည်။ ကွင်းဆင်း အတည်ပြုမှုကို အခြေအနေ ကဏ္ဍတွင် ဆွေးနွေးထားပါသည်။",
"s3.filters":"<button class='chip' data-filter='all' aria-pressed='true'>အားလုံး</button><button class='chip' data-filter='rights' aria-pressed='false'>လူ့အခွင့်အရေး</button><button class='chip' data-filter='disaster' aria-pressed='false'>သဘာဝဘေး တုံ့ပြန်ရေး</button><button class='chip' data-filter='defence' aria-pressed='false'>အရေးပါသော အခြေခံအဆောက်အအုံ</button><button class='chip' data-filter='esg' aria-pressed='false'>ESG &amp; အီလက်ထရွန်နစ် စွန့်ပစ်ပစ္စည်း</button><button class='chip' data-filter='agri' aria-pressed='false'>စိုက်ပျိုးရေး</button><button class='chip' data-filter='consumer' aria-pressed='false'>ကုန်ကျစရိတ်နည်း ဟာ့ဒ်ဝဲ</button>",
"s3.status":"အသုံးချမှု နယ်ပယ် {t} ခုအနက် {n} ခုကို ပြသနေသည်",
"s3.cards":"<article class='card rv' data-tags='disaster'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M4 18h16'/><path d='M7 18V9l5-5 5 5v9'/><path d='M12 13v5'/></svg><span class='tag'>အခြေခံအဆောက်အအုံအပေါ် မမှီခို</span><h3>သဘာဝဘေး တုံ့ပြန်ရေးနှင့် လျှပ်စစ်လိုင်းပြင်ပ အရေးပေါ် လုပ်ငန်းများ</h3><ul><li>အင်တာနက် သို့မဟုတ် မိုဘိုင်းလိုင်း မလိုဘဲ စက်ချင်းဆက် ကွန်ရက် ဆက်သွယ်မှု</li><li>အော့ဖ်လိုင်း လူနာခွဲခြား ကုသမှုနှင့် သက်သေလက္ခဏာ စောင့်ကြည့်မှု</li><li>လျှပ်စစ်နှင့် ကွန်ရက် ပြတ်တောက်ချိန်တွင် ရှာဖွေ ကယ်ဆယ်ရေး ပံ့ပိုးမှု</li></ul><p class='why'>သဘာဝဘေး၏ ပထမဆုံး နာရီများသည် ကွန်ရက် မရရှိသည့် အချိန်ပင် ဖြစ်ပါသည်။</p></article><article class='card rv' data-tags='defence'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><rect x='3' y='4' width='18' height='14' rx='1.5'/><path d='M8 21h8M12 18v3M7 9h4M7 13h7'/></svg><span class='tag'>ကွန်ရက်နှင့် ခွဲထား</span><h3>ကွန်ရက်နှင့် ခွဲထားပြီး ဘေးကင်းရေး အရေးကြီးသော အဆောက်အအုံများ</h3><ul><li>မူဝါဒအရ အပြင်သို့ ထွက်သည့် ဒေတာကို တားမြစ်ထားသော အရေးပါသည့် အခြေခံအဆောက်အအုံ</li><li>ဆီမီးကွန်ဒတ်တာ ထုတ်လုပ်ရေးနှင့် အဆင့်မြင့် ကုန်ထုတ်လုပ်ငန်း ပတ်ဝန်းကျင်</li><li>ကိုယ်ရေးကိုယ်တာ လျှို့ဝှက်ချက်ကို ထိန်းသိမ်းသော ဆေးဘက်ဆိုင်ရာ စက်ပစ္စည်းများ</li></ul><p class='why'>Egress Kill Switch — အပြင်သို့ ဆက်သွယ်မှုကို ချက်ချင်း ပိတ်နိုင်သဖြင့် ဒေတာ ထုတ်ယူခြင်းသည် တားမြစ်ထားရုံမျှမက တည်ဆောက်ပုံအရ ဖြစ်နိုင်ခြင်း မရှိတော့ပါ။</p></article><article class='card rv' data-tags='esg'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M4 12a8 8 0 0 1 8-8h5'/><path d='M20 12a8 8 0 0 1-8 8H7'/><path d='M14 1.5L17.5 4 14 6.5M10 17.5L6.5 20 10 22.5'/></svg><span class='tag'>စက်ဝိုင်း စီးပွားရေး</span><h3>အီလက်ထရွန်နစ် စွန့်ပစ်ပစ္စည်း ပြန်လည်အသုံးချမှုနှင့် ပတ်ဝန်းကျင် စောင့်ကြည့်မှု</h3><ul><li>အသုံးမပြုတော့သော စမတ်ဖုန်းများကို လူသားချင်းစာနာမှုနှင့် စောင့်ကြည့်ရေး နိုဒ်များအဖြစ် ပြောင်းလဲအသုံးပြု</li><li>ကုန်ကျစရိတ်နည်းသော ပတ်ဝန်းကျင်နှင့် လုပ်ငန်းခွင် ဘေးကင်းရေး စောင့်ကြည့်မှု</li><li>လိုင်းမရောက်သော ဒေသများတွင် ကျိုင်းကောင် အုပ်စုကို အသံနှင့် တုန်ခါမှုဖြင့် ရှာဖွေတွေ့ရှိမှု</li></ul><p class='why'>စက်ပစ္စည်း သက်တမ်း တိုးမြှင့်ခြင်းသည် ကြွေးကြော်သံမဟုတ်ဘဲ တိုင်းတာနိုင်သော ESG ရလဒ် ဖြစ်ပါသည်။</p></article><article class='card rv' data-tags='defence esg'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M3 20h18'/><path d='M6 20V10l6-6 6 6v10'/><circle cx='12' cy='13' r='2'/></svg><span class='tag'>အဝေးလွန် လုပ်ငန်းများ</span><h3>အဝေးလွန် စက်မှုနေရာများနှင့် အစွန်အဖျား လုပ်ငန်းများ</h3><ul><li>မြေအောက် သတ္တုတွင်းများနှင့် ဥမင်လိုဏ်ခေါင်း လုပ်ငန်းများ</li><li>ဆောက်လုပ်ရေးနှင့် အခြား အန္တရာယ်ရှိသော လုပ်ငန်းခွင်များ</li><li>ကွန်ရက် အခြေခံအဆောက်အအုံ မလိုဘဲ ဒေသတွင်း ပစ္စည်း ခြေရာခံမှုနှင့် အလုပ်သမား ဘေးကင်းရေး စောင့်ကြည့်မှု</li></ul><p class='why'>ချိတ်ဆက်မှု ကုန်ဆုံးရာနေရာတွင် စက်ပစ္စည်းသည် မိမိဘာသာ ဆက်လက် ဆုံးဖြတ်နိုင်ရပါမည်။</p></article><article class='card rv' data-tags='agri'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M12 21c0-6 3-9 8-9-1 6-4 9-8 9z'/><path d='M12 21c0-6-3-9-8-9 1 6 4 9 8 9z'/><path d='M12 21v-7'/></svg><span class='tag'>လွှမ်းခြုံမှု နည်း</span><h3>လွှမ်းခြုံမှုနည်းသော ကျယ်ပြန့်သည့် ဒေသများရှိ စိုက်ပျိုးရေးနှင့် မွေးမြူရေး</h3><ul><li>အမေရိကန်၊ ကနေဒါနှင့် ဩစတြေးလျတွင် မြေဆီလွှာ စိုထိုင်းဆနှင့် တိရစ္ဆာန် အခြေအနေ စောင့်ကြည့်မှု</li><li>တိရစ္ဆာန်အုပ်စုအတွင်း ရောဂါ အန္တရာယ်ကို စောစီးစွာ ညွှန်ပြမှု</li><li>တန်ဖိုးမြင့် တိရစ္ဆာန်များ ခိုးယူခံရမှုကို တားဆီးရန် ဒေသတွင်း သတိပေးမှု</li></ul><p class='why'>ဆက်သွယ်ရေး အခြေခံအဆောက်အအုံ အကန့်အသတ်ရှိသောနေရာတွင် လျှပ်စစ်နည်းသော အဆက်မပြတ် စောင့်ကြည့်မှုသည် ထုတ်လုပ်မှုကို တိုးတက်စေနိုင်ပါသည်။</p></article><article class='card rv' data-tags='consumer esg'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><rect x='7' y='6' width='10' height='12' rx='2'/><path d='M9 6V3h6v3M9 18v3h6v-3'/><path d='M10 12h4'/></svg><span class='tag'>တစ်ဒေါ်လာတန်း ဆီလီကွန်</span><h3>ကုန်ကျစရိတ် အလွန်နည်းပြီး နေရောင်ခြည်သုံး ဟာ့ဒ်ဝဲ</h3><ul><li>အသက်ကယ် လုပ်ဆောင်ချက် ရိုးရိုးများ ပါဝင်သော နေရောင်ခြည်သုံး ဒစ်ဂျစ်တယ် နာရီများ</li><li>ကုန်ကျစရိတ် အလွန်နည်းသော ဆီမီးကွန်ဒတ်တာ ချစ်ပ်များပေါ်တွင် အဆက်မပြတ် အလုပ်လုပ်ခြင်း</li><li>တစ်ခုချင်းစီ၏ ထုတ်လုပ်မှု ကုန်ကျစရိတ်အပေါ် သိသာမှု မရှိသလောက် အနည်းငယ်သာ သက်ရောက်</li></ul><p class='why'>ဤနေရာတွင် ချွေတာမှုသည် အလိုမတူဘဲ လက်ခံရသော ကန့်သတ်ချက် မဟုတ်ပါ။ ၎င်းသည် ဒီဇိုင်း၏ အခြေခံ မူပင် ဖြစ်ပါသည်။</p></article><article class='card rv' data-tags='rights disaster defence'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><circle cx='12' cy='12' r='2.2'/><path d='M8 8a5.5 5.5 0 0 0 0 8M16 8a5.5 5.5 0 0 1 0 8M5 5a10 10 0 0 0 0 14M19 5a10 10 0 0 1 0 14'/></svg><span class='tag'>BLE &amp; အာထရာဆောင်း</span><h3>ကွန်ရက် လုံးဝမပါဘဲ ဒေသတွင်း ဆက်သွယ်မှု</h3><ul><li>အနီးအနားရှိ စက်များအကြား ဘလူးတုသ် ကွန်ရက်</li><li>ရေဒီယို မရရှိသော သို့မဟုတ် မသင့်လျော်သောနေရာတွင် အာထရာဆောင်းနှင့် အသံဖြင့် သယ်ဆောင်မှု</li><li>ဆယ်နှစ်သား Android စက်များပေါ်တွင် JavaScript သက်သက်ဖြင့် စက်လေ့လာမှုနှင့် BLE စကင်န်ဖတ်ခြင်း</li></ul><p class='why'>ကွင်းဆင်း ခံနိုင်ရည်အတွက် ဒီဇိုင်း ပန်းတိုင်မှာ လျှပ်စစ် အနည်းဆုံးဖြင့် ရက် 60–70 ဖြစ်ပြီး၊ ရေရှည် ပန်းတိုင်မှာ ခြောက်လ ဖြစ်ပါသည်။</p></article>",

"s4.h":"မူဝါဒမှ မဟုတ်ဘဲ တည်ဆောက်ပုံမှ ပေါက်ဖွားလာသော လုံခြုံရေး ဂုဏ်သတ္တိများ။",
"s4.body":"<p>ရည်မှန်းချက်မှာ ဖိုင်တစ်ဖိုင်တည်းဖြင့် ပြင်ပမှီခိုမှု ကင်းသော တည်ဆောက်ပုံ ဖြစ်ပြီး၊ မော်ဂျူးတိုင်းကို ပြည့်စုံမှုနှင့် ကိုယ်ပိုင်ရပ်တည်နိုင်မှုအတွက် အခြေခံမူများမှ စတင်၍ ရေးသားထားပါသည်။ အလုပ်လုပ်နေစဉ် မည်သည့်အရာမျှ တင်သွင်းခြင်း မရှိပါ။ အကြောင်းမှာ အလုပ်လုပ်နေစဉ် တင်သွင်းသည့် မည်သည့်အရာမဆို ရန်သူတစ်ဦး၊ ဝန်ဆောင်မှု ပြတ်တောက်မှု သို့မဟုတ် ရပ်ဆိုင်းသွားသော ဝန်ဆောင်မှုက ဖယ်ရှားပစ်နိုင်သောကြောင့် ဖြစ်ပါသည်။</p><p><strong>Egress Kill Switch —</strong> အပြင်သို့ ကွန်ရက် ဆက်သွယ်မှုကို ချက်ချင်း ပိတ်ကာ စက်ပစ္စည်းကို သီးခြားခွဲထားနိုင်သဖြင့်၊ ဒေတာ ထုတ်ယူခြင်းသည် စီမံခန့်ခွဲရေးအရ တားမြစ်ထားရုံမျှမက တည်ဆောက်ပုံအရ ဖြစ်နိုင်ခြင်း မရှိတော့ပါ။ ဤကွာခြားချက်သည် ဒေတာ ထွက်မသွားနိုင်ကြောင်း ပြောရုံမျှမက သက်သေပြရမည့် အဖွဲ့အစည်းများအတွက် အရေးပါပါသည်။</p>",
"s4.spec":"<tr><th>အလုပ်လုပ်သည့် ပတ်ဝန်းကျင်</th><td>JavaScript သက်သက်၊ ဘရောက်ဇာအတွင်း၊ ဖိုင်တစ်ဖိုင်တည်း</td></tr><tr><th>ပြင်ပ လိုက်ဘရီများ</th><td><span class='ok'>မရှိ</span> — မှီခိုမှုကင်း၊ CDN မပါ</td></tr><tr><th>ဆာဗာ လိုအပ်ချက်</th><td><span class='ok'>မရှိ</span> — ဆာဗာမဲ့၊ အပြင်ထွက် ဒေတာ သုည</td></tr><tr><th>စုဆောင်းသော ကိုယ်ရေးကိုယ်တာ ဒေတာ</th><td><span class='ok'>မရှိ</span> — တယ်လီမက်ထရီ မရှိ၊ မက်တာဒေတာ မရှိ</td></tr><tr><th>အဓိက နည်းလမ်း</th><td>FSM + အပြုအမူ သစ်ပင် + ပေါ့ပါး RL (စည်းမျဉ်းအခြေခံ၊ စစ်ဆေးနိုင်)</td></tr><tr><th>ဒေသတွင်း သယ်ဆောင်မှု</th><td>BLE ကွန်ရက်၊ အာထရာဆောင်းနှင့် အသံ</td></tr><tr><th>အနည်းဆုံး ဟာ့ဒ်ဝဲ</th><td>ဆယ်နှစ်သား Android စက်၊ တစ်ဒေါ်လာတန်း ချစ်ပ်၊ ရိုးရှင်းသော နေရောင်ခြည် လျှပ်စစ်</td></tr><tr><th>ကွင်းဆင်း ခံနိုင်ရည်</th><td>ဒီဇိုင်း ပန်းတိုင် ရက် 60–70၊ ရေရှည် ပန်းတိုင် ခြောက်လ</td></tr><tr><th>လိုက်နာမှု အနေအထား</th><td>GDPR Privacy-by-Design၊ ESG နှင့် ကုလသမဂ္ဂ SDG နှင့် ကိုက်ညီမှု</td></tr><tr><th>လိုင်စင်</th><td><span class='ok'>Apache License 2.0</span></td></tr><tr><th>ဖယ်ရှားခြင်း</th><td>အသုံးပြုသူက အချိန်မရွေး ဖျက်နိုင်ပြီး ကျန်ရစ်သော ဒေတာ မရှိ</td></tr>",
"s5.eyebrow":"ဒီဇိုင်း ကျင့်ဝတ်",
"s5.pull":"နည်းပညာ စွမ်းဆောင်ရည် တစ်ခုတည်းက စနစ်တစ်ခုကို လက်ခံအသုံးပြုနိုင်မည် မနိုင်မည်ကို မဆုံးဖြတ်ပါ။",
"s5.body":"<p class='lead'>လူသားချင်း စာနာမှုနှင့် အရပ်ဘက် အဖွဲ့အစည်း လုပ်ငန်းများတွင် လက်ခံအသုံးပြုမှုကို စွမ်းဆောင်ရည်ထက် ဥပဒေဆိုင်ရာ တာဝန်နှင့် အန္တရာယ်က ဆုံးဖြတ်လေ့ရှိပါသည်။ စနစ်တစ်ခု မည်မျှ စွမ်းဆောင်ရည်ကောင်းစေကာမူ၊ ဒေတာကာကွယ်ရေးဆိုင်ရာ အငြင်းပွားမှု ကြီးကြီးမားမား ဖြစ်နိုင်ခြေ အနည်းငယ်မျှသည်ပင် NGO တစ်ခု သို့မဟုတ် နိုင်ငံတကာ အဖွဲ့အစည်းတစ်ခုကို လက်ခံခြင်းမှ တားဆီးရန် လုံလောက်လေ့ရှိပါသည်။</p><p>ဤနေရာရှိ ဒီဇိုင်း ဆုံးဖြတ်ချက် တစ်ခုစီသည် ထိုကန့်သတ်ချက်မှ ဆင်းသက်လာပါသည် — အထိအခိုက်မခံသော နယ်ပယ်များတွင် မှားယွင်း ထုတ်လုပ်မှုကို လျှော့ချရန်၊ လွတ်လပ်စွာ စစ်ဆေးနိုင်လောက်အောင် ပွင့်လင်းမြင်သာစွာ ရှိနေရန်၊ အရင်းအမြစ် နည်းပါးသည့် နေရာများတွင် အလုပ်လုပ်ရန်၊ မည်သည့်အရာမျှ မစုဆောင်းရန်၊ လက်ခံအသုံးပြုသည့် အဖွဲ့အစည်းသို့ ဥပဒေဆိုင်ရာ တာဝန် လုံးဝ မလွှဲပြောင်းရန်နှင့်၊ ပရိုဂရမ်မာ မဟုတ်သူများပင် ဖတ်နိုင်၊ ပြင်ဆင်နိုင်၊ ဖျက်နိုင်လောက်အောင် ရိုးရှင်းစွာ ရှိနေရန် ဖြစ်ပါသည်။</p><p>နိုင်ငံတကာ စံနှုန်းများ — GDPR၊ ကလေးသူငယ် အခွင့်အရေး ကွန်ဗင်းရှင်းနှင့် မသန်စွမ်းသူများ အခွင့်အရေး ကွန်ဗင်းရှင်း — နှင့် ကိုက်ညီမှုကို နောက်မှ ထပ်ဖြည့်သော လိုက်နာမှု အလွှာအဖြစ် မဟုတ်ဘဲ အစကတည်းက ဒီဇိုင်း၏ အခြေခံ ထည့်သွင်းချက်အဖြစ် ဆောင်ရွက်ထားပါသည်။</p>",
"s5.scenes":"<div class='scene'><b>မှားယွင်း ထုတ်လုပ်မှု လျှော့ချရန်</b><p>ကလေး ကာကွယ်စောင့်ရှောက်ရေး၊ ကျန်းမာရေး သို့မဟုတ် သဘာဝဘေး တုံ့ပြန်ရေးတွင် မှားယွင်းသော ရလဒ်သည် ချက်ချင်း ဆိုးကျိုး ဖြစ်စေပါသည်။</p></div><div class='scene'><b>စစ်ဆေးနိုင်စွာ ရှိနေရန်</b><p>ပွင့်လင်းသော ကုဒ်နှင့် ပွင့်လင်းသော တည်ဆောက်ပုံ ဖြစ်ရပါမည်။ အကြောင်းမှာ မမြင်ရသော စနစ်တစ်ခု ချို့ယွင်းသောအခါ ခုခံ ရှင်းလင်း၍ မရသောကြောင့် ဖြစ်ပါသည်။</p></div><div class='scene'><b>တာဝန် မလွှဲပြောင်းရန်</b><p>စုဆောင်းမှု မရှိ၊ ဆာဗာ မရှိ၊ နယ်စပ်ဖြတ်ကျော် ပို့ဆောင်မှု မရှိခြင်းသည် လက်ခံအသုံးပြုသည့် အဖွဲ့အစည်းသို့ လွှဲပြောင်းသော တာဝန် မရှိခြင်းကို ဆိုလိုပါသည်။</p></div><div class='scene'><b>ဖျက်နိုင်စွာ ရှိနေရန်</b><p>အသုံးပြုသူများသည် စနစ်နှင့် ၎င်း၏ ဒေတာကို အချိန်မရွေး ဖယ်ရှားနိုင်ပါသည်။ လွယ်ကူစွာ ဖျက်နိုင်ခြင်းသည် တာဝန်မှ လွတ်မြောက်ခြင်း ဖြစ်ပါသည်။</p></div>",
"s6.eyebrow":"သုံးသပ်ချက်နှင့် စစ်ဆေးမှု အခြေအနေ",
"s6.h":"အချက်တစ်ခုစီကို ၎င်း၏ လက်ရှိ အဆင့်နှင့်အတူ ဖော်ပြထားပါသည်။",
"s6.lead":"အောက်ပါ အချက်တစ်ခုစီကို တိကျစွာ ဖတ်ရှုနိုင်ရန် အဆင့်နှင့်တကွ တံဆိပ်တပ်ထားပြီး၊ တစ်ခုစီကို ဖော်ပြပါ အရင်းအမြစ်များမှတစ်ဆင့် လွတ်လပ်စွာ စစ်ဆေးနိုင်ပါသည်။",
"s6.grid":"<div><b>ပထမအဆင့် သုံးသပ်ချက်</b><p>လူဇင်ဘတ် အစိုးရ · UCL · IDS (ယူနိုက်တက်ကင်းဒမ်း)</p><span class='pill done'>ပြီးစီး</span></div><div><b>လုံခြုံရေး စစ်ဆေးမှု</b><p>အမေရိကန် OTF Security Lab — USAGM / Open Technology Fund (2026)</p><span class='pill done'>ပြီးစီး</span></div><div><b>သုတေသန စာတမ်း</b><p><a href='https://mcorpai.org/VitalGuard_Offline_AI.pdf' target='_blank' rel='noopener' style='color:var(--signal);text-decoration:none;'>Offline AI (VitalGuard) — PDF ↗</a></p><span class='pill done'>ထုတ်ဝေပြီး</span></div><div><b>ပညာရပ်ဆိုင်ရာ ဖြန့်ဝေမှု</b><p>ACM FAccT သို့ တင်သွင်းရန် ပြင်ဆင်နေဆဲ၊ အောက်စဖို့ဒ် တက္ကသိုလ်နှင့် နောင်တွင် သုတေသန ပူးပေါင်းရန် ဖွင့်ထားသည်</p><span class='pill'>စီစဉ်ဆဲ</span></div><div><b>စံနှုန်းဆိုင်ရာ အနေအထား</b><p>GDPR Privacy-by-Design၊ ESG မူဘောင်များ၊ ကုလသမဂ္ဂ ရေရှည်တည်တံ့ရေး ပန်းတိုင်များ</p><span class='pill'>ဒီဇိုင်းအရ</span></div><div><b>လိုင်စင်</b><p>Apache License 2.0 — အများပြည်သူ အကျိုးအတွက် အခမဲ့ ရရှိနိုင်</p><span class='pill done'>အတည်ပြုပြီး</span></div>",
"s6.note":"<b>အခြေအနေနှင့် ကန့်သတ်ချက်များ —</b> ထုတ်ပြန်ထားသော သရုပ်ပြမှုများသည် ပြီးပြည့်စုံသော ထုတ်ကုန်များ မဟုတ်ဘဲ အနည်းဆုံး အလုပ်လုပ်နိုင်သော ပုံစံများ ဖြစ်ပြီး၊ ကျယ်ပြန့်သော ကွင်းဆင်း အတည်ပြုမှုကို မဆောင်ရွက်ရသေးပါ။ လိုက်နာမှုနှင့် ပတ်သက်သော ဖော်ပြချက်များသည် တတိယအဖွဲ့မှ ထုတ်ပေးသော အသိအမှတ်ပြုလက်မှတ် မဟုတ်ဘဲ၊ တည်ဆောက်ပုံဆိုင်ရာ ရည်ရွယ်ချက်နှင့် စစ်ဆေးနိုင်သော ဂုဏ်သတ္တိများကို — အထူးသဖြင့် ကိုယ်ရေးကိုယ်တာ ဒေတာ မစုဆောင်းခြင်းနှင့် အပြင်သို့ ချိတ်ဆက်မှု မလိုအပ်ခြင်းကို — ဖော်ပြခြင်း ဖြစ်ပါသည်။ ဤကဏ္ဍကို သုံးသပ်သူများအနေဖြင့် ယုံကြည်မှုအပေါ် အခြေခံ၍ လက်ခံမည့်အစား အချက်တစ်ခုစီကို ကိုယ်တိုင် စစ်ဆေးနိုင်ရန် ရေးသားထားပါသည်။",
"s7.eyebrow":"သရုပ်ပြမှုများ",
"s7.h":"ဘရောက်ဇာတွင် ဖိုင်ကို ဖွင့်လိုက်ရုံဖြင့် တပ်ဆင်မှု တစ်ခုလုံး ပြီးဆုံးပါသည်။",
"s7.lead":"စက်ပေါ်တွင် အခြေခံ စက်လေ့လာမှု ပါဝင်သော အနည်းဆုံး အလုပ်လုပ်နိုင်သည့် ပုံစံများ ဖြစ်ပါသည်။ ဝန်ဆောင်နိုင်မှု — ပုံတစ်ပုံ။ အကောင့် မလို၊ စာရင်းသွင်းစရာ မလို၊ ဒေတာလည်း စက်ပစ္စည်းမှ ထွက်မသွားပါ။",

"s1.eyebrow":"زمینه",
"s1.pull":"محدودیت در میدان به‌ندرت کیفیت مدل است.",
"s1.body":"<p class='lead'>توان محاسباتی در مرزهای دانش تنها برای شمار اندکی از نهادها و دولت‌ها در دسترس است. در سکونتگاه‌های پناهجویان، مزارع خارج از شبکه برق، مناطق فاجعه‌زده، کارگاه‌های زیرزمینی، تأسیسات جدا از شبکه و مناطقی که اینترنت در آن‌ها قطع می‌شود، محدودیت‌های تعیین‌کننده چیز دیگری است: برق، پهنای باند، بهای هر واحد، و مخاطره حقوقی که با گردآوری داده شخصی همراه می‌شود.</p><p>این طرح در جهت وارونه روند غالب حرکت می‌کند. به‌جای افزودن پارامتر، زیرساخت را برمی‌دارد. به‌جای گردآوری داده برای بهبود، هیچ داده‌ای گرد نمی‌آورد. آنچه می‌ماند چندان کوچک است که بتوان سطر به سطر خواند، چندان ارزان است که بتوان رایگان پخش کرد، و چندان بادوام است که پس از پایان اتصال، اعتبار ابری و بودجه طرح نیز به کار خود ادامه دهد.</p><p>همین ویژگی‌ها بسی فراتر از بسترهای بشردوستانه نیز اهمیت دارند. سامانه‌های ساخته‌شده برای محیط‌های حدی — از جمله کاوش فضایی — مشمول الزام‌های سنجیدنی همانند در بقاپذیری و خودبسندگی‌اند.</p>",
"s2.eyebrow":"محدودیت‌های طراحی",
"s2.h":"هر ویژگی زیر یک تصمیم معماری است، نه یک گزینه پیکربندی.",
"s2.list":"<li>بی‌نیاز از هرگونه زیرساخت سرور</li><li>بدون کتابخانه بیرونی؛ یک پرونده خودبسنده</li><li>بدون هزینه خرید یا اجاره پردازنده گرافیکی</li><li>هزینه نهایی نزدیک به صفر برای هر استقرار افزوده</li><li>معماری بدون هیچ ترافیک خروجی</li><li>هیچ محتوایی از شبکه‌های طرف ثالث بارگذاری نمی‌شود (صفر CDN)</li><li>طراحی‌شده برای پایبندی به GDPR (Privacy-by-Design)</li><li>مصرف برق بسیار اندک</li><li>بر دستگاه‌های از رده خارج اجرا می‌شود و عمر سخت‌افزار را افزایش می‌دهد</li><li>بر تراشه‌های رده یک دلاری و برق خورشیدی ساده کار می‌کند</li><li>همسو با چارچوب‌های ESG و اهداف توسعه پایدار سازمان ملل</li><li>بودجه بر پژوهشگران متمرکز است، نه بر سخت‌افزار</li>",
"s2.note":"<b>روش —</b> این سامانه به‌جای یک مدل بزرگ یادگیری ژرف، از ترکیب ماشین‌های حالت متناهی، درخت‌های رفتار و یادگیری تقویتی سبک بهره می‌گیرد. مهار حالت بر پایه قاعده، رفتاری پایدار و بی‌درنگ با هزینه محاسباتی اندک فراهم می‌کند و — که در بسترهای مرتبط با ایمنی به همان اندازه مهم است — تصمیم‌هایی می‌سازد که پس از رخداد می‌توان پی گرفت و توضیح داد.",
"s3.eyebrow":"کاربردها",
"s3.h":"هشت محیط عملیاتی که هوش مصنوعی متکی به ابر در آن‌ها قابل استقرار نیست.",
"s3.lead":"دسته‌های زیر همگی بر یک پیاده‌سازی واحد استوارند. بر پایه بستری که به برنامه شما نزدیک‌تر است پالایش کنید. هر مورد به‌عنوان حوزه کاربرد آمده است، نه استقراری به‌انجام‌رسیده؛ اعتبارسنجی میدانی در بخش وضعیت آمده است.",

"s3.cards":"<article class='card rv' data-tags='disaster'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M4 18h16'/><path d='M7 18V9l5-5 5 5v9'/><path d='M12 13v5'/></svg><span class='tag'>مستقل از زیرساخت</span><h3>واکنش به فاجعه و عملیات اضطراری خارج از شبکه</h3><ul><li>ارتباط مشبک دستگاه‌به‌دستگاه بدون اینترنت و بدون شبکه همراه</li><li>پشتیبانی برون‌خط از تریاژ و پایش نشانه‌های حیاتی</li><li>پشتیبانی جست‌وجو و نجات هنگام قطع برق و شبکه</li></ul><p class='why'>ساعت‌های نخست یک فاجعه دقیقاً همان زمانی است که شبکه در دسترس نیست.</p></article><article class='card rv' data-tags='defence'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><rect x='3' y='4' width='18' height='14' rx='1.5'/><path d='M8 21h8M12 18v3M7 9h4M7 13h7'/></svg><span class='tag'>جدا از شبکه</span><h3>تأسیسات جدا از شبکه و حساس از نظر ایمنی</h3><ul><li>زیرساخت‌های حیاتی که ترافیک خروجی در آن‌ها با سیاست سازمانی ممنوع است</li><li>محیط‌های ساخت نیمه‌هادی و تولید پیشرفته</li><li>دستگاه‌های پزشکی و درمانی با حفظ حریم خصوصی</li></ul><p class='why'>Egress Kill Switch: ارتباط خروجی را می‌توان بی‌درنگ از کار انداخت، چنان‌که خروج داده نه صرفاً ممنوع، بلکه ساختاراً ناممکن شود.</p></article><article class='card rv' data-tags='esg'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M4 12a8 8 0 0 1 8-8h5'/><path d='M20 12a8 8 0 0 1-8 8H7'/><path d='M14 1.5L17.5 4 14 6.5M10 17.5L6.5 20 10 22.5'/></svg><span class='tag'>اقتصاد چرخه‌ای</span><h3>بازکاربری پسماند الکترونیکی و پایش محیط زیست</h3><ul><li>گوشی‌های از رده خارج که به گره‌های بشردوستانه و پایشی بدل می‌شوند</li><li>پایش کم‌هزینه محیط زیست و ایمنی کار</li><li>شناسایی صوتی و ارتعاشی هجوم ملخ در مناطق بدون شبکه</li></ul><p class='why'>افزایش عمر دستگاه یک دستاورد سنجش‌پذیر ESG است، نه یک ادعا.</p></article><article class='card rv' data-tags='defence esg'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M3 20h18'/><path d='M6 20V10l6-6 6 6v10'/><circle cx='12' cy='13' r='2'/></svg><span class='tag'>عملیات دورافتاده</span><h3>سایت‌های صنعتی دورافتاده و عملیات لبه</h3><ul><li>معادن زیرزمینی و کارهای تونلی</li><li>ساخت‌وساز و دیگر کارگاه‌های پرخطر</li><li>ردیابی محلی دارایی و پایش ایمنی کارگران بدون زیرساخت شبکه</li></ul><p class='why'>آنجا که اتصال به پایان می‌رسد، دستگاه باید همچنان خود بتواند استدلال کند.</p></article><article class='card rv' data-tags='agri'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M12 21c0-6 3-9 8-9-1 6-4 9-8 9z'/><path d='M12 21c0-6-3-9-8-9 1 6 4 9 8 9z'/><path d='M12 21v-7'/></svg><span class='tag'>پوشش اندک</span><h3>کشاورزی و دامداری در پهنه‌های وسیع با پوشش اندک</h3><ul><li>پایش رطوبت خاک و وضعیت دام در ایالات متحده، کانادا و استرالیا</li><li>نشانه زودهنگام خطر بیماری در گله</li><li>هشدار محلی برای بازداشتن سرقت دام‌های پرارزش</li></ul><p class='why'>پایش پیوسته و کم‌مصرف می‌تواند بهره‌وری را در جایی که زیرساخت ارتباطی محدود است بهبود دهد.</p></article><article class='card rv' data-tags='consumer esg'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><rect x='7' y='6' width='10' height='12' rx='2'/><path d='M9 6V3h6v3M9 18v3h6v-3'/><path d='M10 12h4'/></svg><span class='tag'>تراشه رده یک دلاری</span><h3>سخت‌افزار بسیار کم‌هزینه و خورشیدی</h3><ul><li>ساعت‌های دیجیتال خورشیدی با کارکردهای ساده حفظ جان</li><li>کار پیوسته بر تراشه‌های نیمه‌هادی بسیار کم‌هزینه</li><li>اثر ناچیز بر بهای تمام‌شده هر واحد</li></ul><p class='why'>صرفه‌جویی در اینجا محدودیتی نیست که به ناچار پذیرفته شده باشد؛ خودِ مبنای طراحی است.</p></article><article class='card rv' data-tags='rights disaster defence'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><circle cx='12' cy='12' r='2.2'/><path d='M8 8a5.5 5.5 0 0 0 0 8M16 8a5.5 5.5 0 0 1 0 8M5 5a10 10 0 0 0 0 14M19 5a10 10 0 0 1 0 14'/></svg><span class='tag'>BLE &amp; فراصوت</span><h3>ارتباط محلی بدون هیچ شبکه‌ای</h3><ul><li>شبکه مشبک بلوتوث میان دستگاه‌های نزدیک</li><li>انتقال فراصوتی و صوتی در جایی که رادیو در دسترس یا صلاح نیست</li><li>یادگیری ماشین با جاوااسکریپت خالص و پویش BLE بر دستگاه‌های اندروید ده‌ساله</li></ul><p class='why'>هدف طراحی برای دوام میدانی 60–70 روز با کمترین توان است و شش ماه به‌عنوان هدف بلندمدت.</p></article>",

"s4.h":"ویژگی‌های امنیتی که از ساختار برمی‌آیند، نه از سیاست سازمانی.",
"s4.body":"<p>هدف، معماری تک‌پرونده و بدون وابستگی است که هر پیمانه آن برای کامل بودن و خودبسندگی از اصول نخستین نوشته شده است. هنگام اجرا هیچ چیز درون‌ریزی نمی‌شود، زیرا هر آنچه هنگام اجرا درون‌ریزی شود چیزی است که یک دشمن، یک قطعی یا یک سرویس متوقف‌شده می‌تواند از میان بردارد.</p><p><strong>Egress Kill Switch:</strong> ارتباط شبکه‌ای خروجی را می‌توان بی‌درنگ از کار انداخت و دستگاه را چنان جدا کرد که خروج داده نه با ممنوعیت اداری، بلکه ساختاراً ناممکن شود. این تمایز برای سازمان‌هایی اهمیت دارد که باید نشان دهند — و نه صرفاً ادعا کنند — که داده نمی‌تواند بیرون رود.</p>",
"s4.spec":"<tr><th>بستر اجرا</th><td>جاوااسکریپت خالص، درون مرورگر، یک پرونده</td></tr><tr><th>کتابخانه بیرونی</th><td><span class='ok'>هیچ</span> — بدون وابستگی، بدون CDN</td></tr><tr><th>نیاز به سرور</th><td><span class='ok'>هیچ</span> — بدون سرور، بدون ترافیک خروجی</td></tr><tr><th>داده شخصی گردآوری‌شده</th><td><span class='ok'>هیچ</span> — بدون تله‌متری، بدون فراداده</td></tr><tr><th>روش اصلی</th><td>ماشین حالت متناهی + درخت رفتار + یادگیری تقویتی سبک (قاعده‌محور و بازرسی‌پذیر)</td></tr><tr><th>انتقال محلی</th><td>شبکه مشبک BLE؛ فراصوت و صوت</td></tr><tr><th>کمینه سخت‌افزار</th><td>دستگاه اندروید ده‌ساله؛ تراشه‌های رده یک دلاری؛ برق خورشیدی ساده</td></tr><tr><th>دوام میدانی</th><td>هدف طراحی 60–70 روز؛ شش ماه به‌عنوان هدف بلندمدت</td></tr><tr><th>وضعیت انطباق</th><td>GDPR Privacy-by-Design؛ همسویی با ESG و اهداف توسعه پایدار</td></tr><tr><th>پروانه</th><td><span class='ok'>Apache License 2.0</span></td></tr><tr><th>حذف</th><td>کاربر هر زمان می‌تواند آن را پاک کند، بی‌آنکه داده‌ای بر جای بماند</td></tr>",

"s1.body":"<p class='lead'>Обчислення передового рівня доступні лише невеликому колу установ і держав. У поселеннях біженців, на господарствах поза електромережею, у зонах лиха, на підземних роботах, на обʼєктах з фізичною ізоляцією мережі та в регіонах, де мережу вимикають, обмеження зовсім інші: електроенергія, смуга пропускання, вартість одиниці та юридична вразливість, що супроводжує збирання персональних даних.</p><p>Цей проєкт рухається у зворотному до панівного напрямі. Замість додавати параметри, він прибирає інфраструктуру. Замість збирати дані задля вдосконалення, він не збирає нічого. Те, що лишається, достатньо мале, щоб його прочитати рядок за рядком, достатньо дешеве, щоб поширювати безоплатно, і достатньо витривале, щоб працювати й після того, як звʼязок, хмарні кредити та фінансування проєкту вичерпаються.</p><p>Ті самі властивості важливі далеко за межами гуманітарного контексту. До систем, призначених для екстремальних середовищ — зокрема для дослідження космосу — висувають порівнянні вимоги щодо живучості та самодостатності.</p>",
"s2.eyebrow":"Проєктні обмеження",
"s2.h":"Кожна властивість нижче є архітектурним рішенням, а не параметром налаштування.",
"s2.list":"<li>Не потребує серверної інфраструктури</li><li>Без зовнішніх бібліотек; самодостатній єдиний файл</li><li>Без витрат на придбання чи оренду GPU</li><li>Майже нульові граничні витрати на кожне додаткове розгортання</li><li>Архітектура без вихідного трафіку</li><li>Жодного вмісту з мереж третіх сторін (нуль CDN)</li><li>Спроєктовано для відповідності GDPR (Privacy-by-Design)</li><li>Наднизьке споживання енергії</li><li>Працює на списаних пристроях, подовжуючи строк служби обладнання</li><li>Працює на чипах вартістю близько 1 долара та простому сонячному живленні</li><li>Узгоджено з рамками ESG та Цілями сталого розвитку ООН</li><li>Бюджет зосереджено на дослідниках, а не на обладнанні</li>",
"s2.note":"<b>МЕТОД —</b> Замість великої моделі глибокого навчання система поєднує скінченні автомати, дерева поведінки та полегшене навчання з підкріпленням. Керування станами на основі правил дає стабільну поведінку в реальному часі за низьких обчислювальних витрат і — що не менш важливо там, де йдеться про безпеку людей — породжує рішення, які можна простежити й пояснити постфактум.",
"s3.eyebrow":"Застосування",
"s3.h":"Вісім робочих середовищ, у яких ШІ з опорою на хмару розгорнути неможливо.",
"s3.lead":"Наведені категорії спираються на одну й ту саму реалізацію. Скористайтеся фільтром за середовищем, найближчим до вашої програми. Кожен пункт подано як сферу застосування, а не як завершене впровадження; польову перевірку розглянуто в розділі про стан робіт.",
"s3.filters":"<button class='chip' data-filter='all' aria-pressed='true'>Усі</button><button class='chip' data-filter='rights' aria-pressed='false'>Права людини</button><button class='chip' data-filter='disaster' aria-pressed='false'>Реагування на лиха</button><button class='chip' data-filter='defence' aria-pressed='false'>Критична інфраструктура</button><button class='chip' data-filter='esg' aria-pressed='false'>ESG &amp; електронні відходи</button><button class='chip' data-filter='agri' aria-pressed='false'>Сільське господарство</button><button class='chip' data-filter='consumer' aria-pressed='false'>Недороге обладнання</button>",
"s3.status":"Показано {n} із {t} сфер застосування",
"s3.cards":"<article class='card rv' data-tags='disaster'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M4 18h16'/><path d='M7 18V9l5-5 5 5v9'/><path d='M12 13v5'/></svg><span class='tag'>Незалежність від інфраструктури</span><h3>Реагування на лиха та аварійні операції поза мережею</h3><ul><li>Сітчастий звʼязок між пристроями без інтернету та мобільного покриття</li><li>Офлайнова підтримка сортування постраждалих і спостереження за життєвими показниками</li><li>Підтримка пошуку та рятування під час зникнення живлення й звʼязку</li></ul><p class='why'>Перші години лиха — це саме той час, коли мережі немає.</p></article><article class='card rv' data-tags='defence'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><rect x='3' y='4' width='18' height='14' rx='1.5'/><path d='M8 21h8M12 18v3M7 9h4M7 13h7'/></svg><span class='tag'>Фізична ізоляція мережі</span><h3>Обʼєкти з фізичною ізоляцією мережі та критичні для безпеки</h3><ul><li>Критична інфраструктура, де вихідний трафік заборонено політикою</li><li>Виробництво напівпровідників та середовища високотехнологічного виробництва</li><li>Медичні пристрої та засоби охорони здоровʼя, що зберігають приватність</li></ul><p class='why'>Egress Kill Switch: вихідний звʼязок можна вимкнути миттєво, через що витік стає структурно неможливим, а не просто забороненим.</p></article><article class='card rv' data-tags='esg'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M4 12a8 8 0 0 1 8-8h5'/><path d='M20 12a8 8 0 0 1-8 8H7'/><path d='M14 1.5L17.5 4 14 6.5M10 17.5L6.5 20 10 22.5'/></svg><span class='tag'>Циркулярна економіка</span><h3>Повторне використання електронних відходів та моніторинг довкілля</h3><ul><li>Списані смартфони, перетворені на гуманітарні та спостережні вузли</li><li>Недорогий моніторинг довкілля та безпеки праці</li><li>Акустичне й вібраційне виявлення роїв сарани в регіонах без мережі</li></ul><p class='why'>Подовження строку служби пристроїв — вимірюваний результат ESG, а не заява.</p></article><article class='card rv' data-tags='defence esg'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M3 20h18'/><path d='M6 20V10l6-6 6 6v10'/><circle cx='12' cy='13' r='2'/></svg><span class='tag'>Віддалені операції</span><h3>Віддалені промислові майданчики та роботи на периферії</h3><ul><li>Підземні шахти й тунельні роботи</li><li>Будівництво та інші небезпечні робочі майданчики</li><li>Локальний облік майна та спостереження за безпекою працівників без мережевої інфраструктури</li></ul><p class='why'>Там, де закінчується звʼязок, пристрій має й далі міркувати самостійно.</p></article><article class='card rv' data-tags='agri'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M12 21c0-6 3-9 8-9-1 6-4 9-8 9z'/><path d='M12 21c0-6-3-9-8-9 1 6 4 9 8 9z'/><path d='M12 21v-7'/></svg><span class='tag'>Слабке покриття</span><h3>Землеробство й тваринництво на великих територіях зі слабким покриттям</h3><ul><li>Спостереження за вологістю ґрунту та станом худоби у США, Канаді й Австралії</li><li>Раннє виявлення ризику захворювань у стаді</li><li>Локальне сповіщення для запобігання крадіжкам цінної худоби</li></ul><p class='why'>Безперервне спостереження за низького енергоспоживання здатне підвищити продуктивність там, де інфраструктура звʼязку обмежена.</p></article><article class='card rv' data-tags='consumer esg'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><rect x='7' y='6' width='10' height='12' rx='2'/><path d='M9 6V3h6v3M9 18v3h6v-3'/><path d='M10 12h4'/></svg><span class='tag'>Кремній класу 1 долара</span><h3>Наддешеве обладнання із сонячним живленням</h3><ul><li>Цифрові годинники на сонячній батареї з простими функціями збереження життя</li><li>Безперервна робота на наддешевих напівпровідникових чипах</li><li>Знехтувано малий вплив на собівартість одиниці виробу</li></ul><p class='why'>Ощадність тут не є обмеженням, з яким доводиться миритися; вона є засадою проєктування.</p></article><article class='card rv' data-tags='rights disaster defence'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><circle cx='12' cy='12' r='2.2'/><path d='M8 8a5.5 5.5 0 0 0 0 8M16 8a5.5 5.5 0 0 1 0 8M5 5a10 10 0 0 0 0 14M19 5a10 10 0 0 1 0 14'/></svg><span class='tag'>BLE &amp; ультразвук</span><h3>Локальний звʼязок без жодної мережі</h3><ul><li>Bluetooth-сітка між сусідніми пристроями</li><li>Ультразвукове й акустичне передавання там, де радіо недоступне або небажане</li><li>Машинне навчання суто на JavaScript та сканування BLE на десятирічних пристроях Android</li></ul><p class='why'>Проєктна мета польової автономності — 60–70 днів за мінімального живлення, у довшій перспективі шість місяців.</p></article>",
"s4.eyebrow":"Архітектура",
"s4.h":"Властивості безпеки, що випливають зі структури, а не з політики.",
"s4.body":"<p>Метою є однофайлова архітектура без залежностей, у якій кожен модуль написано від першооснов задля повноти й самодостатності. Під час виконання не імпортується нічого, бо все, що імпортується під час виконання, може прибрати супротивник, збій або припинена послуга.</p><p><strong>Egress Kill Switch:</strong> вихідний мережевий звʼязок можна вимкнути миттєво, ізолювавши пристрій так, що витік стає структурно неможливим, а не адміністративно забороненим. Ця різниця важлива для організацій, які мають довести, а не просто заявити, що дані не можуть залишити пристрій.</p>",
"s4.spec":"<tr><th>Середовище виконання</th><td>Чистий JavaScript, у браузері, єдиний файл</td></tr><tr><th>Зовнішні бібліотеки</th><td><span class='ok'>Немає</span> — жодних залежностей, без CDN</td></tr><tr><th>Потреба в сервері</th><td><span class='ok'>Немає</span> — без сервера, без вихідного трафіку</td></tr><tr><th>Зібрані персональні дані</th><td><span class='ok'>Немає</span> — без телеметрії, без метаданих</td></tr><tr><th>Основний метод</th><td>Скінченні автомати + дерева поведінки + полегшене RL (на основі правил, придатне до перевірки)</td></tr><tr><th>Локальне передавання</th><td>BLE-сітка; ультразвук та акустика</td></tr><tr><th>Мінімальне обладнання</th><td>Десятирічний пристрій Android; чипи класу 1 долара; просте сонячне живлення</td></tr><tr><th>Польова автономність</th><td>Проєктна мета 60–70 днів; шість місяців у довшій перспективі</td></tr><tr><th>Позиція щодо відповідності</th><td>GDPR Privacy-by-Design; узгодження з ESG та ЦСР ООН</td></tr><tr><th>Ліцензія</th><td><span class='ok'>Apache License 2.0</span></td></tr><tr><th>Вилучення</th><td>Користувач може видалити будь-коли, не лишаючи залишкових даних</td></tr>",
"s5.eyebrow":"Етика проєктування",
"s5.pull":"Самі лише технічні показники не вирішують, чи можна впровадити систему.",
"s5.body":"<p class='lead'>У гуманітарних і громадських впровадженнях рішення про прийняття зазвичай визначає юридична відповідальність і ризик, а не спроможність. Хай якою досконалою була б система, залишкової ймовірності серйозного спору щодо захисту даних нерідко достатньо, щоб неурядова чи міжнародна організація відмовилася її брати.</p><p>Кожне проєктне рішення тут випливає з цього обмеження: зменшити галюцинації у чутливих сферах, лишатися достатньо прозорим для незалежного аудиту, працювати за браку ресурсів, не збирати нічого, не перекладати юридичної відповідальності на організацію, що впроваджує, і лишатися достатньо простим, щоб непрограмісти могли це прочитати, пристосувати та видалити.</p><p>Узгодження з міжнародними нормами — GDPR, Конвенцією ООН про права дитини та Конвенцією про права осіб з інвалідністю — розглядається як вихідна умова проєктування, а не як шар відповідності, доданий згодом.</p>",
"s5.scenes":"<div class='scene'><b>Зменшити галюцинації</b><p>Хибний результат у захисті дітей, охороні здоровʼя чи реагуванні на лиха має негайні наслідки.</p></div><div class='scene'><b>Лишатися придатним до перевірки</b><p>Відкритий код і відкрита архітектура, бо непрозору систему неможливо захистити, коли вона підводить.</p></div><div class='scene'><b>Не перекладати відповідальності</b><p>Немає збирання, немає сервера й немає транскордонної передачі — отже, на організацію, що впроваджує, нічого не перекладається.</p></div><div class='scene'><b>Лишатися видаляним</b><p>Користувач може будь-коли прибрати систему разом з її даними. Легкість видалення — це свобода від зобовʼязань.</p></div>",
"s6.eyebrow":"Стан розгляду та аудиту",
"s6.h":"Кожен пункт подано разом із його поточним етапом.",
"s6.lead":"Кожен пункт нижче позначено етапом, щоб його можна було прочитати точно, і кожен можна перевірити незалежно за вказаними джерелами.",
"s6.grid":"<div><b>Перший етап розгляду</b><p>Уряд Люксембургу · UCL · IDS (Сполучене Королівство)</p><span class='pill done'>Завершено</span></div><div><b>Аудит безпеки</b><p>U.S. OTF Security Lab — USAGM / Open Technology Fund (2026)</p><span class='pill done'>Завершено</span></div><div><b>Наукова стаття</b><p><a href='https://mcorpai.org/VitalGuard_Offline_AI.pdf' target='_blank' rel='noopener' style='color:var(--signal);text-decoration:none;'>Offline AI (VitalGuard) — PDF ↗</a></p><span class='pill done'>Опубліковано</span></div><div><b>Академічне поширення</b><p>Готується подання до ACM FAccT; відкритість до майбутньої дослідницької співпраці з Оксфордським університетом</p><span class='pill'>Заплановано</span></div><div><b>Позиція щодо стандартів</b><p>GDPR Privacy-by-Design; рамки ESG; Цілі сталого розвитку ООН</p><span class='pill'>Закладено у проєкт</span></div><div><b>Ліцензія</b><p>Apache License 2.0 — безоплатно для використання на суспільне благо</p><span class='pill done'>Підтверджено</span></div>",
"s6.note":"<b>СТАН І ОБМЕЖЕННЯ —</b> Оприлюднені демонстрації є мінімально життєздатними продуктами, а не завершеними виробами, і масштабної польової перевірки ще не проведено. Твердження про відповідність описують архітектурний намір і властивості, які можна перевірити — насамперед те, що персональні дані не збираються і вихідне зʼєднання не потрібне, — а не сертифікацію, видану третьою стороною. Цей розділ написано так, щоб рецензенти могли перевірити кожне твердження самостійно, а не приймати його на віру.",
"s7.eyebrow":"Демонстрації",
"s7.h":"Відкриття файлу в браузері і є всім процесом встановлення.",
"s7.lead":"Мінімально життєздатні продукти, включно з базовим машинним навчанням на пристрої. Обсяг: одне зображення. Без облікового запису, без реєстрації, і жодні дані не залишають пристрій.",
"s7.demos":"<a class='demo' href='https://mcorpai.com/' target='_blank' rel='noopener'><span class='size'>600 КБ · Демонстрація 01</span><h3>Сітчаста мережа Bluetooth</h3><p>Сітка між пристроями з полегшеним машинним навчанням на пристрої та скануванням BLE, що працює цілком у браузері.</p><span class='go'>mcorpai.com ↗</span></a><a class='demo' href='https://mcorpai.net/' target='_blank' rel='noopener'><span class='size'>460 КБ · Демонстрація 02</span><h3>Bluetooth та ультразвук</h3><p>Акустичне й ультразвукове локальне передавання для середовищ, де радіо недоступне або небажане.</p><span class='go'>mcorpai.net ↗</span></a><a class='demo' href='https://mcorpai.org/' target='_blank' rel='noopener'><span class='size'>Робочий простір проєкту</span><h3>Статті, контакти та стан</h3><p>Поточна документація та адреса для листування щодо програми.</p><span class='go'>mcorpai.org ↗</span></a>",
"s7.note":"Жодного збирання даних. Жодної аналітики. Жодних запитів до третіх сторін — зокрема й на цій сторінці, яка не завантажує ані зовнішнього шрифту, ані скрипта, ані таблиці стилів.",
"s8.eyebrow":"Інститут",
"s8.h":"Пропозиція між установами, а не заявка на особисте працевлаштування.",
"s8.body":"<p>M Corp AI Research Institute планується заснувати в Республіці Корея у співпраці з партнерами з різних країн. Обрані проєкти призначено для безоплатного оприлюднення на умовах Apache License 2.0 задля суспільного блага. Частину доходів інституту передбачено спрямовувати на підтримку незалежного авторського кіно та дітей з рідкісними захворюваннями, а високий рейтинг ESG визначено як прямо заявлену мету.</p><p>Засновник не шукає особистого працевлаштування. Пропонується угода про ліцензування технології та спільні дослідження між вашою організацією та інститутом, за якої засновник і надалі відповідає за архітектуру, напрям досліджень і довгострокову місію.</p>",

"s8.note":"<b>ПОТОЧНА МЕТА —</b> Заснувати в Республіці Корея незалежний дослідний інститут низькорівневого ШІ з невеликою інженерною командою та знайти інституційних партнерів, здатних підтримати його створення й тривалу сталу роботу.",
"s9.eyebrow":"Партнерство",
