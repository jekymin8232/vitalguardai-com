"<article class='card rv' data-tags='agri'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M12 21c0-6 3-9 8-9-1 6-4 9-8 9z'/><path d='M12 21c0-6-3-9-8-9 1 6 4 9 8 9z'/><path d='M12 21v-7'/></svg><span class='tag'>Cobertura limitada</span><h3>Agricultura y ganadería en grandes superficies con escasa cobertura</h3><ul><li>Seguimiento de la humedad del suelo y del estado del ganado en Estados Unidos, Canadá y Australia</li><li>Indicación temprana del riesgo de enfermedad en los rebaños</li><li>Alertas locales para disuadir el robo de ganado de alto valor</li></ul><p class='why'>La monitorización continua de bajo consumo puede mejorar la productividad allí donde la infraestructura de comunicaciones es limitada.</p></article>"+
"<article class='card rv' data-tags='consumer esg'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><rect x='7' y='6' width='10' height='12' rx='2'/><path d='M9 6V3h6v3M9 18v3h6v-3'/><path d='M10 12h4'/></svg><span class='tag'>Silicio de ínfimo coste</span><h3>Equipos de coste muy reducido y alimentación solar</h3><ul><li>Relojes digitales solares con funciones sencillas de protección de la vida</li><li>Funcionamiento permanente sobre chips de coste ínfimo</li><li>Incidencia insignificante en el coste unitario de fabricación</li></ul><p class='why'>Aquí la eficiencia no es una limitación aceptada a regañadientes, sino la premisa misma del diseño.</p></article>"+
"<article class='card rv' data-tags='rights disaster defence'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><circle cx='12' cy='12' r='2.2'/><path d='M8 8a5.5 5.5 0 0 0 0 8M16 8a5.5 5.5 0 0 1 0 8M5 5a10 10 0 0 0 0 14M19 5a10 10 0 0 1 0 14'/></svg><span class='tag'>BLE y ultrasonidos</span><h3>Comunicación local sin ninguna red</h3><ul><li>Malla Bluetooth entre dispositivos próximos</li><li>Transporte acústico y ultrasónico donde la radio no está disponible o no es aconsejable</li><li>Aprendizaje automático y escaneo BLE en JavaScript puro sobre dispositivos Android de hace diez años</li></ul><p class='why'>El objetivo de diseño para la autonomía sobre el terreno es de 60 a 70 días con consumo mínimo, con seis meses como meta a más largo plazo.</p></article>",

"s4.eyebrow":"Arquitectura",
"s4.h":"Propiedades de seguridad derivadas de la estructura, no de la política interna.",
"s4.body":"<p>El objetivo es una arquitectura de archivo único y sin dependencias, en la que cada módulo se escribe desde los primeros principios para garantizar su integridad y autosuficiencia. Nada se importa en tiempo de ejecución, porque todo lo que se importa en tiempo de ejecución puede ser suprimido por un adversario, una caída del servicio o su discontinuación.</p><p><strong>Egress Kill Switch:</strong> la comunicación saliente puede desactivarse de forma inmediata, aislando el dispositivo de modo que la exfiltración resulte estructuralmente imposible y no meramente prohibida por vía administrativa. Esta distinción resulta relevante para las organizaciones que deben demostrar, y no solo afirmar, que los datos no salen.</p>",
"s4.spec":"<tr><th>Entorno de ejecución</th><td>JavaScript puro, en el navegador, archivo único</td></tr><tr><th>Bibliotecas externas</th><td><span class='ok'>Ninguna</span> — sin dependencias ni CDN</td></tr><tr><th>Requisito de servidor</th><td><span class='ok'>Ninguno</span> — sin servidor y sin salida de datos</td></tr><tr><th>Datos personales recopilados</th><td><span class='ok'>Ninguno</span> — sin telemetría ni metadatos</td></tr><tr><th>Método principal</th><td>Máquinas de estados, árboles de comportamiento y aprendizaje por refuerzo ligero, basados en reglas e inspeccionables</td></tr><tr><th>Transporte local</th><td>Malla BLE; ultrasonidos y acústica</td></tr><tr><th>Equipamiento mínimo</th><td>Dispositivo Android de hace diez años; chips de coste ínfimo; alimentación solar básica</td></tr><tr><th>Autonomía sobre el terreno</th><td>Objetivo de diseño de 60 a 70 días; seis meses a más largo plazo</td></tr><tr><th>Posición de cumplimiento</th><td>Privacidad desde el diseño conforme al RGPD; alineación con ESG y los ODS</td></tr><tr><th>Licencia</th><td><span class='ok'>Apache License 2.0</span></td></tr><tr><th>Eliminación</th><td>El usuario puede eliminarlo en cualquier momento sin dejar datos residuales</td></tr>",

"s5.eyebrow":"Ética del diseño",
"s5.pull":"El rendimiento técnico por sí solo no determina si un sistema puede adoptarse.",
"s5.body":"<p class='lead'>En los despliegues humanitarios y de sociedad civil, la adopción suele decidirse por la responsabilidad jurídica y el riesgo, más que por la capacidad técnica. Por elevado que sea el rendimiento de un sistema, la probabilidad residual de un litigio sustancial en materia de protección de datos suele bastar para que una ONG o una organización internacional descarte su adopción.</p><p>Cada decisión de diseño se deriva de esa restricción: reducir las alucinaciones en ámbitos sensibles, mantener la transparencia necesaria para una auditoría independiente, funcionar en entornos de recursos limitados, no recopilar nada, no transferir responsabilidad jurídica a la organización que lo adopta y conservar la sencillez suficiente para que personal no programador pueda leerlo, adaptarlo y eliminarlo.</p><p>La alineación con las normas internacionales — el RGPD, la Convención sobre los Derechos del Niño y la Convención sobre los Derechos de las Personas con Discapacidad — se trata como un requisito de diseño desde el inicio y no como una capa de cumplimiento añadida después.</p>",
"s5.scenes":"<div class='scene'><b>Reducir las alucinaciones</b><p>Una salida errónea en protección de la infancia, atención sanitaria o respuesta a desastres tiene consecuencias inmediatas.</p></div><div class='scene'><b>Ser inspeccionable</b><p>Código y arquitectura abiertos, porque un sistema opaco no puede defenderse cuando falla.</p></div><div class='scene'><b>No transferir responsabilidad</b><p>Sin recopilación, sin servidor y sin transferencia transfronteriza no se traslada responsabilidad alguna a la organización que lo adopta.</p></div><div class='scene'><b>Poder eliminarse</b><p>Las personas usuarias pueden eliminar el sistema y sus datos en cualquier momento. La facilidad de eliminación es libertad respecto de la obligación.</p></div>",

"s6.eyebrow":"Estado de revisión y auditoría",
"s6.h":"Cada elemento se expone junto con su fase actual.",
"s6.lead":"Cada elemento se acompaña de su fase para que pueda interpretarse con exactitud, y todos pueden verificarse de forma independiente a través de las fuentes indicadas.",
"s6.grid":"<div><b>Revisión de primera fase</b><p>Gobierno de Luxemburgo · UCL · IDS (Reino Unido)</p><span class='pill done'>Concluida</span></div><div><b>Auditoría de seguridad</b><p>OTF Security Lab de EE. UU. — USAGM / Open Technology Fund (2026)</p><span class='pill done'>Concluida</span></div><div><b>Documento de investigación</b><p><a href='https://mcorpai.org/VitalGuard_Offline_AI.pdf' target='_blank' rel='noopener' style='color:var(--signal);text-decoration:none;'>Offline AI (VitalGuard) — PDF ↗</a></p><span class='pill done'>Publicado</span></div><div><b>Difusión académica</b><p>Preparación de una contribución a ACM FAccT; disponibilidad para una futura colaboración investigadora con la Universidad de Oxford</p><span class='pill'>Previsto</span></div><div><b>Posición normativa</b><p>Privacidad desde el diseño conforme al RGPD; marcos ESG; Objetivos de Desarrollo Sostenible</p><span class='pill'>Por diseño</span></div><div><b>Licencia</b><p>Apache License 2.0 — disponible sin coste para usos de interés público</p><span class='pill done'>Confirmada</span></div>",
"s6.note":"<b>ESTADO Y LIMITACIONES —</b> Las demostraciones publicadas son productos mínimos viables y no productos acabados, y aún no se ha realizado una validación sobre el terreno a gran escala. Las afirmaciones relativas al cumplimiento describen una intención arquitectónica y propiedades verificables — fundamentalmente, que no se recopilan datos personales y que no se requiere ninguna conexión saliente — y no una certificación emitida por un tercero. Este apartado se ha redactado para que quienes evalúen puedan verificar cada afirmación de forma independiente en lugar de aceptarla por confianza.",

"s7.eyebrow":"Demostraciones",
"s7.h":"Abrir el archivo en un navegador constituye la instalación completa.",
"s7.lead":"Productos mínimos viables que incluyen aprendizaje automático básico en el propio dispositivo. Capacidad: una imagen. Sin cuenta ni registro, y ningún dato sale del dispositivo.",
"s7.demos":"<a class='demo' href='https://mcorpai.com/' target='_blank' rel='noopener'><span class='size'>600 KB · Demostración 01</span><h3>Red en malla por Bluetooth</h3><p>Malla entre dispositivos con aprendizaje automático ligero y escaneo BLE, ejecutada íntegramente en el navegador.</p><span class='go'>mcorpai.com ↗</span></a><a class='demo' href='https://mcorpai.net/' target='_blank' rel='noopener'><span class='size'>460 KB · Demostración 02</span><h3>Bluetooth y ultrasonidos</h3><p>Transporte local acústico y ultrasónico para entornos en los que la radio no está disponible o no es aconsejable.</p><span class='go'>mcorpai.net ↗</span></a><a class='demo' href='https://mcorpai.org/' target='_blank' rel='noopener'><span class='size'>Espacio del proyecto</span><h3>Documentos, contacto y estado</h3><p>Documentación actual y dirección de correspondencia del programa.</p><span class='go'>mcorpai.org ↗</span></a>",
"s7.note":"Sin recopilación de datos. Sin analítica. Sin peticiones a terceros, tampoco en esta página, que no carga ninguna fuente tipográfica, script ni hoja de estilos externa.",

"s8.eyebrow":"El instituto",
"s8.h":"Una propuesta entre instituciones, no una solicitud de empleo individual.",
"s8.body":"<p>Está previsto establecer el Instituto de Investigación M Corp AI en la República de Corea, en colaboración con socios internacionales. Determinados proyectos se publicarán sin coste bajo la Licencia Apache 2.0 para usos de interés público. Asimismo, se prevé destinar una parte de los ingresos del instituto a apoyar el cine de autor independiente y a menores afectados por enfermedades raras, con una calificación ESG elevada como objetivo explícito.</p><p>El fundador no busca un empleo individual. Lo que se propone es un acuerdo de licencia tecnológica e investigación conjunta entre su organización y el instituto, lo que permite al fundador seguir asumiendo la arquitectura, la dirección científica y la misión a largo plazo.</p>",
"s8.org":"<thead><tr><th>Función</th><th>Responsabilidad</th></tr></thead><tbody><tr><td>Fundador y arquitecto de sistemas de IA</td><td>Morgan J. — arquitectura, dirección científica y visión a largo plazo</td></tr><tr><td>Equipo de ingeniería de software</td><td>Tres desarrolladores en Europa del Este — desarrollo, implementación y programación</td></tr></tbody>",
"s8.note":"<b>OBJETIVO ACTUAL —</b> Establecer en la República de Corea un instituto independiente de investigación en IA de bajo nivel con un equipo reducido de ingeniería, e identificar socios institucionales capaces de apoyar su creación y su funcionamiento sostenible a largo plazo.",

"s9.eyebrow":"Colaboración",
"s9.h":"En este momento se buscan tres modalidades de colaboración.",
"s9.items":"<div><span class='n'>01</span><h3>Colaboración investigadora</h3><p>Trabajo conjunto a distancia con grupos académicos e institutos de investigación sobre IA sin conexión, computación en el borde y diseño de sistemas respetuosos con la privacidad, incluida la publicación conjunta.</p></div><div><span class='n'>02</span><h3>Licencia e I+D conjunta</h3><p>Acuerdos entre instituciones que permitan a su organización aplicar esta arquitectura en sus propios programas, con apoyo técnico del instituto.</p></div><div><span class='n'>03</span><h3>Financiación</h3><p>Apoyo a la creación y al funcionamiento sostenible de un laboratorio independiente de investigación en IA sin conexión en la República de Corea.</p></div>",

"s10.eyebrow":"Contacto",
"s10.h":"Correspondencia, informes de auditoría y consultas.",
"s10.lead":"El proyecto se mantiene estrictamente de forma remota con el fin de preservar la neutralidad y la concentración. El correo electrónico es el canal adecuado para cualquier consulta, propuesta de colaboración o comunicación relativa a auditorías. Las respuestas se remiten desde la República de Corea (KST).",
"s10.links":"<a class='btn' href='https://mcorpai.org/' target='_blank' rel='noopener'>mcorpai.org ↗</a><a class='btn' href='https://mcorpai.org/VitalGuard_Offline_AI.pdf' target='_blank' rel='noopener'>Documento de investigación ↗</a>",
"s10.note":"Con sede en la República de Corea · Mantenimiento remoto · Morgan J., arquitecto de IA sin conexión y diseñador de sistemas",

"hero.flag":"IA hors ligne · Sans dépendance · Licence Apache 2.0",
"hero.title":"Une IA hors ligne pour les contextes que l'infrastructure en nuage <span class='accent'>n'atteint pas</span>.",
"hero.sub":"L'IA contemporaine présuppose des centres de données, une alimentation électrique stable, une connectivité continue et une organisation en mesure d'assumer la responsabilité afférente à la protection des données. Pour une part importante de la population mondiale, l'une au moins de ces conditions fait défaut. VitalGuard a été conçu à partir de ce constat&#8239;: un système en fichier unique, sans dépendance, qui fonctionne dans le navigateur d'un téléphone vieux de dix ans, ne requiert aucun serveur et ne collecte aucune donnée personnelle.",

"s1.eyebrow":"Contexte",
"s1.pull":"Sur le terrain, la contrainte tient rarement à la qualité du modèle.",
"s1.body":"<p class='lead'>La puissance de calcul de pointe n'est accessible qu'à un nombre restreint d'institutions et d'États. Dans les camps de réfugiés, les exploitations agricoles hors réseau, les zones sinistrées, les chantiers souterrains, les installations isolées et les régions soumises à des coupures d'accès, les contraintes sont d'une autre nature&#8239;: l'alimentation électrique, la bande passante, le coût unitaire et l'exposition juridique qu'entraîne la collecte de données personnelles.</p><p>Ce projet emprunte la direction inverse de la tendance dominante&#8239;: plutôt que d'ajouter des paramètres, il retire de l'infrastructure&#8239;; plutôt que de collecter des données pour progresser, il n'en collecte aucune. Ce qui subsiste est suffisamment restreint pour être relu ligne à ligne, suffisamment peu coûteux pour être diffusé sans frais, et suffisamment robuste pour continuer de fonctionner une fois la connectivité, le crédit en nuage et le financement épuisés.</p><p>Ces propriétés dépassent largement le cadre humanitaire. Les systèmes destinés aux environnements extrêmes, y compris l'exploration planétaire, sont soumis à des exigences comparables de survivabilité et d'autonomie.</p>",

"s2.eyebrow":"Contraintes de conception",
"s2.h":"Chacune des propriétés ci-dessous relève d'une décision d'architecture et non d'un paramétrage.",
"s2.list":"<li>Aucune infrastructure de serveurs requise</li><li>Aucune bibliothèque externe&#8239;; fichier unique autonome</li><li>Aucun coût d'acquisition ni de location de processeurs graphiques</li><li>Coût marginal quasi nul pour chaque déploiement supplémentaire</li><li>Architecture sans flux sortant</li><li>Aucun contenu chargé depuis un réseau tiers</li><li>Conçu pour la conformité au RGPD (protection dès la conception)</li><li>Consommation énergétique très faible</li><li>Fonctionne sur des appareils réformés, prolongeant leur durée de vie</li><li>Fonctionne sur des puces à très bas coût et une alimentation solaire élémentaire</li><li>Aligné sur les cadres ESG et les Objectifs de développement durable</li><li>Budget concentré sur la recherche plutôt que sur le matériel</li>",
"s2.note":"<b>MÉTHODE —</b> Plutôt qu'un grand modèle d'apprentissage profond, le système associe des automates à états finis, des arbres de comportement et un apprentissage par renforcement léger. Le contrôle d'état fondé sur des règles assure un comportement temps réel stable à faible coût de calcul et, ce qui importe tout autant dans les contextes critiques pour la sécurité, produit des décisions traçables et explicables a posteriori.",

"<article class='card rv' data-tags='disaster'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M4 18h16'/><path d='M7 18V9l5-5 5 5v9'/><path d='M12 13v5'/></svg><span class='tag'>Indépendant de l'infrastructure</span><h3>Réponse aux catastrophes et opérations d'urgence hors réseau</h3><ul><li>Communication maillée entre appareils, sans internet ni couverture cellulaire</li><li>Aide au triage et surveillance des signes vitaux hors ligne</li><li>Appui aux opérations de recherche et de sauvetage lors des coupures d'électricité et de réseau</li></ul><p class='why'>Les premières heures d'une catastrophe sont précisément celles où le réseau est indisponible.</p></article>"+
"<article class='card rv' data-tags='defence'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><rect x='3' y='4' width='18' height='14' rx='1.5'/><path d='M8 21h8M12 18v3M7 9h4M7 13h7'/></svg><span class='tag'>Isolé du réseau</span><h3>Installations isolées et critiques pour la sécurité</h3><ul><li>Infrastructures critiques où tout trafic sortant est proscrit par politique interne</li><li>Fabrication de semi-conducteurs et environnements de production avancée</li><li>Dispositifs médicaux et de santé respectueux de la vie privée</li></ul><p class='why'>«&#8239;Egress Kill Switch&#8239;»&#8239;: la communication sortante peut être désactivée instantanément, ce qui rend l'exfiltration structurellement impossible et non simplement interdite.</p></article>"+
"<article class='card rv' data-tags='esg'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M4 12a8 8 0 0 1 8-8h5'/><path d='M20 12a8 8 0 0 1-8 8H7'/><path d='M14 1.5L17.5 4 14 6.5M10 17.5L6.5 20 10 22.5'/></svg><span class='tag'>Économie circulaire</span><h3>Valorisation des déchets électroniques et surveillance environnementale</h3><ul><li>Téléphones réformés reconvertis en nœuds humanitaires et de surveillance</li><li>Surveillance environnementale et sécurité au travail à faible coût</li><li>Détection acoustique et vibratoire des essaims de criquets dans les régions hors réseau</li></ul><p class='why'>Prolonger la durée de vie des appareils constitue un résultat ESG mesurable et non une simple affirmation.</p></article>"+
"<article class='card rv' data-tags='defence esg'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M3 20h18'/><path d='M6 20V10l6-6 6 6v10'/><circle cx='12' cy='13' r='2'/></svg><span class='tag'>Sites isolés</span><h3>Sites industriels isolés et opérations en périphérie</h3><ul><li>Mines souterraines et travaux en tunnel</li><li>Chantiers de construction et autres environnements dangereux</li><li>Suivi local des équipements et de la sécurité des travailleurs, sans infrastructure réseau</li></ul><p class='why'>Là où s'arrête la connectivité, l'appareil doit continuer de raisonner par lui-même.</p></article>"+
"<article class='card rv' data-tags='agri'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M12 21c0-6 3-9 8-9-1 6-4 9-8 9z'/><path d='M12 21c0-6-3-9-8-9 1 6 4 9 8 9z'/><path d='M12 21v-7'/></svg><span class='tag'>Couverture limitée</span><h3>Agriculture et élevage sur de vastes zones peu couvertes</h3><ul><li>Suivi de l'humidité des sols et de l'état du bétail aux États-Unis, au Canada et en Australie</li><li>Détection précoce du risque sanitaire au sein des troupeaux</li><li>Alertes locales dissuadant le vol de bétail de grande valeur</li></ul><p class='why'>Une surveillance continue et peu énergivore paraît susceptible d'améliorer la productivité là où l'infrastructure de communication est limitée.</p></article>"+
"<article class='card rv' data-tags='consumer esg'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><rect x='7' y='6' width='10' height='12' rx='2'/><path d='M9 6V3h6v3M9 18v3h6v-3'/><path d='M10 12h4'/></svg><span class='tag'>Puces à très bas coût</span><h3>Matériel à très bas coût et alimenté par énergie solaire</h3><ul><li>Montres numériques solaires dotées de fonctions simples de protection de la vie</li><li>Fonctionnement permanent sur des puces à très bas coût</li><li>Incidence négligeable sur le coût unitaire de fabrication</li></ul><p class='why'>L'efficience n'est pas ici une contrainte subie&#8239;: elle constitue la prémisse même de la conception.</p></article>"+
"<article class='card rv' data-tags='rights disaster defence'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><circle cx='12' cy='12' r='2.2'/><path d='M8 8a5.5 5.5 0 0 0 0 8M16 8a5.5 5.5 0 0 1 0 8M5 5a10 10 0 0 0 0 14M19 5a10 10 0 0 1 0 14'/></svg><span class='tag'>BLE et ultrasons</span><h3>Communication locale sans aucun réseau</h3><ul><li>Maillage Bluetooth entre appareils proches</li><li>Transport acoustique et ultrasonore là où la radio est indisponible ou déconseillée</li><li>Apprentissage automatique et balayage BLE en JavaScript pur, sur des appareils Android vieux de dix ans</li></ul><p class='why'>L'objectif de conception pour l'autonomie de terrain est de 60 à 70 jours à consommation minimale, six mois constituant la cible à plus long terme.</p></article>",

"s4.eyebrow":"Architecture",
"s4.h":"Des propriétés de sécurité issues de la structure et non de la politique interne.",
"s4.body":"<p>L'objectif est une architecture en fichier unique et sans dépendance, dont chaque module est écrit à partir des premiers principes afin d'en assurer la complétude et l'autonomie. Rien n'est importé à l'exécution, car tout ce qui est importé à l'exécution peut être retiré par un adversaire, une panne ou l'arrêt d'un service.</p><p><strong>«&#8239;Egress Kill Switch&#8239;»&#8239;:</strong> la communication sortante peut être désactivée instantanément, isolant l'appareil de sorte que l'exfiltration devienne structurellement impossible plutôt qu'administrativement interdite. Cette distinction importe aux organisations tenues de démontrer, et non seulement d'affirmer, que les données ne sortent pas.</p>",
"s4.spec":"<tr><th>Environnement d'exécution</th><td>JavaScript pur, dans le navigateur, fichier unique</td></tr><tr><th>Bibliothèques externes</th><td><span class='ok'>Aucune</span> — sans dépendance ni réseau de diffusion de contenu</td></tr><tr><th>Serveur requis</th><td><span class='ok'>Aucun</span> — sans serveur, sans flux sortant</td></tr><tr><th>Données personnelles collectées</th><td><span class='ok'>Aucune</span> — ni télémétrie ni métadonnées</td></tr><tr><th>Méthode principale</th><td>Automates à états, arbres de comportement et apprentissage par renforcement léger, fondés sur des règles inspectables</td></tr><tr><th>Transport local</th><td>Maillage BLE&#8239;; ultrasons et acoustique</td></tr><tr><th>Matériel minimal</th><td>Appareil Android vieux de dix ans&#8239;; puces à très bas coût&#8239;; alimentation solaire élémentaire</td></tr><tr><th>Autonomie de terrain</th><td>Objectif de conception de 60 à 70 jours&#8239;; six mois à plus long terme</td></tr><tr><th>Positionnement réglementaire</th><td>Protection dès la conception au sens du RGPD&#8239;; alignement sur les cadres ESG et les ODD</td></tr><tr><th>Licence</th><td><span class='ok'>Apache License 2.0</span></td></tr><tr><th>Suppression</th><td>Supprimable à tout moment par l'utilisateur, sans donnée résiduelle</td></tr>",

"s5.eyebrow":"Éthique de conception",
"s5.pull":"La performance technique seule ne détermine pas qu'un système puisse être adopté.",
"s5.body":"<p class='lead'>Dans les déploiements humanitaires et associatifs, l'adoption se décide généralement sur la responsabilité juridique et le risque plutôt que sur la capacité technique. Aussi performant qu'il soit, un système dont subsiste une probabilité de litige substantiel en matière de protection des données suffit souvent à dissuader une ONG ou une organisation internationale de l'adopter.</p><p>Chaque décision de conception découle de cette contrainte&#8239;: réduire les hallucinations dans les domaines sensibles, demeurer suffisamment transparent pour permettre un audit indépendant, fonctionner en milieu peu doté, ne rien collecter, ne transférer aucune responsabilité juridique à l'organisation adoptante, et rester assez simple pour être lu, adapté et supprimé par des personnes non programmeuses.</p><p>L'alignement sur les normes internationales — le RGPD, la Convention relative aux droits de l'enfant et la Convention relative aux droits des personnes handicapées — est traité comme une donnée de conception dès l'origine, et non comme une couche de conformité ajoutée ensuite.</p>",
"s5.scenes":"<div class='scene'><b>Réduire les hallucinations</b><p>Une sortie erronée en protection de l'enfance, en santé ou en réponse aux catastrophes entraîne des conséquences immédiates.</p></div><div class='scene'><b>Rester inspectable</b><p>Code et architecture ouverts, car un système opaque ne peut être défendu lorsqu'il échoue.</p></div><div class='scene'><b>Ne transférer aucune responsabilité</b><p>Sans collecte, sans serveur et sans transfert transfrontalier, aucune responsabilité n'est transmise à l'organisation adoptante.</p></div><div class='scene'><b>Rester supprimable</b><p>Les utilisateurs peuvent supprimer le système et ses données à tout moment&#8239;; la facilité de suppression est une libération de l'obligation.</p></div>",

"s6.eyebrow":"État des examens et de l'audit",
"s6.h":"Chaque élément est présenté avec son stade actuel.",
"s6.lead":"Chaque élément est accompagné de son stade afin d'être lu avec exactitude, et chacun peut être vérifié de manière indépendante au moyen des sources indiquées.",
"s6.grid":"<div><b>Examen de première phase</b><p>Gouvernement du Luxembourg · UCL · IDS (Royaume-Uni)</p><span class='pill done'>Achevé</span></div><div><b>Audit de sécurité</b><p>OTF Security Lab (États-Unis) — USAGM / Open Technology Fund (2026)</p><span class='pill done'>Achevé</span></div><div><b>Article de recherche</b><p><a href='https://mcorpai.org/VitalGuard_Offline_AI.pdf' target='_blank' rel='noopener' style='color:var(--signal);text-decoration:none;'>Offline AI (VitalGuard) — PDF ↗</a></p><span class='pill done'>Publié</span></div><div><b>Diffusion académique</b><p>Soumission à ACM FAccT en préparation&#8239;; ouverture à une future collaboration de recherche avec l'Université d'Oxford</p><span class='pill'>Prévu</span></div><div><b>Positionnement normatif</b><p>Protection dès la conception au sens du RGPD&#8239;; cadres ESG&#8239;; Objectifs de développement durable</p><span class='pill'>Par conception</span></div><div><b>Licence</b><p>Apache License 2.0 — disponible sans frais pour un usage d'intérêt général</p><span class='pill done'>Confirmée</span></div>",
"s6.note":"<b>ÉTAT ET LIMITES —</b> Les démonstrations publiées sont des produits minimaux viables et non des produits achevés&#8239;; aucune validation de terrain à grande échelle n'a encore été menée. Les énoncés relatifs à la conformité décrivent une intention architecturale et des propriétés vérifiables — principalement l'absence de collecte de données personnelles et l'absence de connexion sortante nécessaire — et non une certification délivrée par un tiers. Cette section est rédigée afin que les personnes chargées de l'examen puissent vérifier chaque énoncé de manière indépendante plutôt que de l'accepter sur parole.",

"s7.eyebrow":"Démonstrations",
"s7.h":"Ouvrir le fichier dans un navigateur constitue l'installation complète.",
"s7.lead":"Produits minimaux viables comportant un apprentissage automatique élémentaire embarqué. Capacité&#8239;: une image. Sans compte ni inscription, et aucune donnée ne quitte l'appareil.",
"s7.demos":"<a class='demo' href='https://mcorpai.com/' target='_blank' rel='noopener'><span class='size'>600 ko · Démonstration 01</span><h3>Réseau maillé Bluetooth</h3><p>Maillage entre appareils avec apprentissage automatique léger et balayage BLE, entièrement exécuté dans le navigateur.</p><span class='go'>mcorpai.com ↗</span></a><a class='demo' href='https://mcorpai.net/' target='_blank' rel='noopener'><span class='size'>460 ko · Démonstration 02</span><h3>Bluetooth et ultrasons</h3><p>Transport local acoustique et ultrasonore pour les environnements où la radio est indisponible ou déconseillée.</p><span class='go'>mcorpai.net ↗</span></a><a class='demo' href='https://mcorpai.org/' target='_blank' rel='noopener'><span class='size'>Espace du projet</span><h3>Documents, contact et état d'avancement</h3><p>Documentation actuelle et adresse de correspondance du programme.</p><span class='go'>mcorpai.org ↗</span></a>",
"s7.note":"Aucune collecte de données. Aucune mesure d'audience. Aucune requête vers un tiers, y compris sur cette page, qui ne charge ni police, ni script, ni feuille de style externe.",

"s8.eyebrow":"L'institut",
"s8.h":"Une proposition d'institution à institution, et non une candidature individuelle.",
"s8.body":"<p>L'Institut de recherche M Corp AI doit être établi en République de Corée, en lien avec des partenaires internationaux. Certains projets seront diffusés sans frais sous licence Apache 2.0 pour des usages d'intérêt général. Une part des revenus de l'institut est par ailleurs destinée à soutenir le cinéma d'auteur indépendant ainsi que des enfants atteints de maladies rares, une notation ESG élevée constituant un objectif explicite.</p><p>Le fondateur ne recherche pas un emploi individuel. Ce qui est proposé est un accord de licence technologique et de recherche conjointe entre votre organisation et l'institut, permettant au fondateur de conserver la responsabilité de l'architecture, de l'orientation scientifique et de la mission à long terme.</p>",
"s8.org":"<thead><tr><th>Fonction</th><th>Responsabilité</th></tr></thead><tbody><tr><td>Fondateur et architecte de systèmes d'IA</td><td>Morgan J. — architecture, orientation scientifique, vision à long terme</td></tr><tr><td>Équipe d'ingénierie logicielle</td><td>Trois développeurs établis en Europe de l'Est — développement, mise en œuvre et programmation</td></tr></tbody>",
"s8.note":"<b>OBJECTIF ACTUEL —</b> Établir en République de Corée un institut de recherche indépendant en IA de bas niveau avec une équipe d'ingénierie restreinte, et identifier des partenaires institutionnels en mesure de soutenir sa création et son fonctionnement durable à long terme.",

"s9.eyebrow":"Partenariat",
"s9.h":"Trois formes de collaboration sont actuellement recherchées.",
"s9.items":"<div><span class='n'>01</span><h3>Partenariat de recherche</h3><p>Collaboration à distance avec des équipes universitaires et des instituts de recherche sur l'IA hors ligne, l'informatique en périphérie et la conception de systèmes respectueux de la vie privée, y compris des publications conjointes.</p></div><div><span class='n'>02</span><h3>Licence et R&amp;D conjointe</h3><p>Accords d'institution à institution permettant à votre organisation d'appliquer cette architecture au sein de ses propres programmes, avec l'appui technique de l'institut.</p></div><div><span class='n'>03</span><h3>Financement</h3><p>Soutien à la création et au fonctionnement durable d'un laboratoire indépendant de recherche en IA hors ligne en République de Corée.</p></div>",

"s10.eyebrow":"Contact",
"s10.h":"Correspondance, rapports d'audit et demandes de renseignements.",
"s10.lead":"Le projet est maintenu strictement à distance afin de préserver la neutralité et la concentration. Le courrier électronique constitue le canal approprié pour toute demande, proposition de collaboration ou correspondance relative à un audit. Les réponses sont adressées depuis la République de Corée (KST).",
"s10.links":"<a class='btn' href='https://mcorpai.org/' target='_blank' rel='noopener'>mcorpai.org ↗</a><a class='btn' href='https://mcorpai.org/VitalGuard_Offline_AI.pdf' target='_blank' rel='noopener'>Article de recherche ↗</a>",
"s10.note":"Établi en République de Corée · Maintenu à distance · Morgan J., architecte d'IA hors ligne et concepteur de systèmes",

"foot":"<span class='license-badge'>Apache License 2.0</span><p>© 2026 M Corp AI · VitalGuard</p><p>ESG · Objectifs de développement durable des Nations unies</p><a href='mailto:contact@mcorpai.org'>contact@mcorpai.org</a><p>Cette page ne charge aucune ressource externe et n'enregistre rien sur votre appareil. La langue est détectée une seule fois au chargement et n'est pas conservée.</p>"

"hero.flag":"IA offline · Sem dependências · Licença Apache 2.0",
"hero.title":"IA offline para contextos onde a infraestrutura em nuvem <span class='accent'>não chega</span>.",
"hero.sub":"A IA contemporânea pressupõe centros de dados, eletricidade estável, conectividade contínua e uma organização capaz de assumir a responsabilidade decorrente da proteção de dados. Para uma parte considerável da população mundial, pelo menos um desses pressupostos não se verifica. O VitalGuard foi concebido a partir dessa condição: um sistema de ficheiro único, sem dependências, que funciona no navegador de um telemóvel com dez anos, não exige servidor e não recolhe dados pessoais.",

"s1.eyebrow":"Contexto",
"s1.pull":"No terreno, a restrição raramente é a qualidade do modelo.",
"s1.body":"<p class='lead'>A capacidade de computação de fronteira está ao alcance de um número reduzido de instituições e Estados. Em assentamentos de refugiados, explorações agrícolas fora da rede, zonas de catástrofe, obras subterrâneas, instalações isoladas e regiões sujeitas a cortes de rede, as restrições são de outra natureza: eletricidade, largura de banda, custo unitário e a exposição jurídica que decorre da recolha de dados pessoais.</p><p>Este projeto segue a direção inversa da tendência dominante. Em vez de acrescentar parâmetros, retira infraestrutura; em vez de recolher dados para melhorar, não recolhe nenhum. O que resta é suficientemente pequeno para ser lido linha a linha, suficientemente barato para ser distribuído sem custo e suficientemente robusto para continuar a funcionar depois de esgotadas a conectividade, a verba de nuvem e o financiamento.</p><p>Estas propriedades são relevantes muito para além do domínio humanitário. Os sistemas destinados a ambientes extremos, incluindo a exploração planetária, estão sujeitos a exigências comparáveis de sobrevivência e autossuficiência.</p>",

"s2.eyebrow":"Restrições de conceção",
"s2.h":"Cada propriedade indicada abaixo é uma decisão de arquitetura e não uma opção de configuração.",
"s2.list":"<li>Não exige qualquer infraestrutura de servidores</li><li>Sem bibliotecas externas; ficheiro único autónomo</li><li>Sem custo de aquisição ou aluguer de GPU</li><li>Custo marginal praticamente nulo por cada nova instalação</li><li>Arquitetura sem envio de dados para o exterior</li><li>Nenhum conteúdo carregado a partir de redes de terceiros</li><li>Concebido para conformidade com o RGPD (privacidade desde a conceção)</li><li>Consumo energético muito reduzido</li><li>Funciona em dispositivos retirados de uso, prolongando a sua vida útil</li><li>Opera com chips de custo ínfimo e alimentação solar básica</li><li>Alinhado com os quadros ESG e os Objetivos de Desenvolvimento Sustentável</li><li>Orçamento concentrado na investigação e não no equipamento</li>",
"s2.note":"<b>MÉTODO —</b> Em vez de um modelo extenso de aprendizagem profunda, o sistema combina máquinas de estados finitos, árvores de comportamento e aprendizagem por reforço leve. O controlo de estados baseado em regras assegura um comportamento estável em tempo real com baixo custo computacional e, o que é igualmente importante em contextos críticos para a segurança, produz decisões que podem ser rastreadas e explicadas posteriormente.",

"<article class='card rv' data-tags='disaster'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M4 18h16'/><path d='M7 18V9l5-5 5 5v9'/><path d='M12 13v5'/></svg><span class='tag'>Independente da infraestrutura</span><h3>Resposta a catástrofes e operações de emergência fora da rede</h3><ul><li>Comunicação em malha entre dispositivos, sem internet nem cobertura móvel</li><li>Apoio à triagem e monitorização de sinais vitais sem ligação</li><li>Apoio à busca e salvamento durante falhas de energia e de rede</li></ul><p class='why'>As primeiras horas de uma catástrofe são precisamente aquelas em que a rede está indisponível.</p></article>"+
"<article class='card rv' data-tags='defence'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><rect x='3' y='4' width='18' height='14' rx='1.5'/><path d='M8 21h8M12 18v3M7 9h4M7 13h7'/></svg><span class='tag'>Isolado da rede</span><h3>Instalações isoladas e críticas para a segurança</h3><ul><li>Infraestruturas críticas em que o tráfego de saída é proibido por política interna</li><li>Fabrico de semicondutores e ambientes de produção avançada</li><li>Dispositivos médicos e de saúde que preservam a privacidade</li></ul><p class='why'>Egress Kill Switch: a comunicação de saída pode ser desativada de imediato, tornando a exfiltração estruturalmente impossível e não apenas proibida.</p></article>"+
"<article class='card rv' data-tags='esg'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M4 12a8 8 0 0 1 8-8h5'/><path d='M20 12a8 8 0 0 1-8 8H7'/><path d='M14 1.5L17.5 4 14 6.5M10 17.5L6.5 20 10 22.5'/></svg><span class='tag'>Economia circular</span><h3>Valorização de resíduos eletrónicos e monitorização ambiental</h3><ul><li>Telemóveis retirados de uso reconvertidos em nós humanitários e de monitorização</li><li>Monitorização ambiental e de segurança no trabalho a baixo custo</li><li>Deteção acústica e vibratória de enxames de gafanhotos em regiões fora da rede</li></ul><p class='why'>Prolongar a vida útil dos dispositivos é um resultado ESG mensurável e não uma afirmação.</p></article>"+
"<article class='card rv' data-tags='defence esg'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M3 20h18'/><path d='M6 20V10l6-6 6 6v10'/><circle cx='12' cy='13' r='2'/></svg><span class='tag'>Locais remotos</span><h3>Locais industriais remotos e operações na periferia</h3><ul><li>Minas subterrâneas e trabalhos em túneis</li><li>Estaleiros de construção e outros ambientes perigosos</li><li>Localização de ativos e monitorização da segurança dos trabalhadores sem infraestrutura de rede</li></ul><p class='why'>Onde termina a conectividade, o dispositivo tem de continuar a decidir por si.</p></article>"+
"<article class='card rv' data-tags='agri'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M12 21c0-6 3-9 8-9-1 6-4 9-8 9z'/><path d='M12 21c0-6-3-9-8-9 1 6 4 9 8 9z'/><path d='M12 21v-7'/></svg><span class='tag'>Cobertura limitada</span><h3>Agricultura e pecuária em grandes áreas com pouca cobertura</h3><ul><li>Monitorização da humidade do solo e do estado do gado nos Estados Unidos, Canadá e Austrália</li><li>Indicação precoce de risco sanitário nos efetivos</li><li>Alertas locais que dissuadem o furto de gado de elevado valor</li></ul><p class='why'>A monitorização contínua de baixo consumo pode melhorar a produtividade onde a infraestrutura de comunicações é limitada.</p></article>"+
"<article class='card rv' data-tags='consumer esg'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><rect x='7' y='6' width='10' height='12' rx='2'/><path d='M9 6V3h6v3M9 18v3h6v-3'/><path d='M10 12h4'/></svg><span class='tag'>Silício de custo ínfimo</span><h3>Equipamento de custo muito reduzido e alimentado a energia solar</h3><ul><li>Relógios digitais solares com funções simples de proteção da vida</li><li>Funcionamento permanente em chips de custo ínfimo</li><li>Efeito insignificante no custo unitário de fabrico</li></ul><p class='why'>Aqui a eficiência não é uma limitação aceite a contragosto: é a própria premissa da conceção.</p></article>"+
"<article class='card rv' data-tags='rights disaster defence'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><circle cx='12' cy='12' r='2.2'/><path d='M8 8a5.5 5.5 0 0 0 0 8M16 8a5.5 5.5 0 0 1 0 8M5 5a10 10 0 0 0 0 14M19 5a10 10 0 0 1 0 14'/></svg><span class='tag'>BLE e ultrassons</span><h3>Comunicação local sem qualquer rede</h3><ul><li>Malha Bluetooth entre dispositivos próximos</li><li>Transporte acústico e ultrassónico onde o rádio não está disponível ou não é aconselhável</li><li>Aprendizagem automática e deteção BLE em JavaScript puro, em dispositivos Android com dez anos</li></ul><p class='why'>O objetivo de conceção para a autonomia no terreno é de 60 a 70 dias com consumo mínimo, sendo seis meses a meta a mais longo prazo.</p></article>",

"s4.eyebrow":"Arquitetura",
"s4.h":"Propriedades de segurança decorrentes da estrutura e não da política interna.",
"s4.body":"<p>O objetivo é uma arquitetura de ficheiro único e sem dependências, em que cada módulo é escrito a partir dos primeiros princípios para assegurar integridade e autossuficiência. Nada é importado em tempo de execução, porque tudo o que é importado em tempo de execução pode ser removido por um adversário, por uma falha de serviço ou pela sua descontinuação.</p><p><strong>Egress Kill Switch:</strong> a comunicação de saída pode ser desativada de imediato, isolando o dispositivo de modo que a exfiltração se torne estruturalmente impossível em vez de administrativamente proibida. Esta distinção é relevante para organizações que têm de demonstrar, e não apenas afirmar, que os dados não saem.</p>",
"s4.spec":"<tr><th>Ambiente de execução</th><td>JavaScript puro, no navegador, ficheiro único</td></tr><tr><th>Bibliotecas externas</th><td><span class='ok'>Nenhuma</span> — sem dependências nem CDN</td></tr><tr><th>Requisito de servidor</th><td><span class='ok'>Nenhum</span> — sem servidor e sem envio para o exterior</td></tr><tr><th>Dados pessoais recolhidos</th><td><span class='ok'>Nenhum</span> — sem telemetria nem metadados</td></tr><tr><th>Método principal</th><td>Máquinas de estados, árvores de comportamento e aprendizagem por reforço leve, baseadas em regras e inspecionáveis</td></tr><tr><th>Transporte local</th><td>Malha BLE; ultrassons e acústica</td></tr><tr><th>Equipamento mínimo</th><td>Dispositivo Android com dez anos; chips de custo ínfimo; alimentação solar básica</td></tr><tr><th>Autonomia no terreno</th><td>Objetivo de conceção de 60 a 70 dias; seis meses a mais longo prazo</td></tr><tr><th>Posição de conformidade</th><td>Privacidade desde a conceção nos termos do RGPD; alinhamento com ESG e ODS</td></tr><tr><th>Licença</th><td><span class='ok'>Apache License 2.0</span></td></tr><tr><th>Remoção</th><td>Removível pelo utilizador a qualquer momento, sem dados residuais</td></tr>",

"s5.eyebrow":"Ética de conceção",
"s5.pull":"O desempenho técnico, só por si, não determina que um sistema possa ser adotado.",
"s5.body":"<p class='lead'>Em contextos humanitários e de sociedade civil, a adoção decide-se em regra pela responsabilidade jurídica e pelo risco, e não pela capacidade técnica. Por mais competente que seja um sistema, a probabilidade residual de um litígio significativo em matéria de proteção de dados basta muitas vezes para impedir que uma ONG ou uma organização internacional o adote.</p><p>Cada decisão de conceção decorre dessa restrição: reduzir alucinações em domínios sensíveis, manter transparência suficiente para permitir uma auditoria independente, funcionar em contextos com poucos recursos, não recolher nada, não transferir responsabilidade jurídica para a organização que adota o sistema e manter-se suficientemente simples para que pessoas sem formação em programação o possam ler, adaptar e eliminar.</p><p>O alinhamento com as normas internacionais — o RGPD, a Convenção sobre os Direitos da Criança e a Convenção sobre os Direitos das Pessoas com Deficiência — é tratado como requisito de conceção desde o início e não como uma camada de conformidade acrescentada depois.</p>",
"s5.scenes":"<div class='scene'><b>Reduzir alucinações</b><p>Um resultado incorreto na proteção de crianças, na saúde ou na resposta a catástrofes tem consequências imediatas.</p></div><div class='scene'><b>Ser inspecionável</b><p>Código e arquitetura abertos, porque um sistema opaco não pode ser defendido quando falha.</p></div><div class='scene'><b>Não transferir responsabilidade</b><p>Sem recolha, sem servidor e sem transferência transfronteiriça, nenhuma responsabilidade passa para a organização que adota o sistema.</p></div><div class='scene'><b>Ser removível</b><p>Os utilizadores podem eliminar o sistema e os seus dados a qualquer momento. A facilidade de eliminação é liberdade face à obrigação.</p></div>",

"s6.eyebrow":"Estado das revisões e da auditoria",
"s6.h":"Cada elemento é apresentado com a sua fase atual.",
"s6.lead":"Cada elemento é acompanhado da respetiva fase para que possa ser lido com exatidão, e todos podem ser verificados de forma independente através das fontes indicadas.",
"s6.grid":"<div><b>Revisão de primeira fase</b><p>Governo do Luxemburgo · UCL · IDS (Reino Unido)</p><span class='pill done'>Concluída</span></div><div><b>Auditoria de segurança</b><p>OTF Security Lab dos EUA — USAGM / Open Technology Fund (2026)</p><span class='pill done'>Concluída</span></div><div><b>Artigo de investigação</b><p><a href='https://mcorpai.org/VitalGuard_Offline_AI.pdf' target='_blank' rel='noopener' style='color:var(--signal);text-decoration:none;'>Offline AI (VitalGuard) — PDF ↗</a></p><span class='pill done'>Publicado</span></div><div><b>Divulgação académica</b><p>Submissão à ACM FAccT em preparação; abertura a futura colaboração de investigação com a Universidade de Oxford</p><span class='pill'>Previsto</span></div><div><b>Posição normativa</b><p>Privacidade desde a conceção nos termos do RGPD; quadros ESG; Objetivos de Desenvolvimento Sustentável</p><span class='pill'>Por conceção</span></div><div><b>Licença</b><p>Apache License 2.0 — disponível sem custo para utilização de interesse público</p><span class='pill done'>Confirmada</span></div>",
"s6.note":"<b>ESTADO E LIMITES —</b> As demonstrações publicadas são produtos mínimos viáveis e não produtos acabados, e não foi ainda realizada validação no terreno em larga escala. As afirmações relativas à conformidade descrevem uma intenção arquitetónica e propriedades verificáveis — sobretudo a ausência de recolha de dados pessoais e a inexistência de qualquer ligação de saída necessária — e não uma certificação emitida por terceiros. Esta secção foi redigida para que quem avalia possa verificar cada afirmação de forma independente, em vez de a aceitar por confiança.",

"s7.eyebrow":"Demonstrações",
"s7.h":"Abrir o ficheiro num navegador constitui a instalação completa.",
"s7.lead":"Produtos mínimos viáveis com aprendizagem automática elementar no próprio dispositivo. Capacidade: uma imagem. Sem conta nem registo, e nenhum dado sai do dispositivo.",
"s7.demos":"<a class='demo' href='https://mcorpai.com/' target='_blank' rel='noopener'><span class='size'>600 KB · Demonstração 01</span><h3>Rede em malha por Bluetooth</h3><p>Malha entre dispositivos com aprendizagem automática leve e deteção BLE, executada inteiramente no navegador.</p><span class='go'>mcorpai.com ↗</span></a><a class='demo' href='https://mcorpai.net/' target='_blank' rel='noopener'><span class='size'>460 KB · Demonstração 02</span><h3>Bluetooth e ultrassons</h3><p>Transporte local acústico e ultrassónico para ambientes em que o rádio não está disponível ou não é aconselhável.</p><span class='go'>mcorpai.net ↗</span></a><a class='demo' href='https://mcorpai.org/' target='_blank' rel='noopener'><span class='size'>Espaço do projeto</span><h3>Documentos, contacto e estado</h3><p>Documentação atual e endereço de correspondência do programa.</p><span class='go'>mcorpai.org ↗</span></a>",
"s7.note":"Sem recolha de dados. Sem estatísticas de visitas. Sem pedidos a terceiros, incluindo nesta página, que não carrega qualquer tipo de letra, script ou folha de estilos externa.",

"s8.eyebrow":"O instituto",
"s8.h":"Uma proposta de instituição para instituição, e não uma candidatura individual.",
"s8.body":"<p>Está prevista a criação do Instituto de Investigação M Corp AI na República da Coreia, em articulação com parceiros internacionais. Projetos selecionados serão disponibilizados sem custo ao abrigo da Licença Apache 2.0 para utilização de interesse público. Está igualmente prevista a afetação de parte das receitas do instituto ao apoio ao cinema de autor independente e a crianças com doenças raras, tendo como objetivo explícito uma classificação ESG elevada.</p><p>O fundador não procura emprego individual. O que se propõe é um acordo de licenciamento tecnológico e investigação conjunta entre a vossa organização e o instituto, permitindo ao fundador manter a responsabilidade pela arquitetura, pela orientação científica e pela missão de longo prazo.</p>",
"s8.org":"<thead><tr><th>Função</th><th>Responsabilidade</th></tr></thead><tbody><tr><td>Fundador e arquiteto de sistemas de IA</td><td>Morgan J. — arquitetura, orientação científica e visão de longo prazo</td></tr><tr><td>Equipa de engenharia de software</td><td>Três programadores sediados na Europa de Leste — desenvolvimento, implementação e programação</td></tr></tbody>",
"s8.note":"<b>OBJETIVO ATUAL —</b> Criar na República da Coreia um instituto independente de investigação em IA de baixo nível com uma pequena equipa de engenharia, e identificar parceiros institucionais capazes de apoiar a sua criação e o seu funcionamento sustentável a longo prazo.",

"s9.eyebrow":"Parceria",
"s9.h":"Procuram-se atualmente três formas de colaboração.",
"s9.items":"<div><span class='n'>01</span><h3>Parceria de investigação</h3><p>Colaboração à distância com grupos académicos e institutos de investigação em IA offline, computação na periferia e conceção de sistemas que preservam a privacidade, incluindo publicação conjunta.</p></div><div><span class='n'>02</span><h3>Licenciamento e I&amp;D conjunta</h3><p>Acordos entre instituições que permitam à vossa organização aplicar esta arquitetura nos seus próprios programas, com apoio técnico do instituto.</p></div><div><span class='n'>03</span><h3>Financiamento</h3><p>Apoio à criação e ao funcionamento sustentável de um laboratório independente de investigação em IA offline na República da Coreia.</p></div>",

"s10.eyebrow":"Contacto",
"s10.h":"Correspondência, relatórios de auditoria e pedidos de informação.",
"s10.lead":"O projeto é mantido estritamente à distância, a fim de preservar a neutralidade e a concentração. O correio eletrónico é o canal adequado para qualquer pedido, proposta de colaboração ou correspondência relativa a auditorias. As respostas são enviadas a partir da República da Coreia (KST).",
"s10.links":"<a class='btn' href='https://mcorpai.org/' target='_blank' rel='noopener'>mcorpai.org ↗</a><a class='btn' href='https://mcorpai.org/VitalGuard_Offline_AI.pdf' target='_blank' rel='noopener'>Artigo de investigação ↗</a>",
"s10.note":"Sediado na República da Coreia · Mantido remotamente · Morgan J., arquiteto de IA offline e projetista de sistemas",

"hero.flag":"離線 AI ・ 零相依 ・ Apache License 2.0",
"hero.title":"為雲端基礎設施<span class='accent'>無法觸及之處</span>而設計的離線 AI。",
"hero.sub":"當代 AI 預設了資料中心、穩定電力、不中斷的連線，以及一個有能力承擔資料保護責任的組織。對全球相當比例的人口而言，上述前提至少有一項並不成立。VitalGuard 正是從這個條件出發：單一檔案、零相依的系統，可在十年前的智慧型手機瀏覽器中執行，不需要伺服器，也不蒐集任何個人資料。",

"s1.eyebrow":"背景",
"s1.pull":"現場的限制條件，鮮少是模型效能。",
"s1.body":"<p class='lead'>前沿規模的運算資源，僅有少數機構與國家負擔得起。在難民安置區、電網之外的農地、災區、地下作業現場、實體隔離設施，以及網路遭到封鎖的地區，限制條件的性質完全不同：電力、頻寬、單位成本，以及蒐集個人資料所帶來的法律風險。</p><p>本專案採取與主流相反的方向。與其增加參數，不如移除基礎設施；與其為了改善而蒐集資料，不如完全不蒐集。最終留下的系統，小到足以逐行檢視，便宜到足以無償散布，並且穩固到在連線、雲端額度與經費耗盡之後仍能持續運作。</p><p>同樣的性質在人道領域之外亦具意義。包含行星探測在內、為極端環境設計的系統，在存活能力與自給自足方面同樣受到相近的要求。</p>",

"s2.eyebrow":"設計限制",
"s2.h":"以下每一項均為架構層級的決定，而非可調整的設定選項。",
"s2.list":"<li>不需要任何伺服器基礎設施</li><li>不使用外部函式庫；自我完備的單一檔案</li><li>無 GPU 採購或租用成本</li><li>每增加一處部署的邊際成本趨近於零</li><li>不對外傳送資料的架構</li><li>不從第三方網路載入任何內容</li><li>依循 GDPR 之設計（Privacy-by-Design）</li><li>極低耗電</li><li>可於除役裝置上運作，延長硬體壽命</li><li>可於一美元等級晶片與基本太陽能供電下運作</li><li>與 ESG 架構及聯合國永續發展目標一致</li><li>預算集中於研究人力而非硬體</li>",
"s2.note":"<b>方法 —</b> 系統並未採用大型深度學習模型，而是結合有限狀態機、行為樹與輕量強化學習。以規則為基礎的狀態控制，能在低運算成本下提供穩定的即時行為；在攸關安全的情境中同樣重要的是，其判斷可於事後追溯並加以說明。",

"s4.eyebrow":"架構",
"s4.h":"源自結構而非管理規範的安全性質。",
"s4.body":"<p>目標是單一檔案、零相依的架構，其中每一模組均自基本原理寫起，以確保完備與自足。執行階段不載入任何外部資源，因為凡是在執行階段載入之物，都可能被攻擊者、服務中斷或服務終止所移除。</p><p><strong>Egress Kill Switch：</strong>可即時關閉對外通訊並隔離裝置，使資料外洩成為結構上不可能之事，而非行政上的禁止。對於必須「證明」而非僅「聲明」資料不會外流的組織而言，此一區別至關重要。</p>",
"s4.spec":"<tr><th>執行環境</th><td>純 JavaScript，瀏覽器內執行，單一檔案</td></tr><tr><th>外部函式庫</th><td><span class='ok'>無</span> — 零相依，不使用 CDN</td></tr><tr><th>伺服器需求</th><td><span class='ok'>無</span> — 無伺服器，不對外傳送</td></tr><tr><th>蒐集之個人資料</th><td><span class='ok'>無</span> — 無遙測資料，亦無中繼資料</td></tr><tr><th>核心方法</th><td>有限狀態機＋行為樹＋輕量強化學習（規則導向，可供檢視）</td></tr><tr><th>近距離傳輸</th><td>BLE 網狀網路；超音波與聲波</td></tr><tr><th>最低硬體需求</th><td>十年前的 Android 裝置；一美元等級晶片；基本太陽能供電</td></tr><tr><th>現場續航</th><td>設計目標 60 至 70 日；長期目標六個月</td></tr><tr><th>法遵立場</th><td>依 GDPR 之 Privacy-by-Design；與 ESG 及聯合國 SDGs 一致</td></tr><tr><th>授權條款</th><td><span class='ok'>Apache License 2.0</span></td></tr><tr><th>移除</th><td>使用者可隨時刪除，不留存任何資料</td></tr>",

"s5.eyebrow":"設計倫理",
"s5.pull":"僅有技術效能，並不足以決定一套系統能否被採用。",
"s5.body":"<p class='lead'>在人道與公民社會的現場，決定是否採用的通常是法律責任與風險，而非技術能力。無論系統效能多高，只要仍存在發生重大資料保護爭議的可能性，往往就足以使非政府組織或國際組織放棄採用。</p><p>本設計的每一項判斷皆源自此一限制：於敏感領域降低幻覺、維持足以接受獨立稽核的透明度、可在低資源環境運作、不蒐集任何資料、不將法律責任轉嫁予採用機構，並且簡單到非程式開發人員也能閱讀、修改與刪除。</p><p>與 GDPR、兒童權利公約及身心障礙者權利公約等國際規範的一致性，自始即視為設計條件，而非事後附加的法遵程序。</p>",
"s5.scenes":"<div class='scene'><b>降低幻覺</b><p>於兒童保護、醫療照護或災害應變中的錯誤輸出，會立即產生後果。</p></div><div class='scene'><b>可供檢視</b><p>公開程式碼與架構；無法說明的系統，在失效時無從辯護。</p></div><div class='scene'><b>不轉嫁責任</b><p>不蒐集、無伺服器、無跨境傳輸，因此不會有責任轉移至採用機構。</p></div><div class='scene'><b>可隨時刪除</b><p>使用者可隨時移除系統與資料。刪除的容易度，即是免於義務的自由。</p></div>",

"s6.eyebrow":"審查與稽核狀態",
"s6.h":"各項目均載明其現行階段。",
"s6.lead":"各項目均標示所處階段以利精確理解，且皆可透過所列來源獨立查證。",
"s6.grid":"<div><b>第一階段審查</b><p>盧森堡政府 ・ UCL ・ IDS（英國）</p><span class='pill done'>已完成</span></div><div><b>資安稽核</b><p>美國 OTF Security Lab — USAGM／Open Technology Fund（2026 年）</p><span class='pill done'>已完成</span></div><div><b>研究論文</b><p><a href='https://mcorpai.org/VitalGuard_Offline_AI.pdf' target='_blank' rel='noopener' style='color:var(--signal);text-decoration:none;'>Offline AI（VitalGuard）— PDF ↗</a></p><span class='pill done'>已公開</span></div><div><b>學術發表</b><p>正籌備投稿 ACM FAccT；亦對與牛津大學未來之共同研究持開放態度</p><span class='pill'>規劃中</span></div><div><b>規範對應</b><p>依 GDPR 之 Privacy-by-Design；ESG 架構；聯合國永續發展目標</p><span class='pill'>設計層級</span></div><div><b>授權條款</b><p>Apache License 2.0 — 公益用途可無償使用</p><span class='pill done'>已確定</span></div>",
"s6.note":"<b>現況與限制 —</b> 已公開的示範為最小可行實作而非完成品，尚未進行大規模實地驗證。有關法遵之敘述所指者，係架構意圖與可查證之性質，亦即不蒐集任何個人資料、且不需要任何對外連線，而非由第三方核發之驗證。本節之撰寫，係為使審查者能就各項敘述獨立查證，而非僅憑信任接受。",

"s7.eyebrow":"示範",
"s7.h":"以瀏覽器開啟檔案，即是全部的安裝程序。",
"s7.lead":"包含裝置端基本機器學習的最小可行實作。容量約一張影像。無需帳號或註冊，亦無任何資料離開裝置。",
"s7.demos":"<a class='demo' href='https://mcorpai.com/' target='_blank' rel='noopener'><span class='size'>600 KB ・ 示範 01</span><h3>藍牙網狀網路</h3><p>裝置間網狀連線結合輕量機器學習與 BLE 掃描，全程於瀏覽器內執行。</p><span class='go'>mcorpai.com ↗</span></a><a class='demo' href='https://mcorpai.net/' target='_blank' rel='noopener'><span class='size'>460 KB ・ 示範 02</span><h3>藍牙與超音波</h3><p>適用於無法或不宜使用無線電之環境的聲波與超音波近距離傳輸。</p><span class='go'>mcorpai.net ↗</span></a><a class='demo' href='https://mcorpai.org/' target='_blank' rel='noopener'><span class='size'>專案窗口</span><h3>論文、聯絡方式與進度</h3><p>本計畫之現行文件與聯絡地址。</p><span class='go'>mcorpai.org ↗</span></a>",
"s7.note":"不蒐集資料。不進行流量分析。無第三方請求。本頁本身亦未載入任何外部字型、程式或樣式表。",

"s8.eyebrow":"研究院",
"s8.h":"這是機構對機構的提案，而非個人求職。",
"s8.body":"<p>M Corp AI 研究院預定於大韓民國設立，並與國際夥伴協力推動。經選定之專案將依 Apache License 2.0 無償公開，供公益用途使用。研究院並預計將部分收益用於支持獨立藝術電影及罕見疾病兒童，並以取得高水準 ESG 評等為明確目標。</p><p>創辦人並非尋求個人受僱。此處提出者，係貴機構與研究院之間的技術授權暨共同研究協議，使創辦人得以專注於架構、研究方向與長期使命。</p>",
"s8.org":"<thead><tr><th>職務</th><th>職責</th></tr></thead><tbody><tr><td>創辦人暨 AI 系統架構師</td><td>Morgan J. — 架構、研究方向、長期構想</td></tr><tr><td>軟體工程團隊</td><td>三名東歐開發人員 — 開發、實作與程式撰寫</td></tr></tbody>",
"s8.note":"<b>當前目標 —</b> 以小型工程團隊於大韓民國設立獨立的低階 AI 研究院，並尋求能支持其設立與長期永續運作的機構夥伴。",

"s9.eyebrow":"合作",
"s9.h":"目前尋求三種形式的合作。",
"s9.items":"<div><span class='n'>01</span><h3>共同研究</h3><p>就離線 AI、邊緣運算與隱私保護系統設計，與學術團隊及研究機構進行遠端協作，並包含共同發表論文。</p></div><div><span class='n'>02</span><h3>授權與共同研發</h3><p>使貴機構得於自身計畫中運用本架構的機構間協議，並由研究院提供技術支援。</p></div><div><span class='n'>03</span><h3>經費支持</h3><p>支持於大韓民國設立獨立的離線 AI 研究據點並維持其永續運作。</p></div>",

"<article class='card rv' data-tags='disaster'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M4 18h16'/><path d='M7 18V9l5-5 5 5v9'/><path d='M12 13v5'/></svg><span class='tag'>अवसंरचना पर निर्भर नहीं</span><h3>आपदा प्रतिक्रिया एवं ग्रिड से बाहर आपात संचालन</h3><ul><li>इंटरनेट या मोबाइल सेवा के बिना उपकरणों के बीच मेश संचार</li><li>ऑफ़लाइन ट्राइएज सहायता तथा प्राणसूचक संकेतों की निगरानी</li><li>बिजली एवं नेटवर्क बाधित होने पर खोज एवं बचाव में सहयोग</li></ul><p class='why'>आपदा के प्रथम कुछ घंटे ठीक वही समय होते हैं जब नेटवर्क उपलब्ध नहीं होता।</p></article>"+
"<article class='card rv' data-tags='defence'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><rect x='3' y='4' width='18' height='14' rx='1.5'/><path d='M8 21h8M12 18v3M7 9h4M7 13h7'/></svg><span class='tag'>नेटवर्क से पृथक्</span><h3>नेटवर्क से पृथक् तथा सुरक्षा-संवेदनशील प्रतिष्ठान</h3><ul><li>ऐसी महत्वपूर्ण अवसंरचना जहाँ बाहर जाने वाला ट्रैफ़िक नीतिगत रूप से वर्जित है</li><li>अर्धचालक निर्माण तथा उन्नत विनिर्माण परिवेश</li><li>निजता की रक्षा करने वाले चिकित्सा एवं स्वास्थ्य उपकरण</li></ul><p class='why'>Egress Kill Switch: बाहर जाने वाला संचार तत्काल बंद किया जा सकता है, जिससे डेटा का निर्गमन नियमतः वर्जित नहीं बल्कि संरचनात्मक रूप से असंभव हो जाता है।</p></article>"+
"<article class='card rv' data-tags='esg'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M4 12a8 8 0 0 1 8-8h5'/><path d='M20 12a8 8 0 0 1-8 8H7'/><path d='M14 1.5L17.5 4 14 6.5M10 17.5L6.5 20 10 22.5'/></svg><span class='tag'>चक्रीय अर्थव्यवस्था</span><h3>ई-कचरे का पुनरुपयोग एवं पर्यावरणीय निगरानी</h3><ul><li>सेवामुक्त स्मार्टफ़ोन मानवीय सहायता एवं निगरानी नोड के रूप में पुन: प्रयुक्त</li><li>अल्प लागत पर पर्यावरणीय तथा कार्यस्थल सुरक्षा निगरानी</li><li>ग्रिड से बाहर के क्षेत्रों में टिड्डी दलों की ध्वनिक एवं कंपन आधारित पहचान</li></ul><p class='why'>उपकरणों का जीवनकाल बढ़ाना मापनीय ESG परिणाम है, केवल दावा नहीं।</p></article>"+
"<article class='card rv' data-tags='defence esg'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M3 20h18'/><path d='M6 20V10l6-6 6 6v10'/><circle cx='12' cy='13' r='2'/></svg><span class='tag'>दूरस्थ संचालन</span><h3>दूरस्थ औद्योगिक स्थल एवं एज संचालन</h3><ul><li>भूमिगत खदानें तथा सुरंग कार्य</li><li>निर्माण स्थल एवं अन्य संकटपूर्ण कार्यक्षेत्र</li><li>नेटवर्क अवसंरचना के बिना स्थानीय परिसंपत्ति अनुवीक्षण तथा श्रमिक सुरक्षा निगरानी</li></ul><p class='why'>जहाँ संपर्क समाप्त होता है, वहाँ उपकरण को स्वयं निर्णय लेते रहना पड़ता है।</p></article>"+
"<article class='card rv' data-tags='agri'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M12 21c0-6 3-9 8-9-1 6-4 9-8 9z'/><path d='M12 21c0-6-3-9-8-9 1 6 4 9 8 9z'/><path d='M12 21v-7'/></svg><span class='tag'>सीमित कवरेज</span><h3>विस्तृत एवं अल्प कवरेज वाले क्षेत्रों में कृषि तथा पशुपालन</h3><ul><li>संयुक्त राज्य अमेरिका, कनाडा एवं ऑस्ट्रेलिया में मृदा नमी तथा पशुओं की दशा की निगरानी</li><li>झुंड में रोग जोखिम की प्रारंभिक पहचान</li><li>मूल्यवान पशुधन की चोरी रोकने हेतु स्थानीय चेतावनी</li></ul><p class='why'>जहाँ संचार अवसंरचना सीमित है, वहाँ कम विद्युत खपत वाली सतत निगरानी उत्पादकता बढ़ा सकती है।</p></article>"+
"<article class='card rv' data-tags='consumer esg'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><rect x='7' y='6' width='10' height='12' rx='2'/><path d='M9 6V3h6v3M9 18v3h6v-3'/><path d='M10 12h4'/></svg><span class='tag'>एक डॉलर श्रेणी की चिप</span><h3>अत्यल्प लागत तथा सौर ऊर्जा चालित उपकरण</h3><ul><li>जीवनरक्षक सरल कार्यों से युक्त सौर ऊर्जा चालित डिजिटल घड़ियाँ</li><li>अत्यल्प लागत वाली चिप पर निरंतर संचालन</li><li>प्रति इकाई विनिर्माण लागत पर नगण्य प्रभाव</li></ul><p class='why'>यहाँ दक्षता विवशता में स्वीकारी गई सीमा नहीं, अपितु अभिकल्पना का मूल आधार है।</p></article>"+
"<article class='card rv' data-tags='rights disaster defence'><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.4'><circle cx='12' cy='12' r='2.2'/><path d='M8 8a5.5 5.5 0 0 0 0 8M16 8a5.5 5.5 0 0 1 0 8M5 5a10 10 0 0 0 0 14M19 5a10 10 0 0 1 0 14'/></svg><span class='tag'>BLE एवं पराश्रव्य</span><h3>बिना किसी नेटवर्क के स्थानीय संचार</h3><ul><li>निकटवर्ती उपकरणों के बीच ब्लूटूथ मेश</li><li>जहाँ रेडियो उपलब्ध अथवा उपयुक्त न हो, वहाँ पराश्रव्य एवं ध्वनिक संचरण</li><li>दस वर्ष पुराने Android उपकरणों पर शुद्ध JavaScript में मशीन लर्निंग तथा BLE स्कैनिंग</li></ul><p class='why'>क्षेत्रीय संचालन हेतु अभिकल्पित लक्ष्य न्यूनतम विद्युत खपत पर 60 से 70 दिन है, तथा दीर्घकालिक लक्ष्य छह माह।</p></article>",

"s4.eyebrow":"वास्तुकला",
"s4.h":"सुरक्षा गुण जो नीति से नहीं, संरचना से उत्पन्न होते हैं।",
"s4.body":"<p>लक्ष्य ऐसी एकल-फ़ाइल, शून्य-निर्भरता वाली वास्तुकला है जिसमें प्रत्येक मॉड्यूल पूर्णता एवं आत्मनिर्भरता हेतु मूल सिद्धांतों से लिखा गया है। निष्पादन के समय कुछ भी बाहर से नहीं लिया जाता, क्योंकि निष्पादन के समय लिया गया प्रत्येक अवयव किसी प्रतिपक्षी, किसी व्यवधान अथवा किसी बंद कर दी गई सेवा द्वारा छीना जा सकता है।</p><p><strong>Egress Kill Switch:</strong> बाहर जाने वाला संचार तत्काल निष्क्रिय किया जा सकता है, जिससे उपकरण पृथक् हो जाता है और डेटा का निर्गमन प्रशासनिक रूप से वर्जित होने के स्थान पर संरचनात्मक रूप से असंभव हो जाता है। जिन संस्थाओं को यह केवल कहना नहीं, अपितु सिद्ध करना होता है कि डेटा बाहर नहीं जाता, उनके लिए यह भेद महत्वपूर्ण है।</p>",
"s4.spec":"<tr><th>निष्पादन परिवेश</th><td>शुद्ध JavaScript, ब्राउज़र के भीतर, एकल फ़ाइल</td></tr><tr><th>बाहरी लाइब्रेरी</th><td><span class='ok'>कोई नहीं</span> — शून्य निर्भरता, CDN का प्रयोग नहीं</td></tr><tr><th>सर्वर आवश्यकता</th><td><span class='ok'>कोई नहीं</span> — सर्वर रहित, बाहर कोई प्रेषण नहीं</td></tr><tr><th>एकत्रित व्यक्तिगत डेटा</th><td><span class='ok'>कोई नहीं</span> — न टेलीमेट्री, न मेटाडेटा</td></tr><tr><th>मूल पद्धति</th><td>परिमित अवस्था मशीन + व्यवहार वृक्ष + हल्का प्रबलन अधिगम (नियम आधारित, परीक्षणीय)</td></tr><tr><th>स्थानीय संचरण</th><td>BLE मेश; पराश्रव्य एवं ध्वनिक</td></tr><tr><th>न्यूनतम उपकरण</th><td>दस वर्ष पुराना Android उपकरण; एक डॉलर श्रेणी की चिप; सामान्य सौर आपूर्ति</td></tr><tr><th>क्षेत्रीय संचालन अवधि</th><td>अभिकल्पित लक्ष्य 60 से 70 दिन; दीर्घकालिक लक्ष्य छह माह</td></tr><tr><th>अनुपालन स्थिति</th><td>GDPR के अनुसार Privacy-by-Design; ESG तथा संयुक्त राष्ट्र SDG के अनुरूप</td></tr><tr><th>अनुज्ञप्ति</th><td><span class='ok'>Apache License 2.0</span></td></tr><tr><th>निष्कासन</th><td>उपयोगकर्ता कभी भी हटा सकते हैं, कोई अवशिष्ट डेटा नहीं</td></tr>",

"s5.eyebrow":"अभिकल्पना नैतिकता",
"s5.pull":"केवल तकनीकी निष्पादन से यह तय नहीं होता कि कोई प्रणाली अपनाई जा सकेगी।",
"s5.body":"<p class='lead'>मानवीय सहायता तथा नागरिक समाज के कार्यक्षेत्रों में अपनाने का निर्णय प्रायः तकनीकी क्षमता से नहीं, अपितु विधिक उत्तरदायित्व एवं जोखिम से होता है। प्रणाली कितनी ही सक्षम क्यों न हो, डेटा संरक्षण संबंधी किसी बड़े विवाद की अवशिष्ट संभावना भी प्रायः इतनी पर्याप्त होती है कि कोई स्वयंसेवी अथवा अंतर्राष्ट्रीय संस्था उसे अपनाने से रुक जाती है।</p><p>यहाँ का प्रत्येक अभिकल्पना निर्णय इसी बाध्यता से निकला है: संवेदनशील क्षेत्रों में मतिभ्रम घटाना, स्वतंत्र अंकेक्षण योग्य पारदर्शिता बनाए रखना, अल्प संसाधन वाले परिवेश में कार्य करना, कुछ भी एकत्र न करना, अपनाने वाली संस्था पर कोई विधिक दायित्व न डालना, तथा इतना सरल बने रहना कि प्रोग्रामिंग न जानने वाले कर्मी भी उसे पढ़, अनुकूलित एवं विलोपित कर सकें।</p><p>GDPR, बाल अधिकार अभिसमय तथा दिव्यांगजन अधिकार अभिसमय जैसे अंतर्राष्ट्रीय मानकों के साथ संगति को आरंभ से ही अभिकल्पना की शर्त माना गया है, बाद में जोड़ी जाने वाली अनुपालन परत नहीं।</p>",
"s5.scenes":"<div class='scene'><b>मतिभ्रम घटाना</b><p>बाल संरक्षण, स्वास्थ्य सेवा अथवा आपदा प्रतिक्रिया में त्रुटिपूर्ण परिणाम के तात्कालिक दुष्परिणाम होते हैं।</p></div><div class='scene'><b>परीक्षणीय रहना</b><p>खुला कोड एवं खुली वास्तुकला, क्योंकि अपारदर्शी प्रणाली विफल होने पर उसका बचाव संभव नहीं।</p></div><div class='scene'><b>दायित्व न सौंपना</b><p>न संग्रह, न सर्वर, न सीमापार अंतरण; अतः अपनाने वाली संस्था पर कोई दायित्व नहीं आता।</p></div><div class='scene'><b>विलोपनीय रहना</b><p>उपयोगकर्ता प्रणाली एवं उसका डेटा कभी भी हटा सकते हैं। विलोपन की सुगमता ही दायित्व से मुक्ति है।</p></div>",

"s6.eyebrow":"समीक्षा एवं अंकेक्षण स्थिति",
"s6.h":"प्रत्येक मद अपनी वर्तमान अवस्था सहित प्रस्तुत है।",
"s6.lead":"प्रत्येक मद के साथ उसकी अवस्था अंकित है ताकि उसे यथार्थ रूप में पढ़ा जा सके, और प्रत्येक को उल्लिखित स्रोतों के माध्यम से स्वतंत्र रूप से सत्यापित किया जा सकता है।",
"s6.grid":"<div><b>प्रथम चरण समीक्षा</b><p>लक्ज़मबर्ग सरकार · UCL · IDS (यूनाइटेड किंगडम)</p><span class='pill done'>पूर्ण</span></div><div><b>सुरक्षा अंकेक्षण</b><p>अमेरिकी OTF Security Lab — USAGM / Open Technology Fund (2026)</p><span class='pill done'>पूर्ण</span></div><div><b>शोध पत्र</b><p><a href='https://mcorpai.org/VitalGuard_Offline_AI.pdf' target='_blank' rel='noopener' style='color:var(--signal);text-decoration:none;'>Offline AI (VitalGuard) — PDF ↗</a></p><span class='pill done'>प्रकाशित</span></div><div><b>शैक्षणिक प्रस्तुति</b><p>ACM FAccT हेतु प्रस्तुति की तैयारी; ऑक्सफ़ोर्ड विश्वविद्यालय के साथ भावी शोध सहयोग हेतु खुला</p><span class='pill'>प्रस्तावित</span></div><div><b>मानक अनुपालन</b><p>GDPR अनुसार Privacy-by-Design; ESG ढाँचे; संयुक्त राष्ट्र सतत विकास लक्ष्य</p><span class='pill'>अभिकल्पना में निहित</span></div><div><b>अनुज्ञप्ति</b><p>Apache License 2.0 — लोकहित उपयोग हेतु नि:शुल्क उपलब्ध</p><span class='pill done'>निश्चित</span></div>",
"s6.note":"<b>वर्तमान स्थिति एवं सीमाएँ —</b> प्रकाशित प्रदर्शन पूर्ण उत्पाद नहीं, अपितु न्यूनतम व्यवहार्य कार्यान्वयन हैं, तथा व्यापक स्तर पर क्षेत्रीय सत्यापन अभी नहीं किया गया है। अनुपालन संबंधी कथन किसी तृतीय पक्ष द्वारा जारी प्रमाणन नहीं, अपितु वास्तुकला संबंधी अभिप्राय तथा सत्यापनीय गुणों को इंगित करते हैं — मुख्यतः यह कि कोई व्यक्तिगत डेटा एकत्र नहीं होता और बाहर जाने वाले किसी संपर्क की आवश्यकता नहीं। यह खंड इसलिए लिखा गया है कि समीक्षक प्रत्येक कथन को विश्वास के आधार पर स्वीकार करने के स्थान पर स्वतंत्र रूप से जाँच सकें।",

"s7.eyebrow":"प्रदर्शन",
"s7.h":"ब्राउज़र में फ़ाइल खोलना ही संपूर्ण संस्थापन है।",
"s7.lead":"उपकरण पर ही चलने वाले प्रारंभिक मशीन लर्निंग सहित न्यूनतम व्यवहार्य कार्यान्वयन। क्षमता: एक छवि। न कोई खाता, न पंजीकरण, और कोई डेटा उपकरण से बाहर नहीं जाता।",
"s7.demos":"<a class='demo' href='https://mcorpai.com/' target='_blank' rel='noopener'><span class='size'>600 KB · प्रदर्शन 01</span><h3>ब्लूटूथ मेश नेटवर्क</h3><p>उपकरणों के बीच मेश के साथ हल्का मशीन लर्निंग एवं BLE स्कैनिंग, संपूर्ण प्रक्रिया ब्राउज़र के भीतर।</p><span class='go'>mcorpai.com ↗</span></a><a class='demo' href='https://mcorpai.net/' target='_blank' rel='noopener'><span class='size'>460 KB · प्रदर्शन 02</span><h3>ब्लूटूथ एवं पराश्रव्य</h3><p>जहाँ रेडियो उपलब्ध अथवा उपयुक्त न हो, ऐसे परिवेशों हेतु ध्वनिक एवं पराश्रव्य स्थानीय संचरण।</p><span class='go'>mcorpai.net ↗</span></a><a class='demo' href='https://mcorpai.org/' target='_blank' rel='noopener'><span class='size'>परियोजना केंद्र</span><h3>शोध पत्र, संपर्क एवं प्रगति</h3><p>इस कार्यक्रम से संबंधित वर्तमान दस्तावेज़ तथा पत्राचार पता।</p><span class='go'>mcorpai.org ↗</span></a>",
"s7.note":"कोई डेटा संग्रह नहीं। कोई विश्लेषिकी नहीं। कोई तृतीय-पक्ष अनुरोध नहीं — यह पृष्ठ भी कोई बाहरी फ़ॉन्ट, स्क्रिप्ट अथवा स्टाइलशीट नहीं लेता।",

"s8.eyebrow":"संस्थान",
"s8.h":"यह संस्था-से-संस्था प्रस्ताव है, व्यक्तिगत नियुक्ति हेतु आवेदन नहीं।",
"s8.body":"<p>M Corp AI अनुसंधान संस्थान की स्थापना कोरिया गणराज्य में प्रस्तावित है, जो अंतर्राष्ट्रीय भागीदारों के साथ कार्य करेगा। चयनित परियोजनाएँ लोकहित उपयोग हेतु Apache License 2.0 के अंतर्गत नि:शुल्क उपलब्ध कराई जाएँगी। संस्थान की आय का एक भाग स्वतंत्र कला फ़िल्मों तथा दुर्लभ रोगों से ग्रस्त बच्चों की सहायता हेतु नियत करने की योजना है, जिसमें उच्च ESG मूल्यांकन एक घोषित लक्ष्य है।</p><p>संस्थापक व्यक्तिगत रोज़गार के अभिलाषी नहीं हैं। यहाँ जो प्रस्तावित है वह आपकी संस्था तथा इस संस्थान के मध्य प्रौद्योगिकी अनुज्ञप्ति एवं संयुक्त अनुसंधान समझौता है, जिससे संस्थापक वास्तुकला, अनुसंधान दिशा तथा दीर्घकालिक ध्येय पर केंद्रित रह सकें।</p>",
"s8.org":"<thead><tr><th>भूमिका</th><th>उत्तरदायित्व</th></tr></thead><tbody><tr><td>संस्थापक एवं एआई प्रणाली वास्तुकार</td><td>Morgan J. — वास्तुकला, अनुसंधान दिशा, दीर्घकालिक दृष्टि</td></tr><tr><td>सॉफ़्टवेयर अभियांत्रिकी दल</td><td>पूर्वी यूरोप स्थित तीन डेवलपर — विकास, कार्यान्वयन एवं कोडिंग</td></tr></tbody>",
"s8.note":"<b>वर्तमान लक्ष्य —</b> एक छोटे अभियांत्रिकी दल के साथ कोरिया गणराज्य में निम्न-स्तरीय एआई का स्वतंत्र अनुसंधान संस्थान स्थापित करना, तथा ऐसे संस्थागत भागीदारों की पहचान करना जो उसकी स्थापना एवं दीर्घकालिक संधारणीय संचालन में सहयोग दे सकें।",

"s9.eyebrow":"सहयोग",
"s9.h":"इस समय तीन प्रकार के सहयोग अपेक्षित हैं।",
"s9.items":"<div><span class='n'>01</span><h3>अनुसंधान भागीदारी</h3><p>ऑफ़लाइन एआई, एज कंप्यूटिंग तथा निजता-संरक्षी प्रणाली अभिकल्पना पर शैक्षणिक समूहों एवं अनुसंधान संस्थानों के साथ दूरस्थ सहयोग, जिसमें संयुक्त प्रकाशन सम्मिलित है।</p></div><div><span class='n'>02</span><h3>अनुज्ञप्ति एवं संयुक्त अनुसंधान</h3><p>संस्थाओं के बीच ऐसे समझौते जिनसे आपकी संस्था इस वास्तुकला को अपने कार्यक्रमों में प्रयुक्त कर सके, साथ में संस्थान का तकनीकी सहयोग।</p></div><div><span class='n'>03</span><h3>वित्तीय सहायता</h3><p>कोरिया गणराज्य में स्वतंत्र ऑफ़लाइन एआई अनुसंधान प्रयोगशाला की स्थापना एवं संधारणीय संचालन हेतु सहयोग।</p></div>",

"s10.h":"पत्राचार, अंकेक्षण प्रतिवेदन एवं जिज्ञासाएँ।",
"s10.lead":"तटस्थता एवं एकाग्रता बनाए रखने हेतु यह परियोजना पूर्णतः दूरस्थ रूप से संचालित है। समस्त जिज्ञासाओं, सहयोग प्रस्तावों तथा अंकेक्षण संबंधी पत्राचार हेतु ईमेल ही उपयुक्त माध्यम है। उत्तर कोरिया गणराज्य के मानक समय (KST) के अनुसार भेजे जाते हैं।",

"hero.title":"Offline-KI für Kontexte, die Cloud-Infrastruktur <span class='accent'>nicht erreicht</span>.",
"hero.sub":"Gegenwärtige KI setzt Rechenzentren, eine stabile Stromversorgung, durchgehende Konnektivität sowie eine Organisation voraus, die datenschutzrechtliche Verantwortung tragen kann. Für einen erheblichen Teil der Weltbevölkerung ist mindestens eine dieser Voraussetzungen nicht gegeben. VitalGuard wurde von dieser Ausgangslage her entworfen: ein Ein-Datei-System ohne Abhängigkeiten, das im Browser eines zehn Jahre alten Smartphones läuft, keinen Server benötigt und keine personenbezogenen Daten erhebt.",

"s1.eyebrow":"Ausgangslage",
"s1.pull":"Im Feld ist die begrenzende Größe selten die Modellqualität.",
"s1.body":"<p class='lead'>Rechenleistung auf dem Stand der Spitzenforschung steht nur wenigen Institutionen und Staaten zur Verfügung. In Flüchtlingssiedlungen, netzfernen landwirtschaftlichen Betrieben, Katastrophengebieten, untertägigen Arbeitsstätten, physisch getrennten Anlagen und Regionen mit Netzabschaltungen sind die begrenzenden Größen andere: Stromversorgung, Bandbreite, Stückkosten sowie die rechtliche Exposition, die mit der Erhebung personenbezogener Daten einhergeht.</p><p>Das Vorhaben geht den umgekehrten Weg des vorherrschenden Trends. Statt Parameter hinzuzufügen, wird Infrastruktur entfernt; statt Daten zur Verbesserung zu erheben, werden gar keine erhoben. Was bleibt, ist klein genug, um Zeile für Zeile geprüft zu werden, kostengünstig genug, um unentgeltlich verbreitet zu werden, und robust genug, um weiterzuarbeiten, nachdem Konnektivität, Cloud-Budget und Förderung ausgelaufen sind.</p><p>Dieselben Eigenschaften sind weit über den humanitären Bereich hinaus von Belang. Systeme für extreme Umgebungen, einschließlich der Planetenerkundung, unterliegen vergleichbaren Anforderungen an Überlebensfähigkeit und Eigenständigkeit.</p>",

"s2.eyebrow":"Entwurfsbedingungen",
"s2.h":"Jede der nachstehenden Eigenschaften ist eine Architekturentscheidung, keine Konfigurationsoption.",
"s2.list":"<li>Keine Serverinfrastruktur erforderlich</li><li>Keine externen Bibliotheken; in sich geschlossene Einzeldatei</li><li>Keine Kosten für Erwerb oder Miete von Grafikprozessoren</li><li>Nahezu keine Grenzkosten je zusätzlichem Einsatz</li><li>Architektur ohne ausgehenden Datenverkehr</li><li>Keine Inhalte aus Netzen Dritter</li><li>Auf DSGVO-Konformität hin entworfen (Datenschutz durch Technikgestaltung)</li><li>Äußerst geringer Energieverbrauch</li><li>Läuft auf ausgemusterten Geräten und verlängert deren Nutzungsdauer</li><li>Arbeitet mit Chips der Ein-Dollar-Klasse und einfacher Solarversorgung</li><li>An ESG-Rahmenwerken und den Nachhaltigkeitszielen der Vereinten Nationen ausgerichtet</li><li>Mittel konzentrieren sich auf Forschung statt auf Hardware</li>",
"s2.note":"<b>METHODE —</b> Anstelle eines großen Deep-Learning-Modells verbindet das System endliche Automaten, Verhaltensbäume und leichtgewichtiges bestärkendes Lernen. Die regelbasierte Zustandssteuerung liefert bei geringem Rechenaufwand ein stabiles Echtzeitverhalten und — in sicherheitsrelevanten Zusammenhängen ebenso bedeutsam — Entscheidungen, die im Nachhinein nachvollziehbar und erklärbar bleiben.",
